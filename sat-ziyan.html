 with genuine understanding.", "ipa": "/ˌsɑːfəˈmɔːrɪk/", "pos": "adj.", "word": "sophomoric"}, {"def_cn": "取代；排挤掉", "def_en": "To replace or displace someone or something, often through competition or force.", "example_cn": "在过去二十年里，流媒体服务基本取代了传统的录像带租赁店。", "example_en": "Streaming services have largely supplanted traditional video rental stores over the past two decades.", "ipa": "/səˈplænt/", "pos": "v.", "word": "supplant"}, {"def_cn": "前所未有的；史无前例的", "def_en": "Never having happened or existed before; without previous example.", "example_cn": "史无前例的洪水迫使官员重写那些沿用了一个世纪的应急计划。", "example_en": "The unprecedented flooding forced officials to rewrite emergency plans that had worked for a century.", "ipa": "/ʌnˈpresɪdəntɪd/", "pos": "adj.", "word": "unprecedented"}, {"def_cn": "盛怒；愤怒", "def_en": "Extreme anger, often with a desire for punishment or vengeance.", "example_cn": "一旦丑闻最终曝光，这位腐败官员害怕公众的盛怒。", "example_en": "The corrupt official feared the wrath of the public once the scandal was finally exposed.", "ipa": "/ræθ/", "pos": "n.", "word": "wrath"}], "practice": [{"qid": "d18-q1", "stem": "Biologists warn that some companies have been known to ______ seafood products, mixing in cheaper species while labeling them as premium catch.", "passage": "", "options": ["adulterate", "supplant", "decry", "reprove"], "answer": "A", "explanation_en": "The sentence describes secretly mixing cheaper fish into premium products, which is making them impure. Adulterate means to make impure by adding inferior substances, so A fits. Supplant means replace, decry means publicly denounce, and reprove means scold — none describes secretly diluting a product.", "explanation_cn": "句子描述的是把便宜鱼种混入高价海产品，这是掺假行为。adulterate（掺假）符合语境。supplant 是“取代”，decry 是“公开谴责”，reprove 是“责备”，都不表示偷偷掺劣质成分。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d18-q2", "stem": "The editorial board found the reporter's tone ______; she dismissed expert warnings about the dam as though they were trivial concerns.", "passage": "", "options": ["amicable", "assiduous", "cavalier", "eminent"], "answer": "C", "explanation_en": "Dismissing expert warnings as trivial shows a lack of proper concern, which matches cavalier. Amicable means friendly, assiduous means careful and hardworking, and eminent means famous — none describes a dismissive attitude.", "explanation_cn": "把专家警告当作小事一笔带过，表现的是“满不在乎”，对应 cavalier。amicable 是“友好的”，assiduous 是“勤勉的”，eminent 是“卓越的”，都不表示轻率漠视。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d18-q3", "stem": "During the trial, the defendant's calm ______ suggested confidence, but the testimony revealed a pattern of careless decisions.", "passage": "", "options": ["wrath", "apex", "countenance", "dilemma"], "answer": "C", "explanation_en": "The sentence contrasts a calm facial expression with careless behavior; countenance means a person's face as an expression of mood, so C fits. Wrath is extreme anger, apex is a peak, and dilemma is a hard choice — none refers to the face.", "explanation_cn": "句子把“镇定的面部表情”和“粗心的行为”做对比，countenance（面容）符合。wrath 是“盛怒”，apex 是“顶点”，dilemma 是“两难困境”，都不是指面容。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d18-q4", "stem": "Historians agree that the emperor's reign marked the ______ of the empire's influence: no later ruler ever matched its reach or wealth.", "passage": "", "options": ["halcyon", "apex", "dilemma", "odious"], "answer": "B", "explanation_en": "No later ruler matched the empire's reach, so the reign was its highest point. Apex means the highest point, so B fits. Halcyon describes a peaceful golden time but emphasizes happiness, not the peak; dilemma and odious do not fit.", "explanation_cn": "后来的统治者都达不到当时的版图和财富，所以这是帝国的“巅峰”，apex 符合。halcyon 强调美好安宁的时光，不表示最高点；dilemma、odious 都不合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d18-q5", "stem": "The investigative article was ______: the journalist spent a year reviewing documents, and every claim in the piece could be traced to a source.", "passage": "", "options": ["perfunctory", "sophomoric", "assiduous", "insular"], "answer": "C", "explanation_en": "A year of document review and fully sourced claims show great care and persistence, which matches assiduous. Perfunctory means done with minimum effort, sophomoric means immature, and insular means narrowly closed off — the opposite of what the sentence describes.", "explanation_cn": "花一年查文件、每条论点都有出处，体现的是勤勉认真，对应 assiduous。perfunctory 是“敷衍的”，sophomoric 是“幼稚的”，insular 是“闭塞的”，都与句意相反。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d18-q6", "stem": "Marine biologist Sylvia Earle is an ______ voice in ocean conservation; her decades of research have earned her worldwide respect.", "passage": "", "options": ["eminent", "complicit", "odious", "halcyon"], "answer": "A", "explanation_en": "Decades of research and worldwide respect point to someone famous and respected in their field. Eminent means exactly that, so A fits. Complicit means involved in wrongdoing, odious means hateful, and halcyon describes a peaceful time — none fit.", "explanation_cn": "几十年的研究和世界范围的尊敬，说明她是该领域“卓越著名”的人物，eminent 符合。complicit 是“同谋的”，odious 是“可恨的”，halcyon 是“太平盛世的”，都不合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d18-q7", "stem": "After the merger, streaming platforms quickly ______ DVD rental shops, which could not compete with instant, on-demand access.", "passage": "", "options": ["belied", "reproved", "supplanted", "decry"], "answer": "C", "explanation_en": "DVD shops were displaced and replaced by streaming, which matches supplant. Belie means give a false impression, reprove means scold, and decry means publicly denounce — none describes replacement through competition.", "explanation_cn": "DVD 租赁店被流媒体排挤取代，supplant（取代）符合。belie 是“掩盖”，reprove 是“责备”，decry 是“谴责”，都不表示取代。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d18-q8", "stem": "Text: The city council approved the new park unanimously. The vote followed months of heated debate, and the final plan incorporated ideas from both supporters and opponents. Which choice best describes the outcome?", "passage": "", "options": ["It was perfunctory, because the council rushed the decision.", "It was amicable, because opposing sides reached a mutually accepted result.", "It was insular, because the council ignored outside opinions.", "It was odious, because the plan pleased no one."], "answer": "B", "explanation_en": "The council voted unanimously after incorporating both sides' ideas, which shows a friendly, mutually accepted resolution. Amicable means that, so B fits. The text shows careful compromise, not a rushed perfunctory vote, nor an insular or hateful outcome.", "explanation_cn": "委员会融合了双方意见后一致通过，说明达成了双方都能接受的友好结果，amicable 符合。文本体现的是认真妥协，不是敷衍（perfunctory）、闭塞（insular）或令人厌恶（odious）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d18-q9", "stem": "The new factory produces 10,000 batteries a day. However, inspectors found that nearly 8% of the output fails basic safety tests. Which choice best states the main idea?", "passage": "", "options": ["The factory's production volume is unprecedented in the industry.", "The factory's safety record reveals a serious quality problem.", "The factory's workers are unusually assiduous.", "The factory's management deserves an eminent reputation."], "answer": "B", "explanation_en": "The passage contrasts high output with a high failure rate, so the main idea is a quality problem. B captures that. The text says nothing about record output, worker diligence, or reputation, so A, C, and D are unsupported.", "explanation_cn": "段落把高产量和高的不合格率放在一起对比，主旨是质量有严重问题，B 正确。文中没有提到创纪录产量、工人勤勉或声誉，A、C、D 都没有依据。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d18-q10", "stem": "The archivist's catalog was so ______ that scholars could locate any document in minutes, even in a collection of over two million pages.", "passage": "", "options": ["cavalier", "assiduous", "sophomoric", "complicit"], "answer": "B", "explanation_en": "A catalog that lets scholars find anything quickly must have been built with great care, which matches assiduous. Cavalier means careless, sophomoric means immature, and complicit means involved in wrongdoing — none explains a superb catalog.", "explanation_cn": "让学者几分钟内找到任何文件，说明目录编制得非常认真细致，对应 assiduous。cavalier 是“满不在乎的”，sophomoric 是“幼稚的”，complicit 是“同谋的”，都无法解释优秀的目录。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-16"}, {"day": 19, "words": [{"def_cn": "逆境；困苦", "def_en": "Difficult conditions or misfortune; hardship.", "example_cn": "教练提醒队员们：冠军往往是在逆境中锻造出来的，而不是在轻松的胜利中。", "example_en": "The coach reminded the team that champions are often forged through adversity rather than easy victories.", "ipa": "/ədˈvɜːrsəti/", "pos": "n.", "word": "adversity"}, {"def_cn": "深恶痛绝之物；被诅咒的人或事", "def_en": "Something or someone intensely disliked or condemned; a curse of rejection.", "example_cn": "对这位严格的老师来说，考试作弊是深恶痛绝的行为，背叛了教育的一切宗旨。", "example_en": "To the strict teacher, cheating on exams was anathema, a betrayal of everything education stood for.", "ipa": "/əˈnæθəmə/", "pos": "n.", "word": "anathema"}, {"def_cn": "泰然自若；沉着自信", "def_en": "Self-confidence and poise, especially in a difficult situation.", "example_cn": "这位年轻律师沉着自信地应对了充满敌意的交叉询问，冷静地回答了每一个问题。", "example_en": "The young lawyer handled the hostile cross-examination with aplomb, answering each question calmly.", "ipa": "/əˈplɑːm/", "pos": "n.", "word": "aplomb"}, {"def_cn": "自治的；独立自主的", "def_en": "Self-governing; able to operate independently without outside control.", "example_cn": "这所大学的海外校区实现了完全自治，自主设置课程、聘用师资。", "example_en": "The university's overseas campus became fully autonomous, setting its own curriculum and hiring its own faculty.", "ipa": "/ɔːˈtɑːnəməs/", "pos": "adj.", "word": "autonomous"}, {"def_cn": "藏匿处；贮藏物（也指电脑缓存）", "def_en": "A hidden store of valuable items; also, stored computer data for quick access.", "example_cn": "考古学家在破败神庙的地板下发现了一批窖藏的古代钱币。", "example_en": "Archaeologists uncovered a cache of ancient coins buried beneath the floor of the ruined temple.", "ipa": "/kæʃ/", "pos": "n.", "word": "cache"}, {"def_cn": "割让；正式让出（权力、领土、权利）", "def_en": "To formally give up power, territory, or a right to another.", "example_cn": "根据条约，战败国被迫把几个边境省份割让给邻国。", "example_en": "Under the treaty, the defeated nation was forced to cede several border provinces to its neighbor.", "ipa": "/siːd/", "pos": "v.", "word": "cede"}, {"def_cn": "良心不安；内疚；悔恨", "def_en": "A feeling of guilt or moral doubt that prevents one from doing something.", "example_cn": "这位记者毫不犹豫地发表了这篇报道，坚信公众有知情权。", "example_en": "The journalist published the story without compunction, convinced that the public had a right to know.", "ipa": "/kəmˈpʌŋkʃən/", "pos": "n.", "word": "compunction"}, {"def_cn": "怯懦的；懦弱的", "def_en": "Lacking courage; cowardly and contemptibly timid.", "example_cn": "将军称这次撤退是懦弱的，认为军队未战先退、抛弃了盟友。", "example_en": "The general called the retreat craven, arguing that the army had abandoned its allies without a fight.", "ipa": "/ˈkreɪvən/", "pos": "adj.", "word": "craven"}, {"def_cn": "已不存在的；停止运作的", "def_en": "No longer existing or functioning; discontinued.", "example_cn": "这本曾经风靡的杂志如今已停刊，五年前出版了最后一期。", "example_en": "The once-popular magazine is now defunct, having published its final issue five years ago.", "ipa": "/dɪˈfʌŋkt/", "pos": "adj.", "word": "defunct"}, {"def_cn": "掩饰（真实情感或意图）；假装", "def_en": "To conceal one's true feelings or intentions; to act deceitfully.", "example_cn": "这位外交官掩饰着失望，在失败的谈判中始终面带温暖的微笑。", "example_en": "The diplomat dissembled her disappointment, smiling warmly throughout the failed negotiation.", "ipa": "/dɪˈsembəl/", "pos": "v.", "word": "dissemble"}, {"def_cn": "地方性的；特有的（流行于某地区或人群）", "def_en": "Native to or regularly found in a particular place or among a particular people.", "example_cn": "疟疾在几个热带地区仍然是地方性流行病，那里的蚊子全年滋生。", "example_en": "Malaria remains endemic in several tropical regions, where mosquitoes thrive year-round.", "ipa": "/enˈdemɪk/", "pos": "adj.", "word": "endemic"}, {"def_cn": "霸权；主导地位", "def_en": "Dominance or leadership of one group or nation over others.", "example_cn": "这篇论文认为，罗马对地中海的霸权在几个世纪里塑造了贸易格局。", "example_en": "The essay argues that Rome's hegemony over the Mediterranean shaped trade patterns for centuries.", "ipa": "/hɪˈdʒeməni/", "pos": "n.", "word": "hegemony"}, {"def_cn": "巡回的；流动的（尤指工作性质）", "def_en": "Traveling from place to place, especially for work.", "example_cn": "这位巡回护士穿梭于偏远村庄之间，为没有诊所的社区送去疫苗。", "example_en": "The itinerant nurse traveled between remote villages, bringing vaccines to communities without clinics.", "ipa": "/aɪˈtɪnərənt/", "pos": "adj.", "word": "itinerant"}, {"def_cn": "不透明的；难懂的", "def_en": "Not transparent; impossible to see through, or hard to understand.", "example_cn": "合同中晦涩难懂的语言连律师都感到困惑，他们要求一份更清楚的草稿。", "example_en": "The contract's opaque language confused even the lawyers, who asked for a clearer draft.", "ipa": "/oʊˈpeɪk/", "pos": "adj.", "word": "opaque"}, {"def_cn": "有洞察力的；敏锐的", "def_en": "Having keen insight and good judgment; shrewdly observant.", "example_cn": "这位有洞察力的投资者在市场之前就发现了这家公司隐藏的债务。", "example_en": "The perspicacious investor noticed the company's hidden debts before the market did.", "ipa": "/ˌpɜːrspɪˈkeɪʃəs/", "pos": "adj.", "word": "perspicacious"}, {"def_cn": "强健的；健全的（有效的）", "def_en": "Strong and healthy; also, well-developed and effective.", "example_cn": "该国建立了健全的公共卫生体系，在危机中没有崩溃。", "example_en": "The country built a robust public health system that handled the crisis without collapsing.", "ipa": "/roʊˈbʌst/", "pos": "adj.", "word": "robust"}, {"def_cn": "肮脏破败的；污秽的", "def_en": "Extremely dirty and unpleasant, especially because of poverty or neglect.", "example_cn": "改革者揭露了工厂宿舍肮脏破败的状况，几十个人挤在一间房里。", "example_en": "Reformers exposed the squalid conditions in the factory dormitories, where dozens shared a single room.", "ipa": "/ˈskwɑːlɪd/", "pos": "adj.", "word": "squalid"}, {"def_cn": "站得住脚的；可维持的", "def_en": "Able to be maintained or defended successfully; reasonable.", "example_cn": "没有新的证据，检察官承认原来的推论已经站不住脚了。", "example_en": "Without fresh evidence, the prosecutor admitted that the original theory was no longer tenable.", "ipa": "/ˈtenəbəl/", "pos": "adj.", "word": "tenable"}, {"def_cn": "空洞的；无思想的", "def_en": "Lacking thought, intelligence, or substance; empty-minded.", "example_cn": "批评者称这场竞选演讲空洞无物，指出它只有口号、没有实质政策。", "example_en": "Critics called the campaign speech vacuous, noting that it contained slogans but no real policies.", "ipa": "/ˈvækjuəs/", "pos": "adj.", "word": "vacuous"}, {"def_cn": "冷嘲的；苦笑的；歪扭的", "def_en": "Using dry, mocking humor; also, twisted into a crooked expression.", "example_cn": "科学家带着一丝苦笑承认，他那个宏大的预测完全错了。", "example_en": "With a wry smile, the scientist admitted that his grand prediction had been completely wrong.", "ipa": "/raɪ/", "pos": "adj.", "word": "wry"}], "practice": [{"qid": "d19-q1", "stem": "The memoir describes how the author's family survived the Great Depression: despite extreme ______, they kept the household together through mutual support.", "passage": "", "options": ["aplomb", "adversity", "hegemony", "compunction"], "answer": "B", "explanation_en": "The sentence describes extreme hardship during the Depression, which matches adversity. Aplomb is calm confidence, hegemony is dominance, and compunction is guilt — none describes hardship.", "explanation_cn": "句子描述的是大萧条时期的极度困苦，adversity（逆境）符合。aplomb 是“泰然自若”，hegemony 是“霸权”，compunction 是“内疚”，都不表示困苦。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d19-q2", "stem": "Though the debate grew heated, the student answered every challenge with ______, never raising her voice or losing her composure.", "passage": "", "options": ["aplomb", "adversity", "cache", "compunction"], "answer": "A", "explanation_en": "Never raising her voice or losing composure shows calm self-confidence, which matches aplomb. Adversity is hardship, cache is a hidden store, and compunction is guilt — none describes poise.", "explanation_cn": "不提高嗓门、不失分寸，体现的是沉着自信，aplomb 符合。adversity 是“逆境”，cache 是“贮藏物”，compunction 是“内疚”，都不表示从容。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d19-q3", "stem": "The tribe's elders refused to ______ control of the sacred valley, insisting that the land remain under their protection.", "passage": "", "options": ["dissemble", "cede", "decry", "supplant"], "answer": "B", "explanation_en": "Refusing to give up control of land matches cede, which means to formally give up power or territory. Dissemble means conceal feelings, decry means denounce, and supplant means replace — none means giving up control.", "explanation_cn": "拒绝让出对圣谷的控制权，cede（让出、割让）符合。dissemble 是“掩饰”，decry 是“谴责”，supplant 是“取代”，都不表示让出控制权。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d19-q4", "stem": "The once-mighty typewriter company is now ______, its factories closed and its brand forgotten by younger consumers.", "passage": "", "options": ["autonomous", "robust", "defunct", "tenable"], "answer": "C", "explanation_en": "Factories closed and the brand forgotten show the company no longer exists. Defunct means no longer existing or functioning, so C fits. Autonomous means independent, robust means strong, and tenable means defensible — none describes a dead company.", "explanation_cn": "工厂关闭、品牌被遗忘，说明公司已不存在，defunct（已停业的）符合。autonomous 是“自治的”，robust 是“强健的”，tenable 是“站得住脚的”，都不表示倒闭。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d19-q5", "stem": "Malaria was once common worldwide, but today it is ______ only in tropical regions where the mosquito thrives.", "passage": "", "options": ["endemic", "itinerant", "opaque", "vacuous"], "answer": "A", "explanation_en": "The sentence says the disease is now regularly found only in certain regions, which matches endemic. Itinerant means traveling, opaque means hard to understand, and vacuous means empty — none describes a regionally confined disease.", "explanation_cn": "句子说这种疾病如今只在特定地区流行，endemic（地方性的）符合。itinerant 是“流动的”，opaque 是“难懂的”，vacuous 是“空洞的”，都不表示地域性流行。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d19-q6", "stem": "The instructions were so ______ that even the technicians misread them, assembling the device backward twice.", "passage": "", "options": ["robust", "wry", "opaque", "tenable"], "answer": "C", "explanation_en": "Instructions that even technicians misread must be hard to understand, which matches opaque. Robust means strong, wry means dryly humorous, and tenable means defensible — none explains the confusion.", "explanation_cn": "连技术人员都读错的说明书，一定是晦涩难懂的，opaque 符合。robust 是“强健的”，wry 是“冷嘲的”，tenable 是“站得住脚的”，都无法解释这种误读。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d19-q7", "stem": "Text: The new bridge opened on schedule, yet traffic engineers doubt the original traffic forecasts. Without updated data, they say, the city's claim that the bridge will ease congestion is difficult to defend. Which choice best describes the engineers' position?", "passage": "", "options": ["They believe the claim is tenable only with fresh evidence.", "They consider the claim craven and cowardly.", "They find the claim anathema and refuse to discuss it.", "They regard the claim as robust and well supported."], "answer": "A", "explanation_en": "The engineers doubt the forecasts and say the claim is difficult to defend without updated data, meaning fresh evidence could make it tenable. Tenable means able to be defended, so A fits. The text shows doubt, not contempt, horror, or confidence.", "explanation_cn": "工程师质疑预测数据，说没有更新数据就难以为这项说法辩护，意思是只有新证据才能让它站得住脚，tenable（可辩护的）符合。文本表现的是怀疑，不是轻蔑（craven）、痛恨（anathema）或信心（robust）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d19-q8", "stem": "In the novel, the mayor hides his fear behind confident speeches. The narrator notes that his ______ fools no one: the townspeople see through the performance.", "passage": "", "options": ["hegemony", "dissembling", "cache", "adversity"], "answer": "B", "explanation_en": "Hiding fear behind confident speeches is concealing one's true feelings, which is dissemble. The gerund dissembling fits the sentence. Hegemony is dominance, cache is a hidden store, and adversity is hardship — none describes the act of pretending.", "explanation_cn": "用自信的演讲掩饰恐惧，就是掩饰真实情感，dissemble 符合（这里用动名词形式 dissembling）。hegemony 是“霸权”，cache 是“贮藏物”，adversity 是“逆境”，都不表示伪装。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d19-q9", "stem": "The ______ nurse traveled between three mountain villages, spending a week in each before moving on to the next.", "passage": "", "options": ["itinerant", "craven", "squalid", "perspicacious"], "answer": "A", "explanation_en": "Traveling between villages for work matches itinerant, which means moving from place to place. Craven means cowardly, squalid means filthy, and perspicacious means insightful — none describes a traveling worker.", "explanation_cn": "在几个村庄之间流动工作，itinerant（巡回的）符合。craven 是“怯懦的”，squalid 是“肮脏的”，perspicacious 是“有洞察力的”，都不表示流动工作。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d19-q10", "stem": "Critics described the candidate's promises as ______, arguing that the glossy slogans contained no workable plan for the city's budget.", "passage": "", "options": ["robust", "vacuous", "perspicacious", "autonomous"], "answer": "B", "explanation_en": "Slogans with no workable plan lack substance, which matches vacuous. Robust means strong, perspicacious means insightful, and autonomous means independent — none describes empty promises.", "explanation_cn": "只有华丽口号、没有可行计划的承诺是空洞的，vacuous 符合。robust 是“强健的”，perspicacious 是“有洞察力的”，autonomous 是“自治的”，都不表示空洞。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-17"}, {"day": 20, "words": [{"def_cn": "（言辞、态度）尖酸刻薄的，火药味十足的", "def_en": "Bitter and angry in tone or manner.", "example_cn": "两间实验室之间曾经富有成效的合作，最终因谁该获得这项发现的荣誉而以一场激烈的争执收场。", "example_en": "The once-productive collaboration between the two laboratories ended in an acrimonious dispute over who deserved credit for the discovery.", "ipa": "/ˌæk.rɪˈmoʊ.ni.əs/", "pos": "adj.", "word": "acrimonious"}, {"def_cn": "围攻；使陷入困境", "def_en": "To surround with problems or difficulties; to besiege.", "example_cn": "受预算削减和入学人数下降的困扰，这所小型学院难以维持其学术项目的质量。", "example_en": "Beleaguered by budget cuts and declining enrollment, the small college struggled to maintain the quality of its academic programs.", "ipa": "/bɪˈliː.ɡər/", "pos": "v.", "word": "beleaguer"}, {"def_cn": "安抚的；求和的", "def_en": "Intended to gain goodwill or to make peace.", "example_cn": "为结束罢工，校长采取了和解的语气，邀请学生领袖本着诚意进行谈判。", "example_en": "Hoping to end the strike, the university president adopted a conciliatory tone and invited student leaders to negotiate in good faith.", "ipa": "/kənˈsɪl.i.ə.tɔːr.i/", "pos": "adj.", "word": "conciliatory"}, {"def_cn": "大惨败；彻底崩溃", "def_en": "A sudden and complete failure; a fiasco.", "example_cn": "由于被污染的样本使团队收集的所有结果失效，这场仓促组织的实验变成了一场彻底的灾难。", "example_en": "The hastily organized experiment turned into a complete debacle when contaminated samples invalidated every result the team had collected.", "ipa": "/dɪˈbɑː.kəl/", "pos": "n.", "word": "debacle"}, {"def_cn": "不真诚的；装糊涂的", "def_en": "Not honest or sincere; pretending to know less than one does.", "example_cn": "这位候选人一边承诺减税、一边增加开支的不真诚承诺，很快就被独立经济学家揭穿。", "example_en": "The candidate's disingenuous promise to cut taxes while increasing spending was quickly exposed by independent economists.", "ipa": "/dɪs.ɪnˈdʒen.ju.əs/", "pos": "adj.", "word": "disingenuous"}, {"def_cn": "热情洋溢的；兴高采烈的", "def_en": "Cheerful and full of energy; enthusiastic.", "example_cn": "当著名科学家发表关于好奇心的鼓舞人心的毕业演讲时，热情洋溢的毕业生们欢呼起来。", "example_en": "The ebullient crowd of graduates cheered as the renowned scientist delivered an inspiring commencement address about curiosity.", "ipa": "/ɪˈbʊl.jənt/", "pos": "adj.", "word": "ebullient"}, {"def_cn": "忍耐；克制", "def_en": "Patient self-control when provoked; tolerance.", "example_cn": "面对不断的扰乱，这位老师表现出的非凡忍耐赢得了同事们的深深敬重。", "example_en": "The teacher's remarkable forbearance in the face of constant disruption earned her the deep respect of her colleagues.", "ipa": "/fɔːrˈber.əns/", "pos": "n.", "word": "forbearance"}, {"def_cn": "否认；反驳", "def_en": "To deny or contradict a statement.", "example_cn": "很少有历史学家会否认“印刷术的发明改变了知识在欧洲的传播”这一说法。", "example_en": "Few historians would gainsay the claim that the invention of printing transformed the spread of knowledge across Europe.", "ipa": "/ɡeɪnˈseɪ/", "pos": "v.", "word": "gainsay"}, {"def_cn": "傲慢；目中无人", "def_en": "Excessive pride or self-confidence.", "example_cn": "首席执行官的傲慢使他无视早期的预警信号，他过度自信的扩张计划最终导致公司破产。", "example_en": "The CEO's hubris blinded him to early warning signs, and his overconfident expansion plan eventually bankrupted the company.", "ipa": "/ˈhjuː.brɪs/", "pos": "n.", "word": "hubris"}, {"def_cn": "天真纯朴的；单纯的", "def_en": "Innocent, trusting, and unsuspecting.", "example_cn": "这位天真的大一新生相信她听到的每一条传言，不知道校园八卦很少基于事实。", "example_en": "The ingenuous freshman believed every rumor she heard, unaware that campus gossip is rarely based on fact.", "ipa": "/ɪnˈdʒen.ju.əs/", "pos": "adj.", "word": "ingenuous"}, {"def_cn": "赞美的；歌颂的", "def_en": "Expressing praise or admiration.", "example_cn": "这篇赞美性的书评称赞了小说中生动的人物，称其为十年来最重要的文学成就。", "example_en": "The laudatory review praised the novel's vivid characters and called it the most important literary achievement of the decade.", "ipa": "/ˈlɔː.də.tɔːr.i/", "pos": "adj.", "word": "laudatory"}, {"def_cn": "特立独行者；不墨守成规的人", "def_en": "An independent-minded person who refuses to follow the crowd.", "example_cn": "这位特立独行的经济学家挑战了广为接受的理论，认为其假设已不再符合现代市场。", "example_en": "The maverick economist challenged the widely accepted theory, arguing that its assumptions no longer matched modern markets.", "ipa": "/ˈmæv.ər.ɪk/", "pos": "n.", "word": "maverick"}, {"def_cn": "新手；初学者", "def_en": "A beginner or newcomer to an activity.", "example_cn": "作为实验室的新手，这位年轻的研究员连最简单的操作都要依赖导师的指导。", "example_en": "As a neophyte in the laboratory, the young researcher relied on her mentor's guidance for even the simplest procedures.", "ipa": "/ˈniː.ə.faɪt/", "pos": "n.", "word": "neophyte"}, {"def_cn": "耻辱；恶名", "def_en": "Public shame resulting from disgraceful behavior.", "example_cn": "腐败丑闻之后，这位曾经受人尊敬的官员面临公众的耻辱谴责，被迫蒙羞辞职。", "example_en": "After the corruption scandal, the once-respected official faced public opprobrium and was forced to resign in disgrace.", "ipa": "/əˈproʊ.bri.əm/", "pos": "n.", "word": "opprobrium"}, {"def_cn": "缓解（症状或问题）而不根除", "def_en": "To ease pain or a problem without curing it.", "example_cn": "新政策只是缓解了不平等的症状，并未解决造成不平等的法律根源。", "example_en": "The new policy merely palliated the symptoms of inequality without addressing the unfair laws that caused them.", "ipa": "/ˈpæl.i.eɪt/", "pos": "v.", "word": "palliate"}, {"def_cn": "顽抗的；不服从管束的", "def_en": "Stubbornly resistant to authority or control.", "example_cn": "顽固不化的委员会成员拒绝批准预算，使建筑项目又推迟了一年。", "example_en": "The recalcitrant committee members refused to approve the budget, delaying the construction project for another year.", "ipa": "/rɪˈkæl.sɪ.trənt/", "pos": "adj.", "word": "recalcitrant"}, {"def_cn": "乐观的；满怀信心的", "def_en": "Optimistic, especially in a difficult situation.", "example_cn": "尽管早期结果令人失望，研究人员仍对新方法最终会成功保持乐观。", "example_en": "Despite disappointing early results, the researchers remained sanguine that their new approach would eventually succeed.", "ipa": "/ˈsæŋ.ɡwɪn/", "pos": "adj.", "word": "sanguine"}, {"def_cn": "长篇痛斥；谩骂", "def_en": "A long, angry speech of criticism.", "example_cn": "参议员对拟议税收长达近一小时的愤怒痛斥，连她最亲密的盟友都感到震惊。", "example_en": "The senator's angry tirade against the proposed tax lasted nearly an hour and stunned even her closest allies.", "ipa": "/taɪˈreɪd/", "pos": "n.", "word": "tirade"}, {"def_cn": "尊敬；崇敬", "def_en": "To regard with deep respect and admiration.", "example_cn": "在许多文化中，长者因其智慧和为年轻一代做出的牺牲而受到尊崇。", "example_en": "In many cultures, elders are venerated for their wisdom and the sacrifices they made for younger generations.", "ipa": "/ˈven.ə.reɪt/", "pos": "v.", "word": "venerate"}, {"def_cn": "诋毁；辱骂", "def_en": "To speak or write about someone in an abusively critical way.", "example_cn": "对手们没有回应他的论点，反而选择在媒体上用个人攻击来诋毁他。", "example_en": "Rather than engage with his arguments, his opponents chose to vilify him with personal attacks in the press.", "ipa": "/ˈvɪl.ɪ.faɪ/", "pos": "v.", "word": "vilify"}], "practice": [{"qid": "d20-q1", "stem": "The town hall meeting, which had begun as a respectful discussion of the budget, deteriorated by evening into an ______ exchange, with residents shouting personal insults at the council members.", "passage": "", "options": ["acrimonious", "conciliatory", "laudatory", "ingenuous"], "answer": "A", "explanation_en": "The context describes a discussion that deteriorated into shouting personal insults, so the blank needs a word meaning bitter and hostile. Acrimonious fits perfectly. Conciliatory means peace-making, laudatory means praising, and ingenuous means innocent — all the opposite of or unrelated to the angry tone described.", "explanation_cn": "上下文说讨论恶化成了互相喊叫的人身攻击，所以空格需要一个表示“尖酸刻薄、充满敌意”的词，acrimonious（尖酸刻薄的）最合适。conciliatory 是安抚求和的，laudatory 是赞美的，ingenuous 是天真单纯的，都与愤怒的语气不符。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d20-q2", "stem": "The investigation revealed that neither the critic's lengthy tirade nor the director's calm response ______ the audience's opinion of the play.", "passage": "", "options": ["has changed", "have changed", "were changing", "change"], "answer": "A", "explanation_en": "In a neither/nor construction, the verb agrees with the subject nearest to it — the singular 'calm response' — so the singular verb 'has changed' is required. Choices B, C, and D all use plural verbs, which do not agree with the singular subject.", "explanation_cn": "在 neither…nor 结构中，动词与离它最近的主语保持一致——单数的 calm response，所以必须用单数动词 has changed。B、C、D 都是复数动词，与单数主语不一致。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d20-q3", "stem": "In a review of a new biography, the critic spends the first two paragraphs praising the author's research. In the third paragraph, however, she argues that the author draws sweeping conclusions from thin evidence. In the fourth, she concludes that the book is an impressive achievement despite its flaws. What is the primary function of the third paragraph?", "passage": "", "options": ["It offers a personal anecdote about the critic's own research experience.", "It qualifies the praise from the earlier paragraphs by introducing a significant criticism.", "It summarizes the biography's main argument for readers unfamiliar with it.", "It compares the biography to other books on the same historical figure."], "answer": "B", "explanation_en": "The third paragraph shifts from praise to criticism, so its function is to qualify — that is, to limit — the positive assessment given earlier. Choice A is wrong because no anecdote appears. Choice C is wrong because the paragraph evaluates rather than summarizes. Choice D is wrong because no comparison to other books is made.", "explanation_cn": "第三段从赞美转向批评，作用是限定（qualify）前文的正面评价。A 错误，因为没有出现个人轶事。C 错误，因为该段是评价而非概括。D 错误，因为没有与其他书作比较。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d20-q4", "stem": "Marine biologists have long assumed that deep-sea creatures grow slowly because of the cold, dark environment. However, a recent study of glass sponges found that some individuals doubled in size within a single year, a growth rate comparable to that of shallow-water species. The researchers suggest that nutrient-rich currents, previously unmeasured at those depths, may explain the rapid growth. Which choice is best supported by the text?", "passage": "", "options": ["Glass sponges are the fastest-growing creatures in the deep sea.", "The traditional explanation for slow deep-sea growth may be incomplete.", "Nutrient-rich currents exist only in shallow waters.", "Shallow-water species grow more slowly than scientists previously believed."], "answer": "B", "explanation_en": "The text presents evidence — rapid growth in glass sponges possibly explained by unmeasured nutrient currents — that challenges the old assumption that the deep-sea environment alone causes slow growth. Choice B captures this. Choice A is unsupported because no comparison of all deep-sea creatures is made. Choice C contradicts the passage because the currents were found at depth. Choice D reverses the comparison.", "explanation_cn": "文章用玻璃海绵快速生长的证据挑战了“深海环境导致生长缓慢”的旧假设，还提出未被测量的营养流可能是原因，所以传统解释可能不完整，选 B。A 没有依据（没有比较所有深海生物）。C 与文章矛盾（营养流是在深海发现的）。D 把比较关系说反了。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d20-q5", "stem": "Even after three consecutive rejections from top journals, the young scientist remained ______ about her research, convinced that perseverance would eventually lead to publication.", "passage": "", "options": ["sanguine", "recalcitrant", "disingenuous", "acrimonious"], "answer": "A", "explanation_en": "The phrase 'convinced that perseverance would eventually lead to publication' shows optimism despite setbacks, which matches sanguine (optimistic). Recalcitrant means stubbornly disobedient, disingenuous means insincere, and acrimonious means bitter — none describes hopeful confidence.", "explanation_cn": "convinced that perseverance would eventually lead to publication 表明屡遭挫折仍保持乐观，sanguine（乐观的）正合适。recalcitrant 是顽抗的，disingenuous 是不真诚的，acrimonious 是尖酸刻薄的，都不符合“怀抱希望”的语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d20-q6", "stem": "The mayor's speech opened with a conciliatory promise to listen to all sides. ______ , it closed with a blistering tirade against anyone who opposed the new highway.", "passage": "", "options": ["However,", "Therefore,", "For example,", "Moreover,"], "answer": "A", "explanation_en": "The second sentence contrasts sharply with the first — a conciliatory opening versus an angry closing — so the contrast transition 'However' is needed. 'Therefore' signals a result, 'For example' introduces an illustration, and 'Moreover' adds similar information; none fits a sharp contrast.", "explanation_cn": "第二句与第一句形成鲜明对比——开场安抚、结尾痛斥，所以需要转折连词 However。Therefore 表结果，For example 表举例，Moreover 表递进，都不适合这种强烈对比。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d20-q7", "stem": "The committee issued a laudatory statement praising the volunteers ______ dedication had made the festival possible.", "passage": "", "options": ["whose", "who's", "which", "whom"], "answer": "A", "explanation_en": "The blank requires a possessive relative pronoun referring to 'the volunteers' — 'whose dedication' means the dedication belonging to them. 'Who's' is a contraction of 'who is,' 'which' does not show possession, and 'whom' is an object pronoun, not a possessive.", "explanation_cn": "空格需要一个表示所属的关系代词来修饰 volunteers——whose dedication 即“他们的奉献”。who's 是 who is 的缩写，which 不能表所属，whom 是宾格代词而非所有格。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d20-q8", "stem": "Instead of addressing the substance of her rival's proposal, the candidate chose to ______ him in campaign ads, portraying him as dishonest and unfit for office.", "passage": "", "options": ["vilify", "venerate", "palliate", "gainsay"], "answer": "A", "explanation_en": "The ads portray the rival as dishonest and unfit — an abusive personal attack — so 'vilify' (to defame) is the logical choice. 'Venerate' means to honor, the opposite. 'Palliate' means to ease a problem, and 'gainsay' means to deny a claim; neither fits a smear campaign.", "explanation_cn": "广告把对手描绘成不诚实、不称职——这是人身攻击式的诋毁，所以 vilify（诋毁）最符合逻辑。venerate 是尊敬，意思相反。palliate 是缓解问题，gainsay 是否认说法，都不符合抹黑竞选的语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d20-q9", "stem": "Forbearance is often mistaken for weakness, but the two are fundamentally different. Weakness yields because it cannot resist; forbearance endures because it chooses not to strike back. History's most admired leaders — from Lincoln to Mandela — practiced forbearance precisely when retaliation would have been easiest. What is the main idea of the text?", "passage": "", "options": ["Weak leaders are more likely to practice forbearance than strong ones.", "Forbearance is a deliberate choice, not a sign of weakness.", "Lincoln and Mandela were the only leaders who understood forbearance.", "Retaliation is always the easiest response to provocation."], "answer": "B", "explanation_en": "The passage explicitly distinguishes forbearance from weakness, defining it as a deliberate choice not to retaliate. Choice A reverses the argument. Choice C overstates the claim with 'only.' Choice D is too absolute and misses the main point about forbearance.", "explanation_cn": "文章明确区分了忍耐与软弱，指出忍耐是主动选择不报复。A 把论点说反了。C 用 only 过度夸张。D 过于绝对，且没有抓住关于忍耐的主旨。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d20-q10", "stem": "The company's ambitious product launch ended in a complete ______ : the device malfunctioned on stage, orders were canceled by the thousands, and the stock price collapsed within a week.", "passage": "", "options": ["debacle", "forbearance", "maverick", "opprobrium"], "answer": "A", "explanation_en": "The details describe a total, humiliating failure — a malfunctioning launch, canceled orders, a collapsing stock price — which is exactly what a debacle is. Forbearance means patience, a maverick is an independent person, and opprobrium means public disgrace, a consequence of failure rather than the failure itself.", "explanation_cn": "细节描述的是一场彻底的惨败——发布会现场故障、订单大量取消、股价暴跌，这正是 debacle（大惨败）的意思。forbearance 是忍耐，maverick 是特立独行者，opprobrium 是耻辱（是失败的后果而非失败本身）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-18"}, {"day": 21, "words": [{"def_cn": "欣然；乐意", "def_en": "Cheerful readiness or eagerness.", "example_cn": "志愿者们以惊人的热忱响应洪灾，在接到呼吁几小时内就赶到了避难所。", "example_en": "The volunteers responded to the flood with remarkable alacrity, arriving at the shelter within hours of the call.", "ipa": "/əˈlæk.rə.ti/", "pos": "n.", "word": "alacrity"}, {"def_cn": "矛盾的；犹豫不决的", "def_en": "Having mixed or conflicting feelings.", "example_cn": "这名学生对出国留学感到矛盾，既为机会感到兴奋，又为离开朋友而焦虑。", "example_en": "The student felt ambivalent about studying abroad, excited by the opportunity yet anxious about leaving her friends.", "ipa": "/æmˈbɪv.ə.lənt/", "pos": "adj.", "word": "ambivalent"}, {"def_cn": "削弱；减弱", "def_en": "To weaken or reduce in strength or amount.", "example_cn": "沿公路植树有助于减弱长期困扰附近居民的交通噪音。", "example_en": "Planting trees along the highway helped attenuate the traffic noise that had long disturbed nearby residents.", "ipa": "/əˈten.ju.eɪt/", "pos": "v.", "word": "attenuate"}, {"def_cn": "好战的；好斗的", "def_en": "Aggressive and eager to fight; warlike.", "example_cn": "两国领导人好战的言辞引发了人们对边境争端可能升级为战争的担忧。", "example_en": "The bellicose rhetoric of the two leaders raised fears that the border dispute might escalate into war.", "ipa": "/ˈbel.ɪ.koʊs/", "pos": "adj.", "word": "bellicose"}, {"def_cn": "草率的；走马观花的", "def_en": "Hasty and not thorough; superficial.", "example_cn": "粗略浏览报告什么也没发现，但仔细阅读后发现了数据中的几个严重错误。", "example_en": "A cursory glance at the report revealed nothing, but a careful reading exposed several serious errors in the data.", "ipa": "/ˈkɜːr.sər.i/", "pos": "adj.", "word": "cursory"}, {"def_cn": "描绘；勾勒", "def_en": "To describe or outline something precisely.", "example_cn": "第一章勾勒了作者的中心论点，概述了技术如何在二十世纪重塑了交流方式。", "example_en": "The first chapter delineates the author's central argument, outlining how technology reshaped communication in the twentieth century.", "ipa": "/dɪˈlɪn.i.eɪt/", "pos": "v.", "word": "delineate"}, {"def_cn": "引出；诱发", "def_en": "To draw out a response, answer, or reaction.", "example_cn": "采访者深思熟虑而耐心的问题，最终引出了这位一向谨言慎行的政客出人意料的坦诚回答。", "example_en": "The interviewer's thoughtful and patient questions finally elicited surprisingly honest answers from the usually guarded politician.", "ipa": "/ɪˈlɪs.ɪt/", "pos": "v.", "word": "elicit"}, {"def_cn": "愚蠢的；无意义的", "def_en": "Foolish and pointless; silly.", "example_cn": "委员会驳回了那个愚蠢的建议——认为只要多印钞票就能解决预算危机。", "example_en": "The committee dismissed the fatuous suggestion that the budget crisis could be solved simply by printing more money.", "ipa": "/ˈfætʃ.u.əs/", "pos": "adj.", "word": "fatuous"}, {"def_cn": "相关的；切题的", "def_en": "Relevant to the subject being considered.", "example_cn": "法官提醒律师把问题限制在与法庭审理案件相关的事项上。", "example_en": "The judge reminded the lawyer to limit his questions to matters germane to the case before the court.", "ipa": "/dʒərˈmeɪn/", "pos": "adj.", "word": "germane"}, {"def_cn": "爱社交的；合群的", "def_en": "Fond of company; sociable.", "example_cn": "这位爱社交的教授喜欢举办晚宴，让不同院系的学生交流思想。", "example_en": "The gregarious professor loved hosting dinner parties where students from different departments could exchange ideas.", "ipa": "/ɡrɪˈɡer.i.əs/", "pos": "adj.", "word": "gregarious"}, {"def_cn": "无法平息的；执拗不饶的", "def_en": "Unable to be calmed, satisfied, or appeased.", "example_cn": "这位毫不留情的评论家拒绝一切道歉，在余下的职业生涯中继续抨击这位艺术家的作品。", "example_en": "The implacable critic refused every apology, continuing to denounce the artist's work for the rest of his career.", "ipa": "/ɪmˈplæk.ə.bəl/", "pos": "adj.", "word": "implacable"}, {"def_cn": "无害的；无恶意的", "def_en": "Not harmful or offensive; harmless.", "example_cn": "那句看似无害的天气评论，实际上是两名间谍之间的暗语。", "example_en": "What seemed like an innocuous comment about the weather was actually a coded message between the two spies.", "ipa": "/ɪˈnɑːk.ju.əs/", "pos": "adj.", "word": "innocuous"}, {"def_cn": "辱骂；谩骂之词", "def_en": "Insulting or abusive language.", "example_cn": "辩论很快沦为琐碎的谩骂，两位候选人互相辱骂而不讨论政策。", "example_en": "The debate quickly degenerated into petty invective, with both candidates hurling insults instead of discussing policy.", "ipa": "/ɪnˈvek.tɪv/", "pos": "n.", "word": "invective"}, {"def_cn": "健谈的；多话的", "def_en": "Talkative; fond of talking.", "example_cn": "健谈的导游用关于这座城市隐秘历史的无尽故事逗乐了整个团队。", "example_en": "The loquacious tour guide entertained the group with endless stories about the city's hidden history.", "ipa": "/loʊˈkweɪ.ʃəs/", "pos": "adj.", "word": "loquacious"}, {"def_cn": "万灵药；灵丹妙药", "def_en": "A remedy for all problems; a cure-all.", "example_cn": "市长警告说新的减税并非万灵药，无法解决这座城市更深层的经济问题。", "example_en": "The mayor warned that the new tax cut was no panacea and would not solve the city's deeper economic problems.", "ipa": "/ˌpæn.əˈsiː.ə/", "pos": "n.", "word": "panacea"}, {"def_cn": "偏好；嗜好", "def_en": "A strong liking or fondness for something.", "example_cn": "这位年轻的小说家偏爱历史背景，在书中充满了对过去几个世纪的生动细节描写。", "example_en": "The young novelist had a penchant for historical settings, filling her books with vivid details of past centuries.", "ipa": "/ˈpen.tʃənt/", "pos": "n.", "word": "penchant"}, {"def_cn": "安抚；平息（怒气）", "def_en": "To calm someone's anger; to appease.", "example_cn": "为了安抚愤怒的居民，公司承诺出资彻底清理被污染的河流。", "example_en": "To placate the angry residents, the company promised to fund a full cleanup of the polluted river.", "ipa": "/ˈpleɪ.keɪt/", "pos": "v.", "word": "placate"}, {"def_cn": "静止的；沉寂的", "def_en": "Inactive or at rest; dormant.", "example_cn": "经过几十年的冲突，边境地区保持平静，近五年没有发生冲突的报道。", "example_en": "After decades of conflict, the border region remained quiescent, with no reported clashes for nearly five years.", "ipa": "/kwaɪˈes.ənt/", "pos": "adj.", "word": "quiescent"}, {"def_cn": "傲慢的；目空一切的", "def_en": "Behaving as if one is superior to others; haughty.", "example_cn": "这位傲慢的服务员明显轻蔑地对待顾客，仿佛为他们服务有损他的尊严。", "example_en": "The supercilious waiter treated the customers with obvious disdain, as if serving them were beneath his dignity.", "ipa": "/ˌsuː.pərˈsɪl.i.əs/", "pos": "adj.", "word": "supercilious"}, {"def_cn": "过量；过多", "def_en": "An excessive amount of something.", "example_cn": "节日期间吃了过量的丰盛甜点后，这家人欣然迎来了简单家常菜的回归。", "example_en": "After a surfeit of rich desserts during the holidays, the family welcomed the return of simple home cooking.", "ipa": "/ˈsɜːr.fɪt/", "pos": "n.", "word": "surfeit"}], "practice": [{"qid": "d21-q1", "stem": "When the principal asked for volunteers to organize the charity drive, Maya accepted with ______, eager to take on the challenge.", "passage": "", "options": ["alacrity", "ambivalence", "invective", "surfeit"], "answer": "A", "explanation_en": "'Eager to take on the challenge' signals cheerful willingness, which is the definition of alacrity. Ambivalence means mixed feelings, invective means insulting language, and surfeit means an excess — none matches eager acceptance.", "explanation_cn": "eager to take on the challenge 表示欣然接受挑战，这正是 alacrity（欣然、热忱）的定义。ambivalence 是矛盾心理，invective 是辱骂之词，surfeit 是过量，都不符合“欣然接受”的语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d21-q2", "stem": "The editor's cursory review of the manuscript ______ several factual errors that a more careful reading would have caught.", "passage": "", "options": ["missed", "have missed", "were missing", "miss"], "answer": "A", "explanation_en": "The singular subject 'review' requires the singular past-tense verb 'missed.' Choices B and D use plural verb forms, and C creates a subject-verb mismatch ('review were missing') while also changing the meaning.", "explanation_cn": "单数主语 review 需要单数过去式动词 missed。B 和 D 是复数动词形式，C 造成主谓不一致（review were missing）且改变了句意。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d21-q3", "stem": "The judge interrupted the attorney and instructed him to confine his questions to matters ______ to the case at hand.", "passage": "", "options": ["germane", "fatuous", "quiescent", "loquacious"], "answer": "A", "explanation_en": "The judge wants questions relevant to the case, and 'germane' means relevant. Fatuous means foolish, quiescent means inactive, and loquacious means talkative — none means relevant.", "explanation_cn": "法官要求问题与案件相关，germane（相关的、切题的）正合适。fatuous 是愚蠢的，quiescent 是静止的，loquacious 是健谈的，都没有“相关”之意。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d21-q4", "stem": "Text 1: Urban beekeeping has surged in popularity, with advocates claiming it boosts local pollination and reconnects city dwellers with nature. Text 2: A 2023 study found that city hives often struggle: limited floral diversity leaves bees malnourished, and rooftop heat shortens their lifespans. The researchers conclude that urban beekeeping, while well-intentioned, frequently harms the very insects it aims to protect. How would the author of Text 2 most likely respond to the claim in Text 1 that urban beekeeping reconnects city dwellers with nature?", "passage": "", "options": ["By agreeing that the emotional benefits outweigh the harm to bees.", "By arguing that good intentions do not guarantee good outcomes for the bees.", "By denying that urban beekeeping has become popular.", "By suggesting that rooftop heat actually benefits bee colonies."], "answer": "B", "explanation_en": "Text 2 acknowledges beekeepers are 'well-intentioned' but shows the practice 'frequently harms' bees — the core point is that good intentions do not ensure good results. Choice A contradicts Text 2's conclusion. Choice C contradicts the stated surge in popularity. Choice D contradicts the finding that heat shortens lifespans.", "explanation_cn": "Text 2 承认养蜂人“初衷良好”，但指出这种做法“常常伤害”蜜蜂——核心观点是良好意图不保证良好结果。A 与 Text 2 的结论矛盾。C 与“养蜂激增”的事实矛盾。D 与“高温缩短寿命”的发现矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d21-q5", "stem": "Many voters hoped the new policy would be a panacea for the city's traffic problems. ______, transportation experts warned that no single measure could untangle decades of poor planning.", "passage": "", "options": ["However,", "Consequently,", "For instance,", "Similarly,"], "answer": "A", "explanation_en": "The experts' warning pushes back against the voters' hope, creating a contrast that calls for 'However.' 'Consequently' would signal a result, 'For instance' an example, and 'Similarly' a parallel — none fits a contrast.", "explanation_cn": "专家的警告反驳了选民的期望，形成对比，需要 However。Consequently 表结果，For instance 表举例，Similarly 表类比，都不适合这种对比关系。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d21-q6", "stem": "The thick stone walls of the old library ______ the roar of downtown traffic, creating a quiet refuge for readers.", "passage": "", "options": ["attenuated", "elicited", "delineated", "placated"], "answer": "A", "explanation_en": "The walls reduce the noise, making it quieter — 'attenuate' means to weaken or reduce. 'Elicit' means to draw out, 'delineate' means to outline, and 'placate' means to calm a person; none describes reducing sound.", "explanation_cn": "厚石墙减弱了噪音、营造了安静的环境——attenuate（削弱、减弱）正合适。elicit 是引出，delineate 是勾勒，placate 是安抚（人），都不表示减弱声音。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d21-q7", "stem": "A nutritionist compared two groups of students: one ate breakfast daily, the other skipped it. After one semester, the breakfast group scored 12 percent higher on memory tests, though both groups performed equally on tests of creativity. Which statement is best supported by the study?", "passage": "", "options": ["Eating breakfast improves all types of cognitive performance.", "Skipping breakfast has no effect on academic performance.", "Breakfast consumption was associated with better memory but not better creativity.", "Students who skip breakfast are less creative than those who eat it."], "answer": "C", "explanation_en": "The study found a memory advantage for the breakfast group but equal creativity scores, so C restates the findings precisely. Choice A overgeneralizes with 'all types.' Choice B ignores the memory difference. Choice D contradicts the equal creativity results.", "explanation_cn": "研究发现吃早餐组记忆更好、但创造力得分相同，C 准确复述了发现。A 过度概括（“所有类型”）。B 忽略了记忆差异。D 与创造力得分相同的结果矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d21-q8", "stem": "The panel of experts, along with the keynote speaker, ______ the need for stricter data privacy laws.", "passage": "", "options": ["has emphasized", "have emphasized", "were emphasizing", "emphasize"], "answer": "A", "explanation_en": "The subject is the singular noun 'panel'; the phrase 'along with the keynote speaker' does not make it plural. Therefore the singular verb 'has emphasized' is correct. Choices B, C, and D all use plural verbs.", "explanation_cn": "主语是单数名词 panel；along with the keynote speaker 只是插入语，不改变主语的单复数。所以单数动词 has emphasized 正确。B、C、D 都是复数动词。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d21-q9", "stem": "The food critic's ______ review dripped with condescension, implying that only diners with his refined palate could appreciate fine cuisine.", "passage": "", "options": ["supercilious", "gregarious", "innocuous", "ambivalent"], "answer": "A", "explanation_en": "'Dripped with condescension' and the implication of superiority match 'supercilious' (acting superior to others). Gregarious means sociable, innocuous means harmless, and ambivalent means having mixed feelings — none conveys arrogant condescension.", "explanation_cn": "dripped with condescension（充满居高临下）和自视高人一等之意，与 supercilious（傲慢的、目空一切的）相符。gregarious 是爱社交的，innocuous 是无害的，ambivalent 是矛盾的，都没有傲慢轻蔑之意。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d21-q10", "stem": "While researching a topic, a student has taken the following notes: Dr. Lena Ortiz is a marine biologist studying coral bleaching. She found that certain coral species recover faster when nearby seagrass beds are healthy. Seagrass beds filter pollutants and stabilize water temperature. Ortiz recommends protecting seagrass as part of coral conservation efforts. The student wants to emphasize the reason seagrass helps coral recovery. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "passage": "", "options": ["Dr. Lena Ortiz is a marine biologist who studies coral bleaching and recommends protecting seagrass.", "Certain coral species recover faster when nearby seagrass beds are healthy.", "Seagrass beds filter pollutants and stabilize water temperature, which helps nearby coral recover from bleaching.", "Ortiz found that certain coral species recover faster, so she studies coral bleaching."], "answer": "C", "explanation_en": "Choice C directly gives the reason — filtering pollutants and stabilizing temperature — linking it to coral recovery, which is exactly the student's goal. Choices A and D focus on Ortiz herself rather than the reason. Choice B states the effect but not the reason behind it.", "explanation_cn": "C 直接给出了原因——过滤污染物、稳定水温——并将其与珊瑚恢复联系起来，正好符合学生的目标。A 和 D 聚焦于 Ortiz 本人而非原因。B 只说了效果，没说原因。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-19"}, {"day": 22, "words": [{"def_cn": "奉承；过度的赞美", "def_en": "Excessive praise or admiration given to someone, often considered shallow.", "example_cn": "这位年轻科学家对媒体的吹捧感到不自在，媒体把她一项普通的发现吹捧成了革命。", "example_en": "The young scientist was uncomfortable with the adulation of the media, which celebrated her modest discovery as a revolution.", "ipa": "ˌædʒəˈleɪʃən", "pos": "n.", "word": "adulation"}, {"def_cn": "对立的；截然相反的", "def_en": "Directly opposed to or completely different from something.", "example_cn": "专制审查与大学本应保护的思想自由交流是根本对立的。", "example_en": "Authoritarian censorship is antithetical to the open exchange of ideas that universities are meant to protect.", "ipa": "ˌæntəˈθetɪkəl", "pos": "adj.", "word": "antithetical"}, {"def_cn": "夸夸其谈的；言过其实的", "def_en": "Using language that sounds important but has little real meaning.", "example_cn": "市长那番夸夸其谈的演讲承诺让城市一夜巨变，却没有拿出任何具体计划。", "example_en": "The mayor's bombastic speech promised to transform the city overnight, but it offered no concrete plan.", "ipa": "bɑmˈbæstɪk", "pos": "adj.", "word": "bombastic"}, {"def_cn": "迅速增长；蓬勃发展", "def_en": "To grow or develop quickly; to flourish.", "example_cn": "自从新的补贴让大多数家庭都负担得起太阳能板以来，人们对可再生能源的兴趣迅速增长。", "example_en": "Interest in renewable energy has burgeoned since the new subsidies made solar panels affordable for most households.", "ipa": "ˈbɜrdʒən", "pos": "v.", "word": "burgeon"}, {"def_cn": "鉴赏家；行家", "def_en": "A person with expert knowledge and refined judgment in a particular art or subject.", "example_cn": "即便是一位古典音乐鉴赏家，也觉得这位年轻钢琴家对那首协奏曲的演绎颇具新意。", "example_en": "Even a connoisseur of classical music found the young pianist's interpretation of the concerto strikingly original.", "ipa": "ˌkɑnəˈsɜr", "pos": "n.", "word": "connoisseur"}, {"def_cn": "轻信的；易受骗的", "def_en": "Too willing to believe things without questioning them; gullible.", "example_cn": "这则广告利用了轻信的消费者，宣称那种神奇面霜能一夜抚平皱纹。", "example_en": "The advertisement took advantage of credulous consumers, promising that the miracle cream would erase wrinkles overnight.", "ipa": "ˈkredʒələs", "pos": "adj.", "word": "credulous"}, {"def_cn": "煽动家；蛊惑民心的政客", "def_en": "A political leader who gains power by appealing to people's emotions and prejudices rather than reason.", "example_cn": "历史学家警告说，这位煽动家恢复民族荣光的承诺转移了选民对他糟糕经济政绩的注意力。", "example_en": "Historians warn that the demagogue's promises to restore national glory distracted voters from his disastrous economic record.", "ipa": "ˈdeməɡɑɡ", "pos": "n.", "word": "demagogue"}, {"def_cn": "使不安；使困惑", "def_en": "To make someone feel uneasy, confused, or embarrassed.", "example_cn": "当应聘者平静地承认自己对公司历史一无所知时，面试官感到颇为意外。", "example_en": "The interviewer was disconcerted when the candidate calmly admitted that she knew nothing about the company's history.", "ipa": "ˌdɪskənˈsɜrt", "pos": "v.", "word": "disconcert"}, {"def_cn": "冷静的；客观的", "def_en": "Not influenced by strong feelings; calm and objective.", "example_cn": "优秀的科学家必须以客观冷静的态度看待数据，即使结果与自己的假设相悖也要接受。", "example_en": "A good scientist must take a dispassionate view of the data, accepting results even when they contradict her hypothesis.", "ipa": "dɪsˈpæʃənət", "pos": "adj.", "word": "dispassionate"}, {"def_cn": "厚颜无耻；放肆", "def_en": "Shameless boldness; impudent behavior.", "example_cn": "这名学生竟厚颜无耻地要求教授改分数，尽管他翘了近半数课程。", "example_en": "The student had the effrontery to ask the professor to change his grade, although he had skipped half the lectures.", "ipa": "ɪˈfrʌntəri", "pos": "n.", "word": "effrontery"}, {"def_cn": "阐明；解释清楚", "def_en": "To make something clear; to explain in detail.", "example_cn": "这些新化石阐明了早期鸟类如何在数百万年间从恐龙演化而来。", "example_en": "The new fossils elucidate how early birds evolved from dinosaurs over millions of years.", "ipa": "ɪˈluːsɪdeɪt", "pos": "v.", "word": "elucidate"}, {"def_cn": "证明无罪；为……开脱", "def_en": "To prove that someone is not guilty of a crime or wrongdoing.", "example_cn": "监控录像证明了收银员的清白，显示她从未碰过那笔丢失的钱。", "example_en": "The security footage exculpated the cashier, showing that she had never touched the missing money.", "ipa": "ˈekskəlpeɪt", "pos": "v.", "word": "exculpate"}, {"def_cn": "公然的；明目张胆的", "def_en": "Obviously and shockingly wrong or offensive.", "example_cn": "该公司公然向河里倾倒化学废料，连见惯了工业污染的监管人员都感到震惊。", "example_en": "The company's flagrant dumping of chemicals into the river shocked even regulators used to industrial pollution.", "ipa": "ˈfleɪɡrənt", "pos": "adj.", "word": "flagrant"}, {"def_cn": "鬼鬼祟祟的；偷偷摸摸的", "def_en": "Done secretly to avoid attention; sneaky.", "example_cn": "两位选手交换的那个鬼祟眼神表明，他们在比赛前达成了某种秘密协议。", "example_en": "The furtive glance the two players exchanged suggested that they had a secret agreement before the match.", "ipa": "ˈfɜrtɪv", "pos": "adj.", "word": "furtive"}, {"def_cn": "无礼的；冒失的", "def_en": "Rude and disrespectful, especially toward someone of higher status.", "example_cn": "一名普通员工当着全组的面质疑主管的决定，是很失礼的行为。", "example_en": "It would be impertinent for a junior employee to question the director's decision in front of the whole team.", "ipa": "ɪmˈpɜrtɪnənt", "pos": "adj.", "word": "impertinent"}, {"def_cn": "有害的；敌对的", "def_en": "Harmful to something; unfriendly or hostile.", "example_cn": "持续的噪音和昏暗的灯光都不利于集中注意力，所以图书馆的设计会排除这两者。", "example_en": "Constant noise and poor lighting are inimical to concentration, so libraries are designed to exclude both.", "ipa": "ɪˈnɪmɪkəl", "pos": "adj.", "word": "inimical"}, {"def_cn": "简洁有力的；精辟的", "def_en": "Expressed briefly but with great meaning; concise and forceful.", "example_cn": "作者那篇精辟的书评只用两句话就总结了这部长达三百页的小说。", "example_en": "The author's pithy review summed up the three-hundred-page novel in just two sentences.", "ipa": "ˈpɪθi", "pos": "adj.", "word": "pithy"}, {"def_cn": "催眠的；令人昏昏欲睡的", "def_en": "Tending to cause sleep; boring.", "example_cn": "教授那场关于税收政策的催眠式讲座让一半听众都快睡着了。", "example_en": "The professor's soporific lecture on tax policy left half the audience struggling to stay awake.", "ipa": "ˌsoʊpəˈrɪfɪk", "pos": "adj.", "word": "soporific"}, {"def_cn": "缓和；使适度", "def_en": "To moderate or make something less extreme; to control.", "example_cn": "法官在批评警方的同时也表扬了他们对紧急情况的快速反应，使批评不至于过分尖锐。", "example_en": "The judge tempered her criticism of the police with praise for their quick response to the emergency.", "ipa": "ˈtempər", "pos": "v.", "word": "temper"}, {"def_cn": "辱骂的；尖刻批评的", "def_en": "Full of harsh, abusive criticism.", "example_cn": "这位影评人尖刻的评论不仅攻击了这部电影，还抨击了导演的整个职业生涯。", "example_en": "The critic's vituperative review attacked not only the film but also the director's entire career.", "ipa": "vaɪˈtuːpərətɪv", "pos": "adj.", "word": "vituperative"}], "practice": [{"qid": "d22-q1", "stem": "The critic's review of the novel was brief but powerful: in just three sentences, she captured the book's central flaw. Which word best describes the review?", "passage": "", "options": ["vituperative", "soporific", "pithy", "bombastic"], "answer": "C", "explanation_en": "The review is described as brief but powerful, which matches pithy (concise and forceful). Vituperative means harshly critical, soporific means sleep-inducing, and bombastic means pompous with little meaning, none of which fit a brief, effective review.", "explanation_cn": "评论被描述为简短但有力，符合 pithy（简洁有力）的意思。vituperative 是尖刻辱骂的，soporific 是催眠的，bombastic 是夸夸其谈的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d22-q2", "stem": "The politician's critics accused him of being a ______, claiming that he won votes by stirring up fear rather than presenting real policies.", "passage": "", "options": ["connoisseur", "demagogue", "elucidator", "philistine"], "answer": "B", "explanation_en": "The blank describes a leader who gains support by appealing to emotions like fear instead of reason, which is the definition of a demagogue. A connoisseur is an expert, an elucidator is an explainer, and a philistine is someone indifferent to culture.", "explanation_cn": "空格处指靠煽动恐惧而非真实政策来赢得选票的领导人，正是 demagogue（煽动家）的定义。connoisseur 是鉴赏家，elucidator 是阐释者，philistine 是不懂文化的人。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d22-q3", "stem": "Early telegraph operators developed a shorthand code to send messages quickly. The new study argues that this code was not a crude simplification; ______, it was a sophisticated system with strict grammatical rules. Which choice completes the text with the most logical transition?", "passage": "", "options": ["consequently", "on the contrary", "for example", "in addition"], "answer": "B", "explanation_en": "The second clause reverses the first (not crude, but sophisticated), so the contrasting transition on the contrary fits. Consequently shows a result, for example gives an illustration, and in addition adds information, none of which express contrast.", "explanation_cn": "后句转折了前句（不是粗糙的简化，而是精密的系统），需要表示对比的连接词 on the contrary。consequently 表结果，for example 表举例，in addition 表补充，都不表示转折。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d22-q4", "stem": "The jury found the defendant guilty despite the fact that newly discovered DNA evidence had ______ him completely. Which choice completes the text so that it conforms to the conventions of Standard English and the most logical meaning?", "passage": "", "options": ["exculpated", "implicated", "confounded", "disconcerted"], "answer": "A", "explanation_en": "Exculpated means proven not guilty, which creates the intended contrast with the guilty verdict: despite evidence proving his innocence, he was found guilty. Implicated means the opposite, confounded means confused, and disconcerted means unsettled.", "explanation_cn": "exculpated 意为证明无罪，与 guilty 判决形成“尽管有证据证明清白却被判有罪”的对比。implicated 意思是牵连，confounded 是使困惑，disconcerted 是使不安，都不合逻辑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d22-q5", "stem": "Honeybees perform a waggle dance to tell other bees where flowers are. The dance's angle shows the direction, and its length shows the distance. According to the text, what does the length of the dance communicate?", "passage": "", "options": ["The quality of the flowers", "The distance to the flowers", "The number of bees needed", "The time of day to forage"], "answer": "B", "explanation_en": "The text states directly that the dance's length shows the distance, so B restates that fact. The other options mention details the passage never discusses.", "explanation_cn": "文中明确说舞蹈的长度表示距离，所以 B 是直接复述。其余选项都是文中未提及的信息。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d22-q6", "stem": "The archaeologist's report was praised for its ______ tone: she presented the evidence without letting personal excitement color her conclusions. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["dispassionate", "credulous", "flagrant", "furtive"], "answer": "A", "explanation_en": "The colon explains that she kept personal feelings out of her conclusions, which matches dispassionate (objective and calm). Credulous means gullible, flagrant means shockingly wrong, and furtive means secretive, none of which describe objectivity.", "explanation_cn": "冒号后解释她不让个人情绪影响结论，这正是 dispassionate（客观冷静）的含义。credulous 是轻信的，flagrant 是公然的，furtive 是鬼祟的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d22-q7", "stem": "The new recycling program has already diverted two million plastic bottles from landfills. Expanding it citywide ______, officials say, could prevent another ten million bottles from being dumped each year. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": ["will", "would", "should have", "must have"], "answer": "B", "explanation_en": "The sentence describes a hypothetical future outcome (could prevent), so the conditional would fits. Will states a certainty, should have and must have refer to past obligations or conclusions, which do not match the hypothetical meaning.", "explanation_cn": "句子描述的是假设性的未来结果（could prevent），需要用条件语气 would。will 表肯定，should have 和 must have 指过去的义务或推断，都不符合假设语气。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d22-q8", "stem": "Some historians claim that Queen Victoria's long reign brought only stability. In fact, her era saw rapid industrial change, fierce political debate, and expanding scientific knowledge. The author's main purpose in the second sentence is to ______.", "passage": "", "options": ["praise the queen's personal achievements", "refute the claim made in the first sentence", "describe the daily life of Victorian citizens", "explain why historians disagree with each other"], "answer": "B", "explanation_en": "The second sentence lists facts that contradict the claim of only stability, so its purpose is to refute the first sentence. It does not praise the queen, describe daily life, or explain historians' disagreements.", "explanation_cn": "第二句列举的事实反驳了“只有稳定”的说法，所以其目的是反驳第一句的观点。它没有赞美女王、描述市民生活或解释史学家为何分歧。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d22-q9", "stem": "The company's marketing was ______: it spent millions on flashy advertisements with grand promises, but the ads said almost nothing about the actual product. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["pithy", "bombastic", "dispassionate", "antithetical"], "answer": "B", "explanation_en": "The ads are described as flashy with grand promises but empty of real content, which matches bombastic (pompous but meaningless). Pithy means concise and meaningful, dispassionate means objective, and antithetical means opposed to, none of which fit.", "explanation_cn": "广告被描述为浮夸、承诺宏大却几乎没有实质内容，正符合 bombastic（夸夸其谈）的含义。pithy 是精辟的，dispassionate 是客观的，antithetical 是对立的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d22-q10", "stem": "To reduce plastic waste, the city council banned single-use bags in 2023. A year later, surveys showed that shoppers had largely switched to reusable bags, and plastic bag litter had fallen by 60%. Which choice best states the main idea of the text?", "passage": "", "options": ["Reusable bags are more expensive than single-use bags.", "The bag ban successfully reduced plastic waste.", "Shoppers dislike being told what bags to use.", "The city council should ban more plastic items."], "answer": "B", "explanation_en": "Both the survey results and the litter reduction support the conclusion that the ban worked, which B summarizes. A compares prices never mentioned, C claims shopper dislike contradicted by the switch, and D recommends future action the text never discusses.", "explanation_cn": "调查结果和垃圾减少都证明禁令奏效，B 准确概括了主旨。A 提到价格（文中未提），C 说消费者反感（与文中转用环保袋的事实矛盾），D 建议进一步禁令（文中未讨论）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-20"}, {"day": 23, "words": [{"def_cn": "敌意；憎恨", "def_en": "Strong hostility or hatred toward someone or something.", "example_cn": "尽管两家之间有多年的敌意，年轻一代选择结束恩怨、成为朋友。", "example_en": "Despite years of animosity between the two families, the younger generation chose to end the feud and become friends.", "ipa": "ˌænɪˈmɑsəti", "pos": "n.", "word": "animosity"}, {"def_cn": "严峻的；朴素的", "def_en": "Severe or strict in manner; without decoration or luxury.", "example_cn": "这座修道院体现了僧侣们朴素的生活：光秃的石墙、木长凳，没有任何装饰。", "example_en": "The monastery reflected the monks' austere lifestyle: plain stone walls, wooden benches, and no decoration at all.", "ipa": "ɔˈstɪr", "pos": "adj.", "word": "austere"}, {"def_cn": "田园的；乡村风光的", "def_en": "Relating to pleasant country life; rural and peaceful.", "example_cn": "厌倦了城市的喧嚣，这位作家搬到了一个田园村庄，绵羊就在她小屋的窗外吃草。", "example_en": "Tired of city noise, the writer moved to a bucolic village where sheep grazed outside her cottage window.", "ipa": "bjuːˈkɑlɪk", "pos": "adj.", "word": "bucolic"}, {"def_cn": "刺耳的杂音；不和谐音", "def_en": "A harsh, unpleasant mixture of loud sounds.", "example_cn": "隔壁工地发出的刺耳噪音让学生们听不清老师讲课。", "example_en": "The construction site next door produced such a cacophony that the students could not hear their teacher.", "ipa": "kəˈkɑfəni", "pos": "n.", "word": "cacophony"}, {"def_cn": "尊敬；敬重", "def_en": "Respectful behavior toward someone because of their age, rank, or wisdom.", "example_cn": "出于对祖母心愿的尊重，这位年轻女子同意在家乡举行婚礼。", "example_en": "Out of deference to her grandmother's wishes, the young woman agreed to hold the wedding in her hometown.", "ipa": "ˈdefərəns", "pos": "n.", "word": "deference"}, {"def_cn": "端庄矜持的；腼腆的", "def_en": "Quiet, modest, and shy in a way that seems polite.", "example_cn": "这位一向腼腆的学生竟然发表了大胆演讲反对新校规，让所有人吃惊。", "example_en": "The usually demure student surprised everyone by delivering a bold speech against the new school policy.", "ipa": "dɪˈmjʊr", "pos": "adj.", "word": "demure"}, {"def_cn": "挽歌；哀悼诗", "def_en": "A sad poem or song written in memory of someone who has died.", "example_cn": "诗人写给已故父亲的挽歌描述了他们一起钓鱼度过的宁静黄昏。", "example_en": "The poet's elegy for his late father described quiet evenings they had spent fishing together.", "ipa": "ˈelədʒi", "pos": "n.", "word": "elegy"}, {"def_cn": "悼词；颂词", "def_en": "A speech praising someone who has recently died.", "example_cn": "在悼词中，市长回忆了导师的仁慈和一生对公共服务的奉献。", "example_en": "In her eulogy, the mayor recalled her mentor's kindness and lifelong dedication to public service.", "ipa": "ˈjuːlədʒi", "pos": "n.", "word": "eulogy"}, {"def_cn": "华丽的（文风）；红润的", "def_en": "Overly decorated or complicated in style; also, having a red or flushed face.", "example_cn": "评论家觉得这部小说华而不实的文风令人疲惫，每个落日都要用整整三页来描写。", "example_en": "The critic found the novel's florid prose exhausting, with every sunset described in three full pages.", "ipa": "ˈflɔrɪd", "pos": "adj.", "word": "florid"}, {"def_cn": "夸张华丽的；浮夸的（言辞）", "def_en": "Using big, fancy words to sound impressive; pompous in speech.", "example_cn": "选民们厌倦了这位候选人浮夸的承诺，听起来高尚却什么都没说清楚。", "example_en": "Voters grew tired of the candidate's grandiloquent promises, which sounded noble but explained nothing.", "ipa": "ɡrænˈdɪləkwənt", "pos": "adj.", "word": "grandiloquent"}, {"def_cn": "享乐主义", "def_en": "The belief that pleasure is the most important goal in life.", "example_cn": "这位哲学家认为纯粹的享乐主义无法带来持久的幸福，因为快乐消散得很快。", "example_en": "The philosopher argued that pure hedonism cannot lead to lasting happiness, since pleasures fade quickly.", "ipa": "ˈhidənɪzəm", "pos": "n.", "word": "hedonism"}, {"def_cn": "异端的；离经叛道的", "def_en": "Opposed to the accepted beliefs of a religion or group; unorthodox.", "example_cn": "这位科学家“宇宙没有开端”的异端主张震惊了保守的学术界。", "example_en": "The scientist's heretical claim that the universe had no beginning shocked the conservative academy.", "ipa": "həˈretɪkəl", "pos": "adj.", "word": "heretical"}, {"def_cn": "可耻的；丢脸的", "def_en": "Causing public shame or disgrace.", "example_cn": "惨败蒙羞之后，教练引咎辞职，为球队史上最差的一个赛季负责。", "example_en": "After the ignominious defeat, the coach resigned, taking responsibility for the team's worst season ever.", "ipa": "ˌɪɡnəˈmɪniəs", "pos": "adj.", "word": "ignominious"}, {"def_cn": "乏味的；平淡无味的", "def_en": "Lacking flavor, interest, or energy; dull.", "example_cn": "那碗寡淡无味的汤喝起来像温水，连饥饿的孩子们都不愿喝完。", "example_en": "The insipid soup tasted like warm water, and even the hungry children refused to finish it.", "ipa": "ɪnˈsɪpɪd", "pos": "adj.", "word": "insipid"}, {"def_cn": "傲慢无礼的；粗鲁的", "def_en": "Rude and disrespectful in behavior or speech.", "example_cn": "这位傲慢的顾客对年轻服务员大吼大叫，而那个失误其实是厨房犯的。", "example_en": "The insolent customer shouted at the young waiter for a mistake that the kitchen had actually made.", "ipa": "ˈɪnsələnt", "pos": "adj.", "word": "insolent"}, {"def_cn": "倦怠；无精打采", "def_en": "A feeling of tiredness and lack of energy or interest.", "example_cn": "备考数月后，一种深深的倦怠笼罩了学生们，连咖啡都提不起精神。", "example_en": "After months of studying for the exam, a deep lassitude settled over the students, and even coffee could not lift it.", "ipa": "ˈlæsɪtuːd", "pos": "n.", "word": "lassitude"}, {"def_cn": "把……奉为名人；吹捧", "def_en": "To treat someone as a celebrity or hero; to glorify.", "example_cn": "媒体把这位少年发明家捧成了名人，一夜之间她成了科学天才的全国象征。", "example_en": "The media lionized the teenage inventor, turning her into a national symbol of scientific genius overnight.", "ipa": "ˈlaɪənaɪz", "pos": "v.", "word": "lionize"}, {"def_cn": "不懂文化艺术的人；庸人", "def_en": "A person who is indifferent or hostile to art, culture, and intellectual pursuits.", "example_cn": "博物馆馆长担心削减预算会讨好那些庸人，他们认为艺术是这座城市负担不起的奢侈品。", "example_en": "The museum director feared that budget cuts would please philistines who saw art as a luxury the city could not afford.", "ipa": "ˈfɪlɪstaɪn", "pos": "n.", "word": "philistine"}, {"def_cn": "热情洋溢地赞美；狂热地谈论", "def_en": "To speak or write about something with great enthusiasm and delight.", "example_cn": "这位旅行作家热情洋溢地赞美那座岛屿的海滩，说沙子比丝绸还要柔软。", "example_en": "The travel writer rhapsodized about the island's beaches, describing the sand as softer than silk.", "ipa": "ˈræpsədaɪz", "pos": "v.", "word": "rhapsodize"}, {"def_cn": "勤勉的；聚精会神的", "def_en": "Showing hard work, care, and determination.", "example_cn": "通过勤奋刻苦的练习，这位小提琴家攻克了那首曾经看似不可能的难曲。", "example_en": "Through sedulous practice, the violinist mastered the difficult concerto that had once seemed impossible.", "ipa": "ˈsedʒələs", "pos": "adj.", "word": "sedulous"}], "practice": [{"qid": "d23-q1", "stem": "The two neighboring towns had competed fiercely for decades, but the new highway project required them to set aside their ______ and cooperate. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["animosity", "deference", "hedonism", "lassitude"], "answer": "A", "explanation_en": "The towns need to cooperate despite decades of fierce competition, so they must set aside their hostility, which is animosity. Deference is respect, hedonism is pleasure-seeking, and lassitude is tiredness, none of which conflict with cooperation.", "explanation_cn": "两镇激烈竞争了几十年，现在需要合作，所以要放下的是敌意，即 animosity。deference 是尊敬，hedonism 是享乐主义，lassitude 是倦怠，都与合作不冲突。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d23-q2", "stem": "The ancient temple was known for its ______ design: bare stone walls, no gold, and not a single painted decoration. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["florid", "bucolic", "austere", "grandiloquent"], "answer": "C", "explanation_en": "The temple is described as plain and undecorated, which matches austere (severe and without decoration). Florid means overly decorated, bucolic means rural, and grandiloquent describes pompous speech, none of which fit bare stone walls.", "explanation_cn": "寺庙被描述为朴素无装饰，符合 austere（朴素严峻）的含义。florid 是华丽的，bucolic 是田园的，grandiloquent 形容浮夸的言辞，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d23-q3", "stem": "While some critics dismissed the singer's early albums, music historians now argue that those records were ______: far from simple, they contained complex harmonies that influenced a generation. Which choice completes the text with the most logical transition and word?", "passage": "", "options": ["insipid, because", "profound, although", "insipid, but actually", "celebrated, and therefore"], "answer": "C", "explanation_en": "The sentence contrasts the critics' dismissal with the historians' view that the albums were complex, so the contrasting transition but actually pairs with insipid (dull), the word the critics used. The other choices either lack contrast or pair the transition with the wrong judgment.", "explanation_cn": "句子把评论家的贬低与史学家的高度评价对比，需要转折连接词，所以选“insipid, but actually”（评论家认为平淡，实则不然）。其他选项要么没有转折，要么搭配错误。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d23-q4", "stem": "Seeking relief from the noise of the city, the poet rented a small cottage in a ______ valley, where the only sounds were birdsong and a distant stream. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["cacophonous", "bucolic", "austere", "insolent"], "answer": "B", "explanation_en": "The valley is peaceful countryside with birdsong and a stream, which matches bucolic (rural and pleasant). Cacophonous means noisy, the opposite of the scene; austere means plain and severe; insolent describes rude people.", "explanation_cn": "山谷是宁静的乡村，有鸟鸣和溪流，符合 bucolic（田园的）的含义。cacophonous 是嘈杂的，与场景相反；austere 是朴素严峻的；insolent 形容无礼的人。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d23-q5", "stem": "The scientist collected water samples from the lake every morning for three years. She then compared the yearly data to track pollution trends. The main purpose of the underlined sentence is to ______.", "passage": "", "options": ["show how dedicated the scientist was", "describe the method used to gather evidence", "prove that the lake was badly polluted", "explain why mornings are best for sampling"], "answer": "B", "explanation_en": "The sentence describes what the scientist did to collect data, so it explains her method. It does not comment on her dedication, state the pollution conclusion, or discuss why mornings were chosen.", "explanation_cn":
