 "划线句描述科学家如何收集数据，即说明研究方法。它没有评价她的敬业精神、给出污染结论，也没解释为何选早晨采样。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d23-q6", "stem": "The general's ______ defeat at the final battle ended his career: newspapers called him a disgrace, and he never commanded troops again. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["ignominious", "demure", "sedulous", "florid"], "answer": "A", "explanation_en": "The defeat brought public disgrace and ended his career, which matches ignominious (shameful). Demure means shy, sedulous means hardworking, and florid means overly decorated, none of which describe a disgraceful defeat.", "explanation_cn": "这场失败让他蒙羞并终结了职业生涯，符合 ignominious（可耻的）的含义。demure 是腼腆的，sedulous 是勤勉的，florid 是华丽的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d23-q7", "stem": "The library's new wing opened in 2019, and it quickly became the most popular study space on campus. By 2024, students ______ there for over five years. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": ["have been studying", "had been studying", "will have been studying", "study"], "answer": "A", "explanation_en": "By 2024 describes a period continuing up to the present reference point, so the present perfect continuous have been studying fits. Had been studying would need a past endpoint, will have been studying looks to the future, and study is simple present.", "explanation_cn": "By 2024 表示延续到现在的一个时间段，用现在完成进行时 have been studying。had been studying 需要过去的时间终点，will have been studying 指向未来，study 是一般现在时，都不对。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d23-q8", "stem": "Maya Lin's Vietnam Veterans Memorial was controversial when it was unveiled, but visitors soon found its quiet simplicity deeply moving. Today it is regarded as one of the most powerful war memorials ever built. Which choice best states the main idea of the text?", "passage": "", "options": ["Controversial artworks are always eventually accepted.", "The memorial's power comes from its simplicity.", "Maya Lin designed many famous memorials.", "Visitors prefer loud and grand monuments."], "answer": "B", "explanation_en": "The text emphasizes that the memorial's quiet simplicity moved visitors and made it powerful, which B summarizes. A overgeneralizes, C adds facts not mentioned, and D contradicts the passage.", "explanation_cn": "文中强调纪念碑质朴的简洁打动了参观者、使其极具感染力，B 准确概括。A 过度泛化，C 补充了文中未提的事实，D 与文意相反。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d23-q9", "stem": "The speaker's style was ______: every simple point was wrapped in long, fancy phrases that impressed no one and clarified nothing. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["sedulous", "demure", "grandiloquent", "pithy"], "answer": "C", "explanation_en": "The speaker used long, fancy phrases that impressed no one, which matches grandiloquent (pompous speech). Sedulous means hardworking, demure means shy, and pithy means concise, the opposite of the described style.", "explanation_cn": "演讲者用冗长华丽的词藻包装简单观点却毫无效果，符合 grandiloquent（浮夸的言辞）。sedulous 是勤勉的，demure 是腼腆的，pithy 是简洁的，与描述的风格相反。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d23-q10", "stem": "After winning the national prize, the young author was ______ by publishers, who competed to sign her and invited her to every literary event. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["lionized", "ignored", "questioned", "avoided"], "answer": "A", "explanation_en": "Publishers competed to sign her and invited her everywhere, treating her like a celebrity, which is lionized. Ignored, questioned, and avoided all contradict the enthusiastic attention described.", "explanation_cn": "出版商争相签下她、邀请她参加各种文学活动，把她当名人吹捧，即 lionized。ignored、questioned、avoided 都与文中热情的关注相矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-30"}, {"day": 24, "words": [{"def_cn": "散漫的；无条理的；漫无目的的", "def_en": "Lacking a plan or purpose; random and disconnected.", "example_cn": "这场散漫的讨论在话题之间跳来跳去，始终没有触及核心问题。", "example_en": "The desultory discussion jumped from topic to topic without ever addressing the central question.", "ipa": "/ˈdes.əl.tɔːr.i/", "pos": "adj.", "word": "desultory"}, {"def_cn": "拖延的；故意拖慢的", "def_en": "Intended to cause delay; slow to act.", "example_cn": "批评者谴责了为推迟气候法案投票而使用的拖延战术。", "example_en": "Critics condemned the dilatory tactics used to postpone the vote on the climate bill.", "ipa": "/ˈdɪl.ə.tɔːr.i/", "pos": "adj.", "word": "dilatory"}, {"def_cn": "热情洋溢的；充满活力的", "def_en": "Vivacious and enthusiastic; bubbling with energy.", "example_cn": "在漫长的项目中，她热情洋溢的个性鼓舞了整个研究团队的士气。", "example_en": "Her effervescent personality lifted the mood of the entire research team during the long project.", "ipa": "/ˌef.ɚˈves.ənt/", "pos": "adj.", "word": "effervescent"}, {"def_cn": "紧急需要；迫切的要求", "def_en": "An urgent need or demand requiring immediate action.", "example_cn": "洪水的紧急性迫使该市从其他公共项目中挪用资金。", "example_en": "The exigency of the flood forced the city to divert funds from other public programs.", "ipa": "/ˈedʒ.ə.dʒən.si/", "pos": "n.", "word": "exigency"}, {"def_cn": "搜寻发现；穷追查出", "def_en": "To search out and discover through persistent effort.", "example_cn": "这位记者搜寻出了揭示该公司财务不当行为的隐藏文件。", "example_en": "The journalist ferreted out the hidden documents that revealed the company's financial misconduct.", "ipa": "/ˈfer.ət/", "pos": "v.", "word": "ferret"}, {"def_cn": "再三恳求；纠缠要求", "def_en": "To ask persistently and urgently; to beg repeatedly.", "example_cn": "游说者再三恳求委员会成员在最终投票前重新考虑那项有争议的修正案。", "example_en": "Lobbyists importuned the committee members to reconsider the controversial amendment before the final vote.", "ipa": "/ˌɪm.pɔːrˈtuːn/", "pos": "v.", "word": "importune"}, {"def_cn": "固执己见的；不妥协的", "def_en": "Refusing to change one's views or to compromise.", "example_cn": "固执的代表们拒绝了所有妥协方案，使谈判又延长了整整一周。", "example_en": "The intransigent delegates rejected every compromise, prolonging the negotiations for another full week.", "ipa": "/ɪnˈtræn.sɪ.dʒənt/", "pos": "adj.", "word": "intransigent"}, {"def_cn": "易怒的；暴躁的", "def_en": "Having or showing a tendency to become angry easily.", "example_cn": "这位暴躁的教练在训练中因为球员最小的失误就大吼大叫。", "example_en": "The irascible coach shouted at players for even the smallest mistakes during practice sessions.", "ipa": "/ɪˈræs.ə.bəl/", "pos": "adj.", "word": "irascible"}, {"def_cn": "讽刺；挖苦", "def_en": "To publicly criticize someone or something in a satirical way.", "example_cn": "这部新戏剧通过一群荒诞夸张的人物讽刺了政治腐败。", "example_en": "The new play lampoons political corruption through a cast of absurd and exaggerated characters.", "ipa": "/læmˈpuːn/", "pos": "v.", "word": "lampoon"}, {"def_cn": "（声音）甜美的；悦耳的", "def_en": "Having a smooth, sweet sound that is pleasant to hear.", "example_cn": "叙述者甜美的声音让这本十二小时的有声书听起来出奇地轻松愉快。", "example_en": "The narrator's mellifluous voice made the twelve-hour audiobook surprisingly easy to enjoy.", "ipa": "/məˈlɪf.lu.əs/", "pos": "adj.", "word": "mellifluous"}, {"def_cn": "厌世者；不喜欢与人交往的人", "def_en": "A person who dislikes and distrusts other people.", "example_cn": "作为知名的厌世者，这位小说家很少参加公开活动或接受记者采访。", "example_en": "Known as a misanthrope, the novelist rarely attended public events or granted interviews to reporters.", "ipa": "/ˈmɪs.ən.θroʊp/", "pos": "n.", "word": "misanthrope"}, {"def_cn": "有害的；有毒的", "def_en": "Harmful or poisonous to people or the environment.", "example_cn": "这家工厂因向周边居民区排放有毒烟雾而被处以重罚。", "example_en": "The factory was heavily fined for releasing noxious fumes into the surrounding residential neighborhood.", "ipa": "/ˈnɑːk.ʃəs/", "pos": "adj.", "word": "noxious"}, {"def_cn": "僵化；凝固", "def_en": "To become rigid or inflexible in habits or opinions.", "example_cn": "随着时间的推移，这家公司过时的流程逐渐僵化，使有意义的创新几乎不可能。", "example_en": "Over time, the company's outdated procedures ossified, making meaningful innovation nearly impossible.", "ipa": "/ˈɑː.sə.faɪ/", "pos": "v.", "word": "ossify"}, {"def_cn": "赞歌；颂歌", "def_en": "A song or expression of enthusiastic praise.", "example_cn": "这部传记读起来像是对这位科学家终身投身医学研究的赞歌。", "example_en": "The biography reads like a paean to the scientist's lifelong dedication to medical research.", "ipa": "/ˈpiː.ən/", "pos": "n.", "word": "paean"}, {"def_cn": "极度贫困；贫穷", "def_en": "Extreme poverty; a severe lack of money.", "example_cn": "在父亲的小生意终于开始成功之前，这个家庭贫困潦倒多年。", "example_en": "The family lived in penury for years before the father's small business finally began to succeed.", "ipa": "/ˈpen.jʊ.ri/", "pos": "n.", "word": "penury"}, {"def_cn": "坚韧的；执着的", "def_en": "Holding firmly to a purpose; stubbornly persistent.", "example_cn": "这位执着的记者尽管官方一再否认，仍追踪这个报道数月之久。", "example_en": "The pertinacious reporter pursued the story for months despite repeated official denials.", "ipa": "/ˌpɜːr.tənˈeɪ.ʃəs/", "pos": "adj.", "word": "pertinacious"}, {"def_cn": "修辞；说服性语言", "def_en": "The art of effective speaking or writing; persuasive language.", "example_cn": "这位候选人的言辞承诺国家团结，但她的实际政策却讲述了一个完全不同的故事。", "example_en": "The candidate's rhetoric promised national unity, but her actual policies told a very different story.", "ipa": "/ˈret.ər.ɪk/", "pos": "n.", "word": "rhetoric"}, {"def_cn": "有益健康的；清爽宜人的", "def_en": "Favorable to health; wholesome and pleasant.", "example_cn": "医生们称赞有益健康的山间空气非常适合呼吸道疾病康复中的病人。", "example_en": "Doctors praised the salubrious mountain air as ideal for patients recovering from respiratory illness.", "ipa": "/səˈluː.bri.əs/", "pos": "adj.", "word": "salubrious"}, {"def_cn": "脾气暴躁的；粗鲁阴沉的", "def_en": "Bad-tempered and unfriendly; rudely sullen.", "example_cn": "这位粗鲁的店员拒绝回答问题，对排队等候的顾客置之不理。", "example_en": "The surly clerk refused to answer questions and ignored the customers waiting in line.", "ipa": "/ˈsɜːr.li/", "pos": "adj.", "word": "surly"}, {"def_cn": "简洁的；言简意赅的", "def_en": "Using few words; brief and to the point.", "example_cn": "经理简洁的回复让人毫不怀疑拟议的预算已被坚决拒绝。", "example_en": "The manager's terse reply left no doubt that the proposed budget had been firmly rejected.", "ipa": "/tɜːrs/", "pos": "adj.", "word": "terse"}], "practice": [{"qid": "d24-q1", "stem": "The committee's review of the proposal was so ______ that no issue was examined in depth and members moved on after only a few minutes.", "passage": "", "options": ["desultory", "meticulous", "rigorous", "exhaustive"], "answer": "A", "explanation_en": "The blank needs a word meaning scattered and lacking depth, as shown by the clues 'no issue was examined in depth' and 'only a few minutes.' Desultory means random and disconnected, so it fits. Choices B, C, and D all describe careful, thorough work, which is the opposite of the intended meaning.", "explanation_cn": "空格需要一个表示“散漫、缺乏深度”的词，线索是“no issue was examined in depth”和“only a few minutes”。desultory 意为漫无条理的，正好对应。B、C、D 都表示细致彻底，与题意相反。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d24-q2", "stem": "Urban ecologist Maya Chen studies how pigeons adapt to city life. Unlike most researchers, who track pigeons in parks, Chen follows them through subway stations and construction sites. These unlikely habitats, she argues, reveal the birds' most remarkable survival strategies. Which choice best describes the function of the second sentence in the text as a whole?", "passage": "", "options": ["It summarizes the main conclusion of Chen's research.", "It explains why pigeons prefer cities to rural areas.", "It distinguishes Chen's approach from that of other researchers.", "It criticizes previous studies of urban wildlife."], "answer": "C", "explanation_en": "The second sentence uses the phrase 'unlike most researchers' to contrast Chen's method with the methods of others, setting up the focus on her distinctive approach. It does not state a research conclusion (A), explain pigeon preferences (B), or criticize other studies (D).", "explanation_cn": "第二句用“unlike most researchers”把 Chen 的研究方法与其他研究者对比，突出她的独特方法。它没有总结研究结论（A）、没有解释鸽子的偏好（B），也没有批评其他研究（D）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d24-q3", "stem": "The collection of essays, together with the author's early poems, ______ published last spring to widespread critical acclaim.", "passage": "", "options": ["were", "was", "have been", "are being"], "answer": "B", "explanation_en": "The subject is 'the collection,' which is singular. The phrase 'together with the author's early poems' is a parenthetical addition and does not make the subject plural, so only the singular verb 'was' agrees with the subject.", "explanation_cn": "主语是 the collection，单数。“together with…”是插入语，不改变主语的单复数，所以只能用单数动词 was。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d24-q4", "stem": "A 2025 study measured tree growth in two city neighborhoods. In the neighborhood with regular watering, trees grew an average of 30 centimeters per year. In the neighborhood without watering, trees grew only 12 centimeters per year. The researchers concluded that supplemental watering significantly boosts urban tree growth. Which choice best supports the researchers' conclusion?", "passage": "", "options": ["Trees in both neighborhoods were the same species.", "Trees in the watered neighborhood grew more than twice as fast as trees in the unwatered neighborhood.", "Some residents opposed the cost of the watering program.", "Trees generally grow faster in cities than in forests."], "answer": "B", "explanation_en": "The conclusion claims watering significantly boosts growth. Choice B restates the key data point, 30 cm versus 12 cm, which directly supports that claim. Choice A removes a possible confounding variable but does not itself demonstrate the effect, and choices C and D are irrelevant to the conclusion.", "explanation_cn": "结论是浇水显著促进生长。B 复述了关键数据（30 厘米 vs 12 厘米），直接支持结论。A 只是排除了干扰变量，C、D 与结论无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d24-q5", "stem": "The new library is spacious and well-lit. ______, it is located far from the school's main entrance, which discourages some students from visiting.", "passage": "", "options": ["Moreover", "However", "Consequently", "For example"], "answer": "B", "explanation_en": "The second sentence presents a drawback that contrasts with the positive description in the first sentence, so a contrast transition is needed. However signals this contrast. Moreover adds a similar idea, consequently shows cause and effect, and for example introduces an illustration.", "explanation_cn": "第二句讲的是缺点，与第一句的优点形成转折，所以需要转折连词 However。Moreover 表递进，Consequently 表因果，For example 表举例，都不合适。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d24-q6", "stem": "After the factory closed, many families in the town fell into ______, unable to afford even basic necessities.", "passage": "", "options": ["penury", "prosperity", "affluence", "comfort"], "answer": "A", "explanation_en": "The clue 'unable to afford even basic necessities' indicates extreme poverty. Penury means extreme poverty, so it fits. The other choices describe wealth or ease, which is the opposite of the intended meaning.", "explanation_cn": "线索“unable to afford even basic necessities”指向极度贫困。penury 意为赤贫，正好对应。其他选项都表示富裕安逸，是反义词。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d24-q7", "stem": "The museum's new exhibit features artifacts from three ancient civilizations: Egypt, Greece, and ______.", "passage": "", "options": ["Rome.", "Rome;", "Rome,", "Rome—"], "answer": "A", "explanation_en": "A colon introduces a list, and the items in a simple list are separated by commas. The sentence ends after the final item, so it requires a period. A semicolon or dash is not appropriate at the end of a sentence.", "explanation_cn": "冒号引出列举，简单列表项之间用逗号分隔，句子结尾用句号。分号和破折号不能用在句末。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d24-q8", "stem": "Honeybees communicate the location of flowers through a waggle dance, a figure-eight movement that encodes both direction and distance. Recent experiments show that bees observing the dance can find food sources more than a mile away, even on cloudy days when the sun is invisible. These findings suggest that the dance conveys information precisely enough to guide successful foraging. Which choice best states the main idea of the text?", "passage": "", "options": ["Honeybees cannot find food on cloudy days.", "The waggle dance is a precise communication system that helps bees locate food.", "Scientists still do not understand how bees navigate.", "The figure-eight movement is unique to honeybees."], "answer": "B", "explanation_en": "The passage focuses on how the waggle dance encodes direction and distance and guides bees to food. Choice B captures this central point. Choice A contradicts the text, choice C is too broad, and choice D is an unsupported detail.", "explanation_cn": "全文围绕摇摆舞如何编码方向和距离、帮助蜜蜂找到食物展开。B 准确概括了主旨。A 与原文矛盾，C 过于宽泛，D 是无依据的细节。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d24-q9", "stem": "The editor praised the author's ______ style, noting that the entire argument was presented clearly in just two pages.", "passage": "", "options": ["terse", "verbose", "wordy", "rambling"], "answer": "A", "explanation_en": "The clue 'presented clearly in just two pages' calls for a word meaning brief and to the point. Terse means concise, so it fits. The other choices all mean excessively wordy, which is the opposite of the intended meaning.", "explanation_cn": "线索“just two pages”需要一个表示简洁的词。terse 意为言简意赅，正好对应。其他选项都表示啰嗦冗长，是反义词。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d24-q10", "stem": "The scientist worked alone in the laboratory. She repeated the experiment dozens of times. She finally confirmed her hypothesis. Which choice most effectively combines the sentences?", "passage": "", "options": ["The scientist worked alone in the laboratory, and she repeated the experiment dozens of times, and she finally confirmed her hypothesis.", "Working alone in the laboratory, the scientist repeated the experiment dozens of times before finally confirming her hypothesis.", "The scientist worked alone in the laboratory, repeating the experiment dozens of times, and the hypothesis was finally confirmed.", "The scientist, who worked alone in the laboratory, repeated the experiment dozens of times, confirming her hypothesis finally."], "answer": "B", "explanation_en": "Choice B combines the three ideas smoothly into one clear sentence with correct subordination. Choice A is repetitive and choppy, choice C shifts awkwardly into passive voice at the end, and choice D places 'finally' in an awkward position.", "explanation_cn": "B 把三个意思流畅地合并成一句，结构清晰。A 重复啰嗦，C 结尾突然转成被动语态很别扭，D 中 finally 的位置不当。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-01"}, {"day": 25, "words": [{"def_cn": "尖酸刻薄的；言辞犀利的", "def_en": "Sharp and critical in tone or manner.", "example_cn": "这位评论家尖酸的影评将这部电影贬为对优秀作品的肤浅模仿。", "example_en": "The critic's acerbic review dismissed the film as a shallow imitation of far better works.", "ipa": "/əˈsɜːr.bɪk/", "pos": "adj.", "word": "acerbic"}, {"def_cn": "赞许；嘉奖", "def_en": "Approval or praise.", "example_cn": "这位年轻科学家发表突破性研究成果后，得到了同事们的赞许。", "example_en": "The young scientist received approbation from colleagues after publishing her groundbreaking research findings.", "ipa": "/ˌæp.rəˈbeɪ.ʃən/", "pos": "n.", "word": "approbation"}, {"def_cn": "易怒的；暴躁的", "def_en": "Easily angered; bad-tempered.", "example_cn": "这位暴躁的房东因为最小的抱怨就威胁要驱逐租客。", "example_en": "The choleric landlord threatened to evict tenants over even the smallest complaints.", "ipa": "/ˈkɑː.lɚ.ɪk/", "pos": "adj.", "word": "choleric"}, {"def_cn": "自行决定的自由；谨慎的判断", "def_en": "The freedom to decide what should be done; careful judgment.", "example_cn": "老师们有自行决定选择哪些小说最适合自己学生的自由。", "example_en": "Teachers are given discretion to choose which novels will best suit their own students.", "ipa": "/dɪˈskreʃ.ən/", "pos": "n.", "word": "discretion"}, {"def_cn": "使衰弱；使失去活力", "def_en": "To weaken or drain of energy.", "example_cn": "长期的疾病使这位运动员体力衰弱，迫使她放弃了整个赛季。", "example_en": "The long illness enervated the athlete, forcing her to abandon the entire competitive season.", "ipa": "/ˈen.ɚ.veɪt/", "pos": "v.", "word": "enervate"}, {"def_cn": "模棱两可的；含糊的", "def_en": "Open to more than one interpretation; deliberately vague.", "example_cn": "市长模棱两可的声明既没有证实也没有否认传闻中的预算削减。", "example_en": "The mayor's equivocal statement neither confirmed nor denied the rumored budget cuts.", "ipa": "/ɪˈkwɪv.ə.kəl/", "pos": "adj.", "word": "equivocal"}, {"def_cn": "现存的；尚存的", "def_en": "Still in existence; surviving to the present.", "example_cn": "现代学者已知这部古代手稿仅存三个版本。", "example_en": "Only three extant copies of the ancient manuscript are known to modern scholars.", "ipa": "/ˈek.stənt/", "pos": "adj.", "word": "extant"}, {"def_cn": "使习惯；使适应（不愉快的事）", "def_en": "To harden or accustom to something unpleasant.", "example_cn": "多年的夜班工作使这位护士习惯了长期的疲惫和压力。", "example_en": "Years of working night shifts had inured the nurse to chronic exhaustion and stress.", "ipa": "/ɪˈnjʊr/", "pos": "v.", "word": "inure"}, {"def_cn": "易招怨恨的；不公平的", "def_en": "Likely to arouse resentment; unfairly discriminating.", "example_cn": "对两兄弟的不公平比较损害了他们多年的关系。", "example_en": "The invidious comparison between the two brothers damaged their relationship for many years.", "ipa": "/ɪnˈvɪd.i.əs/", "pos": "adj.", "word": "invidious"}, {"def_cn": "欢欣鼓舞的；喜悦的", "def_en": "Feeling or expressing great joy.", "example_cn": "国家队赢得冠军决赛后，欢欣鼓舞的人群挤满了街道。", "example_en": "Jubilant crowds filled the streets after the national team won the championship final.", "ipa": "/ˈdʒuː.bəl.ənt/", "pos": "adj.", "word": "jubilant"}, {"def_cn": "荣誉；赞誉", "def_en": "Praise and honor received for an achievement.", "example_cn": "设计团队因提前完成这个艰难的项目而赢得了赞誉。", "example_en": "The design team earned kudos for completing the difficult project ahead of schedule.", "ipa": "/ˈkuː.dɑːs/", "pos": "n.", "word": "kudos"}, {"def_cn": "尖酸讽刺的；辛辣的", "def_en": "Bitingly sarcastic or critical.", "example_cn": "她辛辣的机智使这部政治讽刺剧既滑稽又令人深感不安。", "example_en": "Her mordant wit made the political satire both hilarious and deeply uncomfortable.", "ipa": "/ˈmɔːr.dənt/", "pos": "adj.", "word": "mordant"}, {"def_cn": "消除；避免", "def_en": "To remove a need or difficulty; to prevent.", "example_cn": "周密的计划消除了临时更改旅行日程带来的昂贵费用。", "example_en": "Careful planning obviated the need for expensive last-minute changes to the travel schedule.", "ipa": "/ˈɑːb.vi.eɪt/", "pos": "v.", "word": "obviate"}, {"def_cn": "任性的；孩子气的", "def_en": "Childishly sulky or bad-tempered.", "example_cn": "这个任性的孩子在棋盘游戏中输了之后拒绝和任何人说话。", "example_en": "The petulant child refused to speak to anyone after losing the board game.", "ipa": "/ˈpetʃ.ə.lənt/", "pos": "adj.", "word": "petulant"}, {"def_cn": "过剩；大量", "def_en": "A large or excessive amount of something.", "example_cn": "图书馆为准备期末考试的学生提供了大量的资源。", "example_en": "The library offers a plethora of resources for students preparing for their final examinations.", "ipa": "/ˈpleθ.ər.ə/", "pos": "n.", "word": "plethora"}, {"def_cn": "幼稚的；愚蠢的", "def_en": "Childishly silly and immature.", "example_cn": "委员会将这项提案斥为逃避责任的幼稚之举。", "example_en": "The committee dismissed the proposal as a puerile attempt to avoid taking responsibility.", "ipa": "/ˈpjʊr.əl/", "pos": "adj.", "word": "puerile"}, {"def_cn": "秘密的；鬼鬼祟祟的", "def_en": "Kept secret, especially because it would not be approved of.", "example_cn": "学生们在那场难度很大的考试中偷偷瞥了一眼答案。", "example_en": "The students cast surreptitious glances at the answer key during the difficult examination.", "ipa": "/ˌsɜːr.əpˈtɪʃ.əs/", "pos": "adj.", "word": "surreptitious"}, {"def_cn": "谄媚者；拍马屁的人", "def_en": "A person who praises powerful people to gain advantage.", "example_cn": "这位首席执行官身边围绕着一群从不质疑她任何决定的谄媚者。", "example_en": "The CEO surrounded herself with sycophants who never questioned any of her decisions.", "ipa": "/ˈsɪk.ə.fænt/", "pos": "n.", "word": "sycophant"}, {"def_cn": "冗长的；啰嗦的", "def_en": "Using more words than necessary; wordy.", "example_cn": "这份冗长的报告把主要结论埋在了五十页的背景材料之下。", "example_en": "The verbose report buried its main conclusion under fifty pages of background material.", "ipa": "/vɚˈboʊs/", "pos": "adj.", "word": "verbose"}, {"def_cn": "使恼火；使烦恼", "def_en": "To annoy or irritate.", "example_cn": "持续的施工噪音让这个原本安静的社区居民烦恼不已。", "example_en": "The constant construction noise vexed the residents of the normally quiet neighborhood.", "ipa": "/veks/", "pos": "v.", "word": "vex"}], "practice": [{"qid": "d25-q1", "stem": "The spokesperson gave an ______ answer, leaving reporters uncertain whether the policy would actually change.", "passage": "", "options": ["equivocal", "definitive", "decisive", "categorical"], "answer": "A", "explanation_en": "The clue 'leaving reporters uncertain' requires a word meaning vague or open to interpretation. Equivocal means deliberately vague, so it fits. The other choices all mean clear and definite, which is the opposite of the intended meaning.", "explanation_cn": "线索“leaving reporters uncertain”需要一个表示含糊的词。equivocal 意为模棱两可的，正好对应。其他选项都表示明确肯定的，是反义词。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d25-q2", "stem": "In the 1800s, lighthouses relied on oil lamps, which required constant attention from keepers. The invention of the Fresnel lens in 1822 concentrated light into a powerful beam, dramatically extending the lamp's range. Within decades, lighthouses around the world adopted the new lens. Which choice best describes the function of the second sentence in the text as a whole?", "passage": "", "options": ["It presents the central problem that the passage addresses.", "It introduces a technological development that transformed lighthouse design.", "It argues that oil lamps were superior to later technology.", "It explains why lighthouse keepers lost their jobs."], "answer": "B", "explanation_en": "The second sentence describes the Fresnel lens and its effect on lighthouse beams, a key technological advance. It does not state a problem (A), praise oil lamps (C), or discuss keepers' employment (D).", "explanation_cn": "第二句介绍菲涅尔透镜这一关键技术进步及其效果。它没有提出问题（A）、没有赞美油灯（C），也没有讨论守塔人的工作（D）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d25-q3", "stem": "Neither the manager nor the employees ______ satisfied with the proposed schedule.", "passage": "", "options": ["was", "were", "has been", "is"], "answer": "B", "explanation_en": "With a 'neither...nor' construction, the verb agrees with the nearer subject, which is 'the employees,' plural. Therefore the plural verb 'were' is correct.", "explanation_cn": "neither…nor 结构中动词与靠近的那个主语一致，即 the employees（复数），所以用 were。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d25-q4", "stem": "Researchers compared two groups of students preparing for an exam. One group studied in 25-minute sessions with short breaks, while the other studied for two hours straight. The first group scored 18 percent higher on average. The researchers concluded that spaced study sessions improve test performance. Which finding, if true, would most directly support the researchers' conclusion?", "passage": "", "options": ["Students in the first group reported feeling less tired after studying.", "The students in both groups spent the same total amount of time studying.", "Some students preferred studying alone rather than in groups.", "The exam covered material from the entire semester."], "answer": "B", "explanation_en": "The conclusion attributes the score difference to the spacing of study sessions. Choice B rules out the alternative explanation that the first group simply studied longer, directly strengthening the conclusion. Choice A is consistent with the result but does not prove the cause, and choices C and D are irrelevant.", "explanation_cn": "结论把分数差异归因于分段学习。B 排除了“第一组学得更久”的替代解释，直接支持结论。A 只是附带现象，不能证明原因，C、D 无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d25-q5", "stem": "The desert trail has no water stations along its 15-mile route. ______, hikers are advised to carry at least two liters of water.", "passage": "", "options": ["Therefore", "However", "Nevertheless", "Meanwhile"], "answer": "A", "explanation_en": "The second sentence gives a recommendation that follows logically from the fact stated in the first sentence, so a cause-and-effect transition is needed. Therefore signals this relationship. The other choices signal contrast or simultaneity, which do not fit.", "explanation_cn": "第二句的建议是第一句事实的逻辑结果，需要因果连词 Therefore。其他选项表转折或同时，都不合适。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d25-q6", "stem": "The museum's digital archive contains a ______ of photographs documenting the city's changing skyline.", "passage": "", "options": ["plethora", "scarcity", "shortage", "handful"], "answer": "A", "explanation_en": "An archive documenting a city's changing skyline would logically contain a large number of photographs. Plethora means an abundance, so it fits. The other choices all mean a small or insufficient amount, which is the opposite of the intended meaning.", "explanation_cn": "记录城市天际线变化的档案显然包含大量照片。plethora 意为大量，正好对应。其他选项都表示稀少不足，是反义词。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d25-q7", "stem": "The committee reached a decision after hours of debate; ______, the proposal was approved unanimously.", "passage": "", "options": ["however", "however,", "however;", "however:"], "answer": "B", "explanation_en": "After a semicolon, a conjunctive adverb such as 'however' must be followed by a comma. Choice B provides the correct punctuation. Choice A omits the comma, and choices C and D use incorrect marks after the adverb.", "explanation_cn": "分号后接 however 这类连接副词，后面必须加逗号。B 正确；A 缺逗号，C、D 的标点错误。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d25-q8", "stem": "Coral reefs support nearly a quarter of all marine species despite covering less than one percent of the ocean floor. When ocean temperatures rise, corals expel the algae that give them color and nutrients, a process known as bleaching. Without swift action to reduce emissions, scientists warn, many reefs could disappear within decades. Which choice best states the main purpose of the text?", "passage": "", "options": ["To explain how coral reefs form over time.", "To warn that rising temperatures threaten coral reefs and urge action.", "To compare coral reefs with other marine habitats.", "To describe the colors of healthy coral."], "answer": "B", "explanation_en": "The passage describes the bleaching process and ends with a warning that reefs could disappear without action. Choice B captures this purpose. The other choices focus on minor details or on topics the passage does not address.", "explanation_cn": "全文描述白化过程并以警告结尾，B 准确概括了主旨。其他选项聚焦次要细节或原文未涉及的内容。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d25-q9", "stem": "The new software will ______ the need for manual data entry, saving the staff hours of tedious work each week.", "passage": "", "options": ["obviate", "increase", "require", "prolong"], "answer": "A", "explanation_en": "Saving staff hours means the software removes the need for manual entry. Obviate means to remove a need, so it fits. The other choices all suggest the need remains or grows, which is the opposite of the intended meaning.", "explanation_cn": "节省工时意味着软件消除了人工录入的需要。obviate 意为消除（需要），正好对应。其他选项都表示需要保留或增加，是反义词。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d25-q10", "stem": "Which choice most concisely and effectively expresses the idea that the new policy reduced costs?", "passage": "", "options": ["The new policy was responsible for bringing about a reduction in costs that were previously higher.", "The new policy reduced costs.", "The new policy managed to succeed in reducing the costs that the company had been paying.", "It was the new policy that caused costs to become reduced in their amount."], "answer": "B", "explanation_en": "Choice B states the idea in the fewest words without losing any meaning. The other choices add redundant phrases such as 'bringing about a reduction,' 'managed to succeed,' and 'caused costs to become reduced.'", "explanation_cn": "B 用最少的词完整表达了意思。其他选项都有冗余表达，如 bringing about a reduction、managed to succeed 等。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-02"}, {"day": 26, "words": [{"def_cn": "严厉斥责；痛斥。", "def_en": "To scold or criticize someone angrily and at length.", "example_cn": "教练拒绝在惜败后痛斥精疲力竭的队员，而是选择赞扬他们的拼搏。", "example_en": "The coach refused to berate the exhausted players after the narrow defeat, choosing instead to praise their effort.", "ipa": "/bɪˈreɪt/", "pos": "v.", "word": "berate"}, {"def_cn": "做作的；戏剧化的。", "def_en": "Overly theatrical or dramatic in character or style.", "example_cn": "证人对事故戏剧化的描述，配上夸张的手势，让陪审员开始怀疑她的可信度。", "example_en": "The witness's histrionic account of the accident, complete with wild gestures, made the jurors doubt her credibility.", "ipa": "/ˌhɪstriˈɑnɪk/", "pos": "adj.", "word": "histrionic"}, {"def_cn": "爱开玩笑的；幽默的。", "def_en": "Fond of or characterized by joking; humorous and playful.", "example_cn": "尽管谈判气氛紧张，大使幽默的话语帮助营造了更轻松的氛围。", "example_en": "Despite the tense negotiations, the ambassador's jocular remarks helped create a more relaxed atmosphere at the table.", "ipa": "/ˈdʒɑkjələr/", "pos": "adj.", "word": "jocular"}, {"def_cn": "哭哭啼啼的；悲伤的。", "def_en": "Tearful or given to weeping; mournful.", "example_cn": "车站哭哭啼啼的送别场面让那位交换生很尴尬，她更喜欢安静的道别。", "example_en": "The lachrymose farewell scene at the station embarrassed the exchange student, who preferred a quieter goodbye.", "ipa": "/ˈlækrəˌmoʊs/", "pos": "adj.", "word": "lachrymose"}, {"def_cn": "装病以逃避工作或职责。", "def_en": "To pretend to be ill in order to avoid work or duty.", "example_cn": "经理注意到该员工在病假期间发布了看演唱会的开心照片，怀疑他是在装病。", "example_en": "The manager suspected that the employee was malingering after noticing his cheerful photos from a concert on sick leave.", "ipa": "/məˈlɪŋɡər/", "pos": "v.", "word": "malinger"}, {"def_cn": "激怒；惹恼。", "def_en": "To irritate or annoy someone.", "example_cn": "记者关于资金丑闻的连珠炮提问不断激怒着那位一向沉稳的参议员。", "example_en": "The reporter's persistent questions about the funding scandal continued to nettle the usually composed senator.", "ipa": "/ˈnɛtl̩/", "pos": "v.", "word": "nettle"}, {"def_cn": "学究气的；卖弄学问的。", "def_en": "Excessively concerned with minor details or rules; ostentatiously learned.", "example_cn": "她学究气地纠正每一个小语法错误的做法让晚餐聊天变得筋疲力尽。", "example_en": "Her pedantic insistence on correcting every minor grammatical slip made dinner conversations with her exhausting.", "ipa": "/pəˈdæntɪk/", "pos": "adj.", "word": "pedantic"}, {"def_cn": "神圣不可侵犯的；不容置疑的。", "def_en": "Regarded as too important or valuable to be interfered with.", "example_cn": "对编辑们来说，编辑独立的原则神圣不可侵犯，不能为了利润而牺牲。", "example_en": "To the editors, the principle of editorial independence was sacrosanct and could not be sacrificed for profit.", "ipa": "/ˈsækroʊˌsæŋkt/", "pos": "adj.", "word": "sacrosanct"}, {"def_cn": "深入探究；钻研。", "def_en": "To dig or reach deeply into a subject; to investigate thoroughly.", "example_cn": "纪录片摄制组深入挖掘百年档案，重现了这座海滨小镇被遗忘的历史。", "example_en": "The documentary crew delved into century-old archives to reconstruct the forgotten history of the coastal town.", "ipa": "/dɛlv/", "pos": "v.", "word": "delve"}, {"def_cn": "古怪的；特立独行的。", "def_en": "Unconventional and slightly strange in behavior or appearance.", "example_cn": "这位古怪的发明家穿着不搭调的鞋子，声称他最好的创意都是在午夜降临的。", "example_en": "The eccentric inventor wore mismatched shoes and claimed that his best ideas came to him at midnight.", "ipa": "/ɪkˈsɛntrɪk/", "pos": "adj.", "word": "eccentric"}, {"def_cn": "典范；典型。", "def_en": "A person or thing that is a perfect example of a particular quality.", "example_cn": "小提琴家凭借完美的技巧和沉静的自信，成为了敬业音乐家的典范。", "example_en": "With her flawless technique and quiet confidence, the violinist was the epitome of a dedicated musician.", "ipa": "/ɪˈpɪtəmi/", "pos": "n.", "word": "epitome"}, {"def_cn": "奉承；巴结。", "def_en": "To give exaggerated flattery or attention in order to gain favor.", "example_cn": "年轻高管们奉承来访的首席执行官，连他最不好笑的笑话都大声捧场。", "example_en": "The junior executives fawned over the visiting CEO, laughing loudly at even his weakest jokes.", "ipa": "/fɔn/", "pos": "v.", "word": "fawn"}, {"def_cn": "俗艳的；过于鲜艳的。", "def_en": "Obtrusively bright and showy; tastelessly gaudy.", "example_cn": "赌场俗艳的霓虹灯招牌与周围历史街区的幽静优雅格格不入。", "example_en": "The casino's garish neon signs clashed with the quiet elegance of the historic neighborhood around it.", "ipa": "/ˈɡɛrɪʃ/", "pos": "adj.", "word": "garish"}, {"def_cn": "间歇；中断。", "def_en": "A pause or gap in a sequence or process.", "example_cn": "在退出竞技游泳三年后，她复出并在去年春季赢得了全国冠军。", "example_en": "After a three-year hiatus from competitive swimming, she returned to win the national championship last spring.", "ipa": "/haɪˈeɪtəs/", "pos": "n.", "word": "hiatus"}, {"def_cn": "叛乱分子；起义者。", "def_en": "A person fighting against a government or invading force; a rebel.", "example_cn": "这部小说讲述了一名年轻的叛乱分子逐渐质疑起自己所加入运动的暴力手段。", "example_en": "The novel follows a young insurgent who gradually questions the violent methods of the movement she joined.", "ipa": "/ɪnˈsɜrdʒənt/", "pos": "n.", "word": "insurgent"}, {"def_cn": "茂盛的；繁茂的。", "def_en": "Rich and profuse in growth; lush.", "example_cn": "植物园繁茂的热带雨林区惟妙惟肖地再现了热带植物茂密潮湿的栖息环境。", "example_en": "The botanical garden's luxuriant rainforest section recreates the dense, humid habitat of tropical plants with remarkable accuracy.", "ipa": "/lʌɡˈʒʊriənt/", "pos": "adj.", "word": "luxuriant"}, {"def_cn": "被社会抛弃的人；贱民。", "def_en": "An outcast; a person despised or rejected by society.", "example_cn": "在揭露公司欺诈之后，这位举报人成了他服务了几十年的行业里的弃儿。", "example_en": "After exposing the company's fraud, the whistleblower became a pariah in the industry he had served for decades.", "ipa": "/pəˈraɪə/", "pos": "n.", "word": "pariah"}, {"def_cn": "制裁（惩罚）；批准、认可。", "def_en": "A threatened penalty for disobeying a rule; or official permission or approval.", "example_cn": "在外交官未能争取到该政权合作后，委员会对其实施了经济制裁。", "example_en": "The committee imposed economic sanctions on the regime after diplomats failed to secure its cooperation.", "ipa": "/ˈsæŋkʃən/", "pos": "n.", "word": "sanction"}, {"def_cn": "卑鄙的；肮脏的。", "def_en": "Involving ignoble actions and motives; morally degraded.", "example_cn": "这部传记揭露了这位大亨发迹史中的肮脏细节，包括行贿和敲诈勒索。", "example_en": "The biography revealed the sordid details of the tycoon's rise, including bribery and blackmail throughout his career.", "ipa": "/ˈsɔrdɪd/", "pos": "adj.", "word": "sordid"}, {"def_cn": "似是而非的；华而不实的。", "def_en": "Superficially plausible but actually wrong; misleadingly attractive.", "example_cn": "广告中“该保健品能治愈失眠”的似是而非的说法被医学研究人员驳斥。", "example_en": "The advertisement's specious claim that the supplement could cure insomnia was rejected by medical researchers.", "ipa": "/ˈspiʃəs/", "pos": "adj.", "word": "specious"}], "practice": [{"qid": "d26-q1", "stem": "The candidate's defense rested on a specious argument: it sounded convincing during the debate, but fact-checkers later found that every one of its key statistics was fabricated. Which choice best states the main idea of the text?", "passage": "", "options": ["The candidate won the debate with strong evidence.", "The candidate's argument seemed persuasive but was based on false data.", "Fact-checkers were unable to verify the candidate's claims.", "The debate focused too much on statistics."], "answer": "B", "explanation_en": "The text says the argument sounded convincing but its key statistics were fabricated, so B captures both halves. A contradicts the fabrication detail, C misstates the outcome since the fact-checkers did reach a conclusion, and D adds a claim about the debate's focus that the text never makes.", "explanation_cn": "文中说该论点听起来有说服力，但关键数据都是编造的，只有 B 同时涵盖这两层意思。A 与“数据造假”矛盾；C 错误——核查人员其实得出了结论；D 凭空增加了“辩论过于关注数据”这一文中没有的说法。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d26-q2", "stem": "After the hurricane, the relief coordinator described the shelters as sanctuaries: no volunteer was allowed to photograph residents, no reporter could enter without permission, and the privacy of survivors was held _____. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["negotiable", "sacrosanct", "incidental", "controversial"], "answer": "B", "explanation_en": "The examples show that privacy was treated as untouchable, which matches the meaning of sacrosanct. Negotiable is nearly the opposite, incidental means unimportant, and controversial means disputed, and none of those fits the strict protections described.", "explanation_cn": "例子表明隐私被视为不可侵犯的，正好对应 sacrosanct（神圣不可侵犯的）。negotiable（可协商的）意思几乎相反；incidental（次要的）表示不重要；controversial（有争议的）表示有分歧，都不符合文中严格的保护措施。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d26-q3", "stem": "The committee's review of the leaked documents _____ that several officials had ignored safety warnings for months.", "passage": "", "options": ["reveal", "reveals", "have revealed", "are revealing"], "answer": "B", "explanation_en": "The subject of the sentence is the singular noun review, so it requires the singular verb reveals. Choices A and C use plural verb forms, and D pairs a plural auxiliary with a singular subject.", "explanation_cn": "句子的主语是单数名词 review，因此需要单数动词 reveals。A 和 C 用了复数动词形式，D 用复数助动词搭配了单数主语。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d26-q4", "stem": "To win the grant, the team needed three things _____ reliable data, a clear budget, and community support.", "passage": "", "options": [";", ",", ":", "—"], "answer": "C", "explanation_en": "A colon is the standard mark for introducing a list after an independent clause. A semicolon joins two independent clauses, and neither a comma nor a dash properly introduces a formal list in this position.", "explanation_cn": "冒号是引出列举的标准标点。分号用于连接两个独立分句；逗号和破折号在这个位置都不能规范地引出正式列表。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d26-q5", "stem": "The new recycling program exceeded its budget. _____, it reduced landfill waste by 40 percent in its first year, so officials deemed it a success.", "passage": "", "options": ["Nevertheless", "Therefore", "Similarly", "Specifically"], "answer": "A", "explanation_en": "The second sentence contrasts the cost overrun with the program's success, so the concessive transition nevertheless fits best. Therefore would wrongly imply that the overspending caused the success, while similarly and specifically do not signal the needed contrast.", "explanation_cn": "第二句在超预算和项目成功之间形成转折，因此表让步的 nevertheless 最合适。therefore 会错误地暗示超预算导致了成功；similarly 和 specifically 都不能表达这种转折关系。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d26-q6", "stem": "The editor was known for being pedantic: she once delayed publication for two days over a single misplaced comma. Which choice best describes the editor's behavior?", "passage": "", "options": ["She cared excessively about minor details.", "She ignored important errors.", "She worked unusually quickly.", "She avoided making decisions."], "answer": "A", "explanation_en": "Delaying publication over one misplaced comma shows excessive attention to minor details, which matches A. B is the opposite of the evidence, and C and D describe behaviors the text never mentions.", "explanation_cn": "为一个放错位置的逗号推迟出版两天，说明她过分关注细节，对应 A。B 与证据相反；C 和 D 描述的是文中从未提及的行为。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d26-q7", "stem": "Dr. Alvarez's study tracked 200 patients for five years. Those who walked briskly for 30 minutes daily showed a 25 percent lower rate of heart disease than those who did not exercise, even after the researchers adjusted for diet, age, and smoking. What can most reasonably be inferred from the text?", "passage": "", "options": ["Walking was the only factor affecting heart disease in the study.", "Diet and smoking have no effect on heart disease.", "Regular brisk walking is associated with better heart health, independent of other factors.", "All participants who exercised avoided heart disease entirely."], "answer": "C", "explanation_en": "Because the researchers controlled for diet, age, and smoking, the lower disease rate can be linked to walking itself, which C states carefully with the phrase associated with. A overstates the finding with the word only, B contradicts the fact that those factors had to be adjusted for, and D is disproved by the 25 percent figure.", "explanation_cn": "研究人员控制了饮食、年龄和吸烟等变量，因此较低的发病率可以归因于快走本身，C 用 associated with（与……相关）表述得很严谨。A 的“唯一因素”过于绝对；B 与“需要控制这些变量”相矛盾；D 的“完全避免”被 25% 这个数字否定。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d26-q8", "stem": "Marine biologist Kenji Sato opens his lecture with a story about a single octopus escaping its tank, then spends the rest of the talk explaining how octopus intelligence challenges our definition of consciousness. What is the primary purpose of the opening story?", "passage": "", "options": ["To prove that octopuses are conscious beings.", "To engage the audience before introducing the lecture's central question.", "To summarize the scientific evidence about octopus brains.", "To criticize previous research on animal intelligence."], "answer": "B", "explanation_en": "An opening anecdote typically functions as a hook that draws listeners in before the main topic, which is what B describes. A overstates what a single story can prove, while C and D describe things the story does not do.", "explanation_cn": "开场轶事的作用通常是吸引听众，为引入讲座的核心问题做铺垫，即 B。A 夸大了一个故事所能证明的程度；C 和 D 描述的都不是这个故事的功能。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d26-q9", "stem": "Rather than summarizing the novel's plot, the critic chose to delve _____ the author's letters and diaries to understand her creative process.", "passage": "", "options": ["into", "with", "for", "against"], "answer": "A", "explanation_en": "The fixed collocation is delve into, meaning to investigate something deeply. The other prepositions do not pair with delve in standard usage.", "explanation_cn": "固定搭配是 delve into，表示深入探究某事。其他介词在标准用法中不能与 delve 搭配。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d26-q10", "stem": "Text 1: Urban beekeeping advocates argue that rooftop hives increase pollination and reconnect city dwellers with nature. Text 2: Entomologist Dr. Ruiz cautions that without proper training, novice beekeepers may spread disease to wild bee populations. Based on the texts, how would Dr. Ruiz most likely respond to the advocates' claim?", "passage": "", "options": ["By agreeing that rooftop hives always benefit wild bees.", "By arguing that the benefits depend on beekeepers being properly trained.", "By denying that pollination matters in cities.", "By suggesting that rooftop hives should be banned entirely."], "answer": "B", "explanation_en": "Ruiz does not reject beekeeping outright but warns about the risks from untrained keepers, so she would most likely qualify the advocates' claim with the need for training, as B states. A ignores her warning, C misrepresents her position, and D goes further than her stated caution.", "explanation_cn": "Ruiz 并没有全盘否定城市养蜂，而是警告未经培训的养蜂人可能带来风险，因此她最可能用“需要培训”来限定支持者的说法，即 B。A 忽略了她的警告；C 曲解了她的立场；D 比她的谨慎态度走得更远。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-03"}, {"day": 27, "words": [{"def_cn": "机敏的；灵巧的。", "def_en": "Clever or skillful in using the hands or mind.", "example_cn": "这位机敏的谈判代表把有争议的条款重新表述成双方都能接受的措辞，化解了危机。", "example_en": "The adroit negotiator defused the crisis by reframing the disputed clause in terms both sides could accept.", "ipa": "/əˈdrɔɪt/", "pos": "adj.", "word": "adroit"}, {"def_cn": "围攻；围困；纠缠。", "def_en": "To surround a place with armed forces; to overwhelm with requests.", "example_cn": "公告发布后，市长办公室被要求解释预算缺口的记者们团团围住。", "example_en": "After the announcement, the mayor's office was besieged by reporters demanding answers about the budget shortfall.", "ipa": "/bɪˈsidʒ/", "pos": "v.", "word": "besiege"}, {"def_cn": "欺诈；诡辩。", "def_en": "The use of deception or trickery to achieve a goal.", "example_cn": "选举监督员接受了识别欺诈行为的培训，如篡改选票和恐吓选民。", "example_en": "The election monitors were trained to detect chicanery such as ballot tampering and voter intimidation.", "ipa": "/ʃɪˈkeɪnəri/", "pos": "n.", "word": "chicanery"}, {"def_cn": "有害的；损害的。", "def_en": "Causing harm or damage.", "example_cn": "研究人员发现，长期睡眠不足对青少年的记忆力和注意力有长期有害影响。", "example_en": "Researchers found that chronic sleep deprivation has long-term deleterious effects on adolescent memory and concentration.", "ipa": "/ˌdɛləˈtɪriəs/", "pos": "adj.", "word": "deleterious"}, {"def_cn": "猛烈抨击；强烈抗议。", "def_en": "To protest vehemently; to express strong disapproval.", "example_cn": "专栏作家猛烈抨击拟建的高速公路，认为它会破坏小镇的历史风貌。", "example_en": "The columnist fulminated against the proposed highway, arguing that it would destroy the town's historic character.", "ipa": "/ˈfʊlməˌneɪt/", "pos": "v.", "word": "fulminate"}, {"def_cn": "长篇大论地训斥；慷慨激昂地演说。", "def_en": "To lecture someone at length in an aggressive, critical manner.", "example_cn": "工头就检查中发现的安全违规问题对工人们训斥了近一个小时。", "example_en": "The foreman harangued the crew for nearly an hour about safety violations discovered during the inspection.", "ipa": "/həˈræŋ/", "pos": "v.", "word": "harangue"}, {"def_cn": "冲动的；鲁莽的。", "def_en": "Acting quickly without thought or care; impulsive.", "example_cn": "他冲动地决定退学创业，连最亲密的朋友都感到意外。", "example_en": "His impetuous decision to quit school and start a business surprised even his closest friends.", "ipa": "/ɪmˈpɛtʃuəs/", "pos": "adj.", "word": "impetuous"}, {"def_cn": "忧郁；惆怅。", "def_en": "A feeling of pensive sadness, typically with no obvious cause.", "example_cn": "当诗人看着秋叶飘过空荡的庭院时，一种淡淡的忧郁涌上心头。", "example_en": "A gentle melancholy settled over the poet as she watched the autumn leaves drift across the empty courtyard.", "ipa": "/ˈmɛlənˌkɑli/", "pos": "n.", "word": "melancholy"}, {"def_cn": "吵闹难管的；桀骜不驯的。", "def_en": "Noisy and difficult to control.", "example_cn": "上层看台上吵闹难管的球迷因多次向场内投掷物品被驱逐出场。", "example_en": "The obstreperous fans in the upper deck were ejected after repeatedly throwing objects onto the field.", "ipa": "/əbˈstrɛpərəs/", "pos": "adj.", "word": "obstreperous"}, {"def_cn": "日常的；平凡的。", "def_en": "Of or occurring every day; ordinary or commonplace.", "example_cn": "这位摄影师在等车的上班族沐浴晨光这类日常瞬间中发现了意想不到的美。", "example_en": "The photographer found unexpected beauty in quotidian moments, such as commuters waiting in morning light.", "ipa": "/kwoʊˈtɪdiən/", "pos": "adj.", "word": "quotidian"}, {"def_cn": "睿智的；精明的。", "def_en": "Having or showing good judgment; wise.", "example_cn": "这位睿智的投资者避开了市场狂热，耐心等待价格企稳后再出手。", "example_en": "The sagacious investor avoided the market frenzy and waited patiently for prices to stabilize before buying.", "ipa": "/səˈɡeɪʃəs/", "pos": "adj.", "word": "sagacious"}, {"def_cn": "使满足；使饱足。", "def_en": "To satisfy a desire or appetite fully.", "example_cn": "漫长的颁奖典礼结束后，丰盛的自助餐终于让最饥饿的宾客也在那晚吃得心满意足。", "example_en": "The elaborate buffet finally satiated even the hungriest guests after the long awards ceremony that evening.", "ipa": "/ˈseɪʃiˌeɪt/", "pos": "v.", "word": "satiate"}, {"def_cn": "鲁莽；冒失；大胆妄为。", "def_en": "Excessive confidence or boldness; audacity.", "example_cn": "这名实习生上班第一周就大胆质疑总监的战略，真是初生牛犊不怕虎。", "example_en": "The intern had the temerity to question the director's strategy during her first week on the job.", "ipa": "/təˈmɛrəti/", "pos": "n.", "word": "temerity"}, {"def_cn": "模仿的；缺乏独创性的。", "def_en": "Imitative of the work of another artist or writer; not original.", "example_cn": "评论家批评这部续集缺乏独创性，指出它几乎逐场复制了原片的剧情。", "example_en": "Critics dismissed the sequel as derivative, noting that it copied the original film's plot almost scene by scene.", "ipa": "/dɪˈrɪvətɪv/", "pos": "adj.", "word": "derivative"}, {"def_cn": "热情洋溢的；奔放的。", "def_en": "Showing or expressing gratitude, pleasure, or approval in an unrestrained way.", "example_cn": "观众起立为这位年轻的钢琴家送上持续了近十分钟的热情欢呼。", "example_en": "The audience gave the young pianist an effusive standing ovation that lasted nearly ten minutes.", "ipa": "/ɪˈfjusɪv/", "pos": "adj.", "word": "effusive"}, {"def_cn": "避开；回避。", "def_en": "To deliberately avoid using or doing something; to shun.", "example_cn": "这位候选人选择在整个竞选期间避开负面广告，专注于详细的政策主张。", "example_en": "The candidate chose to eschew negative advertising and focused instead on detailed policy proposals throughout the campaign.", "ipa": "/ɛsˈtʃu/", "pos": "v.", "word": "eschew"}, {"def_cn": "无能的；不负责任的。", "def_en": "Lacking initiative or strength of character; irresponsible.", "example_cn": "这位不负责任的房东在整个寒冷的冬天都无视租户关于暖气故障的多次投诉。", "example_en": "The feckless landlord ignored repeated complaints about the broken heating system throughout the freezing winter.", "ipa": "/ˈfɛkləs/", "pos": "adj.", "word": "feckless"}, {"def_cn": "笨拙的；不得体的。", "def_en": "Socially awkward or unsophisticated; lacking ease or grace.", "example_cn": "他在晚宴上炫耀薪水想给客人们留下好印象，结果适得其反，显得十分不得体。", "example_en": "His gauche attempt to impress the guests by bragging about his salary backfired immediately at the dinner.", "ipa": "/ɡoʊʃ/", "pos": "adj.", "word": "gauche"}, {"def_cn": "起诉；控告。", "def_en": "To formally accuse someone of a crime.", "example_cn": "大陪审团投票决定以挪用公款的罪名起诉这位前财务主管。", "example_en": "The grand jury voted to indict the former treasurer on charges of embezzling public funds.", "ipa": "/ɪnˈdaɪt/", "pos": "v.", "word": "indict"}, {"def_cn": "猛烈抨击；痛斥。", "def_en": "To speak or write with strong hostility against something.", "example_cn": "这篇社论猛烈抨击拟议的预算削减，警告这将重创乡村学校。", "example_en": "The editorial inveighed against the proposed budget cuts, warning that they would devastate rural schools.", "ipa": "/ɪnˈveɪ/", "pos": "v.", "word": "inveigh"}], "practice": [{"qid": "d27-q1", "stem": "Worried about his health, Marcus decided to eschew sugary drinks entirely, replacing them with water and unsweetened tea. Which choice best states what Marcus did?", "passage": "", "options": ["He reduced his sugar intake slightly.", "He deliberately avoided sugary drinks.", "He switched to diet soda instead.", "He stopped drinking liquids."], "answer": "B", "explanation_en": "Eschew means to deliberately avoid something, so B matches the text exactly. A weakens the word entirely into slightly, C invents diet soda, which is never mentioned, and D overstates the claim by saying he stopped drinking all liquids.", "explanation_cn": "eschew 意为刻意回避某事，B 与原文完全对应。A 把“完全”弱化为“稍微”；C 虚构了文中从未提及的无糖汽水；D 夸张成“不喝任何液体”，言过其实。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d27-q2", "stem": "The report concluded that prolonged exposure to the chemical had deleterious effects on factory workers, including chronic respiratory illness. The word deleterious most nearly means:", "passage": "", "options": ["harmful", "minor", "temporary", "beneficial"], "answer": "A", "explanation_en": "Chronic respiratory illness is a serious harm, so harmful fits the context. Minor and temporary both understate the damage described, while beneficial is the opposite of the intended meaning.", "explanation_cn": "慢性呼吸道疾病是严重的伤害，因此 harmful（有害的）最贴切。minor（轻微的）和 temporary（暂时的）都低估了文中描述的危害；beneficial（有益的）意思完全相反。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d27-q3", "stem": "The young reporter had the temerity to ask the governor, on live television, whether he had lied to voters. Which choice best describes the reporter's action?", "passage": "", "options": ["It was cautious and respectful.", "It was bold to the point of recklessness.", "It was required by her employer.", "It was ignored by the audience."], "answer": "B", "explanation_en": "Temerity means excessive boldness or audacity, so B captures the reporter's action. A is nearly the opposite, and C and D add details that the text never provides.", "explanation_cn": "temerity 意为过度的胆大、冒失，B 准确描述了记者的行为。A 意思几乎相反；C 和 D 增加了文中没有的细节。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d27-q4", "stem": "The memoir is powerful not because of dramatic events but because it finds meaning in quotidian routines — cooking breakfast, walking to school, folding laundry. Quotidian most nearly means:", "passage": "", "options": ["extraordinary", "everyday", "forgotten", "unpleasant"], "answer": "B", "explanation_en": "The examples given are ordinary daily activities, so everyday fits perfectly. Extraordinary is the opposite of the intended meaning, while forgotten and unpleasant are not supported by any of the listed examples.", "explanation_cn": "文中举例的都是普通的日常活动，因此 everyday（日常的）最贴切。extraordinary（非凡的）意思相反；forgotten（被遗忘的）和 unpleasant（不愉快的）在例子中都得不到支持。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d27-q5", "stem": "The volunteers spent the morning cleaning the park, planting new trees, and _____ litter from the riverbank.", "passage": "", "options": ["they removed", "removing", "remove", "to remove"], "answer": "B", "explanation_en": "The list uses parallel gerunds with cleaning and planting, so removing keeps the structure consistent. A adds an unnecessary subject, while C and D break the parallel form.", "explanation_cn": "列表用的是平行的动名词 cleaning 和 planting，因此 removing 保持结构一致。A 多加了不必要的主语；C 和 D 破坏了平行结构。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d27-q6", "stem": "The students' science fair projects, _____ displayed in the gymnasium, impressed the visiting judges.", "passage": "", "options": ["which were", "they were", "were", "which they were"], "answer": "A", "explanation_en": "The nonrestrictive clause needs a relative pronoun plus a verb, which is exactly what which were provides. C lacks the pronoun, while B and D create ungrammatical or run-on structures.", "explanation_cn": "非限制性定语从句需要关系代词加动词，which were 正好满足。C 缺少关系代词；B 和 D 会造成语法错误或粘连句。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d27-q7", "stem": "Solar panel costs have fallen sharply over the past decade. _____, many homeowners still hesitate to install them because of the upfront expense.", "passage": "", "options": ["As a result", "However", "Similarly", "In other words"], "answer": "B", "explanation_en": "The second sentence contrasts falling costs with continued hesitation, so however fits. As a result would illogically imply that falling costs caused the hesitation, while similarly and in other words do not express the needed contrast.", "explanation_cn": "第二句在成本下降和仍犹豫之间形成转折，因此 however 合适。as a result 会不合逻辑地暗示降价导致了犹豫；similarly 和 in other words 都表达不了这种转折。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d27-q8", "stem": "A 2024 survey of 1,000 teenagers found that those who read for pleasure at least 30 minutes a day scored, on average, 15 percent higher on vocabulary tests than peers who rarely read. Which statement is best supported by the survey?", "passage": "", "options": ["Reading for pleasure causes higher vocabulary scores.", "Teenagers who read daily tend to have stronger vocabularies.", "Thirty minutes is the maximum useful reading time.", "Teenagers who rarely read cannot improve their vocabularies."], "answer": "B", "explanation_en": "The survey shows a correlation, so B states the finding cautiously with the phrase tend to. A claims causation, which a survey alone cannot prove, while C and D add limits that the data never establishes.", "explanation_cn": "调查只显示了相关性，B 用 tend to（往往）表述得很谨慎。A 断言了因果关系，而调查本身无法证明因果；C 和 D 增加了数据从未证实的限制。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d27-q9", "stem": "The mayor's sagacious handling of the budget crisis — cutting waste while protecting essential services — earned praise from both parties. Sagacious most nearly means:", "passage": "", "options": ["wise", "hasty", "secretive", "forceful"], "answer": "A", "explanation_en": "Cutting waste while protecting essential services demonstrates good judgment, which matches the meaning of wise. Hasty is the opposite of the careful balance described, and neither secretive nor forceful fits the evidence.", "explanation_cn": "削减浪费同时保护基本服务体现了良好的判断力，对应 wise（睿智的）。hasty（草率的）与文中谨慎的平衡相反；secretive（遮遮掩掩的）和 forceful（强硬的）都与证据不符。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d27-q10", "stem": "The critic called the novel derivative, pointing out that its plot, characters, and even its dialogue were borrowed from an earlier bestseller. The critic's main complaint was that the novel was:", "passage": "", "options": ["too original", "unoriginal", "too long", "poorly printed"], "answer": "B", "explanation_en": "Derivative means imitative rather than original, and the details about borrowed plot, characters, and dialogue directly support B. A is the opposite of the criticism, while C and D raise issues the critic never mentioned.", "explanation_cn": "derivative 意为模仿而非原创，文中“借用”情节、人物和对话的细节直接支持 B。A 与批评意见相反；C 和 D 提出了评论家从未提及的问题。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-04"}, {"day": 28, "words": [{"word": "acumen", "pos": "n.", "ipa": "/əˈkjuːmən/", "def_en": "Sharpness of judgment; the ability to make quick, accurate decisions.", "def_cn": "敏锐；精明；判断力", "example_en": "The young analyst's business acumen allowed her to spot market trends that more experienced traders had overlooked entirely.", "example_cn": "这位年轻分析师敏锐的商业头脑让她发现了经验更丰富的交易员都完全忽视的市场趋势。"}, {"word": "emulate", "pos": "v.", "ipa": "/ˈemjəˌleɪt/", "def_en": "To imitate someone, especially out of admiration or the ambition to equal them.", "def_cn": "效仿；仿效", "example_en": "Young scientists often emulate their mentors' disciplined habits, hoping that such routines will eventually produce comparable research achievements.", "example_cn": "年轻科学家常常效仿导师的严谨习惯，希望这些习惯最终能带来相当的研究成就。"}, {"word": "panegyric", "pos": "n.", "ipa": "/ˌpænəˈdʒɪrɪk/", "def_en": "A speech or piece of writing that praises someone highly.", "def_cn": "颂词；颂文", "example_en": "The outgoing director received an unexpected panegyric from a former critic, whose remarks acknowledged decades of quiet dedication to public service.", "example_cn": "即将离任的主任收到一位昔日批评者的意外颂词，讲话肯定了她几十年来对公共事业的默默奉献。"}, {"word": "peevish", "pos": "adj.", "ipa": "/ˈpiːvɪʃ/", "def_en": "Easily irritated by small annoyances; fretful and bad-tempered.", "def_cn": "烦躁的；易怒的", "example_en": "The peevish traveler complained about the delayed train, the cramped seat, and even the angle of the sunlight on his window.", "example_cn": "这位烦躁的旅客抱怨火车晚点、座位狭窄，甚至抱怨阳光照进车窗的角度。"}, {"word": "recondite", "pos": "adj.", "ipa": "/ˈrekəndaɪt/", "def_en": "Dealing with very deep, obscure knowledge that is hard to understand.", "def_cn": "深奥的；难懂的", "example_en": "The professor's recondite lecture on medieval logic left even the graduate students struggling to follow the intricate line of argument.", "example_cn": "教授关于中世纪逻辑学的深奥讲座让连研究生都难以跟上错综复杂的论证思路。"}, {"word": "salient", "pos": "adj.", "ipa": "/ˈseɪljənt/", "def_en": "Most noticeable or important; prominent and standing out.", "def_cn": "显著的；突出的", "example_en": "The most salient feature of the report was its finding that literacy rates had doubled within a single generation.", "example_cn": "这份报告最显著的特点是其发现：识字率在一代人的时间里翻了一番。"}, {"word": "sequester", "pos": "v.", "ipa": "/sɪˈkwestər/", "def_en": "To isolate or set apart; to keep someone away from others.", "def_cn": "隔离；使隐退", "example_en": "During the high-profile trial, the judge ordered the jury to be sequestered in a hotel to prevent outside influence.", "example_cn": "在这起备受关注的审判中，法官命令陪审团住在酒店里隔离，以防受到外界影响。"}, {"word": "tacit", "pos": "adj.", "ipa": "/ˈtæsɪt/", "def_en": "Understood without being stated directly; implied rather than spoken.", "def_cn": "心照不宣的；默示的", "example_en": "There was a tacit agreement among the committee members that the most controversial proposal would never reach a vote.", "example_cn": "委员会成员之间有一种心照不宣的默契：最具争议的提案永远不会进入表决。"}, {"word": "unctuous", "pos": "adj.", "ipa": "/ˈʌŋktʃuəs/", "def_en": "Excessively flattering or oily in manner; insincerely smooth.", "def_cn": "谄媚的；油腔滑调的", "example_en": "The salesman's unctuous praise of the car's features irritated the buyer, who preferred honest answers to exaggerated compliments.", "example_cn": "推销员对汽车功能油腔滑调的夸赞惹恼了买家，他更想要诚实的回答而不是夸张的恭维。"}, {"word": "vagary", "pos": "n.", "ipa": "/ˈveɪɡəri/", "def_en": "An unexpected and unpredictable change; a whim or caprice.", "def_cn": "反复无常；奇想", "example_en": "Farmers in the region have learned to adapt to the vagaries of the mountain weather, which can shift from sun to snow within hours.", "example_cn": "该地区的农民已经学会适应山区天气的反复无常，几小时内就可能从晴转雪。"}, {"word": "wheedle", "pos": "v.", "ipa": "/ˈhwiːdl/", "def_en": "To persuade someone by flattery or coaxing.", "def_cn": "哄骗；用甜言蜜语劝说", "example_en": "The child tried to wheedle an extra cookie from his grandmother with a series of exaggerated compliments about her baking.", "example_cn": "孩子用一连串夸张的恭维话哄骗祖母，想多要一块饼干。"}, {"word": "dogged", "pos": "adj.", "ipa": "/ˈdɔːɡɪd/", "def_en": "Persistent; refusing to give up despite difficulty or delay.", "def_cn": "顽强的；坚持不懈的", "example_en": "The journalist's dogged pursuit of the documents eventually exposed a corruption scheme that officials had hidden for years.", "example_cn": "记者顽强地追查文件，最终揭露了官员隐瞒多年的腐败计划。"}, {"word": "embroil", "pos": "v.", "ipa": "/ɪmˈbrɔɪl/", "def_en": "To involve someone deeply in conflict, trouble, or argument.", "def_cn": "使卷入（纠纷）", "example_en": "The diplomat refused to let a border dispute embroil the two nations in a conflict neither government truly wanted.", "example_cn": "这位外交官拒绝让边境争端把两国卷入一场两国政府都不想要的冲突。"}, {"word": "exacting", "pos": "adj.", "ipa": "/ɪɡˈzæktɪŋ/", "def_en": "Making great demands on skill or effort; requiring precision.", "def_cn": "要求苛刻的；严格的", "example_en": "Training for the surgical residency proved exacting, demanding sixteen-hour days and flawless concentration under constant pressure.", "example_cn": "外科住院医师培训要求极为苛刻，每天工作十六小时，在持续压力下保持完美专注。"}, {"word": "fidelity", "pos": "n.", "ipa": "/fɪˈdeləti/", "def_en": "Faithfulness and loyalty; accuracy in reproducing an original.", "def_cn": "忠诚；精确；忠实", "example_en": "The translator's fidelity to the original poem preserved not only its meaning but also the subtle rhythm of each line.", "example_cn": "译者对原诗的忠实再现不仅保留了诗意，还保留了每行的微妙韵律。"}, {"word": "goad", "pos": "v.", "ipa": "/ɡoʊd/", "def_en": "To provoke or push someone into action, often by annoying them.", "def_cn": "刺激；驱使", "example_en": "The coach's sharp criticism was meant to goad the team into practicing harder before the championship game.", "example_cn": "教练尖锐的批评意在刺激球队在冠军赛前更加刻苦训练。"}, {"word": "ingratiate", "pos": "v.", "ipa": "/ɪnˈɡreɪʃieɪt/", "def_en": "To bring oneself into someone's favor by flattery or pleasing acts.", "def_cn": "讨好；巴结", "example_en": "The new employee tried to ingratiate himself with the manager by volunteering for every assignment, however tedious.", "example_cn": "新员工试图通过主动承担每项任务来讨好经理，无论任务多么乏味。"}, {"word": "lurid", "pos": "adj.", "ipa": "/ˈlʊrɪd/", "def_en": "Sensational and shocking; vividly glaring in a disturbing way.", "def_cn": "耸人听闻的；刺眼的", "example_en": "The newspaper's lurid headlines about the scandal attracted readers but obscured the more complex facts of the case.", "example_cn": "报纸关于丑闻的耸人听闻的标题吸引了读者，却掩盖了案件更复杂的真相。"}, {"word": "nonplussed", "pos": "adj.", "ipa": "/ˌnɑːnˈplʌst/", "def_en": "Surprised and confused; unsure how to react.", "def_cn": "困惑的；不知所措的", "example_en": "The mayor was nonplussed by the sudden protest, having expected the town meeting to proceed without any controversy.", "example_cn": "市长对突如其来的抗议感到不知所措，他本以为镇民大会会毫无争议地进行。"}, {"word": "proscribe", "pos": "v.", "ipa": "/proʊˈskraɪb/", "def_en": "To forbid something by law or rule; to officially ban.", "def_cn": "禁止；取缔", "example_en": "The new regulation proscribes the use of certain chemicals in food packaging, citing risks to public health.", "example_cn": "新法规禁止在食品包装中使用某些化学品，理由是危害公共健康。"}], "practice": [{"qid": "d28-q1", "stem": "The review described the spokesperson's remarks as ___: long, oily compliments directed at every reporter in the room, none of which answered the actual question.", "passage": "", "options": ["unctuous", "tacit", "dogged", "salient"], "answer": "A", "explanation_en": "Unctuous means excessively flattering or oily in manner, which matches the clue of long, oily compliments. Tacit means understood without being stated, dogged means persistent, and salient means prominent, so none of them fits the flattery described.", "explanation_cn": "unctuous 意为谄媚的、油腔滑调的，与题中 long, oily compliments（冗长而油滑的恭维）呼应。tacit（心照不宣的）、dogged（顽强的）、salient（显著的）都不表示谄媚。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d28-q2", "stem": "To shield the witnesses from media pressure, the court ordered that they be ___ in a secure hotel until the trial ended.", "passage": "", "options": ["goaded", "embroiled", "sequestered", "proscribed"], "answer": "C", "explanation_en": "Sequester means to isolate or set apart, which fits keeping witnesses in a secure hotel away from the media. Goad means to provoke, embroil means to involve in conflict, and proscribe means to forbid, none of which means isolating people.", "explanation_cn": "sequester 意为隔离，与把证人安置在安全酒店、与媒体隔绝的语境相符。goad（刺激）、embroil（卷入纠纷）、proscribe（禁止）都不表示隔离。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d28-q3", "stem": "Marine biologist Elena Ruiz spent a decade tracking whale migration. Early in her career, colleagues dismissed her methods as too slow. I learned to trust the long view, she later wrote. Her patience paid off: her data revealed a previously unknown feeding ground, changing conservation policy. The quotation from Ruiz primarily serves to", "passage": "", "options": ["summarize the scientific findings of her decade-long study.", "illustrate the attitude that sustained her through early skepticism.", "criticize the colleagues who dismissed her research methods.", "explain why whale migration patterns are difficult to track."], "answer": "B", "explanation_en": "The quotation shows Ruiz trusting the long view, which illustrates the patient attitude that kept her going when colleagues doubted her. It does not summarize her findings, criticize her colleagues, or explain the difficulty of tracking whales.", "explanation_cn": "引文讲她学会相信长远的眼光，说明的是支撑她度过早期质疑的心态。引文没有总结研究发现、没有批评同事，也没有解释追踪迁徙的难度。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d28-q4", "stem": "The city council voted 7-2 to convert the abandoned rail yard into a public park. Council member Alvarez, who had opposed the plan for years, cast the deciding vote in favor. In her statement, she noted that traffic studies had finally addressed her concerns about congestion. It can most reasonably be inferred that Alvarez", "passage": "", "options": ["changed her position because her main objection was resolved.", "had secretly supported the park plan all along.", "voted in favor only to avoid public criticism.", "was the only council member concerned about traffic."], "answer": "A", "explanation_en": "Alvarez opposed the plan over traffic concerns and voted yes once traffic studies addressed them, so her objection was resolved. The passage gives no evidence of secret support, fear of criticism, or that she was the only one concerned about traffic.", "explanation_cn": "Alvarez 因交通担忧反对该计划，交通研究解决她的顾虑后她投了赞成票，说明主要反对理由被消除。文中没有证据表明她一直暗中支持、怕舆论压力，也没有说只有她关心交通。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d28-q5", "stem": "The committee ___ the proposal last Tuesday and will announce its decision tomorrow.", "passage": "", "options": ["reviews", "reviewed", "reviewing", "to review"], "answer": "B", "explanation_en": "The action happened last Tuesday, so the past tense reviewed is required. Reviews is present tense, reviewing needs a helping verb to work as the main verb, and to review is an infinitive that cannot serve as the main verb.", "explanation_cn": "动作发生在上周二，要用过去时 reviewed。reviews 是现在时，reviewing 缺助动词不能作谓语，to review 是不定式不能作谓语。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d28-q6", "stem": "The new bridge reduced commute times by twenty minutes. ___, local businesses near the old route reported fewer customers.", "passage": "", "options": ["Consequently", "For example", "In contrast", "Meanwhile"], "answer": "A", "explanation_en": "The drop in customers is a result of traffic shifting to the new bridge, so consequently expresses the cause-and-effect relationship. For example would introduce an illustration, in contrast needs an opposing idea, and meanwhile suggests unrelated simultaneous events.", "explanation_cn": "老路边商家顾客减少是新桥分流的直接后果，用 consequently 表因果。for example 引出例证，in contrast 需要对立观点，meanwhile 表同时发生的不相关事件。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d28-q7", "stem": "Although the committee voted to ___ the sale of sugary drinks in school cafeterias, enforcing the ban proved difficult.", "passage": "", "options": ["proscribe", "prescribe", "emulate", "wheedle"], "answer": "A", "explanation_en": "Proscribe means to forbid by rule, which fits the context of a ban. Prescribe looks similar but means to recommend or order, as a doctor prescribes medicine, which is the opposite idea. Emulate means to imitate and wheedle means to coax, neither of which fits.", "explanation_cn": "proscribe 意为明令禁止，与 ban 呼应。prescribe 形近但意为开处方、规定，是反义陷阱。emulate（效仿）、wheedle（哄骗）都不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d28-q8", "stem": "The training program emphasizes analyzing data, writing clear reports, and ___ findings to clients.", "passage": "", "options": ["to present", "presenting", "present", "presentation of"], "answer": "B", "explanation_en": "The list uses parallel gerunds, analyzing and writing, so the third item must also be a gerund: presenting. To present and present break the parallelism, and presentation of changes the structure entirely.", "explanation_cn": "并列结构 analyzing、writing 都是动名词，第三项也要用动名词 presenting。to present、present 破坏平行结构，presentation of 改变句式。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d28-q9", "stem": "Honeybees communicate the location of flowers through the waggle dance, a figure-eight movement whose angle indicates direction. Researchers recently discovered that bees adjust the dance when wind conditions change, suggesting a level of flexibility once thought impossible for insects. The main purpose of the passage is to", "passage": "", "options": ["argue that bees are more intelligent than other insects.", "describe a recent finding about bee communication.", "explain how wind affects flower growth.", "question the accuracy of earlier bee research."], "answer": "B", "explanation_en": "The passage presents the discovery that bees adjust the waggle dance for wind, so its purpose is to describe a recent finding. It does not compare bee intelligence, discuss flower growth, or question earlier research.", "explanation_cn": "文章介绍蜜蜂根据风况调整摆尾舞的新发现，目的是描述这一研究发现。没有比较蜜蜂智力、没有讲风对花的影响，也没有质疑早期研究。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d28-q10", "stem": "Which choice most effectively combines the ideas into one clear sentence? The museum opened in 1925. It houses over 10,000 artifacts. It attracts 500,000 visitors each year.", "passage": "", "options": ["The museum, which opened in 1925, houses over 10,000 artifacts and attracts 500,000 visitors each year.", "The museum opened in 1925, and it was then that it began to house over 10,000 artifacts, and it attracts 500,000 visitors each year now.", "Opening in 1925, the museum houses over 10,000 artifacts, and 500,000 visitors each year are attracted by the museum.", "The museum opened in 1925 and houses over 10,000 artifacts, and the museum attracts 500,000 visitors each year."], "answer": "A", "explanation_en": "Choice A combines the facts with a relative clause, avoiding repetition of the museum and wordy constructions. B is wordy, C is awkward and passive, and D repeats the museum unnecessarily.", "explanation_cn": "A 用定语从句把三句话合成一句，简洁无重复。B 啰嗦，C 别扭且被动，D 重复 the museum。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-07"}, {"day": 29, "words": [{"word": "acrimony", "pos": "n.", "ipa": "/ˈækrɪmoʊni/", "def_en": "Bitterness or ill feeling, especially in speech or debate.", "def_cn": "尖刻；敌意", "example_en": "The divorce proceedings, once amicable, ended in acrimony when the couple began disputing the division of their property.", "example_cn": "曾经和气的离婚诉讼最终以敌意收场，双方开始争执财产分割。"}, {"word": "admonish", "pos": "v.", "ipa": "/ædˈmɑːnɪʃ/", "def_en": "To warn or scold someone firmly.", "def_cn": "告诫；责备", "example_en": "The principal admonished the students to arrive on time, reminding them that repeated lateness would result in detention.", "example_cn": "校长告诫学生要准时到校，提醒他们屡次迟到将被留校。"}, {"word": "boorish", "pos": "adj.", "ipa": "/ˈbʊrɪʃ/", "def_en": "Rude and clumsy in manner; ill-mannered.", "def_cn": "粗鲁的；无礼的", "example_en": "The guest's boorish behavior at the dinner party, interrupting others and chewing loudly, embarrassed his host.", "example_cn": "客人在晚宴上粗鲁的举止，打断别人、大声咀嚼，让主人尴尬。"}, {"word": "callow", "pos": "adj.", "ipa": "/ˈkæloʊ/", "def_en": "Young and inexperienced; immature.", "def_cn": "稚嫩的；无经验的", "example_en": "The callow intern's confident predictions about the market amused the veteran traders, who had seen many such forecasts fail.", "example_cn": "稚嫩的实习生对市场的自信预测让资深交易员发笑，他们见过太多类似预测落空。"}, {"word": "chagrin", "pos": "n.", "ipa": "/ʃəˈɡrɪn/", "def_en": "Embarrassment or humiliation caused especially by failure.", "def_cn": "懊恼；羞愧", "example_en": "To the student's chagrin, the teacher read his careless essay aloud as an example of what not to do.", "example_c
