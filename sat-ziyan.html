12-q1", "stem": "In her review of the novel, the critic called the dialogue ______: every exchange between the characters sounded borrowed from another book.", "passage": "", "options": ["trite", "pristine", "urbane", "docile"], "answer": "A", "explanation_en": "Trite means overused and lacking originality, which matches dialogue that sounds borrowed from another book. Pristine (unspoiled), urbane (sophisticated), and docile (obedient) do not describe unoriginal writing.", "explanation_cn": "trite 意为“陈腐老套的”，正好对应“像是从别的书里借来的台词”。pristine（纯净的）、urbane（温文尔雅的）、docile（温顺的）都不能形容缺乏新意的文字。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d12-q2", "stem": "Despite the chaos around him, the surgeon remained ______, calmly issuing instructions to his team.", "passage": "", "options": ["nonchalant", "archaic", "indigent", "parochial"], "answer": "A", "explanation_en": "Nonchalant means calm and unconcerned, fitting someone who stays composed in chaos. Archaic (outdated), indigent (poor), and parochial (narrow-minded) are unrelated to composure.", "explanation_cn": "nonchalant 意为“镇定自若的”，符合在混乱中保持冷静的描述。archaic（过时的）、indigent（贫困的）、parochial（眼界狭窄的）都与镇定无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d12-q3", "stem": "A recent study surveyed 500 historians about the causes of the city's decline. While 68 percent cited economic factors as the primary cause, the remaining 32 percent pointed to political instability. The researchers concluded that no single explanation commands universal support. Which choice best describes the text?", "passage": "", "options": ["It argues that political instability was the main cause of decline.", "It presents survey results showing disagreement among historians.", "It criticizes historians for ignoring economic evidence.", "It compares two cities that experienced decline."], "answer": "B", "explanation_en": "The text reports the survey's split results and concludes there is no universal agreement — choice B captures this. A takes one side the text does not take, C introduces criticism not present, and D mentions a comparison that never occurs.", "explanation_cn": "文章报告了调查中两种观点的分歧，并得出没有一致结论——B 准确概括。A 站了文章没有站的队，C 加入了不存在的批评，D 提到的比较文中没有。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d12-q4", "stem": "The author opens the essay with a vivid description of a crowded marketplace before turning to statistics about urban growth. The primary purpose of this opening is to:", "passage": "", "options": ["criticize the effects of urban growth", "engage readers with a concrete scene before presenting data", "argue that marketplaces are disappearing", "compare rural and urban economies"], "answer": "B", "explanation_en": "The vivid scene draws readers in before the statistical discussion. A and C introduce criticism or argument not present in the opening, and D mentions a comparison that never occurs.", "explanation_cn": "生动的场景先吸引读者，再进入数据讨论。A 和 C 加入了开头没有的批评或论点，D 的比较文中不存在。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d12-q5", "stem": "The collection of ancient manuscripts, many of which date back to the twelfth century, ______ stored in a climate-controlled vault.", "passage": "", "options": ["is", "are", "were being", "have been"], "answer": "A", "explanation_en": "The subject is the singular noun collection; the clause many of which date back does not change the subject's number. Therefore the singular verb is is required.", "explanation_cn": "主语是单数的 collection，many of which date back 是非限定性定语从句，不影响主谓一致，所以谓语用单数 is。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d12-q6", "stem": "After hours of heated debate, the board members finally reached a ______ on the new policy.", "passage": "", "options": ["consensus", "decorum", "brevity", "zealot"], "answer": "A", "explanation_en": "Consensus means general agreement, which is what the board reached. Decorum (proper behavior) and brevity (conciseness) do not fit, and zealot (a fanatical person) is the wrong part of speech.", "explanation_cn": "consensus 意为“共识”，正是董事会达成的东西。decorum（礼仪）、brevity（简洁）不合语境，zealot（狂热分子）词性都不对。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d12-q7", "stem": "The new train line cut commute times in half. ______, ridership has doubled in just six months.", "passage": "", "options": ["As a result", "In contrast", "Nevertheless", "For example"], "answer": "A", "explanation_en": "As a result signals the consequence of shorter commutes. In contrast and Nevertheless show opposition, while For example introduces an illustration — none fits the cause-and-effect logic.", "explanation_cn": "As a result 表因果：通勤时间减半带来了客流翻倍。In contrast 和 Nevertheless 表转折，For example 表举例，都不符合因果逻辑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d12-q8", "stem": "The detective's ______ observation of the suspect's nervous habits helped crack the case.", "passage": "", "options": ["astute", "trite", "docile", "archaic"], "answer": "A", "explanation_en": "Astute means perceptive and sharp, fitting a detective who notices telling details. Trite (unoriginal), docile (obedient), and archaic (outdated) do not describe keen observation.", "explanation_cn": "astute 意为“敏锐的”，符合注意到关键细节的侦探。trite（陈腐的）、docile（温顺的）、archaic（过时的）都不能形容敏锐的观察。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d12-q9", "stem": "Covered in dust after decades in the attic, ______.", "passage": "", "options": ["the old manuscripts were carefully restored by archivists", "archivists carefully restored the old manuscripts", "the restoration of the old manuscripts took several weeks", "it took archivists weeks to restore them"], "answer": "A", "explanation_en": "The participial phrase Covered in dust must modify the noun that follows it. Only choice A places the old manuscripts — the thing covered in dust — directly after the phrase. The other choices create dangling modifiers.", "explanation_cn": "分词短语 Covered in dust 必须修饰紧随其后的主语。只有 A 的主语 the old manuscripts 是“布满灰尘”的东西；其他选项会造成悬垂修饰语。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d12-q10", "stem": "Honeybees perform a waggle dance to tell hive mates where flowers are. The angle of the dance shows direction, and its length shows distance. Scientists who decoded the dance could predict where bees would fly next. What can most reasonably be inferred from the text?", "passage": "", "options": ["Bees navigate only by the position of the sun.", "The waggle dance encodes useful information about food location.", "Scientists invented the waggle dance.", "All insects communicate through dance."], "answer": "B", "explanation_en": "The text explains that the dance conveys direction and distance — choice B restates this. A uses the absolute only, which the text never claims; C reverses the roles; D overgeneralizes to all insects.", "explanation_cn": "文章说明摇摆舞传递方向和距离信息——B 复述了这一点。A 用了文中没有的 only，C 颠倒了角色，D 过度推广到所有昆虫。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-06"}, {"day": 13, "words": [{"word": "allocate", "pos": "v.", "ipa": "/ˈæləkeɪt/", "def_en": "To distribute resources for a particular purpose.", "def_cn": "分配；拨给", "example_en": "The school allocated extra funds to update the science labs.", "example_cn": "学校拨出额外资金来更新科学实验室。"}, {"word": "ardent", "pos": "adj.", "ipa": "/ˈɑrdənt/", "def_en": "Passionate and enthusiastic.", "def_cn": "热烈的；热切的", "example_en": "The ardent supporters cheered for hours after the victory.", "example_cn": "这些热情的支持者在胜利后欢呼了好几个小时。"}, {"word": "brash", "pos": "adj.", "ipa": "/bræʃ/", "def_en": "Bold and tactless; showing too much confidence.", "def_cn": "鲁莽的；无礼的", "example_en": "His brash comments offended several guests at the dinner.", "example_cn": "他鲁莽的言论冒犯了晚宴上的好几位客人。"}, {"word": "contentious", "pos": "adj.", "ipa": "/kənˈtɛnʃəs/", "def_en": "Likely to cause argument; controversial.", "def_cn": "引起争议的", "example_en": "The contentious proposal divided the town council for months.", "example_cn": "这项有争议的提案让镇议会分裂了好几个月。"}, {"word": "diplomatic", "pos": "adj.", "ipa": "/ˌdɪpləˈmætɪk/", "def_en": "Tactful in dealing with people; skilled at avoiding offense.", "def_cn": "圆滑的；有手腕的", "example_en": "She gave a diplomatic answer that satisfied both sides.", "example_cn": "她给出了一个圆滑的回答，让双方都满意。"}, {"word": "dubious", "pos": "adj.", "ipa": "/ˈdubɪəs/", "def_en": "Doubtful; of questionable value or truth.", "def_cn": "可疑的；靠不住的", "example_en": "The salesman made dubious claims about the car's condition.", "example_cn": "这位销售员对车况的说法很可疑。"}, {"word": "fervent", "pos": "adj.", "ipa": "/ˈfɜrvənt/", "def_en": "Having passionate intensity.", "def_cn": "热切的；强烈的", "example_en": "The fervent fans waited outside the stadium all night.", "example_cn": "这些狂热的球迷在体育场外等了一整夜。"}, {"word": "ineffable", "pos": "adj.", "ipa": "/ɪnˈɛfəbəl/", "def_en": "Too great or beautiful to describe in words.", "def_cn": "难以言喻的", "example_en": "The sunset over the ocean filled her with ineffable joy.", "example_cn": "海面上的日落让她心中充满难以言喻的喜悦。"}, {"word": "obfuscate", "pos": "v.", "ipa": "/ˈɑbfəskeɪt/", "def_en": "To make something unclear or confusing.", "def_cn": "使混乱；使模糊", "example_en": "The complicated legal language seemed designed to obfuscate the contract's terms.", "example_cn": "复杂的法律措辞似乎是为了让合同条款含混不清。"}, {"word": "parsimonious", "pos": "adj.", "ipa": "/ˌpɑrsəˈmoʊnɪəs/", "def_en": "Unwilling to spend money; stingy.", "def_cn": "吝啬的", "example_en": "The parsimonious millionaire reused tea bags to save money.", "example_cn": "这位吝啬的百万富翁为了省钱重复使用茶包。"}, {"word": "prodigal", "pos": "adj.", "ipa": "/ˈprɑdɪɡəl/", "def_en": "Wasteful with money or resources.", "def_cn": "挥霍的；浪费的", "example_en": "The prodigal heir spent his entire inheritance within two years.", "example_cn": "这位挥霍无度的继承人两年内花光了全部遗产。"}, {"word": "reticent", "pos": "adj.", "ipa": "/ˈrɛtɪsənt/", "def_en": "Reserved; reluctant to speak freely.", "def_cn": "寡言的；沉默的", "example_en": "The usually talkative actor was reticent about his new film.", "example_cn": "这位平时健谈的演员对他的新电影却寡言少语。"}, {"word": "vacillate", "pos": "v.", "ipa": "/ˈvæsəleɪt/", "def_en": "To waver between choices; be indecisive.", "def_cn": "犹豫；摇摆不定", "example_en": "The committee vacillated for weeks before choosing a location.", "example_cn": "委员会犹豫了好几周才选定地点。"}, {"word": "zany", "pos": "adj.", "ipa": "/ˈzeɪni/", "def_en": "Wildly funny or eccentric.", "def_cn": "古怪的；滑稽的", "example_en": "The zany comedian wore mismatched shoes on stage.", "example_cn": "这位古怪的喜剧演员穿着不配对的鞋子登台。"}, {"word": "charlatan", "pos": "n.", "ipa": "/ˈʃɑrlətən/", "def_en": "A person who falsely claims expertise; a fraud.", "def_cn": "骗子；冒充内行者", "example_en": "The so-called doctor was exposed as a charlatan with fake credentials.", "example_cn": "这位所谓的医生被揭穿是个拿着假文凭的骗子。"}, {"word": "chastise", "pos": "v.", "ipa": "/tʃæˈstaɪz/", "def_en": "To punish or scold severely.", "def_cn": "惩罚；严厉批评", "example_en": "The coach chastised the team for their lack of effort.", "example_cn": "教练严厉批评了球队缺乏拼劲。"}, {"word": "circumspect", "pos": "adj.", "ipa": "/ˈsɜrkəmspekt/", "def_en": "Careful and cautious; considering all risks.", "def_cn": "谨慎的；小心的", "example_en": "Investors were circumspect after losing money in the crash.", "example_cn": "在股灾中赔钱后，投资者们变得格外谨慎。"}, {"word": "clamor", "pos": "n.", "ipa": "/ˈklæmər/", "def_en": "A loud, persistent demand or noise.", "def_cn": "喧哗；强烈要求", "example_en": "The clamor for lower taxes grew louder each year.", "example_cn": "要求减税的呼声一年比一年高。"}, {"word": "coherent", "pos": "adj.", "ipa": "/koʊˈhɪrənt/", "def_en": "Logical and consistent; clearly organized.", "def_cn": "连贯的；条理清晰的", "example_en": "The lawyer presented a coherent argument that convinced the jury.", "example_cn": "这位律师提出了条理清晰的论点，说服了陪审团。"}, {"word": "commensurate", "pos": "adj.", "ipa": "/kəˈmɛnsərət/", "def_en": "Equal in measure or proportion to something.", "def_cn": "相称的；相当的", "example_en": "The salary should be commensurate with the candidate's experience.", "example_cn": "薪水应与候选人的经验相称。"}], "practice": [{"qid": "d13-q1", "stem": "Unlike his ______ brother, who saved every penny, Marco spent his entire allowance within days.", "passage": "", "options": ["prodigal", "parsimonious", "reticent", "diplomatic"], "answer": "B", "explanation_en": "Parsimonious means stingy, the opposite of Marco's wastefulness. Prodigal (wasteful) describes Marco himself, while reticent (quiet) and diplomatic (tactful) are irrelevant to spending habits.", "explanation_cn": "parsimonious 意为“吝啬的”，与 Marco 的挥霍正好相反。prodigal（挥霍的）形容的是 Marco 本人，reticent（寡言的）、diplomatic（圆滑的）都与花钱习惯无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d13-q2", "stem": "The witness gave ______ testimony, changing key details each time she was questioned.", "passage": "", "options": ["dubious", "coherent", "ardent", "diplomatic"], "answer": "A", "explanation_en": "Dubious means doubtful or questionable, fitting testimony that keeps changing. Coherent (logical) is the opposite, while ardent (passionate) and diplomatic (tactful) do not fit.", "explanation_cn": "dubious 意为“可疑的”，符合前后矛盾的证词。coherent（连贯的）意思相反，ardent（热切的）、diplomatic（圆滑的）不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d13-q3", "stem": "The committee ______ for weeks, unable to decide between the two proposals.", "passage": "", "options": ["vacillated", "allocated", "chastised", "obfuscated"], "answer": "A", "explanation_en": "Vacillate means to waver between choices, matching the committee's indecision. Allocated (distributed), chastised (scolded), and obfuscated (confused) do not describe indecision.", "explanation_cn": "vacillate 意为“犹豫不决”，符合委员会无法抉择的状态。allocated（分配）、chastised（批评）、obfuscated（使混乱）都不能表示犹豫。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d13-q4", "stem": "Each of the players on the championship team ______ a medal at the ceremony.", "passage": "", "options": ["receive", "receives", "have received", "are receiving"], "answer": "B", "explanation_en": "The subject is Each, which is singular, so the verb must be the singular receives. The phrase of the players does not change the subject's number.", "explanation_cn": "主语是单数的 Each，所以谓语用单数 receives。of the players 是介词短语，不影响主谓一致。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d13-q5", "stem": "The city council voted to ______ additional funds for repairing the old bridges.", "passage": "", "options": ["allocate", "obfuscate", "vacillate", "clamor"], "answer": "A", "explanation_en": "Allocate means to distribute resources, fitting funds for repairs. Obfuscate (confuse) and vacillate (waver) do not fit, and clamor (a loud demand) is the wrong part of speech.", "explanation_cn": "allocate 意为“分配（资金）”，符合拨款修桥的语境。obfuscate（使混乱）、vacillate（犹豫）不合语境，clamor（喧哗）词性都不对。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d13-q6", "stem": "The storm knocked out power across the region. ______, emergency crews worked through the night to restore electricity.", "passage": "", "options": ["In response", "In contrast", "For instance", "On the other hand"], "answer": "A", "explanation_en": "In response shows the crews reacted to the storm. In contrast and On the other hand signal opposition, while For instance introduces an example — none fits.", "explanation_cn": "In response 表回应：抢修队针对暴风雪采取行动。In contrast 和 On the other hand 表转折，For example 表举例，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d13-q7", "stem": "Her argument was ______, with each point building logically on the previous one.", "passage": "", "options": ["coherent", "contentious", "ineffable", "zany"], "answer": "A", "explanation_en": "Coherent means logical and well-organized, matching points that build on each other. Contentious (controversial), ineffable (indescribable), and zany (eccentric) do not describe logical structure.", "explanation_cn": "coherent 意为“条理清晰的”，符合论点层层递进的描述。contentious（有争议的）、ineffable（难以言喻的）、zany（古怪的）都不能形容逻辑结构。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d13-q8", "stem": "Researchers tracked two groups of students: one studied in complete silence, the other with background music. The silent group scored 12 percent higher on memory tests. The researchers concluded that silence benefits recall. Which finding would most weaken this conclusion?", "passage": "", "options": ["The silent group also slept more hours per night.", "Background music has no effect on math scores.", "Memory tests are widely used in schools.", "Silence is preferred by most teachers."], "answer": "A", "explanation_en": "If the silent group also slept more, sleep — not silence — might explain the higher scores, weakening the conclusion. B, C, and D do not offer an alternative explanation for the result.", "explanation_cn": "如果安静组睡眠也更多，那么高分可能是睡眠而非安静导致的，这削弱了结论。B、C、D 都没有提供替代解释。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d13-q9", "stem": "The so-called financial advisor was exposed as a ______, with no real training or license.", "passage": "", "options": ["charlatan", "prodigal", "reticent", "brash"], "answer": "A", "explanation_en": "Charlatan means a fraud who falsely claims expertise, fitting someone with no real training. Prodigal (wasteful), reticent (quiet), and brash (bold) do not describe a fraud.", "explanation_cn": "charlatan 意为“冒充内行者的骗子”，符合没有真才实学的人。prodigal（挥霍的）、reticent（寡言的）、brash（鲁莽的）都不能表示骗子。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d13-q10", "stem": "The passage describes the author's childhood summers on a farm before discussing modern farming technology. The description of the farm most likely serves to:", "passage": "", "options": ["provide a personal contrast to the technological discussion", "argue that modern farming is harmful", "prove that the author is an expert farmer", "criticize childhood memories as unreliable"], "answer": "A", "explanation_en": "The nostalgic farm scene sets up a personal contrast with the later technology discussion. B and D introduce criticism not present, and C overstates what a childhood memory proves.", "explanation_cn": "童年农场的温情回忆与后文的现代技术形成个人化的对比。B 和 D 加入了不存在的批评，C 过度解读了童年记忆的作用。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-09"}, {"day": 14, "words": [{"word": "abjure", "pos": "v.", "ipa": "/æbˈdʒʊr/", "def_en": "To formally renounce or reject a belief, cause, or claim.", "def_cn": "正式发誓放弃；公开宣布与……决裂", "example_en": "After years of loyalty to the party, the senator publicly abjured its platform in a scathing resignation speech.", "example_cn": "在多年效忠该党之后，这位参议员在一场措辞严厉的辞职演讲中公开宣布与该党决裂。"}, {"word": "affable", "pos": "adj.", "ipa": "/ˈæfəbəl/", "def_en": "Friendly, pleasant, and easy to talk to.", "def_cn": "和蔼的；平易近人的", "example_en": "Despite her formidable reputation as a litigator, the attorney was affable and approachable with junior colleagues.", "example_cn": "尽管作为诉讼律师名声显赫，这位律师对待年轻同事却和蔼可亲、平易近人。"}, {"word": "ancillary", "pos": "adj.", "ipa": "/ˈænsəˌleri/", "def_en": "Providing necessary support to a main activity; subordinate or auxiliary.", "def_cn": "辅助的；次要的", "example_en": "While the novel's plot drives the narrative, its ancillary details about 19th-century London enrich the setting.", "example_cn": "虽然小说的情节推动叙事，但关于19世纪伦敦的辅助细节丰富了故事背景。"}, {"word": "apocryphal", "pos": "adj.", "ipa": "/əˈpɑkrəfəl/", "def_en": "Widely believed but of doubtful authenticity; probably untrue.", "def_cn": "伪造的；传说性的（未必真实）", "example_en": "The story that Einstein failed mathematics as a child is apocryphal, contradicted by his excellent school records.", "example_cn": "爱因斯坦小时候数学不及格的说法纯属传说，与他优异的在校成绩单相矛盾。"}, {"word": "avid", "pos": "adj.", "ipa": "/ˈævɪd/", "def_en": "Showing great enthusiasm or eagerness for something.", "def_cn": "热切的；如饥似渴的", "example_en": "An avid reader of scientific journals, the student could discuss recent breakthroughs in genetics with ease.", "example_cn": "作为科学期刊的热心读者，这名学生能轻松谈论遗传学领域的最新突破。"}, {"word": "cadence", "pos": "n.", "ipa": "/ˈkeɪdəns/", "def_en": "The rhythmic flow of sounds or language; measured rhythm.", "def_cn": "韵律；节奏", "example_en": "The poet's deliberate cadence, with its pauses and repetitions, gives the verse a solemn, hymn-like quality.", "example_cn": "诗人刻意的韵律——停顿与重复——赋予诗句庄严如圣歌般的特质。"}, {"word": "chide", "pos": "v.", "ipa": "/tʃaɪd/", "def_en": "To scold or rebuke mildly.", "def_cn": "轻责；告诫", "example_en": "The coach chided the team for celebrating prematurely, reminding them that the championship was not yet secured.", "example_cn": "教练轻责队员过早庆祝，提醒他们冠军尚未到手。"}, {"word": "condescend", "pos": "v.", "ipa": "/ˌkɑndəˈsend/", "def_en": "To behave as though one is superior; to patronize.", "def_cn": "摆出优越姿态对待（人）；屈尊俯就", "example_en": "Rather than explaining the concept clearly, the professor condescended to the freshmen with oversimplified analogies.", "example_cn": "教授没有把概念讲清楚，反而摆出居高临下的姿态，用过度简化的类比敷衍新生。"}, {"word": "criterion", "pos": "n.", "ipa": "/kraɪˈtɪriən/", "def_en": "A standard or principle by which something is judged.", "def_cn": "标准；准则（复数 criteria）", "example_en": "Originality is the primary criterion by which the judges evaluate entries in the science fair.", "example_cn": "原创性是评委评判科学展作品的首要标准。"}, {"word": "denouement", "pos": "n.", "ipa": "/ˌdeɪnuˈmɑ/", "def_en": "The final resolution of a plot or complicated situation; the outcome.", "def_cn": "（剧情的）结局；收束", "example_en": "Critics praised the film's unexpected denouement, in which the apparent villain is revealed as the hero.", "example_cn": "评论家称赞这部电影出人意料的结局——表面上的反派原来是英雄。"}, {"word": "dogmatic", "pos": "adj.", "ipa": "/dɔɡˈmætɪk/", "def_en": "Asserting opinions as if they were established facts; inflexibly rigid.", "def_cn": "教条的；固执己见的", "example_en": "A good scientist avoids dogmatic claims, remaining open to evidence that contradicts established theories.", "example_cn": "优秀的科学家避免教条式断言，始终对反驳既有理论的证据持开放态度。"}, {"word": "exigent", "pos": "adj.", "ipa": "/ˈeksədʒənt/", "def_en": "Urgent; demanding immediate action or attention.", "def_cn": "紧急的；迫切的", "example_en": "Faced with exigent budget shortfalls, the university froze hiring and postponed construction projects.", "example_cn": "面对紧迫的预算缺口，大学冻结招聘并推迟了建设计划。"}, {"word": "heresy", "pos": "n.", "ipa": "/ˈherəsi/", "def_en": "A belief or opinion contrary to orthodox doctrine.", "def_cn": "异端邪说", "example_en": "In the 17th century, suggesting that the Earth orbited the sun was treated as dangerous heresy.", "example_cn": "17世纪，提出地球绕太阳运转被视为危险的异端邪说。"}, {"word": "jejune", "pos": "adj.", "ipa": "/dʒəˈdʒun/", "def_en": "Naive, simplistic, and superficial; dull and uninteresting.", "def_cn": "幼稚肤浅的；乏味的", "example_en": "The reviewer dismissed the memoir as jejune, arguing that it offered gossip rather than genuine insight.", "example_cn": "评论家认为这本回忆录肤浅乏味，只提供八卦而非真知灼见。"}, {"word": "overbearing", "pos": "adj.", "ipa": "/ˌoʊvərˈberɪŋ/", "def_en": "Domineering; arrogantly bossy and controlling.", "def_cn": "专横的；盛气凌人的", "example_en": "Employees described the manager as overbearing, saying he dismissed suggestions without discussion.", "example_cn": "员工形容这位经理专横跋扈，不经讨论就驳回建议。"}, {"word": "quixotic", "pos": "adj.", "ipa": "/kwɪkˈsɑtɪk/", "def_en": "Extremely idealistic and unrealistic; impractical.", "def_cn": "不切实际的（堂吉诃德式的空想）", "example_en": "Building a colony on Mars within a decade is a quixotic ambition, given current technological limits.", "example_cn": "鉴于当前技术水平，十年内在火星建立殖民地是个不切实际的幻想。"}, {"word": "scathing", "pos": "adj.", "ipa": "/ˈskeɪðɪŋ/", "def_en": "Severely and bitingly critical.", "def_cn": "严厉批评的；尖刻的", "example_en": "The report issued a scathing critique of the city's slow response to the housing crisis.", "example_cn": "报告对该市应对住房危机的迟缓反应提出了严厉批评。"}, {"word": "stolid", "pos": "adj.", "ipa": "/ˈstɑlɪd/", "def_en": "Calm and dependable, showing little emotion or excitement.", "def_cn": "沉着的；无动于衷的", "example_en": "The stolid security guard showed no reaction even as the crowd grew restless and loud.", "example_cn": "即使人群越来越骚动喧闹，那位沉着的保安也毫无反应。"}, {"word": "tendentious", "pos": "adj.", "ipa": "/tenˈdenʃəs/", "def_en": "Expressing a strong, biased point of view rather than being neutral.", "def_cn": "有偏见倾向的；宣传性的", "example_en": "Historians warned that the documentary was tendentious, presenting only evidence that supported its thesis.", "example_cn": "历史学家警告说这部纪录片带有倾向性，只呈现支持其论点的证据。"}, {"word": "valor", "pos": "n.", "ipa": "/ˈvælər/", "def_en": "Courage in battle; bravery, especially in war.", "def_cn": "英勇（尤指战斗中的勇气）", "example_en": "The medal was awarded for valor, honoring soldiers who risked their lives to rescue civilians.", "example_cn": "这枚奖章授予英勇者，表彰那些冒生命危险营救平民的士兵。"}], "practice": [{"qid": "d14-q1", "stem": "When the popular governor ___ the controversial policy he had once championed, political analysts interpreted the reversal as a calculated attempt to appeal to moderate voters.", "passage": "", "options": ["embellished", "abjured", "endorsed", "scrutinized"], "answer": "B", "explanation_en": "The sentence describes a reversal of support, so the blank needs a word meaning 'formally rejected.' 'Abjured' fits perfectly. 'Endorsed' means the opposite, while 'embellished' (made more attractive) and 'scrutinized' (examined closely) do not describe rejecting a policy.", "explanation_cn": "句子描述的是立场反转，空格需要“正式抛弃”之意，abjured 最贴切。endorsed 是反义；embellished（美化）、scrutinized（细查）都不表示抛弃政策。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d14-q2", "stem": "Unlike her ___ predecessor, who dismissed any challenge to his theories, the new department chair encourages open debate among faculty members.", "passage": "", "options": ["affable", "stolid", "dogmatic", "candid"], "answer": "C", "explanation_en": "The clause 'who dismissed any challenge to his theories' describes someone rigid and inflexible — 'dogmatic.' 'Affable' (friendly), 'stolid' (calm), and 'candid' (frank) are all positive traits that do not contrast with the new chair's openness.", "explanation_cn": "定语从句“不容任何人挑战其理论”说明前任固执教条，dogmatic 最合适。affable（和蔼）、stolid（沉着）、candid（坦率）都是褒义，与“鼓励公开辩论”不构成对比。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d14-q3", "stem": "The investigative report was ___ in its assessment of the agency, documenting years of mismanagement and calling for the director's immediate resignation.", "passage": "", "options": ["scathing", "anodyne", "cryptic", "congenial"], "answer": "A", "explanation_en": "'Documenting years of mismanagement and calling for resignation' signals harsh criticism — 'scathing.' 'Anodyne' and 'congenial' suggest mildness, the opposite tone, while 'cryptic' (mysterious) does not describe criticism.", "explanation_cn": "“记录多年管理不善并要求局长辞职”表明措辞严厉，scathing 正确。anodyne（不得罪人的）、congenial（宜人的）语气相反；cryptic（难懂的）与批评无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d14-q4", "stem": "Marine biologists once assumed that deep-sea vents were barren deserts. The discovery of thriving ecosystems around these vents—sustained entirely by chemical energy rather than sunlight—forced researchers to reconsider the very requirements for life. Which choice best describes the function of the second sentence in the text as a whole?", "passage": "", "options": ["It explains the methods researchers used to study deep-sea vents.", "It argues that sunlight is unnecessary for all ecosystems.", "It compares deep-sea vents to desert environments.", "It presents a finding that challenges an assumption stated in the first sentence."], "answer": "D", "explanation_en": "The second sentence introduces a discovery that contradicts the assumption in sentence one. A is wrong because no methods are mentioned, B overstates the claim with 'all ecosystems,' and C misreads the comparison.", "explanation_cn": "第二句提出了一个与第一句假设相矛盾的发现。A 错（没提研究方法）；B 过度推断（“所有生态系统”）；C 误读了比较。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d14-q5", "stem": "In the 1920s, the Harlem Renaissance produced an outpouring of literature, music, and visual art. While often celebrated as a spontaneous cultural flowering, recent scholarship emphasizes the decades of community organizing, patronage networks, and small presses that made the movement possible. Based on the text, the author would most likely agree that the Harlem Renaissance ___", "passage": "", "options": ["had little lasting influence on American culture.", "was less spontaneous than it is often portrayed.", "was primarily driven by wealthy patrons.", "declined because of a lack of community support."], "answer": "B", "explanation_en": "The text contrasts the 'spontaneous flowering' reputation with the groundwork that made it possible, implying it was less spontaneous than portrayed. C is too narrow since patronage was only one factor among several, A contradicts the celebratory framing, and D contradicts the mention of 'decades of community organizing.'", "explanation_cn": "文本把“自发繁荣”的印象与背后的长期铺垫对比，说明它没那么自发。C 以偏概全（资助只是因素之一）；A 与“备受赞誉”的基调矛盾；D 与“数十年社区组织工作”矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d14-q6", "stem": "The new policy, along with a detailed appendix of examples, ___ intended to standardize the review process across departments.", "passage": "", "options": ["are", "were", "is", "have been"], "answer": "C", "explanation_en": "The subject is the singular 'policy'; the phrase 'along with a detailed appendix' is parenthetical and does not change the number. So the singular verb 'is' is correct.", "explanation_cn": "主语是单数 policy，“along with...”是插入语，不影响主谓一致，故用 is。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d14-q7", "stem": "The archaeologists catalogued pottery shards, bronze tools, and ___ before publishing their findings.", "passage": "", "options": ["ancient manuscript fragments were catalogued", "they catalogued ancient manuscript fragments", "cataloguing ancient manuscript fragments", "fragments of ancient manuscripts"], "answer": "D", "explanation_en": "The list needs parallel noun phrases: 'pottery shards, bronze tools, and fragments of ancient manuscripts.' The other choices break parallelism with clauses or verb forms.", "explanation_cn": "列表需要平行结构：名词短语对名词短语。其他选项用了从句或动名词形式，破坏平行。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d14-q8", "stem": "Critics called the mayor's plan to eliminate traffic congestion within a year ___, arguing that no city had achieved such a transformation without decades of investment.", "passage": "", "options": ["quixotic", "prudent", "feasible", "meticulous"], "answer": "A", "explanation_en": "The critics argue the plan is unrealistic given that 'no city had achieved such a transformation' — 'quixotic' (unrealistically idealistic). 'Prudent,' 'feasible,' and 'meticulous' are all positive and contradict the critics' skepticism.", "explanation_cn": "评论家认为该计划不现实（“没有城市做到过”），quixotic（不切实际的幻想）最贴切。prudent（审慎的）、feasible（可行的）、meticulous（一丝不苟的）都是褒义，与质疑态度矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d14-q9", "stem": "Coral reefs support an extraordinary diversity of marine life. ___ rising ocean temperatures have caused widespread bleaching events that threaten entire reef ecosystems.", "passage": "", "options": ["Consequently,", "For example,", "Similarly,", "However,"], "answer": "D", "explanation_en": "The second sentence contrasts the reefs' richness with a threat to them — 'However' signals contrast. 'Consequently' indicates a result, 'For example' introduces an illustration, and 'Similarly' indicates comparison; none fits the contrast.", "explanation_cn": "第二句转折——珊瑚礁丰富多样，但升温威胁着它们，However 表转折。Consequently（表结果）、For example（举例）、Similarly（类比）都不合逻辑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d14-q10", "stem": "The historian cautioned readers that the memoir was ___, noting that the author omitted every episode that might cast his decisions in a negative light.", "passage": "", "options": ["impartial", "lucid", "tendentious", "candid"], "answer": "C", "explanation_en": "Omitting unfavorable episodes shows bias — 'tendentious.' 'Impartial,' 'candid,' and 'lucid' are positive qualities contradicted by the selective omissions.", "explanation_cn": "删去所有不利情节说明有偏见，tendentious 正确。impartial（公正的）、candid（坦率的）、lucid（清晰的）都是褒义，与“选择性删减”矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-10"}, {"day": 15, "words": [{"word": "acolyte", "pos": "n.", "ipa": "/ˈækəˌlaɪt/", "def_en": "A devoted follower or assistant of an important person.", "def_cn": "追随者；信徒；助手", "example_en": "The renowned physicist was surrounded by acolytes who repeated his theories without questioning them.", "example_cn": "这位著名物理学家身边围满了追随者，他们不加质疑地重复他的理论。"}, {"word": "amalgamate", "pos": "v.", "ipa": "/əˈmælɡəˌmeɪt/", "def_en": "To combine into a unified whole; to merge.", "def_cn": "合并；融合", "example_en": "The merger will amalgamate two rival firms into a single corporation controlling a third of the market.", "example_cn": "这次合并将把两家竞争公司合为一家占据三分之一市场的企业。"}, {"word": "anodyne", "pos": "adj.", "ipa": "/ˈænəˌdaɪn/", "def_en": "Not likely to offend anyone; blandly inoffensive.", "def_cn": "不得罪人的；温和无害的", "example_en": "The spokesperson's anodyne statement avoided controversy but revealed nothing about the company's plans.", "example_cn": "发言人那番不得罪人的声明避免了争议，但对公司计划只字未提。"}, {"word": "apprise", "pos": "v.", "ipa": "/əˈpraɪz/", "def_en": "To inform or notify someone of something.", "def_cn": "告知；通知", "example_en": "The ambassador was apprised of the negotiations before the press conference began.", "example_cn": "在新闻发布会开始前，大使已获悉谈判情况。"}, {"word": "balk", "pos": "v.", "ipa": "/bɔk/", "def_en": "To hesitate and refuse to go on; to stop short.", "def_cn": "犹豫不前；畏缩拒绝", "example_en": "Many homeowners balk at the cost of solar panels, despite the long-term savings they promise.", "example_cn": "尽管太阳能板承诺长期省钱，许多房主仍对其成本望而却步。"}, {"word": "candor", "pos": "n.", "ipa": "/ˈkændər/", "def_en": "Frankness and openness in speech; honesty.", "def_cn": "坦率；直言不讳", "example_en": "The candidate's candor about her past mistakes impressed voters more than polished slogans.", "example_cn": "这位候选人对自己过去错误的坦率，比华丽的口号更打动选民。"}, {"word": "churlish", "pos": "adj.", "ipa": "/ˈtʃɜrlɪʃ/", "def_en": "Rude, surly, and ill-mannered.", "def_cn": "粗鲁的；无礼的", "example_en": "It would be churlish to refuse the invitation after the hosts went to such trouble.", "example_cn": "主人如此费心，拒绝邀请就太失礼了。"}, {"word": "congenial", "pos": "adj.", "ipa": "/kənˈdʒinjəl/", "def_en": "Pleasant, agreeable, and well suited to one's nature.", "def_cn": "宜人的；性情相投的", "example_en": "The congenial atmosphere of the small seminar encouraged even shy students to participate.", "example_cn": "小型研讨会宜人的氛围鼓励了连害羞的学生也参与进来。"}, {"word": "cryptic", "pos": "adj.", "ipa": "/ˈkrɪptɪk/", "def_en": "Mysterious and difficult to understand.", "def_cn": "神秘难懂的", "example_en": "The archaeologist spent years deciphering the cryptic symbols carved into the temple walls.", "example_cn": "这位考古学家花了数年时间破译刻在神庙墙上的神秘符号。"}, {"word": "depravity", "pos": "n.", "ipa": "/dɪˈprævəti/", "def_en": "Moral corruption; wickedness.", "def_cn": "堕落；道德败坏", "example_en": "The novel explores the depravity of a regime that rewards cruelty and punishes compassion.", "example_cn": "这部小说探讨了一个奖恶罚善的政权的堕落。"}, {"word": "dulcet", "pos": "adj.", "ipa": "/ˈdʌlsɪt/", "def_en": "Sweet and soothing to hear.", "def_cn": "（声音）甜美的；悦耳的", "example_en": "The choir's dulcet harmonies filled the cathedral, silencing the restless audience.", "example_cn": "合唱团甜美的和声充满大教堂，让骚动不安的观众安静下来。"}, {"word": "foment", "pos": "v.", "ipa": "/foʊˈment/", "def_en": "To instigate or stir up trouble or rebellion.", "def_cn": "煽动；挑起", "example_en": "Investigators accused the group of using social media to foment unrest in the capital.", "example_cn": "调查人员指控该组织利用社交媒体煽动首都的动乱。"}, {"word": "hibernate", "pos": "v.", "ipa": "/ˈhaɪbərˌneɪt/", "def_en": "To spend the winter in a dormant, sleeplike state.", "def_cn": "冬眠", "example_en": "During winter, the bears hibernate in dens, surviving on stored body fat for months.", "example_cn": "冬天，熊在洞穴中冬眠，靠储存的体脂存活数月。"}, {"word": "levity", "pos": "n.", "ipa": "/ˈlevəti/", "def_en": "Lightness of manner; lack of appropriate seriousness.", "def_cn": "轻率；不严肃", "example_en": "The principal's speech struck a rare note of levity, drawing laughter from the graduating class.", "example_cn": "校长的演讲罕见地带了一丝轻松，逗笑了毕业班学生。"}, {"word": "overt", "pos": "adj.", "ipa": "/oʊˈvɜrt/", "def_en": "Done openly and plainly; not hidden or secret.", "def_cn": "公开的；明显的", "example_en": "The policy marks an overt shift toward renewable energy, with subsidies announced publicly.", "example_cn": "这项政策标志着向可再生能源的公开转向，补贴已公开发布。"}, {"word": "raze", "pos": "v.", "ipa": "/reɪz/", "def_en": "To completely destroy; to demolish to the ground.", "def_cn": "彻底摧毁；夷为平地", "example_en": "The historic theater was razed to make room for a parking garage, outraging preservationists.", "example_cn": "这座历史剧院被夷为平地以建停车场，激怒了文物保护人士。"}, {"word": "scrupulous", "pos": "adj.", "ipa": "/ˈskrupjələs/", "def_en": "Diligent, thorough, and attentive to detail; principled.", "def_cn": "一丝不苟的；正直的", "example_en": "A scrupulous researcher, she documented every measurement and double-checked each calculation.", "example_cn": "作为一丝不苟的研究者，她记录每次测量并复核每个计算。"}, {"word": "subside", "pos": "v.", "ipa": "/səbˈsaɪd/", "def_en": "To become less intense; to abate or die down.", "def_cn": "平息；减弱", "example_en": "After the storm subsided, residents returned to assess the damage to their homes.", "example_cn": "暴风雨平息后，居民回来查看房屋受损情况。"}, {"word": "truce", "pos": "n.", "ipa": "/trus/", "def_en": "A temporary stop in fighting; a ceasefire.", "def_cn": "休战；停战", "example_en": "The two nations declared a truce, halting hostilities while diplomats negotiated a settlement.", "example_cn": "两国宣布休战，在外交官谈判解决方案期间停止敌对行动。"}, {"word": "vibrant", "pos": "adj.", "ipa": "/ˈvaɪbrənt/", "def_en": "Full of energy and enthusiasm; vivid and striking.", "def_cn": "充满活力的；鲜艳的", "example_en": "The city's vibrant arts scene attracts musicians and painters from around the world.", "example_cn": "这座城市充满活力的艺术氛围吸引了世界各地的音乐家和画家。"}], "practice": [{"qid": "d15-q1", "stem": "The report accused extremist groups of using inflammatory videos to ___ public anger ahead of the election.", "passage": "", "options": ["assuage", "foment", "scrutinize", "subside"], "answer": "B", "explanation_en": "'Inflammatory videos' used to stir 'public anger' calls for 'foment' (instigate). 'Assuage' and 'subside' suggest calming — the opposite — while 'scrutinize' (examine closely) does not fit the context.", "explanation_cn": "“煽动性视频”激起“公众愤怒”，foment（煽动）最贴切。assuage（缓解）、subside（平息）是反义；scrutinize（细查）不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d15-q2", "stem": "Known for her ___ attention to detail, the auditor uncovered discrepancies that three previous reviews had overlooked.", "passage": "", "options": ["cursory", "jejune", "haphazard", "scrupulous"], "answer": "D", "explanation_en": "Uncovering what others missed requires thorough, careful work — 'scrupulous.' 'Cursory' and 'haphazard' mean careless, the opposite, and 'jejune' (superficial) does not describe attention to detail.", "explanation_cn": "发现别人遗漏的问题需要一丝不苟，scrupulous 正确。cursory（草率的）、haphazard（随意的）是反义；jejune（肤浅的）与“注重细节”无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d15-q3", "stem": "Voters praised the candidate's ___, saying they preferred honest admissions of uncertainty to rehearsed talking points.", "passage": "", "options": ["candor", "levity", "ambiguity", "reticence"], "answer": "A", "explanation_en": "'Honest admissions' points directly to 'candor' (frankness). 'Reticence' (reluctance to speak) and 'ambiguity' (vagueness) are opposites, while 'levity' (lightness of manner) does not match honest admissions.", "explanation_cn": "“诚实地承认不确定”直指 candor（坦率）。reticence（寡言）、ambiguity（含糊）是反义；levity（轻率）不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d15-q4", "stem": "Urban beekeeping has surged in popularity over the past decade. Proponents argue that city hives help pollinate urban gardens and raise awareness of pollinator decline. Skeptics counter that crowded rooftop apiaries can spread disease to wild bee populations and that hobbyists often lack the expertise to manage colonies responsibly. Which choice best states the main idea of the text?", "passage": "", "options": ["Urban beekeeping should be banned to protect wild bees.", "Hobbyist beekeepers are more skilled than professionals.", "Urban beekeeping is debated, with arguments both for its benefits and against its risks.", "Pollinator decline is caused primarily by urban beekeeping."], "answer": "C", "explanation_en": "The text presents both proponents' and skeptics' views without taking a side — C captures this balanced structure. A takes a side the text never takes, B contradicts the text, and D misstates causation.", "explanation_cn": "文本呈现了支持和质疑两方观点而不站队，C 概括了这种平衡结构。A 站了文本没站的队；B 与文本矛盾；D 曲解了因果关系。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d15-q5", "stem": "Honeybees communicate the location of food sources through the 'waggle dance,' a figure-eight movement whose angle relative to the sun indicates direction and whose duration signals distance. Researchers have shown that experienced foragers adjust their dances based on the profitability of the source, dancing more vigorously for richer finds. According to the text, what does the duration of the waggle dance indicate?", "passage": "", "options": ["The direction of the food source.", "The distance to the food source.", "The profitability of the food source.", "The experience level of the dancing bee."], "answer": "B", "explanation_en": "The text states that duration 'signals distance' while angle indicates direction. C confuses profitability, which affects the dance's vigor rather than its duration, and D is never mentioned.", "explanation_cn": "文本明确说持续时间“表示距离”，角度表示方向。C 混淆了（profitability 影响舞蹈的 vigor 而非时长）；D 文中未提。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d15-q6", "stem": "By the time the rescue team arrived, the hikers had already ___ shelter and signaled for help.", "passage": "", "options": ["find", "finding", "to find", "found"], "answer": "D", "explanation_en": "'Had already' requires the past participle to form the past perfect: 'had found.' 'Find' is the base form, 'finding' needs a helper verb, and 'to find' is an infinitive — none fits.", "explanation_cn": "“had already”后接过去分词构成过去完成时，had found 正确。find（原形）、finding（需助动词）、to find（不定式）都不对。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d15-q7", "stem": "___ the initial setbacks, the research team persisted, eventually publishing results that transformed the field.", "passage": "", "options": ["Because", "Instead of", "Despite", "Except"], "answer": "C", "explanation_en": "'Persisted' in the face of setbacks shows concession — 'Despite' is correct. 'Because' would illogically imply the setbacks caused the persistence, while 'Instead of' and 'Except' do not fit grammatically.", "explanation_cn": "“遭遇挫折仍坚持”表让步，Despite 正确。Because 表因果（逻辑不通）；Instead of、Except 语法不通。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d15-q8", "stem": "Although the new software promised greater efficiency, many employees ___ at learning an entirely unfamiliar system during the busiest quarter of the year.", "passage": "", "options": ["balked", "rejoiced", "excelled", "persisted"], "answer": "A", "explanation_en": "Reluctance to learn an unfamiliar system during a busy period means the employees 'balked' (hesitated and resisted). The other choices describe positive reactions that contradict that reluctance.", "explanation_cn": "在最忙的季度学全新系统，员工会犹豫抗拒，balked 正确。rejoiced（欣喜）、excelled（出色）、persisted（坚持）都是积极反应，与“不情愿”矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d15-q9", "stem": "The museum's new wing houses contemporary sculptures. The wing was designed by a renowned architect. It opened to the public last spring. Which choice most effectively combines the sentences?", "passage": "", "options": ["Designed by a renowned architect, the museum's new wing, which houses contemporary sculptures, opened to the public last spring.", "The museum's new wing houses contemporary sculptures, and a renowned architect designed the wing, and it opened to the public last spring.", "Opening to the public last spring, contemporary sculptures are housed in the museum's new wing designed by a renowned architect.", "A renowned architect designed the museum's new wing housing contemporary sculptures, opening to the public last spring."], "answer": "A", "explanation_en": "A combines all three facts concisely with correct modification. B is wordy and repetitive, while C and D contain dangling modifiers — 'opening' appears to modify 'sculptures' or the architect rather than the wing.", "explanation_cn": "A 简洁且修饰关系正确，融合了三个事实。B 啰嗦重复；C 和 D 中 opening 悬垂（似乎修饰 sculptures 或建筑师，而非展馆）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d15-q10", "stem": "The CEO's ___ remarks about 'strategic realignment' left analysts guessing whether layoffs were imminent.", "passage": "", "options": ["lucid", "candid", "explicit", "cryptic"], "answer": "D", "explanation_en": "Remarks that 'left analysts guessing' are mysterious — 'cryptic.' 'Lucid,' 'candid,' and 'explicit' all mean clear or open, the opposite of what the sentence describes.", "explanation_cn": "让分析师“猜测”的发言是神秘难懂的，cryptic 正确。lucid（清晰的）、candid（坦率的）、explicit（明确的）都是反义。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-11"}, {"day": 16, "words": [{"word": "acrid", "pos": "adj.", "ipa": "/ˈækrɪd/", "def_en": "Having an unpleasantly sharp or bitter smell or taste.", "def_cn": "辛辣刺鼻的（气味或味道令人不快的）", "example_en": "The acrid smoke from the laboratory fire forced everyone to evacuate the building immediately.", "example_cn": "实验室火灾产生的刺鼻浓烟迫使所有人立即撤离大楼。"}, {"word": "ameliorate", "pos": "v.", "ipa": "/əˈmiːliəreɪt/", "def_en": "To make something better or less severe.", "def_cn": "改善；减轻（使状况变好或不那么严重）", "example_en": "The new filtration system was installed to ameliorate the pollution in the city's water supply.", "example_cn": "新的过滤系统被安装用来改善该市供水系统的污染状况。"}, {"word": "antipathy", "pos": "n.", "ipa": "/ænˈtɪpəθi/", "def_en": "A deep-seated feeling of dislike toward someone or something.", "def_cn": "反感；厌恶（根深蒂固的讨厌）", "example_en": "Her antipathy toward crowded cities made her choose a small college in a quiet rural town.", "example_cn": "她对拥挤城市的反感使她选择了一所安静乡下小镇上的小学院。"}, {"word": "ascetic", "pos": "adj.", "ipa": "/əˈsetɪk/", "def_en": "Characterized by severe self-discipline and abstinence from pleasure.", "def_cn": "苦行的；禁欲的（严于自律、摒弃享乐的）", "example_en": "The monk lived an ascetic life in the mountains, owning nothing but a robe and a bowl.", "example_cn": "这位僧人在山中过着苦行生活，除了一件袈裟和一只钵什么也没有。"}, {"word": "bedlam", "pos": "n.", "ipa": "/ˈbedləm/", "def_en": "A scene of wild confusion and noisy disorder.", "def_cn": "混乱；喧闹的骚乱场面", "example_en": "When the stadium lights failed during the final match, the stands erupted into bedlam.", "example_cn": "当决赛期间体育场灯光熄灭时，看台上顿时一片混乱。"}, {"word": "carping", "pos": "adj.", "ipa": "/ˈkɑːrpɪŋ/", "def_en": "Constantly finding fault; complaining about small details.", "def_cn": "吹毛求疵的；爱挑小毛病的", "example_en": "The committee grew tired of the carping remarks that delayed every decision by weeks.", "example_cn": "委员会厌倦了那些吹毛求疵的言论，它们让每项决策都拖延了数周。"}, {"word": "clemency", "pos": "n.", "ipa": "/ˈklemənsi/", "def_en": "Mercy or leniency shown to an offender or enemy.", "def_cn": "宽大；仁慈（对犯错者或敌人的宽恕）", "example_en": "The governor granted clemency to the prisoner after new evidence proved his innocence.", "example_cn": "新证据证明该囚犯无罪后，州长给予了他宽赦。"}, {"word": "conscientious", "pos": "adj.", "ipa": "/ˌkɑːnʃiˈenʃəs/", "def_en": "Careful, thorough, and dedicated to doing work well.", "def_cn": "尽责的；认真细致的", "example_en": "The conscientious researcher double-checked every measurement before publishing the results.", "example_cn": "这位尽责的研究人员在发表结果前反复核对了每一项测量数据。"}, {"word": "daunt", "pos": "v.", "ipa": "/dɔːnt/", "def_en": "To make someone feel intimidated or apprehensive.", "def_cn": "使气馁；吓倒", "example_en": "The steep mountain trail did not daunt the experienced climbers in the group.", "example_cn": "陡峭的山路并没有吓倒队伍中经验丰富的登山者。"}, {"word": "desiccate", "pos": "v.", "ipa": "/ˈdesɪkeɪt/", "def_en": "To dry out completely; to remove all moisture from.", "def_cn": "使彻底干燥；脱水", "example_en": "The long drought desiccated the riverbed, leaving cracked earth where fish once swam.", "example_cn": "长期的干旱使河床彻底干涸，鱼儿曾经游弋的地方只剩下龟裂的土地。"}, {"word": "efficacious", "pos": "adj.", "ipa": "/ˌefɪˈkeɪʃəs/", "def_en": "Successful in producing a desired result; effective.", "def_cn": "有效的；见效的", "example_en": "Clinical trials showed that the new vaccine was efficacious against several variants of the virus.", "example_cn": "临床试验表明，这种新疫苗对几种病毒变体都是有效的。"}, {"word": "genial", "pos": "adj.", "ipa": "/ˈdʒiːniəl/", "def_en": "Friendly and cheerful in temperament.", "def_cn": "亲切的；和蔼可亲的", "example_en": "The genial shopkeeper remembered every regular customer's name and greeted them warmly.", "example_cn": "这位和蔼的店主记得每位老顾客的名字，总是热情地问候他们。"}, {"word": "ignoble", "pos": "adj.", "ipa": "/ɪɡˈnoʊbl/", "def_en": "Dishonorable; not worthy of respect.", "def_cn": "卑鄙的；不光彩的", "example_en": "Historians condemn the leader's ignoble decision to abandon his allies during the war.", "example_cn": "历史学家谴责这位领导人在战争期间抛弃盟友的卑鄙决定。"}, {"word": "limpid", "pos": "adj.", "ipa": "/ˈlɪmpɪd/", "def_en": "Completely clear and transparent, like pure water.", "def_cn": "清澈的；透明的", "example_en": "We could see colorful fish swimming beneath the limpid surface of the mountain lake.", "example_cn": "我们能看到五彩斑斓的鱼在清澈的山湖水面下游动。"}, {"word": "pacify", "pos": "v.", "ipa": "/ˈpæsɪfaɪ/", "def_en": "To calm anger or agitation; to bring peace to.", "def_cn": "使平静；安抚（平息愤怒或骚动）", "example_en": "The manager offered refunds to pacify the passengers whose flight had been canceled.", "example_cn": "经理提出退款以安抚那些航班被取消的乘客。"}, {"word": "redress", "pos": "v.", "ipa": "/rɪˈdres/", "def_en": "To set right; to correct an unfair situation.", "def_cn": "纠正；补救（把不公正的状况纠正过来）", "example_en": "The new law aims to redress decades of discrimination against rural workers.", "example_cn": "这项新法律旨在纠正几十年来对农村工人的歧视。"}, {"word": "sedate", "pos": "adj.", "ipa": "/sɪˈdeɪt/", "def_en": "Calm, dignified, and unhurried in manner.", "def_cn": "沉稳的；庄重的（举止冷静从容的）", "example_en": "The sedate professor spoke slowly and never raised her voice during the heated debate.", "example_cn": "这位沉稳的教授讲话缓慢，在激烈的辩论中从未提高嗓门。"}, {"word": "subversive", "pos": "adj.", "ipa": "/səbˈvɜːrsɪv/", "def_en": "Seeking to undermine or overthrow an established system.", "def_cn": "颠覆性的；意图推翻现有体制的", "example_en": "The government banned the newspaper for publishing subversive articles against the regime.", "example_cn": "政府以发表颠覆政权的文章为由查封了这家报纸。"}, {"word": "unassailable", "pos": "adj.", "ipa": "/ˌʌnəˈseɪləbl/", "def_en": "Unable to be attacked or disputed; completely secure.", "def_cn": "无懈可击的；无法攻破的", "example_en": "Her argument was unassailable because it was supported by decades of careful research.", "example_cn": "她的论点无懈可击，因为它有几十年严谨研究的支持。"}, {"word": "whet", "pos": "v.", "ipa": "/wet/", "def_en": "To sharpen or stimulate interest, appetite, or curiosity.", "def_cn": "磨利；激发（兴趣、食欲、好奇心）", "example_en": "The documentary's dramatic opening whetted our appetite for the full story behind the discovery.", "example_cn": "这部纪录片戏剧性的开头激发了我们了解发现背后完整故事的兴趣。"}], "practice": [{"qid": "d16-q1", "stem": "The architect's proposal was so ______ that the planning board approved it within an hour; the logic and evidence left no room for objection.", "passage": "", "options": ["unassailable", "acrid", "carping", "ignoble"], "answer": "A", "explanation_en": "The second clause says the logic left no room for objection, which matches unassailable, meaning impossible to dispute. Carping means finding fault, acrid describes harsh smells, and ignoble means dishonorable, none of which fit.", "explanation_cn": "后半句说其逻辑让人无可反驳，这正符合 unassailable（无懈可击的）的意思。carping 是吹毛求疵的，acrid 形容刺鼻的气味，ignoble 是卑鄙的，都不符合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d16-q2", "stem": "To reduce tension in the crowded stadium, officials lowered ticket prices, a move that ______ the angry fans but failed to address the underlying scheduling problems.", "passage": "", "options": ["desiccated", "pacified", "daunted", "whetted"], "answer": "B", "explanation_en": "The officials wanted to reduce tension and calm the fans, so pacified fits best. Daunted means intimidated, desiccated means dried out, and whetted means stimulated, all of which miss the meaning.", "explanation_cn": "官员们想平息愤怒的球迷，因此 pacified（安抚）最合适。daunted 是吓倒，desiccated 是使干燥，whetted 是激发，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d16-q3", "stem": "Although the expedition faced freezing temperatures and supply shortages, the team's leader remained calm and ______, never allowing panic to spread among the climbers.", "passage": "", "options": ["sedate", "subversive", "ascetic", "acrid"], "answer": "A", "explanation_en": "The leader is described as calm and preventing panic, which matches sedate, meaning calm and composed. Subversive means rebellious, ascetic means self-denying, and acrid describes sharp smells.", "explanation_cn": "领队被描述为冷静且不让恐慌蔓延，这正符合 sedate（沉稳的）。subversive 是颠覆性的，ascetic 是苦行的，acrid 形容刺鼻气味，都不合适。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d16-q4", "stem": "The committee's review process was neither rushed nor superficial; it was ______, with every document examined carefully before any decision was made.", "passage": "", "options": ["genial", "bedlam", "conscientious", "limpid"], "answer": "C", "explanation_en": "Carefully examining every document points to conscientious, meaning thorough and diligent. Genial means friendly, bedlam is a noun meaning chaos, and limpid means clear.", "explanation_cn": "仔细审查每一份文件体现的是 conscientious（尽责认真的）。genial 是和蔼的，bedlam 是名词（混乱），limpid 是清澈的。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d16-q5", "stem": "Maria Alvarez is an economist who argues that raising the minimum wage reduces employee turnover. According to her research, higher pay makes workers less likely to quit, which saves companies the cost of hiring and training replacements. Which finding, if true, would most directly support Alvarez's argument?", "passage": "", "options": ["Companies that raised wages saw no change in customer satisfaction scores.", "A survey found that workers who received raises reported feeling more loyal to their employers.", "Many companies already offer bonuses in addition to base salaries.", "Employee turnover is higher in industries with seasonal demand."], "answer": "B", "explanation_en": "Alvarez claims higher wages reduce turnover because workers stay longer; a survey showing raised workers feel more loyal directly supports that link. Choice A is about customers, C is background information, and D is about unrelated seasonal causes.", "explanation_cn": "Alvarez 的观点是涨薪降低离职率，因为员工更愿意留下；选项 B 显示涨薪后员工忠诚度提高，直接支持了这一逻辑。A 讲的是顾客，C 是背景信息，D 是无关的季节性原因。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d16-q6", "stem": "The scientist's initial theory was ______; later experiments only strengthened it, since none of the results contradicted her predictions.", "passage": "", "options": ["efficacious", "unassailable", "carping", "sedate"], "answer": "B", "explanation_en": "Because no experimental results contradicted the theory, it was unassailable, meaning unable to be disputed. Efficacious means effective at producing results, carping means fault-finding, and sedate means calm.", "explanation_cn": "因为没有任何实验结果反驳这个理论，它是无懈可击的，即 unassailable。efficacious 指有效的（产生效果），carping 是吹毛求疵的，sedate 是沉稳的。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d16-q7", "stem": "The novel's final chapter was written in prose so clear and simple that critics praised its ______ quality, comparing it to a still pool of water.", "passage": "", "options": ["limpid", "acrid", "bedlam", "ignoble"], "answer": "A", "explanation_en": "The comparison to a still pool of water signals clarity, so limpid, meaning perfectly clear, is correct. Acrid means harsh-smelling, bedlam means chaos, and ignoble means dishonorable.", "explanation_cn": "与平静水面的比较表明这是讲清澈，因此 limpid（清澈的）正确。acrid 是刺鼻的，bedlam 是混乱，ignoble 是卑鄙的。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d16-q8", "stem": "The city council voted to ______ the outdated zoning laws, hoping that modernizing them would attract new businesses to the downtown area.", "passage": "", "options": ["daunt", "desiccate", "ameliorate", "pacify"], "answer": "C", "explanation_en": "Modernizing laws to attract businesses means improving them, so ameliorate fits. Daunt means intimidate, desiccate means dry out, and pacify means calm anger.", "explanation_cn": "更新法规以吸引企业就是改善它们，因此 ameliorate（改善）最合适。daunt 是吓倒，desiccate 是使干燥，pacify 是安抚。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d16-q9", "stem": "Despite her deep ______ for political debates, Elena attended every town hall meeting, believing it was her duty as a citizen to stay informed.", "passage": "", "options": ["clemency", "antipathy", "bedlam", "redress"], "answer": "B", "explanation_en": "Although she dislikes political debates, she attends anyway; antipathy, meaning strong dislike, creates that contrast. Clemency means mercy, bedlam means chaos, and redress is a verb meaning to correct.", "explanation_cn": "尽管她讨厌政治辩论还是每场都去，形成转折；antipathy（反感）正好表达这种对比。clemency 是宽赦，bedlam 是混乱，redress 是动词（纠正）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d16-q10", "stem": "Text 1: Historians often praise leaders who show clemency after conflicts, arguing that mercy speeds reconciliation. Text 2: Political scientist Dana Cole counters that clemency without justice can breed resentment among victims, who may see pardons as a denial of their suffering. Based on the texts, how would Cole most likely respond to the historians' view in Text 1?", "passage": "", "options": ["By agreeing that mercy is the fastest path to reconciliation.", "By arguing that pardons can harm reconciliation when victims feel their suffering is ignored.", "By claiming that historians misunderstand the causes of most conflicts.", "By suggesting that clemency should only apply to minor offenses."], "answer": "B", "explanation_en": "Cole argues that clemency without justice can breed resentment among victims, so she would challenge the historians by saying pardons can hurt reconciliation. Choice A agrees with the historians, C goes beyond the text, and D adds a limitation Cole never mentions.", "explanation_cn": "Cole 认为没有正义的宽赦会让受害者产生怨恨，因此她会反驳历史学家的观点：赦免可能损害和解。A 是赞同历史学家，C 超出文本范围，D 增加了 Cole 从未提到的限制。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-12"}, {"day": 17, "words": [{"word": "adjunct", "pos": "n.", "ipa": "/ˈædʒʌŋkt/", "def_en": "Something added to another thing as a supplement or extra.", "def_cn": "附加物；附属品（作为补充添加的东西）", "example_en": "The evening seminar was designed as an adjunct to the main course, not a replacement for it.", "example_cn": "这场晚间研讨会是作为主课的补充而设计的，而不是替代它。"}, {"word": "amenable", "pos": "adj.", "ipa": "/əˈmiːnəbl/", "def_en": "Open to suggestion and willing to cooperate.", "def_cn": "乐于接受建议的；顺从的；愿意配合的", "example_en": "The manager was amenable to changing the schedule once the team explained their concerns.", "example_cn": "团队说明了他们的顾虑后，经理愿意配合调整日程。"}, {"word": "antithesis", "pos": "n.", "ipa": "/ænˈtɪθəsɪs/", "def_en": "The exact opposite of someone or something.", "def_cn": "对立面；完全相反的人或事物", "example_en": "The noisy, crowded festival was the antithesis of the quiet retreat he had hoped for.", "example_cn": "这个喧闹拥挤的节日与他所期待的安静休养完全相反。"}, {"word": "asperity", "pos": "n.", "ipa": "/æˈsperəti/", "def_en": "Harshness of tone or manner; sharpness of temper.", "def_cn": "严厉；粗暴（语气或态度的刻薄）", "example_en": "The teacher's asperity surprised the students, who were used to her gentle manner.", "example_cn": "老师的严厉让学生们感到惊讶，他们习惯了她温和的态度。"}, {"word": "beguile", "pos": "v.", "ipa": "/bɪˈɡaɪl/", "def_en": "To charm or enchant, sometimes in a deceptive way.", "def_cn": "迷惑；诱骗（以魅力吸引，有时带有欺骗性）", "example_en": "The advertisement beguiled thousands of shoppers with promises of luxury at low prices.", "example_cn": "这则广告以低价奢华的承诺迷惑了数千名购物者。"}, {"word": "cathartic", "pos": "adj.", "ipa": "/kəˈθɑːrtɪk/", "def_en": "Providing emotional release or relief.", "def_cn": "宣泄情感的；使情绪得到释放的", "example_en": "Writing in her journal proved cathartic for Lena after the difficult week.", "example_cn": "在艰难的一周后，写日记让莉娜的情绪得到了宣泄。"}, {"word": "coerce", "pos": "v.", "ipa": "/koʊˈɜːrs/", "def_en": "To force someone to do something by threats or pressure.", "def_cn": "胁迫；强迫（用威胁或压力迫使）", "example_en": "The rebels tried to coerce the villagers into providing food by threatening their homes.", "example_cn": "叛军试图以威胁村民家园的方式胁迫他们提供食物。"}, {"word": "convivial", "pos": "adj.", "ipa": "/kənˈvɪviəl/", "def_en": "Friendly, lively, and enjoyable, especially at social gatherings.", "def_cn": "欢乐的；热闹友好的（尤指社交聚会）", "example_en": "The convivial atmosphere at the wedding reception kept guests laughing until midnight.", "example_cn": "婚宴上欢乐热闹的气氛让宾客们欢笑到午夜。"}, {"word": "decorous", "pos": "adj.", "ipa": "/ˈdekərəs/", "def_en": "Behaving in a proper, polite, and dignified way.", "def_cn": "端庄得体的；举止合宜的", "example_en": "The decorous audience remained silent and attentive throughout the long ceremony.", "example_cn": "端庄的观众在漫长的仪式中始终保持安静专注。"}, {"word": "diffuse", "pos": "adj.", "ipa": "/dɪˈfjuːs/", "def_en": "Spread out and not concentrated; wordy and unfocused.", "def_cn": "散漫的；冗长的（不集中、缺乏重点的）", "example_en": "The professor asked the student to shorten his diffuse essay into a clear two-page argument.", "example_cn": "教授要求学生把那篇散漫冗长的论文压缩成清晰的两页论述。"}, {"word": "emaciated", "pos": "adj.", "ipa": "/ɪˈmeɪʃieɪtɪd/", "def_en": "Abnormally thin from hunger or illness.", "def_cn": "憔悴消瘦的（因饥饿或疾病异常消瘦的）", "example_en": "The rescued dog was emaciated after months without enough food.", "example_cn": "这只获救的狗在几个月吃不饱后瘦得皮包骨。"}, {"word": "grandiose", "pos": "adj.", "ipa": "/ˈɡrændioʊs/", "def_en": "Impressive but exaggerated or overly ambitious.", "def_cn": "宏大但夸张的；好大喜功的", "example_en": "The mayor's grandiose plan to build ten new stadiums was dismissed as unrealistic.", "example_cn": "市长要建十座新体育场的宏大计划被认为不切实际而遭到否决。"}, {"word": "impute", "pos": "v.", "ipa": "/ɪmˈpjuːt/", "def_en": "To attribute blame or a fault to someone.", "def_cn": "归咎于；把（过错）归于某人", "example_en": "It would be unfair to impute the team's failure entirely to the new coach.", "example_cn": "把球队的失败完全归咎于新教练是不公平的。"}, {"word": "mendacious", "pos": "adj.", "ipa": "/menˈdeɪʃəs/", "def_en": "Not telling the truth; lying or dishonest.", "def_cn": "说谎的；虚假的；不诚实的", "example_en": "The mendacious witness was caught contradicting his own earlier statements in court.", "example_cn": "这位说谎的证人在法庭上被发现自相矛盾，推翻了自己此前的证词。"}, {"word": "perfidious", "pos": "adj.", "ipa": "/pərˈfɪdiəs/", "def_en": "Betraying trust; treacherous and disloyal.", "def_cn": "背信弃义的；奸诈不忠的", "example_en": "The perfidious advisor secretly sold the kingdom's plans to its enemies.", "example_cn": "这位背信弃义的谋士暗中把王国的计划卖给了敌人。"}, {"word": "reprehensible", "pos": "adj.", "ipa": "/ˌreprɪˈhensəbl/", "def_en": "Deserving strong criticism or blame.", "def_cn": "应受谴责的；可耻的", "example_en": "Dumping chemical waste into the river was a reprehensible act that harmed the whole community.", "example_cn": "向河里倾倒化学废料是应受谴责的行为，危害了整个社区。"}, {"word": "servile", "pos": "adj.", "ipa": "/ˈsɜːrvaɪl/", "def_en": "Excessively eager to obey; showing slavish submission.", "def_cn": "奴颜婢膝的；过分顺从的", "example_en": "The manager disliked the servile attitude of employees who never dared to disagree with him.", "example_cn": "经理不喜欢那些从不敢反对他的员工的奴颜婢膝的态度。"}, {"word": "sumptuous", "pos": "adj.", "ipa": "/ˈsʌmptʃuəs/", "def_en": "Extremely expensive and luxurious in appearance.", "def_cn": "奢华的；豪华的", "example_en": "The wedding was held in a sumptuous palace decorated with gold and crystal chandeliers.", "example_cn": "婚礼在一座装饰着黄金和水晶吊灯的奢华宫殿里举行。"}, {"word": "uncouth", "pos": "adj.", "ipa": "/ʌnˈkuːθ/", "def_en": "Lacking good manners or refinement; crude.", "def_cn": "粗鲁的；没教养的", "example_en": "His uncouth jokes at the formal dinner embarrassed everyone at the table.", "example_cn": "他在正式晚宴上讲的粗俗笑话让全桌人都感到尴尬。"}, {"word": "wistful", "pos": "adj.", "ipa": "/ˈwɪstfl/", "def_en": "Feeling sad longing for something lost or unattainable.", "def_cn": "惆怅的；怀念的（对失去或不可及之物的伤感渴望）", "example_en": "She cast a wistful glance at the old house where she had spent her childhood summers.", "example_cn": "她惆怅地望了一眼那座老房子，她曾在那里度过童年的夏天。"}], "practice": [{"qid": "d17-q1", "stem": "The new policy was the ______ of fairness: instead of helping struggling students, it punished them for circumstances beyond their control.", "passage": "", "options": ["antithesis", "adjunct", "asperity", "catharsis"], "answer": "A", "explanation_en": "The policy does the exact opposite of fairness, so antithesis, meaning the direct opposite, fits. Adjunct means a supplement, asperity means harshness, and catharsis is a noun, not the adjective form needed here.", "explanation_cn": "这项政策与公平完全相反，因此 antithesis（对立面）最合适。adjunct 是附加物，asperity 是严厉，catharsis 是名词形式而这里需要的是描述关系的词。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d17-q2", "stem": "After years of strict discipline, the soldiers found the commander's sudden ______ surprising; he shouted at them for mistakes he had previously ignored.", "passage": "", "options": ["amenability", "asperity", "conviviality", "decorum"], "answer": "B", "explanation_en": "Shouting at soldiers for small mistakes shows harshness of manner, which is asperity. Amenability means willingness to cooperate, conviviality means cheerfulness, and decorum means proper behavior.", "explanation_cn": "为小错对士兵大吼体现的是态度的严厉，即 asperity。amenability 是愿意配合，conviviality 是欢乐，decorum 是得体举止。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d17-q3", "stem": "The witness gave a ______ account of the accident, inventing details that contradicted the video evidence presented in court.", "passage": "", "options": ["decorous", "sumptuous", "mendacious", "convivial"], "answer": "C", "explanation_en": "Inventing details that contradict evidence means lying, so mendacious fits. Decorous means proper, sumptuous means luxurious, and convivial means cheerful.", "explanation_cn": "编造与证据矛盾的细节就是说谎，因此 mendacious（说谎的）正确。decorous 是端庄的，sumptuous 是奢华的，convivial 是欢乐的。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d17-q4", "stem": "Rather than betraying her friend's secret, Ana remained loyal; her ______ behavior stood in sharp contrast to her brother, who shared it within hours.", "passage": "", "options": ["perfidious", "servile", "diffuse", "faithful"], "answer": "D", "explanation_en": "Ana stayed loyal and kept the secret, so faithful, the opposite of her brother's betrayal, is correct. Perfidious means treacherous, which describes the brother, not Ana; servile means submissive and diffuse means unfocused.", "explanation_cn": "Ana 忠诚守密，与她哥哥的背叛形成对比，因此 faithful（忠诚的）正确。perfidious（背信弃义的）形容的是她哥哥，servile 是奴颜婢膝的，diffuse 是散漫的。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d17-q5", "stem": "Dr. Chen's lecture was so ______ that the audience lost track of her main point; she wandered through unrelated stories without ever reaching a conclusion.", "passage": "", "options": ["diffuse", "decorous", "emaciated", "grandiose"], "answer": "A", "explanation_en": "Wandering through unrelated stories without a conclusion describes something unfocused and wordy, which is diffuse. Decorous means proper, emaciated means thin, and grandiose means exaggeratedly ambitious.", "explanation_cn": "东拉西扯、没有结论的演讲就是散漫冗长的，即 diffuse。decorous 是端庄的，emaciated 是消瘦的，grandiose 是好大喜功的。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d17-q6", "stem": "Studying the physics of sound ______ the music students' understanding of harmony, giving them a scientific foundation for what they had learned by ear.", "passage": "", "options": ["coerced", "beguiled", "enriched", "imputed"], "answer": "C", "explanation_en": "The physics study added scientific depth to their musical knowledge, so enriched, meaning added value to, fits as the logical verb. Coerced means forced, beguiled means charmed deceptively, and imputed means attributed blame.", "explanation_cn": "学习声音物理学为他们的音乐知识增加了科学深度，因此 enriched（丰富了）是逻辑上合适的动词。coerced 是胁迫，beguiled 是迷惑，imputed 是归咎。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d17-q7", "stem": "The committee members were ______ to revising the proposal once they saw the new data; none of them insisted on keeping the original version.", "passage": "", "options": ["amenable", "uncouth", "wistful", "servile"], "answer": "A", "explanation_en": "The members were willing to revise the proposal, which matches amenable, meaning open to suggestion. Uncouth means rude, wistful means longingly sad, and servile means excessively submissive.", "explanation_cn": "委员们愿意修改提案，这正符合 amenable（乐于接受建议的）。uncouth 是粗鲁的，wistful 是惆怅的，servile 是奴颜婢膝的。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d17-q8", "stem": "The charity gala was a ______ affair, with guests arriving in designer gowns and dining on dishes prepared by a famous chef.", "passage": "", "options": ["emaciated", "sumptuous", "reprehensible", "diffuse"], "answer": "B", "explanation_en": "Designer gowns and a famous chef signal luxury, so sumptuous fits. Emaciated means thin, reprehensible means blameworthy, and diffuse means unfocused.", "explanation_cn": "名牌礼服和名厨料理都表明奢华，因此 sumptuous（奢华的）正确。emaciated 是消瘦的，reprehensible 是应受谴责的，diffuse 是散漫的。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d17-q9", "stem": "In her memoir, the author describes returning to her childhood neighborhood with a ______ feeling, smiling at the familiar streets while mourning how much had changed.", "passage": "", "options": ["wistful", "convivial", "uncouth", "grandiose"], "answer": "A", "explanation_en": "Smiling while mourning change captures sad longing for the past, which is wistful. Convivial means cheerful, uncouth means rude, and grandiose means exaggeratedly ambitious.", "explanation_cn": "微笑着又为变迁而伤感，正是对过去的惆怅怀念，即 wistful。convivial 是欢乐的，uncouth 是粗鲁的，grandiose 是好大喜功的。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d17-q10", "stem": "Text 1: Some critics dismiss the mayor's new transit plan as grandiose, arguing that the city cannot afford such an ambitious project. Text 2: Transit analyst Robert Hale disagrees, noting that phased construction would spread costs over a decade and that similar projects in other cities ultimately paid for themselves through increased ridership. Based on the texts, how would Hale most likely respond to the critics in Text 1?", "passage": "", "options": ["By agreeing that the plan is too ambitious for the city's budget.", "By arguing that the plan is financially realistic when built in stages.", "By claiming that other cities' transit projects all failed financially.", "By suggesting the mayor abandon the transit plan entirely."], "answer": "B", "explanation_en": "Hale says phased construction spreads costs and similar projects paid for themselves, so he would counter the grandiose criticism by calling the plan realistic. Choice A agrees with critics, C contradicts his point about other cities, and D opposes his supportive stance.", "explanation_cn": "Hale 认为分阶段建设可以分摊成本、其他城市类似项目最终都收回了成本，因此他会反驳“好大喜功”的批评，认为计划在财务上是可行的。A 是赞同批评者，C 与他关于其他城市的观点矛盾，D 与他的支持立场相反。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-13"}, {"day": 18, "words": [{"def_cn": "掺假；掺杂劣质成分使其品质下降", "def_en": "To make something impure or of lower quality by adding an inferior substance.", "example_cn": "监管部门在发现该供应商在食用油中掺入廉价的未获批添加剂后对其处以罚款。", "example_en": "Regulators fined the supplier after discovering that it had adulterated the cooking oil with cheaper, unapproved additives.", "ipa": "/əˈdʌltəreɪt/", "pos": "v.", "word": "adulterate"}, {"def_cn": "友好的；和睦的（尤指分歧的解决）", "def_en": "Having a spirit of friendliness, especially in the settlement of a disagreement.", "example_cn": "经过数月的谈判，两家公司达成了一项令双方律师团队都满意的友好协议。", "example_en": "After months of negotiation, the two companies reached an amicable agreement that satisfied both legal teams.", "ipa": "/ˈæmɪkəbəl/", "pos": "adj.", "word": "amicable"}, {"def_cn": "顶点；最高点；巅峰", "def_en": "The highest point or culminating stage of something.", "example_cn": "许多历史学家把19世纪中期视为英国工业实力的巅峰，之后出现了经济对手。", "example_en": "Many historians regard the mid-1800s as the apex of British industrial power before economic rivals emerged.", "ipa": "/ˈeɪpeks/", "pos": "n.", "word": "apex"}, {"def_cn": "勤勉的；一丝不苟的", "def_en": "Showing great care, persistence, and attention to detail in one's work.", "example_cn": "这位勤勉的研究者把每条引文都核对了两遍，这一习惯让她的论文格外可靠。", "example_en": "The assiduous researcher checked every citation twice, a habit that made her papers exceptionally reliable.", "ipa": "/əˈsɪdʒuəs/", "pos": "adj.", "word": "assiduous"}, {"def_cn": "掩盖；与……不符（给人错误印象）", "def_en": "To give a false impression of something; to contradict its true nature.", "example_cn": "那封欢快的信掩盖了作者的悲伤，遮住了她不愿公开谈论的哀痛。", "example_en": "The cheerful letter belied the author's grief, concealing the sorrow she refused to discuss publicly.", "ipa": "/bɪˈlaɪ/", "pos": "v.", "word": "belie"}, {"def_cn": "随意的；满不在乎的（对重要事情缺乏应有的重视）", "def_en": "Showing a lack of proper concern; dismissive or casual about important matters.", "example_cn": "委员会批评了这位官员对安全规章满不在乎的态度，这些规章关系到工人的生命。", "example_en": "The committee criticized the official's cavalier attitude toward safety regulations that had cost workers' lives.", "ipa": "/ˌkævəˈlɪr/", "pos": "adj.", "word": "cavalier"}, {"def_cn": "同谋的；串通作弊的", "def_en": "Involved with others in wrongdoing, even if not the main actor.", "example_cn": "调查人员得出结论，几位高管串通参与了欺诈，因为他们批准了伪造的报告。", "example_en": "Investigators concluded that several executives were complicit in the fraud, having approved the falsified reports.", "ipa": "/kəmˈplɪsɪt/", "pos": "adj.", "word": "complicit"}, {"def_cn": "面容；表情", "def_en": "A person's face, especially as an expression of their mood or feelings.", "example_cn": "尽管收到了坏消息，船长的面容依然镇定，让紧张的乘客们安下心来。", "example_en": "Despite the bad news, the captain's countenance remained calm, reassuring the nervous passengers.", "ipa": "/ˈkaʊntənəns/", "pos": "n.", "word": "countenance"}, {"def_cn": "公开谴责；强烈反对", "def_en": "To publicly denounce or express strong disapproval of something.", "example_cn": "社论公开谴责这项政策目光短浅，认为它为了短期收益牺牲了长期稳定。", "example_en": "Editorials decry the policy as shortsighted, arguing that it sacrifices long-term stability for quick gains.", "ipa": "/dɪˈkraɪ/", "pos": "v.", "word": "decry"}, {"def_cn": "两难困境；进退维谷的选择", "def_en": "A difficult choice between two options, each with undesirable consequences.", "example_cn": "市长面临两难困境：削减公共服务会激怒居民，但提高税收同样会激怒他们。", "example_en": "The mayor faced a dilemma: cutting services would anger residents, but raising taxes would anger them too.", "ipa": "/dɪˈlemə/", "pos": "n.", "word": "dilemma"}, {"def_cn": "卓越的；著名的（在某一领域受尊敬）", "def_en": "Famous and respected within a particular field or profession.", "example_cn": "这位卓越的生物学家获奖，因为她几十年的研究改变了我们对遗传学的理解。", "example_en": "The eminent biologist received the award after decades of research that transformed our understanding of genetics.", "ipa": "/ˈemɪnənt/", "pos": "adj.", "word": "eminent"}, {"def_cn": "太平盛世的；美好安宁的", "def_en": "Denoting a period of time that is peaceful, happy, and golden.", "example_cn": "诗人回忆起童年那些太平美好的夏天，那时白昼很长，烦恼仿佛很远。", "example_en": "The poet recalled the halcyon summers of his childhood, when days stretched long and worries felt distant.", "ipa": "/ˈhælsiən/", "pos": "adj.", "word": "halcyon"}, {"def_cn": "孤立的；闭塞狭隘的", "def_en": "Interested only in one's own group and unaware of outside ideas; narrowly closed off.", "example_cn": "批评者说这个董事会很闭塞狭隘，认为其成员忽视了教育改革的国际趋势。", "example_en": "Critics described the board as insular, arguing that its members ignored international trends in education reform.", "ipa": "/ˈɪnsələr/", "pos": "adj.", "word": "insular"}, {"def_cn": "令人厌恶的；可恨的", "def_en": "Extremely unpleasant and deserving of hatred; repulsive.", "example_cn": "这部小说中的反派依然是文学史上最令人厌恶的形象之一，他以他人的痛苦为乐。", "example_en": "The novel's villain remains one of literature's most odious figures, delighting in the suffering of others.", "ipa": "/ˈoʊdiəs/", "pos": "adj.", "word": "odious"}, {"def_cn": "敷衍的；走过场的", "def_en": "Done with minimum effort or reflection; merely going through the motions.", "example_cn": "老师注意到这名学生敷衍的回答，表明他在这项作业上花的时间很少。", "example_en": "The teacher noticed that the student's perfunctory answers suggested he had spent little time on the assignment.", "ipa": "/pərˈfʌŋktəri/", "pos": "adj.", "word": "perfunctory"}, {"def_cn": "责备；轻微训斥", "def_en": "To scold or correct someone gently for a fault; to rebuke mildly.", "example_cn": "主管责备了早退的实习生，提醒他可靠性是工作的一部分。", "example_en": "The supervisor reproved the intern for leaving early, reminding him that reliability was part of the job.", "ipa": "/rɪˈpruːv/", "pos": "v.", "word": "reprove"}, {"def_cn": "幼稚自负的；半生不熟的", "def_en": "Conceited and overconfident while showing immaturity or lack of judgment.", "example_cn": "评论家把这个提案斥为幼稚自负，指出它把巧妙的措辞误当成了真正的理解。", "example_en": "The critic dismissed the proposal as sophomoric, noting that it confused clever wording
