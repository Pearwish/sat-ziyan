n": "令学生懊恼的是，老师把他马虎的作文当众朗读，作为反面教材。"}, {"word": "diatribe", "pos": "n.", "ipa": "/ˈdaɪətraɪb/", "def_en": "A forceful, bitter verbal attack against someone or something.", "def_cn": "猛烈的抨击", "example_en": "The editorial was less a review than a diatribe, attacking the novelist's character rather than evaluating the book.", "example_cn": "这篇社论与其说是评论，不如说是一篇猛烈的抨击，攻击的是小说家的人品而非评价作品。"}, {"word": "esoteric", "pos": "adj.", "ipa": "/ˌesəˈterɪk/", "def_en": "Intended for a small, specialized audience; difficult to understand.", "def_cn": "深奥难懂的；小众的", "example_en": "The journal publishes esoteric studies of ancient dialects that appeal to a handful of linguists worldwide.", "example_cn": "这本期刊发表关于古代方言的深奥研究，全世界只有少数语言学家感兴趣。"}, {"word": "inundate", "pos": "v.", "ipa": "/ˈɪnəndeɪt/", "def_en": "To overwhelm with a large amount of something; to flood.", "def_cn": "淹没；使应接不暇", "example_en": "After the product launch, the company was inundated with customer complaints about the confusing new interface.", "example_cn": "产品发布后，公司被客户关于新界面混乱难用的投诉淹没了。"}, {"word": "phlegmatic", "pos": "adj.", "ipa": "/fleɡˈmætɪk/", "def_en": "Calm and unemotional; not easily excited or disturbed.", "def_cn": "冷静的；不动声色的", "example_en": "The phlegmatic pilot announced the engine trouble in a steady voice, and the passengers remained remarkably calm.", "example_cn": "冷静的飞行员用平稳的声音宣布发动机故障，乘客们也出奇地镇定。"}, {"word": "pillory", "pos": "v.", "ipa": "/ˈpɪləri/", "def_en": "To attack someone publicly; to hold them up to ridicule.", "def_cn": "公开抨击；嘲弄", "example_en": "The journalist was pilloried online for the error, with thousands of comments mocking her careless reporting.", "example_cn": "这名记者因这个错误在网上遭到公开抨击，数千条评论嘲笑她马虎的报道。"}, {"word": "remonstrate", "pos": "v.", "ipa": "/rɪˈmɑːnstreɪt/", "def_en": "To protest or complain; to argue earnestly against something.", "def_cn": "抗议；劝阻", "example_en": "The workers remonstrated with management over the new schedule, arguing that the night shifts endangered their health.", "example_cn": "工人们就新排班向管理层提出抗议，认为夜班危害他们的健康。"}, {"word": "sanctimonious", "pos": "adj.", "ipa": "/ˌsæŋktɪˈmoʊniəs/", "def_en": "Pretending to be morally superior to others; hypocritically pious.", "def_cn": "假装道貌岸然的；伪善的", "example_en": "The columnist's sanctimonious lectures on honesty rang hollow once his own plagiarism was finally exposed.", "example_cn": "专栏作家关于诚信的道貌岸然的说教，在他自己的抄袭行为曝光后显得空洞虚伪。"}, {"word": "truculent", "pos": "adj.", "ipa": "/ˈtrʌkjələnt/", "def_en": "Aggressively defiant; eager to argue or fight.", "def_cn": "好斗的；凶悍的", "example_en": "The truculent debater interrupted every opponent, turning what should have been a discussion into a shouting match.", "example_cn": "好斗的辩手打断每一位对手，把本应是讨论的辩论变成了对骂。"}, {"word": "undulate", "pos": "v.", "ipa": "/ˈʌndʒəleɪt/", "def_en": "To move in waves; to rise and fall like waves.", "def_cn": "波动；起伏", "example_en": "The fields of wheat undulated in the summer breeze, creating a golden sea that stretched to the horizon.", "example_cn": "麦田在夏日的微风中起伏波动，形成一片金色海洋延伸到地平线。"}, {"word": "vainglorious", "pos": "adj.", "ipa": "/ˌveɪnˈɡlɔːriəs/", "def_en": "Excessively proud of oneself; boastful about achievements.", "def_cn": "自负的；爱炫耀的", "example_en": "The vainglorious executive filled his office with framed awards, ensuring every visitor noticed his achievements.", "example_cn": "自负的高管把办公室挂满装裱的奖状，确保每位访客都注意到他的成就。"}, {"word": "winsome", "pos": "adj.", "ipa": "/ˈwɪnsəm/", "def_en": "Attractive and charming in appearance or manner.", "def_cn": "迷人的；讨人喜欢的", "example_en": "The winsome guide charmed the tourists with her humor and her deep knowledge of the ancient city.", "example_cn": "迷人的导游以她的幽默和对古城的深厚了解赢得了游客的喜爱。"}, {"word": "droll", "pos": "adj.", "ipa": "/droʊl/", "def_en": "Amusing in an odd or understated way.", "def_cn": "滑稽的；古怪有趣的", "example_en": "The professor's droll habit of grading papers with a rubber duck on his desk delighted his students.", "example_cn": "教授批改试卷时桌上总放一只橡皮鸭的滑稽习惯让学生们忍俊不禁。"}, {"word": "enclave", "pos": "n.", "ipa": "/ˈenkleɪv/", "def_en": "A distinct area or group enclosed within a larger territory.", "def_cn": "飞地；聚居区", "example_en": "The historic neighborhood remains a cultural enclave, where the original language is still spoken in shops and schools.", "example_cn": "这个历史街区仍是一个文化飞地，商店和学校里依然使用原来的语言。"}, {"word": "excoriate", "pos": "v.", "ipa": "/ɪkˈskɔːrieɪt/", "def_en": "To criticize someone or something severely.", "def_cn": "严厉批评", "example_en": "The review excoriated the film's lazy script, calling it an insult to the audience's intelligence.", "example_cn": "这篇评论严厉批评了电影敷衍的剧本，称其侮辱观众智商。"}, {"word": "flippant", "pos": "adj.", "ipa": "/ˈflɪpənt/", "def_en": "Not showing proper seriousness; disrespectfully casual.", "def_cn": "轻率的；不严肃的", "example_en": "The lawyer warned his client that a flippant attitude during the hearing would offend the judge.", "example_cn": "律师警告他的当事人，听证会上轻率的态度会冒犯法官。"}], "practice": [{"qid": "d29-q1", "stem": "The negotiations, which began with polite handshakes, ended in ___: both sides left the room exchanging bitter accusations.", "passage": "", "options": ["acrimony", "chagrin", "enclave", "undulate"], "answer": "A", "explanation_en": "Acrimony means bitterness or ill feeling, matching the bitter accusations. Chagrin means embarrassment caused by failure, enclave means an enclosed area, and undulate means to move in waves, none of which fits the context.", "explanation_cn": "acrimony 意为敌意、尖刻，与 bitter accusations 呼应。chagrin（懊恼）、enclave（飞地）、undulate（波动）都不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d29-q2", "stem": "The mayor's ___ speech about public honesty struck many as hollow, given that he had just been fined for hiding campaign donations.", "passage": "", "options": ["winsome", "sanctimonious", "phlegmatic", "droll"], "answer": "B", "explanation_en": "Sanctimonious means pretending to be morally superior, which fits a dishonest mayor lecturing on honesty. Winsome means charming, phlegmatic means calm, and droll means oddly amusing, none of which captures the hypocrisy.", "explanation_cn": "sanctimonious 意为假装道貌岸然的，符合隐瞒捐款的市长大谈诚信的虚伪。winsome（迷人的）、phlegmatic（冷静的）、droll（滑稽的）都不表示虚伪。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d29-q3", "stem": "Coral reefs support a quarter of all marine life, yet they cover less than one percent of the ocean floor. Rising sea temperatures have caused mass bleaching events, and scientists warn that without rapid emission cuts, most reefs could vanish within decades. Which choice best describes the overall structure of the text?", "passage": "", "options": ["It presents a valuable resource, describes a threat to it, and warns of a possible outcome.", "It compares two ecosystems and argues that one is more important.", "It explains a scientific debate and takes a side in it.", "It tells the history of coral research over the past century."], "answer": "A", "explanation_en": "The text states the reefs' value, then describes the threat of bleaching, then warns that reefs could vanish. It makes no comparison between ecosystems, presents no debate, and gives no history of research.", "explanation_cn": "文章先讲珊瑚礁的价值，再讲白化威胁，最后警告可能消失。没有比较生态系统、没有科学争论、也没有研究史。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d29-q4", "stem": "A study tracked 200 students: those who reviewed vocabulary for fifteen minutes daily remembered 40% more words after a month than those who studied two hours once a week. The researcher concluded that frequent short sessions beat rare long ones. Which finding, if true, would most directly support the researcher's conclusion?", "passage": "", "options": ["Students who studied two hours weekly reported enjoying the sessions more.", "A second experiment found that daily ten-minute math drills also outperformed weekly two-hour drills.", "Some students in the daily group skipped sessions without penalty.", "The weekly group contained more advanced students than the daily group."], "answer": "B", "explanation_en": "Finding B replicates the advantage of frequent short sessions in a different subject, directly supporting the general claim. A concerns enjoyment, C weakens the daily group's discipline, and D suggests a confound that favors the weekly group.", "explanation_cn": "B 在另一学科复制了高频短时优于低频长时的结论，直接支持研究者的观点。A 讲喜好，C 说明每日组有人缺勤，D 暗示周组学生更强（反而不利结论）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d29-q5", "stem": "The collection of rare stamps ___ kept in a climate-controlled vault.", "passage": "", "options": ["are", "were", "is", "have been"], "answer": "C", "explanation_en": "The subject is collection, which is singular, so the verb must be is. Of rare stamps is a prepositional phrase and does not make the subject plural, so are, were, and have been are all wrong.", "explanation_cn": "主语是 collection（单数），谓语用 is。of rare stamps 是介词短语，不影响主语单复数，所以 are、were、have been 都错。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d29-q6", "stem": "The experiment was repeated three times with identical results. ___, the team published its findings with confidence.", "passage": "", "options": ["Nevertheless", "Therefore", "Instead", "For instance"], "answer": "B", "explanation_en": "The repeated success is the reason the team published confidently, so therefore shows the logical result. Nevertheless and instead signal contrast, and for instance introduces an example, none of which fits the cause-and-effect relationship.", "explanation_cn": "三次重复得到相同结果是自信发表的原因，用 therefore 表因果。nevertheless、instead 表转折，for instance 引出例子，都不合因果关系。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d29-q7", "stem": "The review did not merely criticize the restaurant; it ___ the chef, calling his cooking an insult to the city's food culture.", "passage": "", "options": ["admonished", "excoriated", "inundated", "remonstrated"], "answer": "B", "explanation_en": "Excoriate means to criticize severely, which matches calling the cooking an insult. Admonish means to warn or scold mildly, inundate means to overwhelm, and remonstrate means to protest, none of which fits such harsh language.", "explanation_cn": "excoriate 意为严厉批评，与 calling his cooking an insult 的严厉语气相符。admonish（告诫，语气较轻）、inundate（淹没）、remonstrate（抗议）都不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d29-q8", "stem": "The novelist is known for her vivid characters, intricate plots, and ___ dialogue.", "passage": "", "options": ["to write realistic", "writing realistic", "realistic", "realism in"], "answer": "C", "explanation_en": "The parallel list uses adjective-noun pairs, vivid characters and intricate plots, so the third item must also be an adjective plus a noun: realistic dialogue. The other choices break the parallel structure.", "explanation_cn": "并列项是形容词加名词：vivid characters、intricate plots，第三项也应是 realistic dialogue。其他选项都破坏平行结构。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d29-q9", "stem": "When the power grid failed during the 2003 blackout, hospitals switched to backup generators within seconds. Traffic lights went dark across eight states, yet crime rates did not rise. Sociologists cite this calm response as evidence that communities can remain orderly in a crisis. The detail about crime rates primarily serves to", "passage": "", "options": ["explain why the power grid failed.", "support the claim that communities stayed orderly.", "criticize the slow repair of the traffic lights.", "describe how backup generators work."], "answer": "B", "explanation_en": "Unchanged crime rates are evidence of order, supporting the sociologists' claim that communities remained orderly. The detail does not explain the failure, criticize repairs, or describe how generators work.", "explanation_cn": "犯罪率未上升是社区保持有序的证据，支持社会学家的观点。该细节没有解释停电原因、没有批评维修、也没有讲发电机原理。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d29-q10", "stem": "The scientist's discovery was accidental. [1] A spilled chemical changed the experiment's outcome. [2] She had been studying plant growth. [3] The result led to a new fertilizer. [4] To make the sequence most logical, sentence 3 should be placed", "passage": "", "options": ["where it is now.", "before sentence 1.", "between sentences 1 and 2.", "after sentence 4."], "answer": "C", "explanation_en": "Sentence 3 uses the past perfect had been studying, which describes background action completed before the spill in sentence 2, so it belongs between sentences 1 and 2. Where it is now breaks the chronology, before sentence 1 buries the topic sentence, and after sentence 4 makes no sense.", "explanation_cn": "第3句用过去完成时 had been studying，表示发生在化学品洒落之前的背景动作，应放在第1、2句之间。现在的位置打乱时间顺序，放在第1句前会埋没主题句，放在第4句后不合逻辑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-08"}, {"day": 30, "words": [{"word": "abstruse", "pos": "adj.", "ipa": "/æbˈstruːs/", "def_en": "Difficult to understand; obscure and complex.", "def_cn": "晦涩难懂的；深奥的", "example_en": "The professor's abstruse lecture on quantum mechanics left most freshmen bewildered and struggling to follow.", "example_cn": "教授那场关于量子力学的晦涩讲座让大多数新生感到困惑，难以跟上。"}, {"word": "aggrandize", "pos": "v.", "ipa": "/əˈɡrændɑɪz/", "def_en": "To increase in power, wealth, or reputation.", "def_cn": "扩大（权力、财富或声望）；使增大", "example_en": "The dictator launched the war not for national security but to aggrandize his own power and prestige.", "example_cn": "独裁者发动战争并非为了国家安全，而是为了扩大自己的权力和威望。"}, {"word": "confound", "pos": "v.", "ipa": "/kənˈfaʊnd/", "def_en": "To confuse or astonish greatly.", "def_cn": "使大惑不解；使困惑", "example_en": "Scientists were confounded when the experiment yielded results opposite to every accepted theory in the field.", "example_cn": "当实验得出了与该领域所有公认理论相反的结果时，科学家们大惑不解。"}, {"word": "contrite", "pos": "adj.", "ipa": "/kənˈtraɪt/", "def_en": "Feeling genuine remorse for wrongdoing.", "def_cn": "真诚悔悟的；痛悔的", "example_en": "With a contrite expression, the student apologized for cheating and accepted the consequences without complaint.", "example_cn": "学生带着真诚悔悟的表情为作弊道歉，并毫无怨言地接受了处分。"}, {"word": "enigma", "pos": "n.", "ipa": "/ɪˈnɪɡmə/", "def_en": "A puzzling person or thing; a mystery.", "def_cn": "令人费解的人或事物；谜", "example_en": "Despite decades of research, the sudden disappearance of the ancient civilization remains an enigma to historians.", "example_cn": "尽管研究了数十年，古代文明的突然消失对历史学家来说仍然是一个谜。"}, {"word": "irreverent", "pos": "adj.", "ipa": "/ɪˈrevərənt/", "def_en": "Showing a lack of respect for what is usually respected.", "def_cn": "不敬的；轻蔑的", "example_en": "The young comedian's irreverent jokes about sacred traditions shocked the older members of the audience.", "example_cn": "这位年轻喜剧演员拿神圣传统开的玩笑让年长的观众大为震惊。"}, {"word": "polemic", "pos": "n.", "ipa": "/pəˈlemɪk/", "def_en": "A strong written or spoken attack against an idea or person.", "def_cn": "抨击；论战文章", "example_en": "The professor's latest polemic against standardized testing has sparked heated debate among educators across the country.", "example_cn": "教授最新发表的抨击标准化考试的文章在全国教育工作者中引发了激烈辩论。"}, {"word": "redolent", "pos": "adj.", "ipa": "/ˈredələnt/", "def_en": "Strongly suggestive of something; fragrant.", "def_cn": "使人想起的；散发芳香的", "example_en": "The old bookstore was redolent of coffee and aged paper, reminding visitors of quieter times.", "example_cn": "这家旧书店弥漫着咖啡和旧纸的气息，让人想起更安静的时光。"}, {"word": "saturnine", "pos": "adj.", "ipa": "/ˈsætərnaɪn/", "def_en": "Gloomy, serious, and slow in temperament.", "def_cn": "阴郁的；忧郁的", "example_en": "The saturnine detective rarely smiled, yet his melancholy demeanor somehow made him oddly approachable to witnesses.", "example_cn": "这位阴郁的侦探很少微笑，但他忧郁的气质却莫名地让证人觉得他平易近人。"}, {"word": "stentorian", "pos": "adj.", "ipa": "/stenˈtɔːriən/", "def_en": "Extremely loud and powerful in voice.", "def_cn": "声音洪亮的", "example_en": "The coach's stentorian commands could be heard clearly across the entire stadium during every practice session.", "example_cn": "每次训练时，教练洪亮的口令声都能清晰地传遍整个体育场。"}, {"word": "turgid", "pos": "adj.", "ipa": "/ˈtɜːrdʒɪd/", "def_en": "Swollen or congested; excessively ornate in style.", "def_cn": "浮肿的；文风浮夸的", "example_en": "The novel's turgid prose buried a simple story beneath long paragraphs of needless and tiresome decoration.", "example_cn": "这部小说浮夸的文风把一个简单的故事埋在了大段冗长乏味的修饰之下。"}, {"word": "unfeigned", "pos": "adj.", "ipa": "/ʌnˈfeɪnd/", "def_en": "Genuine; not pretended.", "def_cn": "真诚的；非伪装的", "example_en": "Her unfeigned delight at seeing her old teacher showed that her gratitude was entirely sincere.", "example_cn": "见到老教师时她毫不掩饰的喜悦表明她的感激完全真诚。"}, {"word": "vendetta", "pos": "n.", "ipa": "/venˈdetə/", "def_en": "A prolonged bitter feud or rivalry.", "def_cn": "世仇；长期的争斗", "example_en": "The two families' vendetta over the disputed land lasted three generations before it was finally resolved.", "example_cn": "两个家族因有争议的土地结下的世仇持续了三代才得以化解。"}, {"word": "verdant", "pos": "adj.", "ipa": "/ˈvɜːrdənt/", "def_en": "Green with lush, growing vegetation.", "def_cn": "青翠的；郁郁葱葱的", "example_en": "After the spring rains, the valley was a verdant carpet of wildflowers and new grass.", "example_cn": "春雨过后，山谷变成了野花与新草铺成的青翠地毯。"}, {"word": "winnow", "pos": "v.", "ipa": "/ˈwɪnoʊ/", "def_en": "To separate the useful from the useless.", "def_cn": "去粗取精；筛选", "example_en": "The committee must winnow hundreds of applications to find the few truly qualified candidates worth interviewing.", "example_cn": "委员会必须从数百份申请中去粗取精，找出真正合格、值得面试的少数候选人。"}, {"word": "drudgery", "pos": "n.", "ipa": "/ˈdrʌdʒəri/", "def_en": "Hard, menial, and tedious work.", "def_cn": "苦差事；单调乏味的工作", "example_en": "Data entry was pure drudgery, so the researcher automated the process to focus on real analysis.", "example_cn": "数据录入纯粹是苦差事，于是研究员把流程自动化，以便专注于真正的分析。"}, {"word": "ennui", "pos": "n.", "ipa": "/ɑːnˈwiː/", "def_en": "Weariness and dissatisfaction from lack of interest.", "def_cn": "倦怠；厌倦", "example_en": "After a month of idle luxury on the yacht, the billionaire was overcome by profound ennui.", "example_cn": "在游艇上悠闲奢华地度过一个月后，这位亿万富翁被深深的倦怠感淹没。"}, {"word": "expedient", "pos": "adj.", "ipa": "/ɪkˈspiːdiənt/", "def_en": "Convenient and practical, though possibly improper.", "def_cn": "权宜的；图方便的", "example_en": "Critics called the policy expedient rather than just, since it solved the crisis but ignored fairness.", "example_cn": "批评者称这项政策是权宜之计而非正义之举，因为它解决了危机却忽视了公平。"}, {"word": "flout", "pos": "v.", "ipa": "/flaʊt/", "def_en": "To openly disregard or mock a rule.", "def_cn": "公然违抗；蔑视", "example_en": "The company flouted environmental regulations for years before regulators finally imposed heavy fines last spring.", "example_cn": "这家公司多年来公然违抗环保法规，直到去年春天监管部门终于开出巨额罚单。"}, {"word": "grovel", "pos": "v.", "ipa": "/ˈɡrɑːvəl/", "def_en": "To act in an overly humble, cringing way.", "def_cn": "卑躬屈膝；奴颜婢膝", "example_en": "Rather than grovel before the committee, the journalist defended her sources with quiet dignity and courage.", "example_cn": "这位记者没有在委员会面前卑躬屈膝，而是沉着勇敢地捍卫了自己的消息来源。"}], "practice": [{"qid": "d30-q1", "stem": "The critic described the philosopher's latest book as ______, noting that its dense arguments and specialized vocabulary made it nearly impossible for general readers to understand.", "passage": "", "options": ["lucid", "abstruse", "concise", "animated"], "answer": "B", "explanation_en": "The context clues dense arguments, specialized vocabulary, and nearly impossible for general readers to understand point to a word meaning difficult to comprehend. Abstruse means exactly that. Lucid and concise are near opposites, and animated describes liveliness rather than difficulty.", "explanation_cn": "根据“dense arguments（论证晦涩）”“specialized vocabulary（专业词汇）”“普通读者几乎无法理解”这些线索，空格处需要一个表示“难以理解”的词。abstruse 正是“晦涩难懂的”意思。lucid（清晰的）和 concise（简洁的）意思几乎相反，animated（生动的）表示活泼，与难度无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d30-q2", "stem": "The admissions committee plans to ______ hundreds of applications, selecting only the most qualified candidates for interviews.", "passage": "", "options": ["winnowed", "winnow", "winnowing", "winnows"], "answer": "B", "explanation_en": "After the infinitive marker to, the base form of the verb is required. Winnow is the base form meaning to separate the useful from the rest, which fits the context of selecting candidates. The other choices are the wrong verb forms for this position.", "explanation_cn": "to 后面要接动词原形，所以选 winnow（去粗取精、筛选），语义上也符合“从众多申请中筛选候选人”的语境。其他选项的动词形式都不符合 to 后的语法要求。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d30-q3", "stem": "Unlike his predecessor, who governed through intimidation, the new mayor vowed to end the bitter political ______ that had divided the city for decades.", "passage": "", "options": ["vendetta", "alliance", "celebration", "consensus"], "answer": "A", "explanation_en": "The phrase bitter political and divided the city for decades describes a prolonged feud. Vendetta means a long-lasting bitter rivalry, which fits perfectly. Alliance and consensus describe unity, while celebration is irrelevant to the context.", "explanation_cn": "bitter political（激烈的政治）加上 divided the city for decades（让城市分裂数十年），描述的是一场长期的争斗。vendetta 意为“长期不和、世仇”，完全吻合。alliance（联盟）和 consensus（共识）表示团结，celebration（庆祝）与语境无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d30-q4", "stem": "The following text is from a 2024 review of a poetry collection. The reviewer's tone is sharply critical: she calls the book a polemic against modern life itself, attacking not only its themes but the very idea that poetry should comfort its readers. Which choice best describes the main purpose of the text?", "passage": "", "options": ["To praise the collection for challenging readers", "To summarize the plot of the poems", "To attack the collection and its underlying assumptions", "To compare the collection with earlier works"], "answer": "C", "explanation_en": "The reviewer is sharply critical and calls the book a polemic, which is a strong verbal attack. The text attacks both the themes and the assumption that poetry should comfort readers. Choice C captures this attacking purpose, while the others describe praise, summary, or comparison that the text does not do.", "explanation_cn": "评论者语气尖锐，把这本书称为 polemic（抨击之作），即强烈的言辞攻击。文本既攻击了主题，也攻击了“诗歌应该安慰读者”这一前提。C 选项准确概括了这种抨击的目的，其他选项所说的赞美、情节概括或作品比较在文中都不存在。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d30-q5", "stem": "A 2023 workplace study surveyed 2,000 office employees. Those who spent more than half their day on repetitive data entry reported the lowest job satisfaction, while those whose employers automated such drudgery reported satisfaction levels 40 percent higher. Which choice best states the main idea of the text?", "passage": "", "options": ["Automation always increases company profits", "Employees who were freed from tedious drudgery reported much higher job satisfaction", "Data entry is the only cause of low morale", "Most employees prefer repetitive tasks"], "answer": "B", "explanation_en": "The study compares two groups: workers stuck doing repetitive data entry had the lowest satisfaction, while those freed from such drudgery by automation were 40 percent more satisfied. Choice B restates this finding accurately. The other choices overstate or contradict the data.", "explanation_cn": "研究对比了两组人：整天做重复数据录入的员工满意度最低，而雇主用自动化消除了这种苦差事（drudgery）的员工满意度高出 40%。B 选项准确复述了这一发现，其他选项或夸大、或与数据矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d30-q6", "stem": "The lead scientist, along with her team of assistants, ______ confounded by the unexpected experimental results.", "passage": "", "options": ["was", "were", "are", "have been"], "answer": "A", "explanation_en": "The subject of the sentence is the singular noun scientist; the phrase along with her team of assistants is parenthetical and does not change the number of the subject. Therefore the singular past-tense verb was is correct. Were, are, and have been are plural or wrong-tense forms.", "explanation_cn": "句子主语是单数的 scientist，along with her team of assistants 只是插入语，不改变主语的单复数。因此要用单数过去式 was。were、are、have been 都是复数或时态错误的形式。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d30-q7", "stem": "The defendant's ______ apology convinced the judge that his remorse was genuine, and his sentence was reduced accordingly.", "passage": "", "options": ["contrite", "irreverent", "stentorian", "turgid"], "answer": "A", "explanation_en": "The clues remorse was genuine and sentence was reduced show the apology expressed sincere regret. Contrite means feeling genuine remorse. Irreverent means disrespectful, stentorian means loud-voiced, and turgid means pompous, none of which fits a sincere apology.", "explanation_cn": "remorse was genuine（悔意是真诚的）和 sentence was reduced（刑期被减轻）表明道歉表达了真诚的悔悟。contrite 意为“真诚悔悟的”。irreverent（不敬的）、stentorian（声音洪亮的）、turgid（浮夸的）都不符合真诚道歉的语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d30-q8", "stem": "The author's prose is dense and heavily ornamented. ______, the underlying story is surprisingly simple.", "passage": "", "options": ["Moreover", "For example", "However", "Consequently"], "answer": "C", "explanation_en": "The second sentence contrasts with the first: ornate prose versus a simple story. However signals this contrast. Moreover adds information, for example introduces an illustration, and consequently shows a result, none of which fits the contrast here.", "explanation_cn": "第二句与第一句形成对比：文风华丽繁复 vs 故事本身简单。However 表示转折，符合这里的对比关系。Moreover（递进）、For example（举例）、Consequently（结果）都不符合对比的逻辑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d30-q9", "stem": "Critics dismissed the mayor's decision as purely ______, arguing that it was chosen for short-term convenience rather than principle.", "passage": "", "options": ["expedient", "unfeigned", "verdant", "saturnine"], "answer": "A", "explanation_en": "The phrase chosen for short-term convenience rather than principle matches the meaning of expedient: convenient and practical but not necessarily proper. Unfeigned means genuine, verdant means green, and saturnine means gloomy, none of which fits.", "explanation_cn": "chosen for short-term convenience rather than principle（为短期便利而非原则所选）正好对应 expedient 的含义：权宜的、图方便的。unfeigned（真诚的）、verdant（青翠的）、saturnine（阴郁的）都不符合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d30-q10", "stem": "For years the factory flouted safety regulations, ignoring repeated warnings from inspectors. When an accident finally injured twelve workers, regulators shut the plant down and imposed record fines. What can most reasonably be inferred from the text?", "passage": "", "options": ["The factory's managers were unaware of the regulations", "Openly disregarding the rules eventually led to severe consequences", "The inspectors caused the accident", "The fines were later cancelled"], "answer": "B", "explanation_en": "The text shows a chain of events: the factory ignored rules for years, an accident happened, and then came shutdown and record fines. The reasonable inference is that flouting the regulations led to serious consequences. The text never suggests the managers were unaware, that inspectors caused the accident, or that fines were cancelled.", "explanation_cn": "文本呈现了一条因果链：工厂多年无视法规→发生事故→被关停并处以创纪录罚款。最合理的推断是：公然违抗（flout）法规最终导致了严重后果。文中从未暗示管理者不知法规、检查员导致事故或罚款被取消。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-09"}, {"day": 31, "words": [{"word": "abrogate", "pos": "v.", "ipa": "/ˈæbrəɡeɪt/", "def_en": "To abolish or repeal formally.", "def_cn": "正式废除", "example_en": "The new government voted to abrogate the outdated treaty that had bound the two nations for decades.", "example_cn": "新政府投票废除了束缚两国数十年的过时条约。"}, {"word": "aver", "pos": "v.", "ipa": "/əˈvɜːr/", "def_en": "To state as a fact; to assert confidently.", "def_cn": "断言；肯定地说", "example_en": "The witness averred that she had seen the defendant at the scene on the night in question.", "example_cn": "证人断言，在案发当晚她看到被告出现在现场。"}, {"word": "bifurcate", "pos": "v.", "ipa": "/ˈbaɪfərkeɪt/", "def_en": "To divide into two branches or parts.", "def_cn": "分叉；一分为二", "example_en": "Just ahead, the wide river bifurcates around a small wooded island before rejoining farther downstream.", "example_cn": "就在前方，宽阔的河面绕过一座长满树木的小岛分成两支，在下游远处又重新汇合。"}, {"word": "callous", "pos": "adj.", "ipa": "/ˈkæles/", "def_en": "Unfeeling; insensitive to the suffering of others.", "def_cn": "无情的；麻木不仁的", "example_en": "The landlord's callous refusal to fix the broken heating left tenants shivering through the bitter winter.", "example_cn": "房东冷酷无情地拒绝修理坏掉的暖气，让房客在严寒的冬天里瑟瑟发抖。"}, {"word": "cajole", "pos": "v.", "ipa": "/kəˈdʒoʊl/", "def_en": "To persuade with flattery or gentle urging.", "def_cn": "哄骗；甜言蜜语劝说", "example_en": "She cajoled her brother into lending her the car by promising to fill the tank.", "example_cn": "她许诺给哥哥把油加满，哄得他把车借给了她。"}, {"word": "cantankerous", "pos": "adj.", "ipa": "/kænˈtæŋkərəs/", "def_en": "Bad-tempered and argumentative.", "def_cn": "脾气暴躁的；好争吵的", "example_en": "The cantankerous neighbor complained about everything, from loud music to fallen leaves in his yard.", "example_cn": "这位脾气暴躁的邻居什么都要抱怨，从吵闹的音乐到他院子里的落叶都不放过。"}, {"word": "digress", "pos": "v.", "ipa": "/dɪˈɡres/", "def_en": "To stray from the main topic.", "def_cn": "离题；跑题", "example_en": "The professor tends to digress into long personal anecdotes, though his students rarely seem to mind.", "example_cn": "这位教授讲课时常跑题讲起冗长的个人轶事，不过学生们似乎并不介意。"}, {"word": "encomium", "pos": "n.", "ipa": "/enˈkoʊmiəm/", "def_en": "A formal expression of high praise.", "def_cn": "颂词；赞美之辞", "example_en": "At the retirement dinner, colleagues offered an encomium honoring her forty dedicated years of service.", "example_cn": "在退休晚宴上，同事们致颂词，表彰她四十年尽心尽力的奉献。"}, {"word": "penurious", "pos": "adj.", "ipa": "/peˈnjʊriəs/", "def_en": "Extremely poor; miserly.", "def_cn": "极度贫困的；吝啬的", "example_en": "Raised in penurious circumstances, he learned to value every dollar he earned and never wasted money.", "example_cn": "在极度贫困的环境中长大，他学会了珍惜自己挣来的每一块钱，从不浪费。"}, {"word": "prevaricate", "pos": "v.", "ipa": "/prɪˈværəkeɪt/", "def_en": "To speak evasively; to avoid telling the truth.", "def_cn": "支吾其词；回避真相", "example_en": "When pressed about the missing funds, the treasurer prevaricated instead of giving a direct answer.", "example_cn": "当被追问失踪的资金时，财务主管支吾其词，没有给出直接答复。"}, {"word": "recant", "pos": "v.", "ipa": "/rɪˈkænt/", "def_en": "To withdraw a belief or statement publicly.", "def_cn": "公开撤回（信仰或言论）", "example_en": "Under pressure from the authorities, the scientist was forced to publicly recant his controversial theory.", "example_cn": "在当局的压力下，这位科学家被迫公开撤回了自己有争议的理论。"}, {"word": "travesty", "pos": "n.", "ipa": "/ˈtrævəsti/", "def_en": "A distorted imitation; a mockery of justice or fairness.", "def_cn": "拙劣的模仿；对正义的嘲弄", "example_en": "The rushed and unfair trial was denounced as a travesty of justice by international observers.", "example_cn": "这场仓促而不公的审判被国际观察员谴责为对正义的嘲弄。"}, {"word": "wily", "pos": "adj.", "ipa": "/ˈwaɪli/", "def_en": "Clever in a cunning, deceitful way.", "def_cn": "狡猾的；诡计多端的", "example_en": "The wily negotiator secured a favorable deal by revealing his terms only at the last moment.", "example_cn": "这位狡猾的谈判者在最后一刻才亮出条件，从而拿到了有利的协议。"}, {"word": "anachronism", "pos": "n.", "ipa": "/əˈnækrənɪzəm/", "def_en": "Something out of its proper time period.", "def_cn": "时代错误；不合时宜之物", "example_en": "The horse-drawn carriage in the modern film was a deliberate anachronism meant to evoke nostalgia.", "example_cn": "现代电影中出现的马车是刻意安排的时代错位，意在唤起怀旧之情。"}, {"word": "duplicity", "pos": "n.", "ipa": "/duːˈplɪsəti/", "def_en": "Deceitfulness; double-dealing.", "def_cn": "欺骗；表里不一", "example_en": "The ambassador's duplicity was finally exposed when secret documents revealed his double dealings with rivals.", "example_cn": "当秘密文件揭露了他与对手的两面派交易，这位大使的欺骗本性终于暴露无遗。"}, {"word": "epithet", "pos": "n.", "ipa": "/ˈepɪθet/", "def_en": "A descriptive nickname or insulting term.", "def_cn": "绰号；蔑称", "example_en": "The novelist earned the epithet master of suspense for her tightly plotted and genuinely frightening thrillers.", "example_cn": "这位小说家以情节紧凑、真正令人胆寒的惊悚小说赢得了“悬疑大师”的绰号。"}, {"word": "exult", "pos": "v.", "ipa": "/ɪɡˈzʌlt/", "def_en": "To rejoice greatly; to triumph.", "def_cn": "欢欣鼓舞；得意洋洋", "example_en": "The team exulted when the final whistle confirmed their hard-fought championship victory after a long season.", "example_cn": "终场哨声确认了漫长赛季后这场来之不易的冠军胜利，全队欢欣鼓舞。"}, {"word": "fractious", "pos": "adj.", "ipa": "/ˈfrækʃəs/", "def_en": "Unruly, quarrelsome, and hard to control.", "def_cn": "难以管束的；好争吵的", "example_en": "The fractious committee spent far more time arguing over minor procedures than actually solving real problems.", "example_cn": "这个难以管束的委员会把大量时间花在为琐碎程序争吵上，而不是真正解决问题。"}, {"word": "haughty", "pos": "adj.", "ipa": "/ˈhɔːti/", "def_en": "Arrogantly superior; disdainful.", "def_cn": "傲慢的；高傲的", "example_en": "Her haughty dismissal of the interns' suggestions alienated the entire team and damaged morale for weeks.", "example_cn": "她傲慢地驳回实习生的建议，疏远了整个团队，士气数周都受影响。"}, {"word": "iniquity", "pos": "n.", "ipa": "/ɪˈnɪkwəti/", "def_en": "Gross injustice or wickedness.", "def_cn": "极不公正；邪恶", "example_en": "The novel exposes the iniquity of a system that punishes the poor for being poor.", "example_cn": "这部小说揭露了一个因穷人贫穷而惩罚穷人的制度的极不公正。"}], "practice": [{"qid": "d31-q1", "stem": "The legislature voted to ______ the outdated law, formally ending a regulation that had restricted small businesses for fifty years.", "passage": "", "options": ["abrogate", "aver", "exult", "digress"], "answer": "A", "explanation_en": "Formally ending a law matches abrogate, which means to abolish or repeal officially. Aver means to assert, exult means to rejoice, and digress means to stray off topic, none of which means ending a law.", "explanation_cn": "formally ending a law（正式终结一项法律）对应 abrogate 的含义：正式废除。aver（断言）、exult（欢欣）、digress（离题）都没有“废除法律”的意思。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d31-q2", "stem": "During the trial, the witness ______ that she had seen the defendant near the scene on the night in question.", "passage": "", "options": ["avers", "averred", "averring", "to aver"], "answer": "B", "explanation_en": "The sentence describes a completed action during the trial, so the simple past tense is needed: averred. Avers is present tense, averring is a participle that cannot serve as the main verb here, and to aver is an infinitive.", "explanation_cn": "句子描述审判期间已经完成的动作，需要用一般过去时 averred。avers 是现在时，averring 是分词不能作谓语，to aver 是不定式，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d31-q3", "stem": "The professor is known for his ______ temper; even minor disruptions provoke long, angry tirades that leave students afraid to speak.", "passage": "", "options": ["cantankerous", "wily", "haughty", "fractious"], "answer": "A", "explanation_en": "The description of a bad temper with angry tirades over minor disruptions points to cantankerous, meaning bad-tempered and quarrelsome. Wily means cunning, haughty means arrogant, and fractious means unruly, which fits groups better than an individual's temper.", "explanation_cn": "因小事就大发雷霆的坏脾气对应 cantankerous：脾气暴躁、好争吵。wily（狡猾的）、haughty（傲慢的）都不表示坏脾气，fractious（难以管束的）多形容群体而非个人的脾气。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d31-q4", "stem": "At the retirement ceremony, the principal delivered a moving encomium, praising the teacher's forty years of dedication, her patience with struggling students, and the generations she had inspired. Which choice best describes the function of the encomium in the passage?", "passage": "", "options": ["To criticize the school's policies", "To formally praise and honor the teacher", "To announce a new school program", "To question the teacher's methods"], "answer": "B", "explanation_en": "An encomium is a formal speech of praise, and the passage lists the teacher's dedication, patience, and inspiration. Choice B correctly identifies its function as honoring her. The other choices describe criticism, announcements, or questioning, none of which appear in the passage.", "explanation_cn": "encomium 是正式的颂词，文中列举了这位教师的奉献、耐心和激励了几代人。B 选项正确指出了它的功能是表彰她。其他选项所说的批评政策、宣布新项目、质疑教学方法在文中都不存在。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d31-q5", "stem": "The defendant's lawyer called the trial a travesty of justice: key witnesses were never called, evidence was withheld, and the verdict was decided in under an hour. Based on the text, the lawyer most likely believes that ______.", "passage": "", "options": ["the trial was fair and thorough", "the trial mocked the ideals of justice", "the verdict took too long", "the witnesses were unreliable"], "answer": "B", "explanation_en": "Calling the trial a travesty of justice, plus the listed flaws of missing witnesses, withheld evidence, and a rushed verdict, shows the lawyer believes the proceedings made a mockery of justice. Choice B captures this. The text contradicts fairness and gives no basis for the other choices.", "explanation_cn": "律师称审判是 travesty of justice（对正义的嘲弄），再加上关键证人未出庭、证据被隐瞒、不到一小时就裁决这些细节，表明他认为审判亵渎了正义。B 选项准确概括了这一点。文本否定了“公平”，其他选项也缺乏依据。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d31-q6", "stem": "Because the committee was fractious ______ meetings rarely accomplished anything.", "passage": "", "options": [",", ";", ":", "—"], "answer": "A", "explanation_en": "A comma correctly separates an introductory dependent clause beginning with because from the main clause. A semicolon, colon, or dash cannot properly join a dependent clause to a main clause in this way.", "explanation_cn": "because 引导的从句是句首状语从句，后面用逗号与主句隔开。分号、冒号、破折号都不能这样连接从句和主句。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d31-q7", "stem": "Rather than answer the reporter's questions directly, the official ______, offering vague statements that satisfied no one.", "passage": "", "options": ["prevaricated", "exulted", "recanted", "averred"], "answer": "A", "explanation_en": "Offering vague statements instead of direct answers matches prevaricate, meaning to speak evasively. Exulted means rejoiced, recanted means withdrew a belief, and averred means asserted confidently, which is the opposite of being evasive.", "explanation_cn": "不直接回答、只给出含糊其辞的声明，对应 prevaricate：支吾其词、回避真相。exulted（欢欣）、recanted（撤回言论）、averred（断言）都不符合，其中 averred 还是反义词。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d31-q8", "stem": "The negotiator was famously wily. ______, his opponents rarely saw his final offer coming.", "passage": "", "options": ["Consequently", "Nevertheless", "For instance", "In contrast"], "answer": "A", "explanation_en": "The second sentence gives the result of his cunning: opponents were caught off guard. Consequently shows this cause-and-effect relationship. Nevertheless and in contrast signal opposition, while for instance introduces an example, none of which fits.", "explanation_cn": "第二句是他狡猾的结果：对手总是措手不及。Consequently 表示因果关系，符合逻辑。Nevertheless（转折）、In contrast（对比）表示对立，For instance（举例）表示举例，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d31-q9", "stem": "The novel exposes the ______ of a legal system that imprisons children for minor offenses while the wealthy escape punishment.", "passage": "", "options": ["iniquity", "duplicity", "epithet", "anachronism"], "answer": "A", "explanation_en": "A system that punishes children while the wealthy escape is grossly unjust, which matches iniquity: gross injustice or wickedness. Duplicity means deceitfulness, epithet means a nickname, and anachronism means something out of its time period, none of which fits.", "explanation_cn": "把儿童投入监狱、富人却逃脱惩罚的司法制度是极不公正的，对应 iniquity：极不公正、邪恶。duplicity（欺骗）、epithet（绰号）、anachronism（时代错位）都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d31-q10", "stem": "The speaker began with praise for the graduates but soon began to ______, wandering into long, unrelated stories about his own childhood.", "passage": "", "options": ["digress", "cajole", "bifurcate", "recant"], "answer": "A", "explanation_en": "Wandering into unrelated stories matches digress, meaning to stray from the main topic. Cajole means to persuade with flattery, bifurcate means to split in two, and recant means to withdraw a belief, none of which fits.", "explanation_cn": "wandering into unrelated stories（讲起不相关的故事）对应 digress：离题、跑题。cajole（哄骗）、bifurcate（分叉）、recant（撤回言论）都不符合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-10"}, {"day": 32, "words": [{"def_cn": "宣告无罪；免除责任", "def_en": "To officially declare someone free from blame, guilt, or responsibility for an action.", "example_cn": "委员会在彻底审查了她的实验记录后，宣告这位研究人员在学术不端指控中无罪。", "example_en": "The committee absolved the researcher of any misconduct after a thorough review of her laboratory records.", "ipa": "/əbˈzɑːlv/", "pos": "v.", "word": "absolve"}, {"def_cn": "奉承话；甜言蜜语（用于哄骗）", "def_en": "Flattering or coaxing speech used to persuade someone to do something.", "example_cn": "尽管销售人员甜言蜜语地劝说，委员会经过慎重考虑后还是选择了更便宜的预算方案。", "example_en": "Despite the salesperson's blandishments, the committee chose the more affordable budget proposal after careful deliberation.", "ipa": "/ˈblændɪʃmənt/", "pos": "n.", "word": "blandishment"}, {"def_cn": "顺从的；遵守规定的", "def_en": "Willing to obey rules, requests, or authority without resistance.", "example_cn": "这家公司在新环保法规公布后的六个月内就做到了合规。", "example_en": "The company became compliant with the new environmental regulations within six months of their announcement.", "ipa": "/kəmˈplaɪənt/", "pos": "adj.", "word": "compliant"}, {"def_cn": "故意的；深思熟虑的", "def_en": "Done consciously and intentionally; also describes careful and unhurried action.", "example_cn": "作者有意使用简单的语言，使复杂的理论能被普通读者理解。", "example_en": "The author's deliberate choice of simple language made the complex theory accessible to general readers.", "ipa": "/dɪˈlɪbərət/", "pos": "adj.", "word": "deliberate"}, {"def_cn": "散发；发出；起源于", "def_en": "To come out from a source; to spread outward.", "example_cn": "有关合并的传言似乎源于公司论坛上一篇匿名帖子。", "example_en": "The rumors of a merger seemed to emanate from a single anonymous post on the company's forum.", "ipa": "/ˈeməneɪt/", "pos": "v.", "word": "emanate"}, {"def_cn": "束缚；限制", "def_en": "To restrict someone's freedom or progress; literally, to chain the feet.", "example_cn": "过多的政府法规会束缚小企业，阻碍它们与大公司有效竞争。", "example_en": "Excessive government regulations can fetter small businesses, preventing them from competing effectively with larger corporations.", "ipa": "/ˈfetər/", "pos": "v.", "word": "fetter"}, {"def_cn": "策略；先手棋（为获利而冒险的一步）", "def_en": "A calculated move or remark intended to gain an advantage, often involving some risk.", "example_cn": "这位候选人在辩论中的开场策略是先称赞对手的政绩，再加以抨击。", "example_en": "The candidate's opening gambit in the debate was to praise her opponent's record before attacking it.", "ipa": "/ˈɡæmbɪt/", "pos": "n.", "word": "gambit"}, {"def_cn": "不幸的；倒霉的", "def_en": "Unfortunate; having consistently bad luck.", "example_cn": "这些倒霉的旅客因恶劣天气导致的延误而错过了转机航班。", "example_en": "The hapless travelers missed their connecting flight because of a delay caused by severe weather.", "ipa": "/ˈhæpləs/", "pos": "adj.", "word": "hapless"}, {"def_cn": "侵犯；对……产生不利影响", "def_en": "To have a negative effect on something; to encroach upon rights or space.", "example_cn": "批评者认为新的监控法会侵犯公民的基本隐私权。", "example_en": "Critics argued that the new surveillance law would impinge on citizens' basic right to privacy.", "ipa": "/ɪmˈpɪndʒ/", "pos": "v.", "word": "impinge"}, {"def_cn": "心怀偏见的；愤世嫉俗的（因过去不快而）", "def_en": "Showing bitterness or resentment resulting from past unpleasant experiences.", "example_cn": "多年求职被拒之后，她对整个招聘流程都抱有偏见。", "example_en": "After years of rejected applications, she took a jaundiced view of the entire hiring process.", "ipa": "/ˈdʒɔːndɪst/", "pos": "adj.", "word": "jaundiced"}, {"def_cn": "迷宫；错综复杂的事物", "def_en": "A complex network of winding paths; any confusingly complicated system.", "example_cn": "在这所大学令人困惑的官僚体系中办事，就像在没有明确出口的迷宫里徘徊。", "example_en": "Navigating the university's confusing bureaucracy felt like wandering through a labyrinth with no clear exit.", "ipa": "/ˈlæbərɪnθ/", "pos": "n.", "word": "labyrinth"}, {"def_cn": "不适感；萎靡；普遍的不满情绪", "def_en": "A general feeling of unease, discomfort, or dissatisfaction, often hard to pinpoint.", "example_cn": "工厂宣布关闭后，一种经济萧条的萎靡情绪蔓延到整个小镇。", "example_en": "A sense of economic malaise spread through the town after the factory announced its closure.", "ipa": "/məˈleɪz/", "pos": "n.", "word": "malaise"}, {"def_cn": "最低点；谷底", "def_en": "The lowest point of something, such as a career or a historical period.", "example_cn": "球队在冠军赛中的最后一场失利，标志着这个原本就令人失望的赛季跌入谷底。", "example_en": "The team's final defeat in the championship marked the nadir of an otherwise disappointing season.", "ipa": "/ˈneɪdər/", "pos": "n.", "word": "nadir"}, {"def_cn": "讥讽的；冷嘲的", "def_en": "Grimly mocking or cynical in a way that shows contempt.", "example_cn": "这位专栏作家的讥讽语气表明，她怀疑这位政客态度的突然转变。", "example_en": "The columnist's sardonic tone made it clear that she doubted the politician's sudden change of heart.", "ipa": "/sɑːrˈdɑːnɪk/", "pos": "adj.", "word": "sardonic"}, {"def_cn": "吝啬的；小气的", "def_en": "Unwilling to spend money; extremely stingy.", "example_cn": "尽管家财万贯，这位吝啬的房东还是拒绝修理大楼坏掉的暖气系统。", "example_en": "Despite his considerable wealth, the miserly landlord refused to repair the building's broken heating system.", "ipa": "/ˈmaɪzərli/", "pos": "adj.", "word": "miserly"}, {"def_cn": "困境；泥潭", "def_en": "A difficult, complex situation from which it is hard to escape.", "example_cn": "和平谈判陷入停滞，外交官们担心这场漫长的谈判已陷入政治泥潭。", "example_en": "The peace talks stalled, and diplomats feared the long negotiations had become a political quagmire.", "ipa": "/ˈkwæɡmaɪər/", "pos": "n.", "word": "quagmire"}, {"def_cn": "食言；背弃承诺", "def_en": "To go back on a promise, agreement, or commitment.", "example_cn": "承包商在发现材料成本大幅上涨后，背弃了最近达成的协议。", "example_en": "The contractor reneged on the recent deal after discovering that material costs had risen sharply.", "ipa": "/rɪˈnɪɡ/", "pos": "v.", "word": "renege"}, {"def_cn": "吹毛求疵的；好批评的", "def_en": "Severely critical of others; quick to find fault.", "example_cn": "这篇吹毛求疵的书评把这部小说贬为肤浅之作，忽略了它对现代生活微妙的评论。", "example_en": "The censorious review dismissed the novel as shallow, ignoring its subtle commentary on modern life.", "ipa": "/senˈsɔːriəs/", "pos": "adj.", "word": "censorious"}, {"def_cn": "迟钝的；懒散的；不活跃的", "def_en": "Mentally or physically inactive; sluggish and lacking energy.", "example_cn": "尽管政府最近推出了刺激措施，迟滞的国民经济仍几乎没有复苏的迹象。", "example_en": "The torpid national economy showed little sign of recovery despite the government's recent stimulus measures.", "ipa": "/ˈtɔːrpɪd/", "pos": "adj.", "word": "torpid"}, {"def_cn": "奉承的；谄媚的", "def_en": "Displaying excessive flattery or servile praise to gain favor.", "example_cn": "这位谄媚的电视主持人对每个回答都大加赞赏，却没有向候选人提出任何有挑战性的问题。", "example_en": "The fawning television interviewer praised every answer, failing to ask the candidate any challenging questions.", "ipa": "/ˈfɔːnɪŋ/", "pos": "adj.", "word": "fawning"}], "practice": [{"qid": "d32-q1", "stem": "The investigation found no evidence of wrongdoing, and the committee voted to ______ the director of all charges.", "passage": "", "options": ["absolve", "accuse", "interrogate", "suspend"], "answer": "A", "explanation_en": "The investigation found no wrongdoing, so the committee would declare the director free from blame, which is what absolve means. Accuse, interrogate, and suspend all imply guilt or punishment, which contradicts the finding of no wrongdoing.", "explanation_cn": "调查没有发现不当行为，因此委员会应宣告主管无罪，即 absolve（免除罪责）。accuse（指控）、interrogate（审问）、suspend（停职）都暗示有罪或惩罚，与调查结果矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d32-q2", "stem": "The prolonged conflict turned into a diplomatic ______, with neither side willing to compromise.", "passage": "", "options": ["triumph", "quagmire", "celebration", "ceremony"], "answer": "B", "explanation_en": "A prolonged conflict with no willingness to compromise describes a difficult situation that is hard to escape, which matches quagmire. Triumph, celebration, and ceremony describe positive or formal events that do not fit an unresolved conflict.", "explanation_cn": "旷日持久且双方都不愿妥协的冲突，形容的是难以脱身的困境，即 quagmire（泥潭）。triumph（胜利）、celebration（庆祝）、ceremony（仪式）都是积极或正式的场合，不符合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d32-q3", "stem": "The labyrinth of narrow streets in the old quarter ______ visitors who attempt to navigate without a map.", "passage": "", "options": ["confuse", "confuses", "have confused", "are confusing"], "answer": "B", "explanation_en": "The subject of the sentence is the singular noun labyrinth, so the verb must take the singular form confuses. Choices A, C, and D use plural verb forms, which do not agree with a singular subject.", "explanation_cn": "句子主语是单数名词 labyrinth，动词须用单数形式 confuses。A、C、D 都是复数动词形式，与单数主语不一致。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d32-q4", "stem": "The reviewer's ______ comment about the 'brilliant' plot twist revealed his contempt for the novel.", "passage": "", "options": ["sincere", "sardonic", "admiring", "neutral"], "answer": "B", "explanation_en": "The quotation marks around brilliant signal sarcasm, and the comment revealed contempt, which matches sardonic, meaning grimly mocking. Sincere, admiring, and neutral describe genuine or unbiased attitudes that contradict the reviewer's contempt.", "explanation_cn": "brilliant 加了引号表示反讽，且评论流露出轻蔑，这正是 sardonic（讥讽的）的含义。sincere（真诚的）、admiring（赞赏的）、neutral（中立的）都是真诚或无偏见的态度，与轻蔑矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d32-q5", "stem": "Miserly figures appear throughout literature, from Dickens's Scrooge to Moliere's Harpagon. Yet economists note that extreme thrift, when practiced by entire societies, can slow economic growth by reducing spending. The literary miser hoards gold; the economic miser hoards opportunity. Which choice best states the main purpose of the text?", "passage": "", "options": ["To argue that literary misers are unrealistic portrayals of real people.", "To compare the literary image of the miser with the economic consequences of extreme thrift.", "To prove that Dickens invented the miser character.", "To suggest that all forms of thrift are harmful to society."], "answer": "B", "explanation_en": "The text discusses both the literary miser and the economic effects of widespread thrift, drawing a comparison between the two images. It does not claim literary misers are unrealistic (A), that Dickens invented the character (C), or that all thrift is harmful (D).", "explanation_cn": "短文同时讨论了文学中的吝啬鬼形象和普遍节俭的经济后果，并将两者对比。A 说文学形象不真实、C 说狄更斯首创该形象、D 说一切节俭都有害，文中都没有表达。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d32-q6", "stem": "A study tracked 200 patients recovering from surgery. Those who described their pain with highly negative, jaundiced language recovered more slowly than those who used neutral descriptions, even when their injuries were identical. Which choice best states what the study suggests?", "passage": "", "options": ["Patients with identical injuries always recover at the same rate.", "Negative attitudes toward recovery may be associated with slower healing.", "Jaundiced language causes physical injury.", "Neutral descriptions of pain are dishonest."], "answer": "B", "explanation_en": "Patients using negative language recovered more slowly despite identical injuries, suggesting an association between attitude and recovery speed. The study does not claim identical injuries always heal equally (A), that language causes injury (C), or that neutral descriptions are dishonest (D).", "explanation_cn": "尽管伤情相同，用消极语言描述疼痛的患者恢复更慢，这表明心态与恢复速度可能相关。A 说相同伤情恢复速度一定相同、C 说语言导致受伤、D 说中性描述不诚实，都不符合文意。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d32-q7", "stem": "______ by the candidate's fawning praise, the manager overlooked his lack of experience.", "passage": "", "options": ["Impressed", "Having impressed", "To impress", "Impressing"], "answer": "A", "explanation_en": "The participial phrase must describe the manager, who was impressed by the praise, so the past participle Impressed is correct. Having impressed and Impressing would wrongly suggest the manager did the impressing, and To impress expresses purpose rather than a state.", "explanation_cn": "分词短语必须修饰 manager（被奉承打动的人），因此用过去分词 Impressed。Having impressed 和 Impressing 会错误地表示 manager 是施动者，To impress 则表示目的而非状态。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d32-q8", "stem": "The new policy was designed to reduce traffic congestion. ______, commute times increased by fifteen percent in the first month.", "passage": "", "options": ["Consequently,", "However,", "For example,", "Moreover,"], "answer": "B", "explanation_en": "The second sentence presents a result opposite to the policy's goal, so a contrast transition is needed, which is However. Consequently and Moreover signal continuation, while For example introduces an illustration; none fits the contrast here.", "explanation_cn": "第二句呈现了与政策目标相反的结果，需要转折连接词 However。Consequently（因此）和 Moreover（而且）表示顺承，For example（例如）表示举例，都不符合转折关系。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d32-q9", "stem": "After promising to fund the project, the sponsor suddenly ______ on the agreement, leaving the researchers without support.", "passage": "", "options": ["reneged", "improved", "expanded", "commented"], "answer": "A", "explanation_en": "Leaving the researchers without support after making a promise indicates going back on an agreement, which is the meaning of renege. Improved, expanded, and commented describe positive or neutral actions that cannot explain the loss of support.", "explanation_cn": "承诺出资后却让研究人员失去支持，说明背弃了协议，即 renege（食言）。improved（改善）、expanded（扩大）、commented（评论）都是积极或中性的行为，无法解释支持的中断。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d32-q10", "stem": "In the novel, the torpid bureaucracy processes every request at a glacial pace, frustrating citizens who need urgent help. As used in the text, what does torpid most nearly mean?", "passage": "", "options": ["corrupt", "sluggish", "enormous", "secretive"], "answer": "B", "explanation_en": "The context describes processing requests at a glacial pace, which indicates sluggishness, the meaning of torpid. The passage gives no evidence of corruption (A), great size (C), or secrecy (D).", "explanation_cn": "上下文说以冰川般的速度处理请求，形容的是迟缓，即 torpid 的含义。文中没有腐败、庞大或秘密的依据。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-11"}, {"day": 33, "words": [{"def_cn": "有节制的；饮食节制的", "def_en": "Sparing or moderate, especially in eating and drinking.", "example_cn": "这位节制的僧人每天只吃一顿简单的饭，只喝水。", "example_en": "The abstemious monk ate only one simple meal each day and drank nothing but water.", "ipa": "/æbˈstiːmiəs/", "pos": "adj.", "word": "abstemious"}, {"def_cn": "无忧无虑的；满不在乎的", "def_en": "Carefree and lighthearted; showing a casual lack of concern.", "example_cn": "这些无忧无虑的游客在老城里闲逛，全然不知风暴正从海岸逼近。", "example_en": "The blithe tourists wandered through the old town, unaware of the storm approaching from the coast.", "ipa": "/blaɪð/", "pos": "adj.", "word": "blithe"}, {"def_cn": "承认；认输", "def_en": "To admit that something is true; to acknowledge defeat.", "example_cn": "在审查了证据之后，这位科学家终于承认她最初的假设是错误的。", "example_en": "After reviewing the evidence, the scientist finally conceded that her original hypothesis had been incorrect.", "ipa": "/kənˈsiːd/", "pos": "v.", "word": "concede"}, {"def_cn": "嘲笑；讥讽", "def_en": "Contemptuous ridicule or mockery.", "example_cn": "他雄心勃勃的提案遭到了同事们的公开嘲笑，他们认为这个提案完全不切实际。", "example_en": "His ambitious proposal was met with open derision from colleagues who considered it completely impractical.", "ipa": "/dɪˈrɪʒən/", "pos": "n.", "word": "derision"}, {"def_cn": "使痛苦；使怀恨", "def_en": "To make someone feel bitter, resentful, or hostile.", "example_cn": "多年来管理层的不公待遇让工人们心怀怨恨，最终导致了一场激烈的罢工。", "example_en": "Years of unfair treatment by management embittered the workers, eventually leading to a bitter strike.", "ipa": "/ɪmˈbɪtər/", "pos": "v.", "word": "embitter"}, {"def_cn": "荒谬的；闹剧般的", "def_en": "Absurdly ridiculous; resembling a farce.", "example_cn": "当关键证人承认自己当时根本不在场时，这场审判变得荒谬可笑。", "example_en": "The trial became farcical when the key witness admitted he had not even been present.", "ipa": "/ˈfɑːrsɪkəl/", "pos": "adj.", "word": "farcical"}, {"def_cn": "文雅的；有教养的；体面的", "def_en": "Polite, refined, and respectable in manners or appearance.", "example_cn": "这位文雅的年长主人亲自迎接每一位客人，营造出温馨优雅的氛围。", "example_en": "The genteel elderly host truly welcomed every guest personally, creating a warm and gracious atmosphere.", "ipa": "/dʒenˈtiːl/", "pos": "adj.", "word": "genteel"}, {"def_cn": "令人痛心的；折磨人的", "def_en": "Extremely distressing or disturbing; causing great suffering.", "example_cn": "幸存者们讲述了那场突如其来的地震的可怕经历，地震在一夜之间摧毁了他们的整个村庄。", "example_en": "The survivors gave harrowing accounts of the sudden earthquake that destroyed their entire village overnight.", "ipa": "/ˈhæroʊɪŋ/", "pos": "adj.", "word": "harrowing"}, {"def_cn": "不可阻挡的；无情的", "def_en": "Impossible to stop or prevent; relentless and unstoppable.", "example_cn": "全球海平面不可阻挡的上升正威胁着世界各地的沿海大城市。", "example_en": "The inexorable rise of global sea levels now threatens major coastal cities around the world.", "ipa": "/ɪnˈeksərəbəl/", "pos": "adj.", "word": "inexorable"}, {"def_cn": "抛弃；丢弃", "def_en": "To discard or abandon something that is no longer needed or wanted.", "example_cn": "公司决定抛弃失败的产品线，专注于更有利可图的业务。", "example_en": "The company decided to jettison its failing product line and focus on more profitable ventures.", "ipa": "/ˈdʒetɪsən/", "pos": "v.", "word": "jettison"}, {"def_cn": "没精打采的；慵懒的", "def_en": "Lacking energy or vitality; slow, relaxed, and listless.", "example_cn": "午后慵懒的闷热让疲惫的学生们在漫长的三小时历史课上昏昏欲睡。", "example_en": "The languid afternoon heat made the tired students drowsy during the long three-hour history lecture.", "ipa": "/ˈlæŋɡwɪd/", "pos": "adj.", "word": "languid"}, {"def_cn": "多愁善感的；感伤得过分的", "def_en": "Excessively sentimental; tearfully emotional in a weak or foolish way.", "example_cn": "校长那冗长而感伤的告别演说让一些听众落泪，却让更多人感到尴尬。", "example_en": "The principal's long maudlin farewell speech moved some listeners to tears but embarrassed many others.", "ipa": "/ˈmɔːdlɪn/", "pos": "adj.", "word": "maudlin"}, {"def_cn": "微不足道的；可以忽略的", "def_en": "So small or unimportant as to be not worth considering.", "example_cn": "两款机型的价格差异微不足道，所以她选择了较新的那一款。", "example_en": "The difference in price between the two models was negligible, so she chose the newer one.", "ipa": "/ˈneɡlɪdʒəbəl/", "pos": "adj.", "word": "negligible"}, {"def_cn": "繁重的；费力的", "def_en": "Burdensome; involving a great deal of effort or difficulty.", "example_cn": "翻译整部古手稿这项繁重的任务花了这位学者近两年时间。", "example_en": "The onerous task of translating the entire ancient manuscript took the scholar nearly two years.", "ipa": "/ˈɑːnərəs/", "pos": "adj.", "word": "onerous"}, {"def_cn": "平静的；温和的", "def_en": "Calm and peaceful; not easily upset or excited.", "example_cn": "在那个无风的初秋清晨，平静的山湖完美地倒映着雪山。", "example_en": "The placid mountain lake reflected the snowy peaks perfectly on that windless early autumn morning.", "ipa": "/ˈplæsɪd/", "pos": "adj.", "word": "placid"}, {"def_cn": "疑虑；不安", "def_en": "A feeling of uneasiness or doubt about whether one is doing the right thing.", "example_cn": "她对举报公司欺诈行为毫无疑虑，认为诚实比忠诚更重要。", "example_en": "She had no qualms about reporting the corporate fraud, believing honesty mattered more than loyalty.", "ipa": "/kwɑːm/", "pos": "n.", "word": "qualm"}, {"def_cn": "难控制的；倔强的；难治的", "def_en": "Stubbornly resistant to control, treatment, or change.", "example_cn": "这位病人顽固而危险的感染对常规抗生素没有反应，需要实验性治疗。", "example_en": "The patient's dangerous refractory infection did not respond to standard antibiotics and required experimental treatment.", "ipa": "/rɪˈfræktəri/", "pos": "adj.", "word": "refractory"}, {"def_cn": "使腻烦；使生厌（因过甜或过腻）", "def_en": "To sicken or weary with an excess of sweetness, richness, or sentimentality.", "example_cn": "电影过于煽情的结尾开始让人腻烦，观众感到恼火多于感动。", "example_en": "The film's overly sentimental ending began to cloy, leaving the audience more irritated than moved.", "ipa": "/klɔɪ/", "pos": "v.", "word": "cloy"}, {"def_cn": "漫画式夸张描绘；讽刺画", "def_en": "An exaggerated or distorted representation of a person or thing, often for comic effect.", "example_cn": "这幅社论漫画是对市长的辛辣讽刺，夸张了他最具辨识度的特征。", "example_en": "The editorial cartoon was a biting caricature of the mayor, exaggerating his most recognizable features.", "ipa": "/ˈkærɪkətʃʊr/", "pos": "n.", "word": "caricature"}, {"def_cn": "衷心的；真诚的", "def_en": "Deeply felt; sincere and genuine.", "example_cn": "这位退休教师收到了众多学生的衷心感谢，她曾悄然改变了他们的生活。", "example_en": "The retiring teacher received heartfelt thanks from many students whose lives she had quietly transformed.", "ipa": "/ˈhɑːrtfelt/", "pos": "adj.", "word": "heartfelt"}], "practice": [{"qid": "d33-q1", "stem": "Although she defended her theory for months, the professor finally ______ that the new data contradicted her conclusions.", "passage": "", "options": ["conceded", "denied", "ignored", "celebrated"], "answer": "A", "explanation_en": "The word finally and the contradicting data indicate that she admitted her theory was wrong, which is the meaning of concede. Denied, ignored, and celebrated all contradict the idea of admitting defeat.", "explanation_cn": "finally（最终）和相矛盾的新数据表明她承认了自己的理论有误，即 concede（承认）。denied（否认）、ignored（忽视）、celebrated（庆祝）都与承认失败矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d33-q2", "stem": "The cost difference between the generic and brand-name drugs was ______, so most patients chose the cheaper option.", "passage": "", "options": ["enormous", "negligible", "mysterious", "controversial"], "answer": "B", "explanation_en": "Most patients chose the cheaper drug, which makes sense only if the price difference was tiny, matching negligible. An enormous difference would not lead patients to choose on price alone, while mysterious and controversial do not describe the size of a difference.", "explanation_cn": "大多数患者选择了更便宜的药，说明差价微乎其微，即 negligible（微不足道的）。enormous（巨大）与按价格选择的逻辑不符，mysterious（神秘的）和 controversial（有争议的）不能形容差价大小。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d33-q3", "stem": "The committee plans to jettison outdated procedures, ______ new guidelines, and train all staff members.", "passage": "", "options": ["to adopt", "adopt", "adopting", "adopted"], "answer": "B", "explanation_en": "The list requires parallel structure: to jettison outdated procedures, adopt new guidelines, and train all staff members. After the first to, the remaining items use the bare infinitive, so adopt is the only parallel choice.", "explanation_cn": "并列结构要求形式一致：to jettison outdated procedures、adopt new guidelines、train all staff members。第一个 to 之后其余项用动词原形，只有 adopt 符合平行结构。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d33-q4", "stem": "The young inventor's ideas were met with ______ by established scientists, who later adopted them as their own.", "passage": "", "options": ["derision", "applause", "funding", "indifference"], "answer": "A", "explanation_en": "The scientists later adopted the ideas as their own, implying that they first mocked them, which is derision. Applause and funding are positive responses that would not precede taking credit, and indifference would not lead to adoption.", "explanation_cn": "科学家们后来把这些想法据为己有，暗示他们起初是嘲笑，即 derision（嘲笑）。applause（喝彩）和 funding（资助）是积极回应，不会导致后来的剽窃；indifference（漠不关心）也不会导致采纳。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d33-q5", "stem": "Blithe optimism characterized the early years of the space race, when engineers spoke confidently of moon colonies by 1980. The reality proved more onerous: budgets shrank, technical challenges multiplied, and public enthusiasm faded. Yet the ambition of that era still inspires engineers today. Which choice best states the main purpose of the text?", "passage": "", "options": ["To argue that the space race was a complete failure.", "To contrast early optimism about space exploration with later difficulties while noting its lasting inspiration.", "To prove that engineers are always overly optimistic.", "To explain why moon colonies were never built."], "answer": "B", "explanation_en": "The text contrasts the early blithe optimism with the later onerous reality, then adds that the era's ambition still inspires engineers today, matching choice B. It never calls the space race a complete failure (A), generalizes about all engineers (C), or focuses on why moon colonies were never built (D).", "explanation_cn": "短文把早期无忧无虑的乐观与后来繁重的现实作对比，最后指出当年的雄心至今仍激励着工程师，对应 B。A 说太空竞赛彻底失败、C 泛化所有工程师、D 聚焦月球殖民地为何没建成，文中均未表达。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d33-q6", "stem": "Researchers compared two groups of hikers: one carrying negligible extra weight and one carrying heavy packs. The heavily loaded group reported far more fatigue, though both groups hiked the same trail at the same pace. Which conclusion is best supported by the study?", "passage": "", "options": ["Trail difficulty is the only factor in hiker fatigue.", "Carrying extra weight is associated with greater fatigue.", "Hiking speed determines fatigue levels.", "Light packs cause more fatigue than heavy packs."], "answer": "B", "explanation_en": "The only difference between the groups was pack weight, and the heavier group reported more fatigue, supporting the conclusion that extra weight is associated with greater fatigue. The study controlled for trail and pace, ruling out A and C, and D reverses the finding.", "explanation_cn": "两组唯一的区别是负重，较重的一组更疲劳，支持负重与疲劳相关的结论。实验控制了路线和速度，排除了 A 和 C；D 则把结论说反了。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d33-q7", "stem": "The author's caricature of small-town life______ readers either love or hate remains his most discussed work.", "passage": "", "options": [", which", "which", "; which", ": which"], "answer": "A", "explanation_en": "The clause which readers either love or hate is nonrestrictive extra information, so it must be set off by a comma before which. Omitting the comma (B) or using a semicolon (C) or colon (D) is incorrect.", "explanation_cn": "which readers either love or hate 是非限制性定语从句，属于补充信息，which 前必须用逗号隔开。B 缺逗号，C 用分号、D 用冒号都不正确。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d33-q8", "stem": "The placid surface of the lake was calm. It was peaceful. It reflected the sky. Which choice most effectively combines the sentences?", "passage": "", "options": ["The placid surface of the lake was calm and peaceful, and it reflected the sky.", "The placid surface of the lake, calm and peaceful, reflected the sky.", "The placid surface of the lake was calm, it was peaceful, and it reflected the sky.", "Being calm and peaceful, the placid surface of the lake reflected the sky and was calm."], "answer": "B", "explanation_en": "Choice B combines the three ideas concisely with an appositive phrase and no redundancy. Choice A is wordy, C is a comma splice, and D is awkward and redundant.", "explanation_cn": "B 用同位语短语把三个意思简洁合并，没有冗余。A 啰嗦，C 是逗号粘连句，D 别扭且重复。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d33-q9", "stem": "Despite every medical intervention, the ______ spread of the disease continued unchecked through the region.", "passage": "", "options": ["inexorable", "negligible", "placid", "blithe"], "answer": "A", "explanation_en": "The phrase continued unchecked indicates something unstoppable, which is the meaning of inexorable. Negligible means tiny, while placid and blithe describe calm or carefree moods that do not fit the spread of a disease.", "explanation_cn": "continued unchecked（不受控制地蔓延）表明不可阻挡，即 inexorable（不可阻挡的）。negligible 是微小，placid（平静的）和 blithe（无忧的）形容心情，不符合疾病蔓延的语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d33-q10", "stem": "The critic called the play farcical, 'a two-hour exercise in missed cues and collapsing sets.' The comparison was harsh but memorable. The quotation in the text primarily serves to", "passage": "", "options": ["illustrate what the critic means by farcical.", "prove that the play was commercially successful.", "suggest that the critic did not watch the play.", "describe the architecture of the theater."], "answer": "A", "explanation_en": "The quoted phrase gives a concrete example of the farcical elements the critic observed, illustrating the term farcical. It says nothing about commercial success (B), whether the critic attended the performance (C), or the design of the building (D).", "explanation_cn": "引文具体举例说明了评论家所看到的荒谬之处，是对 farcical 一词的阐释。文中没有提到商业成功、评论家是否观看演出或剧院建筑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-14"}, {"day": 34, "words": [{"def_cn": "热烈赞扬，公开表彰。", "def_en": "To praise enthusiastically and publicly.", "example_cn": "这位年轻的小说家因生动描绘了战争期间沿海村庄的生活而受到评论界的热烈赞扬。", "example_en": "The young novelist was acclaimed by critics for her vivid portrayal of life in a coastal village during the war.", "ipa": "əˈkleɪm", "pos": "v.", "word": "acclaim"}, {"def_cn": "简明的，扼要的。", "def_en": "Giving much information in few words; brief and clear.", "example_cn": "这位科学家做了一个简明的发现总结，略去了专业术语，以便委员会理解结论。", "example_en": "The scientist delivered a concise summary of the findings, omitting technical jargon so that the committee could grasp the conclusion.", "ipa": "kənˈsaɪs", "pos": "adj.", "word": "concise"}, {"def_cn": "沮丧的，绝望的。", "def_en": "Feeling hopeless and discouraged.", "example_cn": "经历三次被拒后，这位剧作家变得沮丧，认定自己的剧本永远登不上舞台。", "example_en": "After three rejections, the playwright grew despondent, convinced that her script would never reach the stage.", "ipa": "dɪˈspɑːndənt", "pos": "adj.", "word": "despondent"}, {"def_cn": "公平的，公正的。", "def_en": "Fair and impartial; treating everyone equally.", "example_cn": "调解人提出公平地分配遗产，确保每个兄弟姐妹按需求获得相应份额。", "example_en": "The mediator proposed an equitable division of the inheritance, ensuring that each sibling received a share proportional to need.", "ipa": "ˈɛkwɪtəbəl", "pos": "adj.", "word": "equitable"}, {"def_cn": "恰当的，幸运的。", "def_en": "Well-chosen or particularly suitable; fortunate.", "example_cn": "教授称这个类比非常恰当，因为它澄清了一个学生长期难以理解的概念。", "example_en": "The professor called the analogy a felicitous comparison, since it clarified a concept students had long struggled to understand.", "ipa": "fɪˈlɪsɪtəs", "pos": "adj.", "word": "felicitous"}, {"def_cn": "过量供应，充斥。", "def_en": "An excessive supply of something.", "example_cn": "大量廉价进口钢铁充斥市场，压低了价格，迫使几家国内工厂减产裁员。", "example_en": "A glut of cheap imported steel drove prices down, forcing several domestic factories to reduce production and lay off workers.", "ipa": "ɡlʌt", "pos": "n.", "word": "glut"}, {"def_cn": "注意，听从（忠告或警告）。", "def_en": "To pay attention to advice or warnings.", "example_cn": "工程师们没有理会关于大坝裂缝的早期警告，随后的洪水使数千居民流离失所。", "example_en": "The engineers failed to heed the early warnings about the dam's cracks, and the subsequent flood displaced thousands of residents.", "ipa": "hiːd", "pos": "v.", "word": "heed"}, {"def_cn": "发起，煽动。", "def_en": "To start or provoke an action or event, often trouble.", "example_cn": "历史学家认为，那些激进的小册子煽动了起义，让工人们相信和平抗议已经失败。", "example_en": "Historians argue that the radical pamphlets instigated the uprising by convincing workers that peaceful protest had failed.", "ipa": "ˈɪnstɪˌɡeɪt", "pos": "v.", "word": "instigate"}, {"def_cn": "慷慨，捐赠。", "def_en": "Generosity in giving money or gifts.", "example_cn": "这位慈善家慷慨捐赠，为全州乡村社区的数百名学生提供奖学金。", "example_en": "Through her largess, the philanthropist funded scholarships for hundreds of students from rural communities across the state.", "ipa": "lɑːrˈdʒɛs", "pos": "n.", "word": "largess"}, {"def_cn": "疑虑，担心。", "def_en": "A feeling of doubt or suspicion about something.", "example_cn": "尽管对紧凑的日程心存疑虑，建筑师还是签了合同，希望团队能赶上截止日期。", "example_en": "Despite her misgivings about the rushed schedule, the architect signed the contract and hoped the team could meet the deadline.", "ipa": "mɪsˈɡɪvɪŋ", "pos": "n.", "word": "misgiving"}, {"def_cn": "微不足道的，名义上的。", "def_en": "Very small in amount; existing in name only.", "example_cn": "博物馆只收取象征性的门票，希望低票价能吸引各行各业的参观者。", "example_en": "The museum charged only a nominal fee for admission, hoping that low prices would attract visitors from all backgrounds.", "ipa": "ˈnɑːmɪnəl", "pos": "adj.", "word": "nominal"}, {"def_cn": "摆动，摇摆不定。", "def_en": "To swing back and forth; to waver between opinions.", "example_cn": "州长的支持率在这一年里上下波动，每次政策成功后上升，丑闻期间下跌。", "example_en": "The governor's approval ratings oscillated throughout the year, rising after each policy success and falling during the scandal.", "ipa": "ˈɑːsəleɪt", "pos": "v.", "word": "oscillate"}, {"def_cn": "严厉批评，痛斥。", "def_en": "To criticize harshly and severely.", "example_cn": "这篇社论痛斥市议会，在没有征询将被迫搬迁的居民意见的情况下批准了开发项目。", "example_en": "The editorial lambasted the city council for approving the development without consulting the residents it would displace.", "ipa": "læmˈbeɪst", "pos": "v.", "word": "lambaste"}, {"def_cn": "平常的，日常的。", "def_en": "Ordinary and everyday; not special or exciting.", "example_cn": "这位摄影师在日常场景中发现美，捕捉了清晨地铁通勤者安静的尊严。", "example_en": "The photographer found beauty in workaday scenes, capturing the quiet dignity of morning commuters on the subway.", "ipa": "ˈwɜːrkədeɪ", "pos": "adj.", "word": "workaday"}, {"def_cn": "抱怨，痛斥。", "def_en": "To complain bitterly or angrily about something.", "example_cn": "这位专栏作家痛斥新的税收政策，认为它加重了小企业的负担，却让富有的大公司受益。", "example_en": "The columnist railed against the new tax policy, arguing that it burdened small businesses while rewarding wealthy corporations.", "ipa": "reɪl", "pos": "v.", "word": "rail"}, {"def_cn": "郁闷的，阴沉的。", "def_en": "Gloomy, sullen, and bad-tempered.", "example_cn": "工厂关闭后，这个曾经热闹的小镇变得阴沉，街道安静，店面空荡。", "example_en": "After the factory closed, the once lively town grew morose, its streets quiet and its storefronts empty.", "ipa": "məˈroʊs", "pos": "adj.", "word": "morose"}, {"def_cn": "好斗的，好争辩的。", "def_en": "Eager to fight or argue; aggressive.", "example_cn": "这位一向冷静的外交官在辩论中变得好斗，打断对手，质疑他们提出的每一个论点。", "example_en": "The usually calm diplomat turned combative during the debate, interrupting opponents and challenging every claim they made.", "ipa": "kəmˈbætɪv", "pos": "adj.", "word": "combative"}, {"def_cn": "不得体的，不合适的。", "def_en": "Improper or inappropriate in behavior.", "example_cn": "法官警告这位律师，他在法庭上不得体的爆发可能导致藐视法庭的罚款。", "example_en": "The judge warned the lawyer that his unseemly outburst in court could result in a fine for contempt.", "ipa": "ʌnˈsiːmli", "pos": "adj.", "word": "unseemly"}, {"def_cn": "自负的，傲慢的。", "def_en": "Showing an exaggerated sense of one's own importance; arrogant.", "example_cn": "这位自负的高管连听都不听就否定了实习生的建议，坚信自己的经验让他不会犯错。", "example_en": "The pompous executive dismissed the interns' suggestions without listening, convinced that his experience made him infallible.", "ipa": "ˈpɑːmpəs", "pos": "adj.", "word": "pompous"}, {"def_cn": "肆意的，无端的。", "def_en": "Deliberate and unprovoked; showing no care for consequences.", "example_cn": "委员会谴责了对湿地肆意的破坏，那片湿地曾是几十种濒危物种的栖息地。", "example_en": "The committee condemned the wanton destruction of the wetlands, which had provided habitat for dozens of endangered species.", "ipa": "ˈwɑːntən", "pos": "adj.", "word": "wanton"}], "practice": [{"qid": "d34-q1", "stem": "The debut album received widespread _____ from music critics, who praised its original melodies and named it one of the year's best records. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["acclaim", "misgiving", "largess", "glut"], "answer": "A", "explanation_en": "The text says critics praised the album and named it one of the year's best, so acclaim, meaning enthusiastic praise, fits. Misgiving means doubt, largess means generosity, and glut means an oversupply, none of which describe praise.", "explanation_cn": "文中说评论家称赞这张专辑并把它评为年度最佳之一，所以表示“热烈赞扬”的 acclaim 最合适。misgiving 是疑虑，largess 是慷慨，glut 是过量供应，都不符合“称赞”的语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d34-q2", "stem": "Stock prices _____ sharply during the crisis, rising on news of government aid and falling again as unemployment figures worsened. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["oscillated", "railed", "heeded", "instigated"], "answer": "A", "explanation_en": "The sentence describes prices rising and falling repeatedly, which matches oscillate, meaning to swing back and forth. Railed means complained angrily, heeded means paid attention to, and instigated means provoked, none of which describe repeated movement in two directions.", "explanation_cn": "句子描述股价在危机中反复涨跌，正好对应 oscillate（来回摆动）。railed 是愤怒抱怨，heeded 是听从，instigated 是煽动，都不能表示反复双向波动。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d34-q3", "stem": "After the storm _____ the coastline, volunteers from nearby towns arrived to help clear the debris. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": ["has battered", "had battered", "batters", "will batter"], "answer": "B", "explanation_en": "The storm happened before the volunteers arrived, so the past perfect had battered correctly shows the earlier action. Has battered is present perfect and does not fit the past narrative, batters is present tense, and will batter wrongly puts the storm in the future.", "explanation_cn": "风暴发生在志愿者到达之前，过去完成时 had battered 正确表示更早的动作。has battered 是现在完成时，与过去叙述不符；batters 是现在时；will batter 错误地把风暴放到未来。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan
