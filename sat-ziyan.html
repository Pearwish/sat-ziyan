Academy · Digital SAT 练习"}, {"qid": "d34-q4", "stem": "The following text is from a 2019 essay about urban parks. Parks do more than decorate a city. They cool overheated neighborhoods, absorb stormwater, and give residents a place to gather. Which choice best describes the function of the first sentence in the text as a whole?", "passage": "", "options": ["It summarizes the main argument of the essay.", "It introduces the specific benefits that the following sentences will describe.", "It contrasts urban parks with rural landscapes.", "It questions whether parks are worth their cost."], "answer": "B", "explanation_en": "The sentence makes a general claim that parks do more than decorate, and the following sentences list those additional benefits, so it introduces what comes next. It does not summarize the whole essay, make any rural contrast, or question the value of parks.", "explanation_cn": "这句话提出公园不止是装饰城市的总体观点，后文列举了具体好处，因此它的作用是引出后文。它没有总结全文，也没有对比乡村或质疑公园的价值。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d34-q5", "stem": "A recent study tracked two groups of office workers for six months. One group took a ten-minute walk outdoors each afternoon; the other remained at their desks. At the end of the study, the walking group reported significantly lower stress levels and completed tasks more quickly. Which choice best states the main idea of the text?", "passage": "", "options": ["Office workers should replace all indoor breaks with outdoor exercise.", "Desk workers are generally less healthy than other employees.", "Ten minutes is the ideal length for every work break.", "Short outdoor walks may reduce stress and improve productivity."], "answer": "D", "explanation_en": "The study found that the walking group had lower stress and worked faster, supporting the cautious claim that short walks may help. The text never says all breaks must be replaced, makes no comparison with other employees, and does not claim ten minutes is ideal for every break.", "explanation_cn": "研究发现散步组压力更低、工作更快，支持“短时间户外散步可能减压并提高效率”这一谨慎结论。文中没有说必须取代所有室内休息，没有与其他员工比较，也没有说十分钟适合所有休息。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d34-q6", "stem": "The landlord charged the students only a _____ fee for using the storage room, a sum so small that it barely covered the cost of the lock. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["nominal", "wanton", "pompous", "combative"], "answer": "A", "explanation_en": "The fee is described as so small it barely covered the lock's cost, matching nominal, meaning very small in amount. Wanton means deliberate and unprovoked, pompous means arrogant, and combative means eager to argue, none of which describe a tiny fee.", "explanation_cn": "费用小到几乎不够买锁的钱，对应 nominal（微不足道的）。wanton 是肆意的，pompous 是傲慢的，combative 是好斗的，都不能形容金额小。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d34-q7", "stem": "The new highway was expected to reduce traffic congestion. _____, commute times in the area increased by fifteen percent in the first year. Which choice completes the text with the most logical transition?", "passage": "", "options": ["For example,", "In fact,", "Therefore,", "However,"], "answer": "D", "explanation_en": "The second sentence contradicts the expectation in the first, so the contrast transition However fits. For example would introduce an illustration, In fact would emphasize agreement, and Therefore would signal a result, but the result here is the opposite of what was expected.", "explanation_cn": "第二句与第一句的预期相反，需要转折连词 However。For example 表举例，In fact 表强调一致，Therefore 表结果，但这里的结果与预期恰恰相反。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d34-q8", "stem": "The committee praised the two _____ dedication to the project. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": ["scientists", "scientist's", "scientists'", "scientists's"], "answer": "C", "explanation_en": "Two scientists is plural, and their dedication belongs to them, so the plural possessive scientists' is correct. Scientists has no possessive form, scientist's is singular, and scientists's is not a standard form.", "explanation_cn": "two scientists 是复数，dedication 属于他们，所以用复数所有格 scientists'。scientists 没有所有格形式，scientist's 是单数，scientists's 不是规范形式。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d34-q9", "stem": "After losing the championship in the final seconds, the players were _____, sitting silently in the locker room long after the game ended. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["morose", "despondent", "felicitous", "workaday"], "answer": "B", "explanation_en": "The players lost and sat silently, suggesting discouraged hopelessness, which is despondent. Morose is close but describes a sullen, gloomy temper rather than crushed hope. Felicitous means fortunate and workaday means ordinary, both positive or neutral and wrong in tone.", "explanation_cn": "队员输了比赛后沉默地坐着，表现出沮丧绝望，即 despondent。morose 虽接近，但更强调阴沉的脾气而非希望破灭。felicitous 是幸运的，workaday 是平常的，感情色彩都不对。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d34-q10", "stem": "Marine biologists have discovered that certain coral species can recover from bleaching if water temperatures drop quickly enough. The finding suggests that protecting reefs from additional stress, such as pollution, could buy corals the time they need to survive warming oceans. According to the text, what is one way to help corals survive?", "passage": "", "options": ["Reducing other pressures like pollution on reefs.", "Raising water temperatures around reefs.", "Moving all coral species to cooler waters.", "Preventing any bleaching from occurring."], "answer": "A", "explanation_en": "The text says protecting reefs from additional stress such as pollution could buy corals time to survive. Raising temperatures would worsen bleaching, the text never suggests moving corals, and it does not claim bleaching can be fully prevented.", "explanation_cn": "文中说减少污染等额外压力可以为珊瑚争取存活时间。升高水温会加重白化，文中没提搬迁珊瑚，也没说能完全防止白化。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-15"}, {"day": 35, "words": [{"def_cn": "熟练的，内行的。", "def_en": "Highly skilled or expert at something.", "example_cn": "这位技术娴熟的外科医生用时不到一半就完成了精细的手术，赢得了整个医疗团队的称赞。", "example_en": "The adept surgeon completed the delicate procedure in half the usual time, earning praise from the entire medical team.", "ipa": "əˈdɛpt", "pos": "adj.", "word": "adept"}, {"def_cn": "奉为神圣，奉献。", "def_en": "To declare something sacred or dedicate it to a purpose.", "example_cn": "社区把这座新纪念碑奉献给在灾难中牺牲的消防员。", "example_en": "The community consecrated the new memorial to the firefighters who had lost their lives in the disaster.", "ipa": "ˈkɑːnsɪkreɪt", "pos": "v.", "word": "consecrate"}, {"def_cn": "推论，自然结果。", "def_en": "A natural consequence or result of something.", "example_cn": "新税法的一个自然结果是慈善捐款大幅上升，因为捐赠者争相申报抵税。", "example_en": "A corollary of the new tax law was a sharp rise in charitable donations, as donors rushed to claim deductions.", "ipa": "ˈkɔːrəleri", "pos": "n.", "word": "corollary"}, {"def_cn": "粗鲁的，粗俗的。", "def_en": "Rude and insensitive; lacking refinement.", "example_cn": "这位喜剧演员粗俗的笑话冒犯了许多观众，几家赞助商在演出后撤回了支持。", "example_en": "The comedian's crass jokes offended much of the audience, and several sponsors withdrew their support after the show.", "ipa": "kræs", "pos": "adj.", "word": "crass"}, {"def_cn": "关键，症结。", "def_en": "The most important or decisive point of an issue.", "example_cn": "这场辩论的关键在于，大坝的益处是否超过了对山谷生态系统的破坏。", "example_en": "The crux of the debate was whether the benefits of the dam outweighed the destruction of the valley's ecosystem.", "ipa": "krʌks", "pos": "n.", "word": "crux"}, {"def_cn": "奉为神明，过度崇拜。", "def_en": "To worship someone as a god; to glorify excessively.", "example_cn": "粉丝们倾向于把成功的运动员奉为神明，忘记了他们也是有普通缺点的普通人。", "example_en": "Fans tend to deify successful athletes, forgetting that they are ordinary people with ordinary flaws.", "ipa": "ˈdeɪəfaɪ", "pos": "v.", "word": "deify"}, {"def_cn": "二分法，对立。", "def_en": "A division into two opposing groups or ideas.", "example_cn": "这部小说探讨了财富与幸福之间的对立，表明富足并不保证满足。", "example_en": "The novel explores the dichotomy between wealth and happiness, showing that prosperity does not guarantee contentment.", "ipa": "daɪˈkɑːtəmi", "pos": "n.", "word": "dichotomy"}, {"def_cn": "离题的，散漫的。", "def_en": "Moving from topic to topic; rambling and not focused.", "example_cn": "教授散漫的讲座从古罗马扯到现代政治，学生们对主旨一头雾水。", "example_en": "The professor's discursive lecture wandered from ancient Rome to modern politics, leaving students confused about the main point.", "ipa": "dɪˈskɜːrsɪv", "pos": "adj.", "word": "discursive"}, {"def_cn": "不和谐，冲突。", "def_en": "Lack of harmony or agreement; a harsh clash.", "example_cn": "公司欢快的广告与过度劳累员工的抱怨之间存在明显的不和谐。", "example_en": "There was a clear dissonance between the company's cheerful advertisements and the complaints of its overworked employees.", "ipa": "ˈdɪsənəns", "pos": "n.", "word": "dissonance"}, {"def_cn": "模拟像，肖像。", "def_en": "A model or statue representing a person, often burned in protest.", "example_cn": "抗议者在议会大厦外焚烧了州长的模拟像，表达对教育经费削减的愤怒。", "example_en": "Protesters burned an effigy of the governor outside the capitol, expressing their anger at the new education cuts.", "ipa": "ˈɛfɪdʒi", "pos": "n.", "word": "effigy"}, {"def_cn": "解放，使摆脱束缚。", "def_en": "To set free from slavery, control, or restrictions.", "example_cn": "新法律把数千名工人从不公平的合同中解放出来，那些合同曾把他们束缚在单一雇主手下。", "example_en": "The new law emancipated thousands of workers from unfair contracts that had bound them to a single employer.", "ipa": "ɪˈmænsɪpeɪt", "pos": "v.", "word": "emancipate"}, {"def_cn": "迷住，深深吸引。", "def_en": "To capture someone's attention completely; to fascinate.", "example_cn": "讲故事的人用海怪的故事迷住了孩子们，谁也没注意到外面的雨。", "example_en": "The storyteller enthralled the children with tales of sea monsters, and none of them noticed the rain outside.", "ipa": "ɪnˈθrɔːl", "pos": "v.", "word": "enthrall"}, {"def_cn": "信奉，支持（观点、事业）。", "def_en": "To adopt or support an idea, cause, or belief.", "example_cn": "这位年轻参议员支持环保改革，承诺十年内减少该州的碳排放。", "example_en": "The young senator espoused environmental reforms, pledging to reduce the state's carbon emissions within a decade.", "ipa": "ɪˈspaʊz", "pos": "v.", "word": "espouse"}, {"def_cn": "推断，推测。", "def_en": "To estimate or predict based on known data or trends.", "example_cn": "分析师根据第一季度的销售额推算出公司年收入，预测利润将创纪录。", "example_en": "From the sales of the first quarter, analysts extrapolated the company's annual revenue and predicted record profits.", "ipa": "ɪkˈstræpəleɪt", "pos": "v.", "word": "extrapolate"}, {"def_cn": "诚实的，单纯的。", "def_en": "Honest and sincere; without deceit.", "example_cn": "这个单纯的孩子立刻承认打碎了花瓶，丝毫没有想推卸给弟弟。", "example_en": "The guileless child admitted breaking the vase immediately, showing no attempt to blame her brother.", "ipa": "ˈɡaɪlləs", "pos": "adj.", "word": "guileless"}, {"def_cn": "放荡的，不检点的。", "def_en": "Lacking moral restraint, especially in behavior.", "example_cn": "评论家谴责这部小说中放荡的场景，认为它们对故事的深层主题毫无助益。", "example_en": "Critics condemned the novel's licentious scenes, arguing that they added nothing to the story's deeper themes.", "ipa": "laɪˈsɛnʃəs", "pos": "adj.", "word": "licentious"}, {"def_cn": "讨好，抚慰。", "def_en": "To win back someone's favor; to appease.", "example_cn": "为了安抚愤怒的居民，开发商承诺在新购物中心旁建一座公共公园。", "example_en": "Hoping to propitiate the angry residents, the developer promised to build a public park beside the new shopping center.", "ipa": "prəˈpɪʃieɪt", "pos": "v.", "word": "propitiate"}, {"def_cn": "引起共鸣的，深远的。", "def_en": "Deeply meaningful; evoking strong emotion or memory.", "example_cn": "作者对移民经历的记述至今仍引起共鸣，提醒读者这样的旅程需要多大的勇气。", "example_en": "The author's account of immigration remains resonant today, reminding readers of the courage such journeys require.", "ipa": "ˈrɛzənənt", "pos": "adj.", "word": "resonant"}, {"def_cn": "贪污的，唯利是图的。", "def_en": "Corrupt and willing to do wrong for money.", "example_cn": "调查揭露了贪污的市长，他曾收受贿赂以换取授予市政合同。", "example_en": "The investigation exposed the venal mayor, who had accepted bribes in exchange for awarding city contracts.", "ipa": "ˈviːnəl", "pos": "adj.", "word": "venal"}, {"def_cn": "迷人的，吸引人的。", "def_en": "Charming and interesting; holding one's attention.", "example_cn": "这位迷人的演讲者让观众笑声不断，把枯燥的话题变成了难忘的一晚。", "example_en": "The engaging speaker kept the audience laughing, turning a dry topic into an unforgettable evening.", "ipa": "ɪnˈɡeɪdʒɪŋ", "pos": "adj.", "word": "engaging"}], "practice": [{"qid": "d35-q1", "stem": "The _____ of the disagreement was simple: the two partners could not agree on whether to expand the business or keep it small. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["crux", "effigy", "dichotomy", "dissonance"], "answer": "A", "explanation_en": "The sentence asks for the central point of the disagreement, which is the crux. Dichotomy describes a division into two opposites but does not name the decisive point. Effigy is a statue used in protest, and dissonance is a clash or lack of harmony, neither of which fits.", "explanation_cn": "句子要找的是分歧的核心要点，即 crux。dichotomy 指分成两个对立面，但不是“关键点”本身。effigy 是抗议用的模拟像，dissonance 是冲突不和谐，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d35-q2", "stem": "By studying the growth of the trees over five years, the researchers were able to _____ how tall the forest would become in fifty years. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["consecrate", "deify", "extrapolate", "emancipate"], "answer": "C", "explanation_en": "The researchers used five years of data to predict future growth, which is extrapolate. Consecrate means to declare sacred, deify means to worship as a god, and emancipate means to set free, none of which involve prediction from data.", "explanation_cn": "研究者用五年的数据预测未来长势，即 extrapolate（推断）。consecrate 是奉为神圣，deify 是奉为神明，emancipate 是解放，都与根据数据预测无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d35-q3", "stem": "The new library, with its bright reading rooms and quiet study areas, _____ become a favorite gathering place for students. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": ["has", "have", "having", "are"], "answer": "A", "explanation_en": "The subject is the singular noun library, so the verb must be singular: has. Have and are are plural, and having leaves the sentence without a main verb.", "explanation_cn": "主语是单数 library，谓语也要用单数 has。have 和 are 是复数，having 会让句子缺少主要谓语动词。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d35-q4", "stem": "The following text is from a 2021 article about honeybees. A single hive can house up to 60,000 bees, yet the colony functions as one coordinated unit. Scouts report the location of flowers, workers adjust their tasks with the seasons, and the queen's presence keeps the entire system stable. Which choice best states the main purpose of the text?", "passage": "", "options": ["To argue that honeybees are more intelligent than other insects.", "To explain why bee populations are declining worldwide.", "To compare the roles of scouts, workers, and queens.", "To describe how the parts of a hive work together as a system."], "answer": "D", "explanation_en": "The text emphasizes that the hive functions as one coordinated unit and gives examples of cooperation, so its purpose is to describe that teamwork. It makes no claim about intelligence compared with other insects, never mentions population decline, and does not compare the roles against one another.", "explanation_cn": "文中强调蜂群作为一个协调的整体运作，并举例说明合作，因此主旨是描述这种协作。它没有说蜜蜂比其他昆虫聪明，没提种群下降，也没有对比各角色。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d35-q5", "stem": "In the 1800s, lighthouse keepers lived in isolation for months, tending lamps that guided ships away from dangerous coasts. Though their work was lonely, keepers took pride in knowing that a single missed night could mean disaster for sailors. Which choice best describes the lighthouse keepers' attitude toward their work?", "passage": "", "options": ["They resented the isolation and wished to leave.", "They believed the work was unimportant.", "They feared the ships they were guiding.", "They felt proud despite the loneliness."], "answer": "D", "explanation_en": "The text says the work was lonely but the keepers took pride in its importance, matching choice D. Nothing suggests they resented the job or wanted to leave, they clearly saw the work as important, and there is no mention of fearing ships.", "explanation_cn": "文中说工作孤独，但守塔人以它为荣，对应 D。文中没有说他们怨恨想离开，他们显然认为工作重要，也没有提到害怕船只。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d35-q6", "stem": "The journalist uncovered a _____ scheme in which officials awarded public contracts to companies that had secretly paid them. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["guileless", "venal", "engaging", "adept"], "answer": "B", "explanation_en": "Officials taking secret payments for contracts are corrupt and motivated by money, which is venal. Guileless means honest, the opposite of the needed meaning. Engaging means charming and adept means skilled, neither of which describes corruption.", "explanation_cn": "官员收受秘密贿赂授予合同，是贪污受贿，即 venal。guileless 是诚实，意思正好相反；engaging 是迷人，adept 是熟练，都不能形容腐败。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d35-q7", "stem": "The new policy will help reduce costs by cutting unnecessary expenses and eliminating spending that is not needed. Which choice best revises the sentence to eliminate redundancy?", "passage": "", "options": ["The new policy will help reduce costs by cutting unnecessary expenses and eliminating spending that is not needed at this time.", "The new policy will help reduce costs by cutting unnecessary expenses.", "The new policy, which is new, will help reduce costs by cutting unnecessary expenses and eliminating spending that is not needed.", "The new policy will help to reduce costs by cutting unnecessary expenses and also eliminating spending that is not needed as well."], "answer": "B", "explanation_en": "Choice B keeps the meaning while removing the redundant phrase, since eliminating spending that is not needed repeats cutting unnecessary expenses. The other choices keep the repetition or add new wordy phrases such as at this time and as well.", "explanation_cn": "B 在保留原意的同时删掉了重复表达，因为 eliminating spending that is not needed 与 cutting unnecessary expenses 意思重复。其他选项保留了重复或增加了 at this time、as well 等冗余表达。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d35-q8", "stem": "To succeed in the competition, the team needed to practice daily, to study their opponents, and _____ a clear strategy. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": ["developing", "develop", "to develop", "developed"], "answer": "C", "explanation_en": "The list uses parallel infinitives, to practice and to study, so the third item must also be an infinitive: to develop. Developing breaks the parallel structure, develop lacks to, and developed wrongly shifts to past tense.", "explanation_cn": "并列结构用的是不定式 to practice、to study，所以第三项也要用不定式 to develop。developing 破坏平行结构，develop 缺少 to，developed 错误地转成过去时。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d35-q9", "stem": "The candidate _____ a platform of lower taxes and better schools, winning support from voters across the political spectrum. Which choice completes the text with the most logical and precise word?", "passage": "", "options": ["deified", "propitiated", "espoused", "enthralled"], "answer": "C", "explanation_en": "The candidate adopted and supported a political platform, which is espoused. Deified means worshipped as a god, propitiated means appeased, and enthralled means fascinated, none of which mean adopting a set of ideas.", "explanation_cn": "候选人采纳并支持一套施政纲领，即 espouse。deified 是奉为神明，propitiated 是安抚，enthralled 是迷住，都不表示采纳观点。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d35-q10", "stem": "Geologists studying the canyon found layers of rock that recorded millions of years of climate change. The oldest layers formed when the region was a shallow sea; the newest show signs of recent drought. Which choice best states the main idea of the text?", "passage": "", "options": ["The region was once covered by a shallow sea.", "Recent droughts are the worst in the canyon's history.", "The canyon's rock layers preserve a long record of changing climate.", "Geologists disagree about how the canyon formed."], "answer": "C", "explanation_en": "The text describes rock layers recording millions of years of climate change, from ancient seas to recent drought, so the main idea is that the layers preserve a long climate record. The sea is only one detail, the text never says recent droughts are the worst, and no disagreement among geologists is mentioned.", "explanation_cn": "文中描述岩层记录了从远古浅海到近期干旱的数百万年气候变化，主旨是岩层保存了漫长的气候记录。浅海只是一个细节，文中没说近期干旱最严重，也没提地质学家有分歧。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-16"}, {"day": 36, "words": [{"def_cn": "为有争议的人或观点辩护的人", "def_en": "A person who defends or speaks in favor of a controversial person, idea, or policy.", "example_cn": "尽管批评者谴责这项新政策，但它最直言不讳的辩护者认为，从长远来看它会增强经济实力。", "example_en": "Although critics condemned the new policy, its most vocal apologist argued that it would strengthen the economy in the long run.", "ipa": "/əˈpɑːlədʒɪst/", "pos": "n.", "word": "apologist"}, {"def_cn": "甜得发腻的；过分甜蜜而令人不快的", "def_en": "Excessively sweet or sentimental to the point of being unpleasant.", "example_cn": "这部小说甜得发腻的多愁善感——每一章都以泪水和团聚收尾——最终让最忠实的读者也感到疲惫。", "example_en": "The novel's cloying sentimentality, with every chapter ending in tears and reunions, eventually exhausted even its most devoted readers.", "ipa": "/ˈklɔɪɪŋ/", "pos": "adj.", "word": "cloying"}, {"def_cn": "令人困惑的难题；谜题", "def_en": "A confusing and difficult problem or question.", "example_cn": "经济学家们面临一个难题：加息可能遏制通胀，但也有把国家推入衰退的风险。", "example_en": "Economists faced a conundrum: raising interest rates could curb inflation but also risked pushing the country into recession.", "ipa": "/kəˈnʌndrəm/", "pos": "n.", "word": "conundrum"}, {"def_cn": "正式契约；盟约", "def_en": "A formal, binding agreement between two or more parties.", "example_cn": "通过签署这份契约，两家公司承诺共享研究数据，并不在对方的市场中竞争。", "example_en": "By signing the covenant, the two companies pledged to share research data and refrain from competing in each other's markets.", "ipa": "/ˈkʌvənənt/", "pos": "n.", "word": "covenant"}, {"def_cn": "信任；信以为真", "def_en": "Belief in or acceptance of something as true.", "example_cn": "这个传言只在两家独立报纸向官方消息源核实细节之后才变得可信。", "example_en": "The rumor gained credence only after two independent newspapers confirmed the details with official sources.", "ipa": "/ˈkriːdəns/", "pos": "n.", "word": "credence"}, {"def_cn": "不赞成；反对", "def_en": "To express strong disapproval of something.", "example_cn": "委员会不赞成这项提议，认为其成本远远超过对社区的任何潜在好处。", "example_en": "The committee deprecated the proposal, arguing that its costs far outweighed any potential benefits to the community.", "ipa": "/ˈdeprəkeɪt/", "pos": "v.", "word": "deprecate"}, {"def_cn": "使不安；使难堪", "def_en": "To make someone feel uneasy, embarrassed, or confused.", "example_cn": "在新闻发布会上，关于利润下滑的意外提问明显让这位首席执行官感到难堪。", "example_en": "The unexpected question about declining profits visibly discomfited the CEO during the press conference.", "ipa": "/dɪsˈkʌmfɪt/", "pos": "v.", "word": "discomfit"}, {"def_cn": "不安；焦虑", "def_en": "A feeling of anxiety or worry.", "example_cn": "随着工厂宣布又一轮裁员，一种日益增长的不安情绪在镇上蔓延开来。", "example_en": "A growing sense of disquiet spread through the town as the factory announced another round of layoffs.", "ipa": "/dɪsˈkwaɪət/", "pos": "n.", "word": "disquiet"}, {"def_cn": "持不同政见者", "def_en": "A person who opposes official policy, especially that of an authoritarian state.", "example_cn": "这位持不同政见者因发表公开挑战政府官方说法的文章而被捕。", "example_en": "The dissident was arrested for publishing articles that openly challenged the government's official narrative.", "ipa": "/ˈdɪsɪdənt/", "pos": "n.", "word": "dissident"}, {"def_cn": "极坏的；骇人听闻的", "def_en": "Outstandingly bad; shocking and unacceptable.", "example_cn": "这份报告揭露了骇人听闻的违反安全标准的行为，多年来一直危及工人的安全。", "example_en": "The report exposed egregious violations of safety standards that had endangered workers for years.", "ipa": "/ɪˈɡriːdʒəs/", "pos": "adj.", "word": "egregious"}, {"def_cn": "侵犯；蚕食（领地、权利）", "def_en": "To intrude gradually on a person's territory, rights, or privacy.", "example_cn": "居民们抱怨说，新高速公路将侵占受保护的湿地，威胁当地野生动物。", "example_en": "Residents complained that the new highway would encroach on protected wetlands and threaten local wildlife.", "ipa": "/ɪnˈkroʊtʃ/", "pos": "v.", "word": "encroach"}, {"def_cn": "警句；机智隽永的短语", "def_en": "A pithy saying that expresses an idea in a clever and amusing way.", "example_cn": "王尔德的名言警句——除了诱惑，他什么都能抵挡——至今仍让读者感到愉悦。", "example_en": "Wilde's famous epigram, that he could resist everything except temptation, still delights readers today.", "ipa": "/ˈepɪɡræm/", "pos": "n.", "word": "epigram"}, {"def_cn": "值得尊敬的", "def_en": "Worthy of great respect and admiration.", "example_cn": "这位值得尊敬的教授不仅因其研究而受人敬仰，还因她对学生的奉献精神而备受爱戴。", "example_en": "The estimable professor was admired not only for her research but also for her dedication to students.", "ipa": "/ˈestɪməbəl/", "pos": "adj.", "word": "estimable"}, {"def_cn": "赞扬；褒扬", "def_en": "To praise someone or something highly.", "example_cn": "这部传记把主人公赞扬为有远见的领袖，尽管一些历史学家对这种溢美之词提出质疑。", "example_en": "The biography exalts its subject as a visionary leader, though some historians question this flattering portrait.", "ipa": "/ɪɡˈzɔːlt/", "pos": "v.", "word": "exalt"}, {"def_cn": "偏离正道的；误入歧途的", "def_en": "Straying from the accepted course, standards, or path.", "example_cn": "这枚偏离轨道的导弹偏离了预定路径，无害地落在一片空地上。", "example_en": "The errant missile strayed from its intended path and landed harmlessly in an empty field.", "ipa": "/ˈerənt/", "pos": "adj.", "word": "errant"}, {"def_cn": "不服从的；抗命的", "def_en": "Defiant of authority; refusing to obey orders.", "example_cn": "这名抗命的军官在多次拒绝服从指挥官的直接命令后被开除。", "example_en": "The insubordinate officer was dismissed after repeatedly refusing to follow direct orders from his commander.", "ipa": "/ˌɪnsəˈbɔːrdənət/", "pos": "adj.", "word": "insubordinate"}, {"def_cn": "铁板一块的；庞大而单一的", "def_en": "Forming a single large, uniform block; massive and undivided.", "example_cn": "批评者曾把这个党看作铁板一块，但最近的辩论揭示了其内部深刻的分歧。", "example_en": "Critics once viewed the party as monolithic, but recent debates have revealed deep divisions within its ranks.", "ipa": "/ˌmɑːnəˈlɪθɪk/", "pos": "adj.", "word": "monolithic"}, {"def_cn": "崇高的；壮美的", "def_en": "Of such excellence, grandeur, or beauty as to inspire great admiration or awe.", "example_cn": "站在喜马拉雅壮美的群峰前，登山者们既感到敬畏又感到谦卑。", "example_en": "Standing before the sublime peaks of the Himalayas, the climbers felt both awe and humility.", "ipa": "/səˈblaɪm/", "pos": "adj.", "word": "sublime"}, {"def_cn": "辱骂；痛斥", "def_en": "To blame or insult someone abusively and harshly.", "example_cn": "这篇社论痛斥市长的腐败行为，称这届政府是这座城市的耻辱。", "example_en": "The editorial vituperated the mayor for corruption, calling the administration a disgrace to the city.", "ipa": "/vaɪˈtuːpəreɪt/", "pos": "v.", "word": "vituperate"}, {"def_cn": "挽歌；哀歌", "def_en": "A lament for the dead, especially one forming part of a funeral rite.", "example_cn": "当送葬队伍抬着牺牲的英雄穿过寂静的街道时，乐队奏起了一首缓慢的挽歌。", "example_en": "The orchestra played a slow dirge as the procession carried the fallen hero through the silent streets.", "ipa": "/dɜːrdʒ/", "pos": "n.", "word": "dirge"}], "practice": [{"qid": "d36-q1", "stem": "In 1215, English barons forced King John to sign the Magna Carta, a _______ that limited royal power and established that even the monarch was subject to the law.", "passage": "", "options": ["rumor", "covenant", "jest", "coincidence"], "answer": "B", "explanation_en": "The sentence describes the Magna Carta as a signed document that bound the king to the law, so the blank calls for a word meaning a formal agreement. Covenant fits perfectly. Rumor, jest, and coincidence cannot describe a binding legal document.", "explanation_cn": "句子把《大宪章》描述为一份约束国王遵守法律的签署文件，所以空格需要“正式协议”的意思。Covenant 完全符合。Rumor（谣言）、jest（玩笑）、coincidence（巧合）都无法形容有约束力的法律文件。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d36-q2", "stem": "Marina Keegan's essays are often described as precocious, but that label misses what makes them endure. She writes with an urgency that belies her age, treating ordinary moments—a kitchen conversation, a car ride home—as worthy of serious attention. Which choice best describes the main purpose of the text?", "passage": "", "options": ["argue that Keegan's work has been undervalued by critics", "compare Keegan's writing style with that of other young writers", "suggest that a common description of Keegan's essays is inadequate", "explain why Keegan chose ordinary subjects for her essays"], "answer": "C", "explanation_en": "The first sentence rejects the label precocious as missing what makes the essays endure, and the rest supports that judgment. The text therefore suggests the common description is inadequate. It does not claim critics undervalue the work, compare Keegan to other writers, or explain her choice of subjects.", "explanation_cn": "第一句否定 precocious 这个标签，认为它没抓住散文经久不衰的原因，后文用例子支撑这个判断。因此文章是在说这个常见描述不够准确。文章没有说评论家低估了她的作品，没有拿她和其他作家比较，也没有解释她为什么选日常题材。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d36-q3", "stem": "Which choice is correctly punctuated?", "passage": "", "options": ["The scientist's discovery, a previously unknown species of deep-sea fish challenged long-held assumptions about ocean life.", "The scientist's discovery, a previously unknown species of deep-sea fish; challenged long-held assumptions about ocean life.", "The scientist's discovery a previously unknown species of deep-sea fish, challenged long-held assumptions about ocean life.", "The scientist's discovery—a previously unknown species of deep-sea fish—challenged long-held assumptions about ocean life."], "answer": "D", "explanation_en": "The phrase a previously unknown species of deep-sea fish is a nonessential appositive renaming the discovery, so it must be set off with matching punctuation on both sides. Only choice D uses paired em dashes correctly. The other choices mix or omit the required punctuation.", "explanation_cn": "A previously unknown species of deep-sea fish 是非限制性同位语，对 discovery 补充说明，前后必须用成对的标点隔开。只有 D 用了成对的破折号。其他选项标点搭配错误或缺失。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d36-q4", "stem": "The audit uncovered _______ errors in the company's bookkeeping: entire transactions had been omitted, and the reported profits were nearly double the actual figures.", "passage": "", "options": ["subtle", "minor", "egregious", "occasional"], "answer": "C", "explanation_en": "The context describes omitted transactions and profits reported at nearly double the real figures, which are extremely serious errors. Egregious means outstandingly bad and fits. Subtle, minor, and occasional all suggest the errors were small or infrequent, contradicting the evidence.", "explanation_cn": "语境描述的是整笔交易被遗漏、利润虚报近一倍，这是极其严重的错误。Egregious 意为“极坏的”，正好符合。Subtle（细微的）、minor（轻微的）、occasional（偶尔的）都暗示错误很小或不常见，与证据矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d36-q5", "stem": "Honeybees communicate the location of food through the waggle dance, a figure-eight pattern whose angle indicates direction relative to the sun. In 2022, researchers found that bees raised in colonies exposed to artificial light performed the dance with significantly less precision, suggesting that light pollution disrupts not just navigation but the very language bees use to share information. Based on the text, what can most reasonably be inferred about artificial light?", "passage": "", "options": ["It impairs bees' ability to communicate food locations accurately.", "It prevents bees from performing the waggle dance entirely.", "It is the primary cause of declining bee populations worldwide.", "It affects only bees raised in laboratory settings."], "answer": "A", "explanation_en": "The text says light-exposed bees performed the dance with significantly less precision, which means their communication of food locations became less accurate. Choice A states exactly that. The dance was not eliminated, no claim is made about global population decline, and the study was not limited to labs.", "explanation_cn": "文章说接触人造光的蜜蜂跳舞的精确度明显下降，也就是说它们传达食物位置的能力变差了。A 正是这个意思。舞蹈并没有消失，文章没提全球蜂群数量下降，研究也不限于实验室。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d36-q6", "stem": "Coral reefs support a quarter of all marine species. _______ rising ocean temperatures have caused mass bleaching events that threaten these ecosystems. Which choice completes the text with the most logical transition?", "passage": "", "options": ["Consequently,", "However,", "For example,", "In contrast,"], "answer": "B", "explanation_en": "The second sentence turns from the value of reefs to the threat against them, so a contrast transition is needed. However signals that turn. Consequently implies cause and effect, for example introduces an illustration, and in contrast needs a direct comparison between two parallel items.", "explanation_cn": "第二句从珊瑚礁的价值转到它面临的威胁，需要转折连词。However 表示这种转折。Consequently 表因果，for example 引出例子，in contrast 需要两个并列事物的直接对比，都不合适。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d36-q7", "stem": "Each of the researchers _______ access to the raw data before the committee released its findings. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": ["are given", "have been given", "was given", "were given"], "answer": "C", "explanation_en": "The subject is Each, which is singular, so the verb must be singular: was given. Choices A, B, and D use plural or mismatched verb forms that do not agree with the singular subject.", "explanation_cn": "主语是 Each，单数，所以谓语必须用单数 was given。A、B、D 用的都是复数或不匹配的动词形式，与单数主语不一致。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d36-q8", "stem": "Standing at the edge of the Grand Canyon at sunrise, the hikers were struck by a _______ beauty that made words feel inadequate.", "passage": "", "options": ["mundane", "trivial", "garish", "sublime"], "answer": "D", "explanation_en": "The hikers feel words are inadequate before the canyon's beauty at sunrise, pointing to beauty of overwhelming grandeur. Sublime means inspiring awe through grandeur. Mundane, trivial, and garish describe ordinary or unpleasant qualities, the opposite of the intended meaning.", "explanation_cn": "徒步者在日出时分的峡谷美景前觉得语言苍白，说明这是一种令人震撼的壮美。Sublime 意为“因壮美而令人敬畏的”。Mundane（平凡的）、trivial（微不足道的）、garish（俗艳的）意思相反。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d36-q9", "stem": "In her speech, the mayor repeatedly used the word 'crisis' to describe the city's budget shortfall, although analysts noted the deficit was modest and temporary. Which choice best describes the effect of the mayor's word choice?", "passage": "", "options": ["It demonstrates her familiarity with economic terminology.", "It shifts blame for the shortfall onto previous administrations.", "It understates the severity of the problem to avoid panic.", "It lends an exaggerated sense of urgency to the situation."], "answer": "D", "explanation_en": "Analysts say the deficit is modest and temporary, yet the mayor calls it a crisis, so her word choice exaggerates the urgency. Choice D captures this. She is not showing off terminology, blaming predecessors, or understating the problem.", "explanation_cn": "分析师说赤字不大且是暂时的，市长却称之为 crisis，所以她的用词夸大了紧迫感。D 抓住了这一点。她不是在炫耀术语，没有把责任推给前任，也不是在淡化问题。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d36-q10", "stem": "The archaeological team wanted to date the pottery shards. They used thermoluminescence testing. This method measures accumulated radiation in ceramics. It can determine when the pottery was last fired. Which choice most effectively combines the sentences?", "passage": "", "options": ["The archaeological team wanted to date the pottery shards, and they used thermoluminescence testing, and this method measures accumulated radiation.", "Thermoluminescence testing measures accumulated radiation in ceramics, so the team wanted to date the pottery shards.", "The pottery shards were dated by the team, who used a method that measures radiation to determine firing.", "The archaeological team used thermoluminescence testing, which measures accumulated radiation in ceramics, to date the pottery shards and determine when they were last fired."], "answer": "D", "explanation_en": "Choice D merges all four sentences smoothly with a relative clause, keeping every key detail. A merely strings clauses together with and, B drops the purpose of dating the shards, and C is vague about what the method measures.", "explanation_cn": "D 用定语从句把四个句子的信息流畅合并，保留了所有关键细节。A 只是用 and 生硬拼接，B 丢掉了“断代”这个目的，C 对测量对象表述模糊。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-17"}, {"day": 37, "words": [{"def_cn": "仲裁者；权威人士", "def_en": "A person who settles a dispute, or whose opinions are widely respected.", "example_cn": "作为全国文学品味的权威仲裁者，这位评论家的书评可以决定一部新小说的成败。", "example_en": "As the nation's leading arbiter of literary taste, the critic's reviews could make or break a new novel.", "ipa": "/ˈɑːrbɪtər/", "pos": "n.", "word": "arbiter"}, {"def_cn": "自负；骄傲", "def_en": "Excessive pride in oneself.", "example_cn": "他的自负让他看不到自己的错误，同事们很快不再向他提供坦诚的建议。", "example_en": "His conceit blinded him to his own mistakes, and colleagues soon stopped offering him honest advice.", "ipa": "/kənˈsiːt/", "pos": "n.", "word": "conceit"}, {"def_cn": "谋划；精心设计", "def_en": "To create or bring about something through deliberate planning and skill.", "example_cn": "学生们精心设计了一个复杂的实验，来测试植物在音乐环境中是否长得更快。", "example_en": "The students contrived an elaborate experiment to test whether plants grow faster when exposed to music.", "ipa": "/kənˈtraɪv/", "pos": "v.", "word": "contrive"}, {"def_cn": "觊觎；贪求（别人的东西）", "def_en": "To yearn to possess something that belongs to someone else.", "example_cn": "她并不觊觎邻居的财富；相反，她钦佩赢得这些财富的辛勤工作。", "example_en": "She did not covet her neighbor's wealth; instead, she admired the hard work that had earned it.", "ipa": "/ˈkʌvət/", "pos": "v.", "word": "covet"}, {"def_cn": "脾气暴躁的", "def_en": "Irritable and bad-tempered.", "example_cn": "这位脾气暴躁的房东抱怨每一点细小的噪音，让房客们颇为恼火。", "example_en": "The crotchety landlord complained about every minor noise, much to the annoyance of his tenants.", "ipa": "/ˈkrɑːtʃəti/", "pos": "adj.", "word": "crotchety"}, {"def_cn": "乖戾的人；老顽固", "def_en": "A bad-tempered person, especially an old one.", "example_cn": "这位老顽固粗鲁的外表背后，是一个暗中向儿童医院捐款的人。", "example_en": "Behind the old curmudgeon's gruff exterior was a man who secretly donated to the children's hospital.", "ipa": "/kərˈmʌdʒən/", "pos": "n.", "word": "curmudgeon"}, {"def_cn": "贬损；诋毁", "def_en": "The action of taking away from someone's reputation; disparagement.", "example_cn": "尽管竞争对手不断贬损，这位科学家的开创性研究最终赢得了广泛认可。", "example_en": "Despite constant detraction from his rivals, the scientist's groundbreaking research eventually won wide recognition.", "ipa": "/dɪˈtrækʃən/", "pos": "n.", "word": "detraction"}, {"def_cn": "有眼光的；明辨的", "def_en": "Having or showing good judgment.", "example_cn": "眼光敏锐的收藏家立刻认出这幅画是赝品，因为它的笔触前后不一致。", "example_en": "Discerning collectors immediately recognized the painting as a forgery because of its inconsistent brushwork.", "ipa": "/dɪˈsɜːrnɪŋ/", "pos": "adj.", "word": "discerning"}, {"def_cn": "消散；驱散", "def_en": "To disperse, scatter, or fade away.", "example_cn": "随着太阳在山谷上空越升越高，晨雾逐渐消散。", "example_en": "The morning fog gradually dissipated as the sun rose higher over the valley.", "ipa": "/ˈdɪsəpeɪt/", "pos": "v.", "word": "dissipate"}, {"def_cn": "泄露；透露（私密信息）", "def_en": "To make known private or sensitive information.", "example_cn": "即使在巨大的压力下，这位记者也拒绝透露消息来源的身份。", "example_en": "The journalist refused to divulge the identity of her source, even under intense pressure.", "ipa": "/daɪˈvʌldʒ/", "pos": "v.", "word": "divulge"}, {"def_cn": "难以捉摸的；难以达到的", "def_en": "Difficult to find, catch, or achieve.", "example_cn": "难以捉摸的雪豹很少被拍到，因为它避开人类，并融入多岩的地形中。", "example_en": "The elusive snow leopard is rarely photographed, since it avoids humans and blends into rocky terrain.", "ipa": "/ɪˈluːsɪv/", "pos": "adj.", "word": "elusive"}, {"def_cn": "巨大；极其严重", "def_en": "The great scale, seriousness, or extent of something.", "example_cn": "公众花了几个月才认识到这次石油泄漏的严重程度及其对野生动物的破坏。", "example_en": "It took months for the public to grasp the enormity of the oil spill and its damage to wildlife.", "ipa": "/ɪˈnɔːrməti/", "pos": "n.", "word": "enormity"}, {"def_cn": "墓志铭", "def_en": "A phrase written in memory of a person who has died, often on a tombstone.", "example_cn": "她的墓志铭很简单：“她教会我们善良”，这是对这位深受爱戴的老师恰如其分的悼念。", "example_en": "Her epitaph reads simply, She taught us to be kind, a fitting tribute to a beloved teacher.", "ipa": "/ˈepɪtæf/", "pos": "n.", "word": "epitaph"}, {"def_cn": "欣快；狂喜", "def_en": "A feeling of intense excitement and happiness.", "example_cn": "当主队在最后一分钟进球时，一阵狂喜席卷了整个体育场。", "example_en": "A wave of euphoria swept through the stadium when the home team scored in the final minute.", "ipa": "/juːˈfɔːriə/", "pos": "n.", "word": "euphoria"}, {"def_cn": "删除；彻底抹去", "def_en": "To erase or remove something completely.", "example_cn": "法院同意，在他五年表现良好之后，从他的记录中删除这项轻微罪行。", "example_en": "The court agreed to expunge the minor offense from his record after five years of good behavior.", "ipa": "/ɪkˈspʌndʒ/", "pos": "v.", "word": "expunge"}, {"def_cn": "狡诈；机智", "def_en": "Sly or cunning intelligence.", "example_cn": "这位谈判者用的是机智而非武力，悄悄地让对手们互相反目。", "example_en": "The negotiator used guile rather than force, quietly turning the rivals against each other.", "ipa": "/ɡaɪl/", "pos": "n.", "word": "guile"}, {"def_cn": "调停；代为求情", "def_en": "To intervene on behalf of another person in a dispute.", "example_cn": "大使介入调停这场争端，说服双方回到谈判桌前。", "example_en": "The ambassador interceded in the dispute, persuading both sides to return to the negotiating table.", "ipa": "/ˌɪntərˈsiːd/", "pos": "v.", "word": "intercede"}, {"def_cn": "规避风险；含糊其辞以留后路", "def_en": "To limit or qualify a commitment in order to avoid risk.", "example_cn": "这家公司通过同时投资传统能源和可再生能源技术来规避风险。", ，表现出敏锐的判断力。Discerning 意为“有眼光的、明辨的”。Indifferent（漠不关心的）、weary（疲倦的）、hasty（仓促的）都是粗心或疲惫的态度，不可能识破赝品。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d37-q5", "stem": "Urban beekeeping has grown rapidly in the past decade. Rooftop hives now dot cities from Paris to Tokyo. While some ecologists worry that too many hives strain limited floral resources, supporters argue that city bees raise awareness of pollinator decline. The author mentions ecologists' concerns primarily to", "passage": "", "options": ["prove that urban beekeeping harms the environment", "acknowledge a counterargument before presenting a supporting view", "suggest that supporters of beekeeping are misinformed", "argue that rooftop hives should be banned in large cities"], "answer": "B", "explanation_en": "The sentence about ecologists' worries presents an opposing view before the sentence about supporters offers a favorable one, so its function is to acknowledge a counterargument. It does not prove harm, call supporters misinformed, or argue for a ban.", "explanation_cn": "提到生态学家担忧的句子先摆出反方观点，之后再给出支持者的正面看法，所以它的作用是承认对立观点。它没有证明危害，没有说支持者无知，也没有主张禁止。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d37-q6", "stem": "Which choice is the clearest and most logical?", "passage": "", "options": ["The gardener admired the roses covered in morning dew.", "Covered in morning dew, the gardener admired the roses.", "Admiring the roses, the morning dew covered the gardener.", "The gardener admired the roses, they were covered in morning dew."], "answer": "A", "explanation_en": "Only choice A places covered in morning dew next to roses, the noun it modifies. In B and C the phrase dangles, illogically describing the gardener or the dew itself, and D contains a comma splice.", "explanation_cn": "只有 A 把 covered in morning dew 紧挨着它修饰的 roses。B 和 C 中这个短语悬空，逻辑上变成了形容园丁或露水本身，D 则是逗号粘连句。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d37-q7", "stem": "The program was expected to attract 10,000 riders in its first year. _______ it surpassed that goal within three months. Which choice completes the text with the most logical transition?", "passage": "", "options": ["Instead,", "However,", "Indeed,", "Otherwise,"], "answer": "C", "explanation_en": "The second sentence confirms and strengthens the expectation stated in the first, so indeed is the right transition. Instead, however, and otherwise all signal contrast or alternatives, which the sentence does not express.", "explanation_cn": "第二句证实并加强了第一句的预期，所以用 indeed 表递进确认。Instead、however、otherwise 都表示转折或替代，句子并没有这个意思。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d37-q8", "stem": "Physicists have long pursued a unified theory of quantum gravity, but a complete and testable formulation remains _______ , slipping past every theoretical framework proposed so far.", "passage": "", "options": ["abundant", "trivial", "elusive", "obsolete"], "answer": "C", "explanation_en": "The theory keeps slipping past every framework, so a complete formulation remains hard to grasp or achieve. Elusive means difficult to catch or attain. Abundant, trivial, and obsolete contradict the idea of a long, fruitless pursuit.", "explanation_cn": "这个理论不断从每个框架中溜走，所以完整表述仍然难以捉摸、难以实现。Elusive 意为“难以捕捉、难以达到的”。Abundant（丰富的）、trivial（微不足道的）、obsolete（过时的）都与“长期追寻而无果”矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d37-q9", "stem": "In 1859, Charles Darwin published On the Origin of Species. The book's argument unfolded in two parts: first, that species change over time; second, that natural selection drives that change. The first claim was widely accepted within a decade, but the second faced resistance for nearly eighty years. Which choice best describes the overall structure of the text?", "passage": "", "options": ["It compares Darwin's ideas with those of his contemporaries.", "It narrates the events leading up to the book's publication.", "It presents a theory and then refutes it with new evidence.", "It introduces a historical work, outlines its two-part argument, and contrasts their receptions."], "answer": "D", "explanation_en": "The text names the book, lays out its two claims, and then contrasts how each was received, which is exactly choice D. It refutes nothing, compares Darwin with no contemporaries, and does not narrate events before publication.", "explanation_cn": "文章先点出这本书，再列出它的两个论点，最后对比两者受到的不同反响，正是 D 所说的。它没有反驳任何东西，没有拿达尔文和同时代人比较，也没有叙述出版前的事件。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d37-q10", "stem": "Which choice is correctly punctuated?", "passage": "", "options": ["The museum's new exhibit features artifacts from three ancient civilizations; Egypt, Greece, and Rome.", "The museum's new exhibit features artifacts from three ancient civilizations, Egypt, Greece, and Rome.", "The museum's new exhibit features artifacts from three ancient civilizations: Egypt, Greece, and Rome.", "The museum's new exhibit features artifacts from three ancient civilizations—Egypt, Greece, and Rome,"], "answer": "C", "explanation_en": "A colon properly introduces a list after an independent clause, so choice C is correct. A semicolon cannot introduce a list, a comma creates a run-on, and choice D adds an unnecessary trailing comma.", "explanation_cn": "冒号可以放在完整句子后引出列表，所以 C 正确。分号不能引出列表，逗号会造成粘连，D 末尾还多了个不必要的逗号。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-12-18"}];
const $ = s => document.querySelector(s);
const LETTERS = ['A','B','C','D'];
let DAY = 1;

function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtMD(iso){ const p = iso.split('-'); return p[1].replace(/^0/,'') + '/' + p[2].replace(/^0/,''); }
function fmtCn(iso){ const p = iso.split('-'); return p[1].replace(/^0/,'') + '\u6708' + p[2].replace(/^0/,'') + '\u65E5'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function speak(t){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.85; speechSynthesis.speak(u); }catch(e){} }

(function initDay(){
  const i = DAY_DATES.indexOf(todayStr());
  DAY = i >= 0 ? i + 1 : 1;
})();

const _memStore = {};
const store = {
  read(k, dflt){ try{ return (k in _memStore) ? JSON.parse(JSON.stringify(_memStore[k])) : dflt; }catch(e){ return dflt; } },
  write(k, v){ try{ _memStore[k] = JSON.parse(JSON.stringify(v)); }catch(e){} },
  clear(){ for (const k in _memStore) delete _memStore[k]; }
};
let mastery = store.read('mastery', {});
let errors = store.read('errors', {});
let checkins = store.read('checkins', []).filter(x => typeof x === 'number');
let practiceDone = store.read('practiceDone', {});
let wordRated = store.read('wordRated', {});
function saveAllSilent(){
  store.write('mastery', mastery); store.write('errors', errors);
  store.write('checkins', checkins); store.write('practiceDone', practiceDone);
  store.write('wordRated', wordRated);
}
function saveAll(){ saveAllSilent(); schedulePush(); }

/* ---------- cloud sync ---------- */
let _pushTimer = null;
let _pendingCheckin = false;
function syncMsg(t){ const el = $('#syncInfo'); if (el) el.textContent = t; }
function snapshot(){ return { mastery, errors, checkins, practiceDone, wordRated, ts: Date.now() }; }
function schedulePush(){ if (!SYNC_URL) return; clearTimeout(_pushTimer); _pushTimer = setTimeout(pushProgress, 1500); }
function pushProgress(manual){
  if (!SYNC_URL){ if (manual) syncMsg('\u672A\u914D\u7F6E\u4E91\u7AEF\u5730\u5740\uFF0C\u8FDB\u5EA6\u4EC5\u5728\u672C\u6B21\u6253\u5F00\u6709\u6548'); return; }
  const wordsMastered = Object.keys(mastery).filter(w => mastery[w] === 1).length;
  const pd = practiceDone[DAY];
  const payload = { day: DAY, wordsMastered, practiceDone: pd ? 1 : 0,
    practiceCorrect: pd ? pd.score : 0, practiceTotal: pd ? pd.total : 0,
    event: _pendingCheckin ? 'checkin' : '', student: STUDENT, full: snapshot() };
  _pendingCheckin = false;
  if (manual) syncMsg('\u6B63\u5728\u540C\u6B65\u2026');
  fetch(SYNC_URL, { method: 'POST', mode: 'no-cors',
    headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload)
  }).then(() => syncMsg('\u2601\uFE0F \u8FDB\u5EA6\u5DF2\u540C\u6B65 ' + new Date().toLocaleTimeString()))
    .catch(() => { if (manual) syncMsg('\u540C\u6B65\u5931\u8D25\uFF0C\u8BF7\u68C0\u67E5\u7F51\u7EDC\u540E\u70B9\u300C\u540C\u6B65\u8FDB\u5EA6\u300D\u91CD\u8BD5'); });
}
function pullProgress(){
  if (!SYNC_URL) return;
  fetch(SYNC_URL + '?action=get&student=' + encodeURIComponent(STUDENT)).then(r => r.json()).then(cloud => {
    if (!cloud || !cloud.full) return;
    const c = cloud.full;
    for (const w in (c.mastery || {})) if (c.mastery[w] === 1) mastery[w] = 1;
    for (const w in (c.errors || {})) errors[w] = Math.max(errors[w] || 0, c.errors[w] || 0);
    (c.checkins || []).forEach(d => { if (!checkins.includes(d)) checkins.push(d); });
    for (const d in (c.practiceDone || {})){
      const cur = practiceDone[d];
      if (!cur || c.practiceDone[d].score > cur.score) practiceDone[d] = c.practiceDone[d];
    }
    for (const d in (c.wordRated || {})){
      const cur = wordRated[d] || [];
      (c.wordRated[d] || []).forEach(w => { if (!cur.includes(w)) cur.push(w); });
      wordRated[d] = cur;
    }
    saveAllSilent(); renderAll();
    syncMsg('\u2601\uFE0F \u5DF2\u4ECE\u4E91\u7AEF\u6062\u590D\u8FDB\u5EA6');
  }).catch(() => {});
}

/* ---------- day nav ---------- */
function renderDayNav(){
  const t = todayStr();
  $('#dayNav').innerHTML = DATA.map(d => {
    const md = fmtMD(d.date);
    const cls = 'daybtn' + (d.day === DAY ? ' active' : '') + (d.date === t ? ' today' : '');
    return `<button class="${cls}" data-day="${d.day}">Day ${d.day}<br>${md}</button>`;
  }).join('');
  document.querySelectorAll('#dayNav .daybtn').forEach(b => {
    b.onclick = () => {
      DAY = +b.dataset.day; fcIdx = 0; practiceAnswers = {};
      document.querySelectorAll('#dayNav .daybtn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      updateDaySub(); renderAll(); window.scrollTo(0, 0);
    };
  });
}
function updateDaySub(){
  const d = dayData(DAY);
  $('#daySub').textContent = 'Day ' + DAY + ' \u00B7 ' + fmtCn(d.date) + ' \u00B7 \u6BCF\u65E5\u4EFB\u52A1';
}
function dayData(n){ return DATA.find(d => d.day === n); }

/* ---------- tasks ---------- */
function taskStatus(){
  const d = dayData(DAY);
  const rated = wordRated[DAY] || [];
  const t1 = rated.length >= d.words.length;
  const prevWords = DATA.filter(x => x.day < DAY).flatMap(x => x.words.map(w => w.word));
  const needReview = prevWords.filter(w => mastery[w] !== 1);
  const t2 = needReview.length === 0;
  const pd = practiceDone[DAY];
  const t3 = !!(pd && pd.total === d.practice.length);
  const t4 = checkins.includes(DAY);
  return [
    {t: '\u5355\u8BCD\u5B66\u4E60\uFF1A20 \u4E2A\u65B0\u8BCD', done: t1},
    {t: '\u590D\u4E60\u65E7\u8BCD' + (needReview.length ? '\uFF08' + needReview.length + ' \u4E2A\u5F85\u590D\u4E60\uFF09' : '\uFF08\u5DF2\u5B8C\u6210\uFF09'), done: t2},
    {t: '\u6BCF\u65E5\u7EC3\u4E60\uFF1A10 \u9053\u9898', done: t3},
    {t: '\u6253\u5361', done: t4},
  ];
}
function renderTasks(){
  $('#taskList').innerHTML = taskStatus().map(x =>
    `<div class="task${x.done ? ' done' : ''}"><div class="box">${x.done ? '\u2713' : ''}</div><div class="t">${esc(x.t)}</div></div>`
  ).join('');
}

/* ---------- flashcards ---------- */
let fcIdx = 0;
function renderFlashcards(){
  const d = dayData(DAY);
  const rated = wordRated[DAY] || [];
  while (fcIdx < d.words.length && rated.includes(d.words[fcIdx].word)) fcIdx++;
  const wrap = $('#fcWrap');
  $('#wprog').textContent = '\uFF08' + rated.length + '/' + d.words.length + '\uFF09';
  if (fcIdx >= d.words.length) {
    wrap.innerHTML = '<div class="empty">\uD83C\uDF89 \u4ECA\u5929\u7684 20 \u4E2A\u8BCD\u90FD\u8FC7\u4E86\u4E00\u904D\uFF01\u53BB\u590D\u4E60\u6216\u5237\u9898\u5427\u3002</div>';
    return;
  }
  const w = d.words[fcIdx];
  const learned = mastery[w.word] === 1;
  wrap.innerHTML = `
    <div class="fc" id="fcCard">
      <div class="word">${esc(w.word)}<span style="font-size:14px;color:#888"> ${esc(w.pos)}</span>${learned ? '<span class="badge ok">\u5DF2\u638C\u63E1</span>' : ''}</div>
      <div class="ipa">${esc(w.ipa)}</div>
      <button class="speak" id="speakBtn" title="\u6717\u8BFB">\uD83D\uDD0A</button>
      <div class="front-hint">\uD83D\uDC46 \u70B9\u51FB\u5361\u7247\u67E5\u770B\u91CA\u4E49\u548C\u4F8B\u53E5</div>
      <div class="back">
        <div><strong>\u82F1\u6587\u91CA\u4E49\uFF1A</strong>${esc(w.def_en)}</div>
        <div><strong>\u4E2D\u6587\u91CA\u4E49\uFF1A</strong>${esc(w.def_cn)}</div>
        <div style="margin-top:6px"><strong>\u4F8B\u53E5\uFF1A</strong>${esc(w.example_en)}</div>
        <div style="color:#666">${esc(w.example_cn)}</div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="btn-unknown" id="btnUnknown">\u8FD8\u4E0D\u8BA4\u8BC6 \u2717</button>
      <button class="btn-know" id="btnKnow">\u8BA4\u8BC6\u4E86 \u2713</button>
    </div>
    <div class="fc-count">${fcIdx + 1} / ${d.words.length}</div>`;
  $('#fcCard').onclick = e => { if (e.target.id !== 'speakBtn') $('#fcCard').classList.toggle('flipped'); };
  $('#speakBtn').onclick = e => { e.stopPropagation(); speak(w.word); };
  const rate = known => {
    mastery[w.word] = known ? 1 : 0;
    if (!known) errors[w.word] = (errors[w.word] || 0) + 1;
    if (!rated.includes(w.word)) rated.push(w.word);
    wordRated[DAY] = rated; saveAll();
    fcIdx++; renderFlashcards(); renderTasks(); renderProgress(); renderReview();
  };
  $('#btnKnow').onclick = () => rate(true);
  $('#btnUnknown').onclick = () => rate(false);
}

/* ---------- adaptive review ---------- */
function renderReview(){
  const box = $('#reviewList');
  if (DAY === 1) { box.innerHTML = '<div class="empty">\u7B2C\u4E00\u5929\u6CA1\u6709\u65E7\u8BCD\uFF0C\u4ECE\u660E\u5929\u5F00\u59CB\u590D\u4E60\u3002</div>'; return; }
  const prevWords = [];
  DATA.filter(x => x.day < DAY).forEach(x => x.words.forEach(w => prevWords.push(w)));
  const need = prevWords.filter(w => mastery[w.word] !== 1)
    .sort((a, b) => ((errors[b.word] || 0) - (errors[a.word] || 0)));
  const doneCount = prevWords.length - need.length;
  if (!need.length) { box.innerHTML = `<div class="empty">\uD83C\uDF89 \u65E7\u8BCD\u5168\u90E8\u638C\u63E1\uFF01\uFF08${doneCount}/${prevWords.length}\uFF09</div>`; return; }
  const show = need.slice(0, 30);
  box.innerHTML = `<div class="empty">\u8FD8\u6709 ${need.length} \u4E2A\u65E7\u8BCD\u6CA1\u638C\u63E1\uFF08\u5DF2\u638C\u63E1 ${doneCount}/${prevWords.length}\uFF09\uFF0C\u7B54\u9519\u591A\u7684\u6392\u5728\u524D\u9762\uFF1A</div>` +
    show.map(w => `
      <div class="rv">
        <div class="w">${esc(w.word)} <span style="font-size:12px;color:#888">${esc(w.pos)} ${esc(w.ipa)}</span>
          <button class="speak" style="width:32px;height:32px;font-size:15px" onclick="speak('${esc(w.word)}')">\uD83D\uDD0A</button>${(errors[w.word] || 0) > 0 ? `<span class="badge err">\u7B54\u9519 ${errors[w.word]} \u6B21</span>` : ''}</div>
        <div class="d">${esc(w.def_cn)} \u00B7 ${esc(w.def_en)}</div>
        <button onclick="markKnown('${esc(w.word)}')">\u8BA4\u8BC6\u4E86 \u2713</button>
      </div>`).join('') +
    (need.length > 30 ? `<div class="empty">\u2026\u8FD8\u6709 ${need.length - 30} \u4E2A</div>` : '');
}
function markKnown(word){
  mastery[word] = 1; saveAll();
  renderReview(); renderTasks(); renderProgress();
}

/* ---------- practice ---------- */
function renderQuestion(q, idx){
  return `
  <div class="q" id="q-${q.qid}">
    <div class="qnum">Question ${idx + 1}</div>
    ${q.passage ? `<div class="passage">${esc(q.passage).replace(/___/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</div>` : ''}
    <div class="stem">${esc(q.stem).replace(/___/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</div>
    ${q.options.map((o, i) => `<button class="opt" data-q="${q.qid}" data-i="${i}"><strong>${LETTERS[i]}.</strong> ${esc(o)}</button>`).join('')}
    <div class="expl" id="expl-${q.qid}">
      <div class="en"><strong>Explanation:</strong> ${esc(q.explanation_en || '')}</div>
      <div><strong>\u8BB2\u89E3\uFF1A</strong>${esc(q.explanation_cn)}</div>
      <div style="margin-top:6px"><a href="${esc(q.khan)}" target="_blank">\uD83D\uDCCE ${esc(q.label || 'Khan Academy')}</a></div>
    </div>
  </div>`;
}
function findQ(qid){
  for (const d of DATA) for (const q of d.practice) if (q.qid === qid) return q;
  return null;
}
function wordHit(text, word){
  try { return new RegExp('\\b' + word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '\\b', 'i').test(text); }
  catch(e){ return false; }
}
function applyPracticeResult(q, correct){
  const d = dayData(DAY);
  const hay = (q.stem + ' ' + q.options.join(' '));
  d.words.forEach(w => {
    if (wordHit(hay, w.word)) {
      if (correct) { /* keep existing mastery */ }
      else { errors[w.word] = (errors[w.word] || 0) + 1; mastery[w.word] = 0; }
    }
  });
  if (q.word) mastery[q.word] = correct ? 1 : 0;
  saveAll();
}
let practiceAnswers = {};
function renderPractice(){
  const d = dayData(DAY);
  practiceAnswers = {};
  $('#practiceList').innerHTML = d.practice.map((q, i) => renderQuestion(q, i)).join('');
  $('#practiceScore').textContent = '';
  $('#pprog').textContent = '';
  document.querySelectorAll('#practiceList .opt').forEach(btn => {
    btn.onclick = () => {
      const qid = btn.dataset.q, i = +btn.dataset.i;
      if (practiceAnswers[qid] !== undefined) return;
      const q = findQ(qid);
      const correct = LETTERS[i] === q.answer;
      practiceAnswers[qid] = correct;
      const box = document.getElementById('q-' + qid);
      const ansIdx = LETTERS.indexOf(q.answer);
      box.querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        if (+b.dataset.i === ansIdx) b.classList.add('correct');
      });
      if (!correct) btn.classList.add('wrong');
      document.getElementById('expl-' + qid).classList.add('show');
      applyPracticeResult(q, correct);
      const done = Object.keys(practiceAnswers).length;
      const score = Object.values(practiceAnswers).filter(Boolean).length;
      $('#pprog').textContent = '\uFF08' + done + '/' + d.practice.length + '\uFF09';
      if (done === d.practice.length) {
        $('#practiceScore').textContent = '\u7EC3\u4E60\u5B8C\u6210\uFF1A' + score + '/' + d.practice.length + ' \uD83C\uDFAF';
        practiceDone[DAY] = {score, total: d.practice.length}; saveAll();
      }
      renderTasks(); renderProgress(); renderReview();
    };
  });
  const pd = practiceDone[DAY];
  if (pd && pd.total === d.practice.length) $('#practiceScore').textContent = '\u7EC3\u4E60\u5B8C\u6210\uFF1A' + pd.score + '/' + pd.total + ' \uD83C\uDFAF';
  $('#pprog').textContent = pd ? '\uFF08' + pd.total + '/' + d.practice.length + '\uFF09' : '';
}

/* ---------- checkin (by DAY, not calendar date) ---------- */
function renderCheckin(){
  const done = checkins.includes(DAY);
  const btn = $('#checkinBtn');
  btn.disabled = done;
  btn.textContent = done ? '\u4ECA\u65E5\u5DF2\u6253\u5361 \u2713' : '\u4ECA\u65E5\u6253\u5361';
  $('#checkinInfo').innerHTML = done
    ? `\uD83C\uDF89 Day ${DAY} \u6253\u5361\u6210\u529F\uFF01\u7D2F\u8BA1\u6253\u5361 <strong>${checkins.length}</strong> \u5929\u3002`
    : (checkins.length ? `\u7D2F\u8BA1\u5DF2\u6253\u5361 ${checkins.length} \u5929\uFF0CDay ${DAY} \u8FD8\u6CA1\u6709\u6253\u5361\u3002` : '\u8FD8\u6CA1\u6709\u6253\u5361\u8BB0\u5F55\uFF0C\u4ECA\u5929\u5F00\u59CB\u5427\uFF01');
  btn.onclick = () => {
    if (!checkins.includes(DAY)) { checkins.push(DAY); _pendingCheckin = true; saveAll(); }
    renderCheckin(); renderTasks(); renderProgress();
  };
}

/* ---------- progress ---------- */
function renderProgress(){
  const allWords = DATA.flatMap(d => d.words.map(w => w.word));
  const learned = allWords.filter(w => mastery[w] === 1).length;
  $('#stWords').textContent = learned;
  const ds = Object.entries(practiceDone);
  $('#stPractice').textContent = ds.length
    ? (ds.reduce((s, [,v]) => s + v.score / v.total, 0) / ds.length * 10).toFixed(1) + ' / 10' : '\u2013';
  $('#stDays').textContent = checkins.length;
  $('#dayScores').innerHTML = ds.length
    ? ds.sort((a,b) => a[0]-b[0]).map(([d, v]) => `Day ${d} \u7EC3\u4E60\uFF1A${v.score}/${v.total}`).join(' &nbsp;\u00B7&nbsp; ')
    : '\u8FD8\u6CA1\u6709\u7EC3\u4E60\u6210\u7EE9\u3002';
}

let _resetArmed = false, _resetTimer = null;
function disarmReset(){
  _resetArmed = false; clearTimeout(_resetTimer);
  const b = $('#resetBtn'), h = $('#resetHint');
  b.textContent = '\u91CD\u7F6E\u5168\u90E8\u8FDB\u5EA6'; b.classList.remove('armed');
  if (h) h.style.display = 'none';
}
$('#resetBtn').onclick = () => {
  if (!_resetArmed) {
    _resetArmed = true;
    const b = $('#resetBtn'), h = $('#resetHint');
    b.textContent = '\u518D\u70B9\u4E00\u6B21\u786E\u8BA4\u6E05\u7A7A'; b.classList.add('armed');
    if (h) { h.textContent = '\u786E\u5B9A\u8981\u6E05\u7A7A\u6240\u6709\u5B66\u4E60\u8FDB\u5EA6\u5417\uFF1F\u70B9\u4E0A\u9762\u7684\u7EA2\u8272\u6309\u94AE\u786E\u8BA4\uFF0C3 \u79D2\u540E\u81EA\u52A8\u53D6\u6D88\u3002'; h.style.display = 'inline'; }
    _resetTimer = setTimeout(disarmReset, 3000);
    return;
  }
  disarmReset();
  mastery = {}; errors = {}; checkins = []; practiceDone = {}; wordRated = {};
  saveAllSilent(); pushProgress(true);
  fcIdx = 0; practiceAnswers = {};
  renderAll();
  syncMsg('\u5DF2\u6E05\u7A7A\u672C\u673A\u8FDB\u5EA6\u5E76\u540C\u6B65\u5230\u4E91\u7AEF');
};
$('#syncBtn').onclick = () => pushProgress(true);

function renderAll(){
  renderDayNav(); updateDaySub(); renderTasks(); renderFlashcards();
  renderReview(); renderPractice(); renderCheckin(); renderProgress();
  if (!SYNC_URL) {
    $('#syncBtn').style.display = 'none';
    $('#syncInfo').textContent = '';
    $('#localNote').style.display = 'block';
  } else {
    $('#syncBtn').style.display = 'block';
    $('#localNote').textContent = '\u8FDB\u5EA6\u81EA\u52A8\u540C\u6B65\u5230\u4E91\u7AEF\uFF0C\u6362\u8BBE\u5907\u4E0D\u4E22\u5931\u3002';
  }
}
renderAll();
pullProgress();
</script>
</body>
