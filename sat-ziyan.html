<style>

<script>

  document.title = STUDENT + ' 的 SAT 英语学习营';
}
const DAY_DATES = ["2026-10-22","2026-10-23","2026-10-26","2026-10-27","2026-10-28","2026-10-29","2026-10-30","2026-11-02","2026-11-03","2026-11-04","2026-11-05","2026-11-06","2026-11-09","2026-11-10","2026-11-11","2026-11-12","2026-11-13","2026-11-16","2026-11-17","2026-11-18","2026-11-19","2026-11-20","2026-11-30","2026-12-01","2026-12-02","2026-12-03","2026-12-04","2026-12-07","2026-12-08","2026-12-09","2026-12-10","2026-12-11","2026-12-14","2026-12-15","2026-12-16","2026-12-17","2026-12-18"];
const DATA = [{"day": 1, "words": [{"word": "ambiguous", "pos": "adj.", "ipa": "/æmˈbɪɡjuəs/", "def_en": "open to more than one interpretation; unclear or vague", "def_cn": "含糊的，模棱两可的", "example_en": "The instructions were so ambiguous that each student interpreted the assignment differently.", "example_cn": "这些指示太含糊了，每个学生对作业的理解都不一样。"}, {"word": "bolster", "pos": "v.", "ipa": "/ˈboʊlstər/", "def_en": "to support or strengthen", "def_cn": "支持，加强", "example_en": "The new data bolstered the scientist's claim about climate change.", "example_cn": "新数据支持了这位科学家关于气候变化的观点。"}, {"word": "candid", "pos": "adj.", "ipa": "/ˈkændɪd/", "def_en": "truthful and straightforward; frank", "def_cn": "坦率的，直言的", "example_en": "In a candid interview, the mayor admitted that the policy had failed.", "example_cn": "在这次坦率的采访中，市长承认这项政策失败了。"}, {"word": "diverge", "pos": "v.", "ipa": "/dɪˈvɜːrdʒ/", "def_en": "to separate from a common path; to differ", "def_cn": "分歧，偏离", "example_en": "After years of agreement, the sisters' views on the family business began to diverge.", "example_cn": "多年意见一致之后，姐妹俩对家族企业的看法开始出现分歧。"}, {"word": "empirical", "pos": "adj.", "ipa": "/ɛmˈpɪrɪkəl/", "def_en": "based on observation or experiment rather than theory", "def_cn": "实证的，经验的", "example_en": "The theory lacked empirical evidence, so few researchers accepted it.", "example_cn": "这个理论缺乏实证证据，所以很少有研究者接受它。"}, {"word": "feasible", "pos": "adj.", "ipa": "/ˈfiːzəbəl/", "def_en": "possible and practical to achieve", "def_cn": "可行的", "example_en": "Building a subway under the old district is no longer considered feasible.", "example_cn": "在老城区下方修建地铁已不再被认为可行。"}, {"word": "galvanize", "pos": "v.", "ipa": "/ˈɡælvənaɪz/", "def_en": "to shock or excite someone into action", "def_cn": "激励，鼓舞", "example_en": "The coach's speech galvanized the team before the final game.", "example_cn": "教练的讲话在决赛前激励了全队。"}, {"word": "hinder", "pos": "v.", "ipa": "/ˈhɪndər/", "def_en": "to delay or obstruct progress", "def_cn": "阻碍", "example_en": "Lack of sleep can seriously hinder a student's ability to learn.", "example_cn": "睡眠不足会严重阻碍学生的学习能力。"}, {"word": "impartial", "pos": "adj.", "ipa": "/ɪmˈpɑːrʃəl/", "def_en": "treating all sides equally; not biased", "def_cn": "公正的，不偏不倚的", "example_en": "The judge was praised for her impartial handling of the controversial case.", "example_cn": "这位法官因公正地处理这起有争议的案件而受到称赞。"}, {"word": "juxtapose", "pos": "v.", "ipa": "/ˌdʒʌkstəˈpoʊz/", "def_en": "to place side by side for comparison", "def_cn": "并置，对比", "example_en": "The exhibition juxtaposes ancient tools with modern technology.", "example_cn": "这个展览把古代工具和现代科技并置在一起。"}, {"word": "keen", "pos": "adj.", "ipa": "/kiːn/", "def_en": "eager; having sharp perception", "def_cn": "热切的；敏锐的", "example_en": "She is a keen observer of human behavior.", "example_cn": "她是一个敏锐的人性观察者。"}, {"word": "lucid", "pos": "adj.", "ipa": "/ˈluːsɪd/", "def_en": "clear and easy to understand", "def_cn": "清晰易懂的", "example_en": "The professor gave a lucid explanation of a complex theory.", "example_cn": "教授对这个复杂的理论做了一个清晰易懂的解释。"}, {"word": "mitigate", "pos": "v.", "ipa": "/ˈmɪtɪɡeɪt/", "def_en": "to make less severe or serious", "def_cn": "缓解，减轻", "example_en": "Planting trees can help mitigate the effects of air pollution.", "example_cn": "植树有助于减轻空气污染的影响。"}, {"word": "novel", "pos": "adj.", "ipa": "/ˈnɑːvəl/", "def_en": "new and original; unusual", "def_cn": "新颖的", "example_en": "The startup proposed a novel solution to the city's traffic problem.", "example_cn": "这家初创公司为城市的交通问题提出了一个新颖的解决方案。"}, {"word": "obscure", "pos": "adj./v.", "ipa": "/əbˈskjʊr/", "def_en": "not well known; difficult to understand", "def_cn": "不出名的；晦涩的", "example_en": "The poet was obscure during his lifetime but became famous after his death.", "example_cn": "这位诗人一生默默无闻，死后却声名大噪。"}, {"word": "pragmatic", "pos": "adj.", "ipa": "/præɡˈmætɪk/", "def_en": "practical rather than idealistic", "def_cn": "务实的", "example_en": "She took a pragmatic approach, focusing on what could actually be done.", "example_cn": "她采取了务实的做法，专注于实际能做到的事。"}, {"word": "quell", "pos": "v.", "ipa": "/kwɛl/", "def_en": "to put an end to; to calm", "def_cn": "平息，镇压", "example_en": "The principal quickly quelled the rumors spreading among students.", "example_cn": "校长迅速平息了在学生中流传的谣言。"}, {"word": "resilient", "pos": "adj.", "ipa": "/rɪˈzɪljənt/", "def_en": "able to recover quickly from difficulties", "def_cn": "有韧性的，能复原的", "example_en": "Children are often remarkably resilient after difficult experiences.", "example_cn": "经历困难之后，孩子们往往表现出惊人的韧性。"}, {"word": "scrutinize", "pos": "v.", "ipa": "/ˈskruːtənaɪz/", "def_en": "to examine carefully and critically", "def_cn": "细查，审视", "example_en": "Investors will scrutinize the company's financial reports before buying shares.", "example_cn": "投资者在购买股票之前会仔细审查公司的财务报告。"}, {"word": "tangible", "pos": "adj.", "ipa": "/ˈtændʒəbəl/", "def_en": "clear and definite; real enough to be measured", "def_cn": "切实的，有形的", "example_en": "The reform produced few tangible results in its first year.", "example_cn": "这项改革在第一年几乎没有产生切实的成果。"}], "practice": [{"qid": "d1-p1", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "Rising sea levels threaten coastal cities around the world. In response, engineers in the Netherlands have designed floating neighborhoods that rise and fall with the water, a strategy intended to ___ the damage caused by future floods.", "options": ["mitigate", "exacerbate", "scrutinize", "galvanize"], "answer": "A", "explanation_en": "The strategy is meant to reduce future flood damage, so 'mitigate' (to make less severe) is the right choice. 'Exacerbate' means to make worse — the opposite of what's needed, so it's a classic trap. 'Scrutinize' (to examine closely) and 'galvanize' (to inspire action) don't fit the context at all.", "explanation_cn": "这项策略的目的是减轻未来洪水造成的损害，应选 mitigate（缓解）。exacerbate（加剧）是反义词陷阱；scrutinize（细查）和 galvanize（激励）与语境无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d1-p2", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "The archaeologist's theory about the ancient trade route was initially met with skepticism. However, the discovery of coins from three different civilizations at the site served to ___ her argument.", "options": ["bolster", "diverge", "obscure", "hinder"], "answer": "A", "explanation_en": "The discovery of the coins supports her argument, so 'bolster' (to support or strengthen) is correct. 'Diverge' (to differ) and 'hinder' (to block) work against the idea of supporting a theory, and 'obscure' (to hide or make unclear) doesn't fit either.", "explanation_cn": "三处文明的硬币这一发现支持了她的论点，应选 bolster（支持、加强）。diverge（偏离）、obscure（使模糊）、hinder（阻碍）都与“支持论点”的语境相反或无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d1-p3", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "Unlike most politicians, who carefully script every public statement, Senator Alvarez is known for her ___ remarks about the failures of her own party's policies.", "options": ["candid", "ambiguous", "impartial", "tangible"], "answer": "A", "explanation_en": "She is contrasted with politicians who carefully script every statement, so 'candid' (frank, outspoken) fits best. 'Ambiguous' (unclear) goes against that contrast; 'impartial' (fair) and 'tangible' (concrete) don't describe a speaking style here.", "explanation_cn": "与“精心写稿”的政客对比，这位参议员以坦率著称，应选 candid（坦率的）。ambiguous（含糊的）与文意相反；impartial（公正的）和 tangible（切实的）不符合此处语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d1-p4", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "Heavy traffic and outdated equipment have continued to ___ rescue efforts in the mountain region, delaying the delivery of supplies by several days.", "options": ["hinder", "galvanize", "bolster", "quell"], "answer": "A", "explanation_en": "Traffic and equipment problems delayed the supply delivery, so 'hinder' (to obstruct) is correct. 'Galvanize' and 'bolster' mean the opposite (to inspire / to strengthen) — they're traps; 'quell' (to calm) is irrelevant here.", "explanation_cn": "交通和设备问题阻碍了救援工作、导致物资延迟，应选 hinder（阻碍）。galvanize（激励）、bolster（加强）是反义陷阱；quell（平息）与语境无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d1-p5", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "Although the mayor promised sweeping reforms, critics argue that after two years in office, she has produced few ___ improvements in the city's schools.", "options": ["tangible", "novel", "obscure", "lucid"], "answer": "A", "explanation_en": "The critics say the schools saw few real improvements, so 'tangible' (real, concrete) is the word that fits 'improvements.' 'Novel' (new), 'obscure' (unclear), and 'lucid' (clear) can't express the idea of actual results.", "explanation_cn": "批评者认为学校没有取得切实的改善，应选 tangible（切实的）。novel（新颖的）、obscure（晦涩的）、lucid（清晰的）都不能修饰 improvements 表达“实际成果”的意思。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d1-p6", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "Rather than pursuing an idealistic plan that would require decades to complete, the committee adopted a ___ approach, focusing on repairs that could be finished within a year.", "options": ["pragmatic", "obscure", "ambiguous", "impartial"], "answer": "A", "explanation_en": "It's contrasted with an 'idealistic' plan, so 'pragmatic' (practical) is the logical opposite. 'Obscure,' 'ambiguous,' and 'impartial' can't form a contrast with 'idealistic.'", "explanation_cn": "与 idealistic（理想主义的）形成对比，委员会采取了务实的做法，应选 pragmatic（务实的）。obscure（晦涩的）、ambiguous（含糊的）、impartial（公正的）都不能与 idealistic 构成对比。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d1-p7", "stem": "Which choice completes the text with the most logical transition?", "passage": "The new library is twice the size of the old one. ___ it has fewer books on its shelves because most of the collection is now digital.", "options": ["However", "Therefore", "Moreover", "For example"], "answer": "A", "explanation_en": "The two sentences contrast with each other: a bigger library, but fewer physical books — so 'However' signals that turn. 'Therefore' shows cause and effect, 'Moreover' adds information, and 'For example' introduces an example; none of those fit here.", "explanation_cn": "第二句与第一句是转折关系（面积更大，但藏书更少），应选 However。Therefore 表因果、Moreover 表递进、For example 表举例，都不符合这里的转折逻辑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Transitions"}, {"qid": "d1-p8", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "passage": "Honeybees communicate the location of food through the “waggle dance.” _The angle of the dance relative to the sun indicates direction, while its duration signals distance._ Researchers have decoded these movements with remarkable precision.", "options": ["It presents a hypothesis that is refuted later in the text.", "It explains the specific mechanism behind the phenomenon described earlier.", "It lists details unrelated to the main topic.", "It summarizes the main conclusion of the text."], "answer": "B", "explanation_en": "The underlined sentence explains how the dance works — the specific mechanism behind the phenomenon mentioned before. No hypothesis is stated or refuted (not A), the details are directly on topic (not C), and it doesn't summarize the whole passage (not D).", "explanation_cn": "下划线句具体解释了摇摆舞如何传递方向和距离信息，即解释前文提到的现象的具体机制。文中没有提出假设更没有反驳（A错）；细节与主题直接相关（C错）；这不是全文的总结（D错）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Text Structure and Purpose"}, {"qid": "d1-p9", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "The collection of ancient maps, donated by a private collector last year, ___ now on display at the museum.", "options": ["is", "are", "were", "have been"], "answer": "A", "explanation_en": "The subject is 'collection,' which is singular — 'donated by a private collector last year' is just an interrupter and doesn't change that. 'Now' tells us it's present tense, so singular present 'is' is right. 'Are' and 'have been' are plural; 'were' clashes with 'now.'", "explanation_cn": "主语是 collection（单数），插入语 donated by a private collector last year 不影响主谓一致，且 now 表示现在时，所以用单数现在时 is。are 和 have been 主谓不一致；were 时态与 now 矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Subject-Verb Agreement"}, {"qid": "d1-p10", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "The scientist made an unexpected discovery ___ a new species of frog living in the city park.", "options": [":", ",", ";", "."], "answer": "A", "explanation_en": "The colon correctly introduces an explanation of the 'discovery' — namely, what was discovered. A comma would create a run-on; a semicolon or period must be followed by a complete sentence, but 'a new species of frog living in the city park' is not one.", "explanation_cn": "冒号后面是对 discovery 的具体说明（同位解释），冒号用法正确。逗号会造成粘连句；分号和句号后面必须接完整句子，而 a new species of frog living in the city park 不是完整句子，所以都不对。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Punctuation"}], "date": "2026-10-22"}, {"day": 2, "words": [{"word": "adamant", "pos": "adj.", "ipa": "/ˈædəmənt/", "def_en": "refusing to be persuaded; unyielding", "def_cn": "坚定的，固执的", "example_en": "She remained adamant that the policy would not change.", "example_cn": "她坚称政策不会改变。"}, {"word": "anomaly", "pos": "n.", "ipa": "/əˈnɑməli/", "def_en": "something that deviates from the norm; an irregularity", "def_cn": "反常，异常", "example_en": "The warm winter was an anomaly in the region's climate history.", "example_cn": "那个暖冬是该地区气候史上的反常现象。"}, {"word": "apathy", "pos": "n.", "ipa": "/ˈæpəθi/", "def_en": "lack of interest, enthusiasm, or concern", "def_cn": "冷漠，漠不关心", "example_en": "Voter apathy led to the lowest turnout in decades.", "example_cn": "选民的冷漠导致了几十年来最低的投票率。"}, {"word": "buttress", "pos": "v.", "ipa": "/ˈbʌtrəs/", "def_en": "to support or strengthen", "def_cn": "支持，加强", "example_en": "New evidence buttressed the scientist's controversial theory.", "example_cn": "新证据加强了这位科学家颇具争议的理论。"}, {"word": "capricious", "pos": "adj.", "ipa": "/kəˈprɪʃəs/", "def_en": "given to sudden changes of mood or behavior; unpredictable", "def_cn": "变化无常的，任性的", "example_en": "The capricious weather made planning the outdoor event difficult.", "example_cn": "变化无常的天气让户外活动的筹备变得困难。"}, {"word": "coalesce", "pos": "v.", "ipa": "/ˌkoʊəˈlɛs/", "def_en": "to come together and form one whole", "def_cn": "合并，联合", "example_en": "Several small parties coalesced to form a powerful coalition.", "example_cn": "几个小党派合并，组成了一个强大的联盟。"}, {"word": "complacent", "pos": "adj.", "ipa": "/kəmˈpleɪsənt/", "def_en": "self-satisfied and unaware of potential danger", "def_cn": "自满的，得意的", "example_en": "After three straight wins, the team grew complacent and lost the final.", "example_cn": "三连胜之后，球队变得自满，最终输掉了决赛。"}, {"word": "corroborate", "pos": "v.", "ipa": "/kəˈrɑbəreɪt/", "def_en": "to confirm or support with evidence", "def_cn": "证实，佐证", "example_en": "Witnesses corroborated the driver's account of the accident.", "example_cn": "目击者证实了司机对事故的描述。"}, {"word": "dearth", "pos": "n.", "ipa": "/dɜrθ/", "def_en": "a scarcity or lack of something", "def_cn": "缺乏，匮乏", "example_en": "There is a dearth of affordable housing in the city.", "example_cn": "这座城市经济适用房严重匮乏。"}, {"word": "diligent", "pos": "adj.", "ipa": "/ˈdɪlɪdʒənt/", "def_en": "showing care and effort in one's work", "def_cn": "勤奋的，刻苦的", "example_en": "The diligent student reviewed her notes every evening.", "example_cn": "这位勤奋的学生每晚都复习笔记。"}, {"word": "disparage", "pos": "v.", "ipa": "/dɪˈspærɪdʒ/", "def_en": "to regard or represent as of little worth", "def_cn": "贬低，轻视", "example_en": "The critic disparaged the novel as predictable and dull.", "example_cn": "评论家贬低这部小说，说它情节老套、沉闷乏味。"}, {"word": "eclectic", "pos": "adj.", "ipa": "/ɪˈklɛktɪk/", "def_en": "deriving ideas from a broad range of sources; diverse", "def_cn": "兼收并蓄的，博采众长的", "example_en": "The museum's eclectic collection spans five centuries of art.", "example_cn": "这家博物馆兼收并蓄的藏品横跨五个世纪的艺术。"}, {"word": "efficacy", "pos": "n.", "ipa": "/ˈɛfɪkəsi/", "def_en": "the ability to produce a desired result; effectiveness", "def_cn": "功效，效力", "example_en": "The study questioned the efficacy of the new drug.", "example_cn": "这项研究质疑了这种新药的疗效。"}, {"word": "engender", "pos": "v.", "ipa": "/ɛnˈdʒɛndər/", "def_en": "to cause or give rise to", "def_cn": "引起，产生", "example_en": "The scandal engendered public distrust of the officials.", "example_cn": "这起丑闻引起了公众对官员的不信任。"}, {"word": "ephemeral", "pos": "adj.", "ipa": "/ɪˈfɛmərəl/", "def_en": "lasting for a very short time", "def_cn": "短暂的，转瞬即逝的", "example_en": "Fame in the digital age is often ephemeral.", "example_cn": "数字时代的名气往往转瞬即逝。"}, {"word": "exacerbate", "pos": "v.", "ipa": "/ɪɡˈzæsərbeɪt/", "def_en": "to make worse", "def_cn": "加剧，恶化", "example_en": "Cutting funding will only exacerbate the school's problems.", "example_cn": "削减经费只会加剧学校的问题。"}, {"word": "exonerate", "pos": "v.", "ipa": "/ɪɡˈzɑnəreɪt/", "def_en": "to officially absolve from blame", "def_cn": "免除罪责，证明清白", "example_en": "DNA evidence exonerated the man after ten years in prison.", "example_cn": "DNA 证据让这名男子在入狱十年后洗清了罪名。"}, {"word": "fallacy", "pos": "n.", "ipa": "/ˈfæləsi/", "def_en": "a mistaken belief; a flaw in reasoning", "def_cn": "谬误，谬论", "example_en": "It is a fallacy to assume that wealth guarantees happiness.", "example_cn": "认为财富能保证幸福是一种谬误。"}, {"word": "fortuitous", "pos": "adj.", "ipa": "/fɔrˈtuɪtəs/", "def_en": "happening by lucky chance", "def_cn": "偶然的，幸运的", "example_en": "A fortuitous meeting led to her dream job.", "example_cn": "一次偶然的相遇让她得到了梦寐以求的工作。"}, {"word": "frugal", "pos": "adj.", "ipa": "/ˈfruɡəl/", "def_en": "careful with money; economical", "def_cn": "节俭的", "example_en": "His frugal habits allowed him to save for college.", "example_cn": "他节俭的习惯让他攒够了上大学的钱。"}], "practice": [{"qid": "d2-p1", "stem": "When the river flooded, the town's outdated drainage system only ___ the damage, turning streets that might have stayed passable into rushing streams.", "passage": "", "options": ["exacerbate", "mitigate", "corroborate", "hinder"], "answer": "A", "explanation_en": "The drainage system turned passable streets into rushing streams — it made the damage worse, so 'exacerbate' (to make worse) is correct. 'Mitigate' (to lessen) is the exact opposite and a common trap; 'corroborate' (to confirm) and 'hinder' (to obstruct) don't fit the context.", "explanation_cn": "排水系统让本可通行的街道变成湍急的溪流，是让损失“加剧”→ exacerbate。mitigate（缓解）意思正好相反，是常见陷阱；corroborate（证实）、hinder（阻碍）与语境不通。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d2-p2", "stem": "After winning the championship two years in a row, the players became ___, skipping practices and underestimating their opponents.", "passage": "", "options": ["diligent", "complacent", "frugal", "adamant"], "answer": "B", "explanation_en": "Skipping practices and underestimating opponents after winning shows they became 'complacent' (self-satisfied). 'Diligent' (hardworking) is the opposite — a trap; 'frugal' (thrifty) and 'adamant' (firm) are unrelated to the situation.", "explanation_cn": "连冠后逃训练、轻视对手，是“自满”→ complacent。diligent（勤奋）意思相反，是陷阱；frugal（节俭）、adamant（坚定）与语境无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d2-p3", "stem": "The historian doubted the diary's claims until shipping records ___ them, confirming the dates and names mentioned in its pages.", "passage": "", "options": ["disparaged", "engendered", "corroborated", "obscured"], "answer": "C", "explanation_en": "The shipping records confirmed the diary's dates and names — that's 'corroborate' (to confirm with evidence), in the past tense 'corroborated.' 'Disparage' (to belittle) is the opposite; 'engender' (to cause) and 'obscure' (to hide) don't make sense here.", "explanation_cn": "航运记录确认了日记中的日期和人名，是“证实”→ corroborate（注意时态变为 corroborated）。disparage（贬低）意思相反；engender（引起）、obscure（使模糊）语义不通。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d2-p4", "stem": "Despite the city's growing population, there is a ___ of affordable apartments, forcing many young workers to commute long distances.", "passage": "", "options": ["surplus", "dearth", "fallacy", "anomaly"], "answer": "B", "explanation_en": "A growing population but not enough apartments, forcing long commutes, means a 'dearth' (scarcity) of housing. 'Surplus' (extra) is the opposite — a trap; 'fallacy' (false belief) and 'anomaly' (irregularity) don't fit.", "explanation_cn": "人口增长但经济适用房不够、年轻人被迫长途通勤，是“匮乏”→ dearth。surplus（过剩）意思相反，是陷阱；fallacy（谬误）、anomaly（反常）与语境不通。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d2-p5", "stem": "Investors dislike ___ markets, where prices swing wildly from day to day without any clear pattern.", "passage": "", "options": ["capricious", "resilient", "ephemeral", "tangible"], "answer": "A", "explanation_en": "Markets swinging wildly with no clear pattern are 'capricious' (unpredictable). 'Resilient' (able to recover) sounds related but is a trap; 'ephemeral' means short-lived, not fluctuating; 'tangible' (concrete) doesn't fit.", "explanation_cn": "价格每天剧烈波动、毫无规律，是“变化无常的”→ capricious。resilient（有韧性的）指能复原，看似相关实为陷阱；ephemeral（短暂的）指持续时间短，不指波动；tangible（切实的）语义不通。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d2-p6", "stem": "The lawyer called three expert witnesses to ___ her argument that the contract had been signed under pressure.", "passage": "", "options": ["buttress", "disparage", "quell", "hinder"], "answer": "A", "explanation_en": "Expert witnesses were called to strengthen the argument — that's 'buttress' (to support). 'Disparage' and 'hinder' are opposites; 'quell' (to calm) usually pairs with unrest or rumors, not arguments.", "explanation_cn": "请专家证人是为了“加强”自己的论点 → buttress。disparage（贬低）、hinder（阻碍）意思相反；quell（平息）通常搭配骚乱、谣言，不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d2-p7", "stem": "Which choice completes the text with the most logical transition?", "passage": "The new library is open twenty-four hours a day. ___, students can study there even in the middle of the night.", "options": ["Therefore", "However", "Likewise", "Previously"], "answer": "A", "explanation_en": "The second sentence is a result of the first (a 24-hour library means students can study at night), so 'Therefore' shows the cause-and-effect link. 'However' (contrast), 'Likewise' (comparison), and 'Previously' (time) don't match that logic.", "explanation_cn": "第二句是第一句带来的结果（24 小时开放 → 半夜也能学习），表因果用 Therefore。However 表转折、Likewise 表类比、Previously 表时间，都不符合两句的逻辑关系。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Transitions"}, {"qid": "d2-p8", "stem": "Which choice best describes the function of the third sentence in the text as a whole?", "passage": "Honeybees communicate the location of food sources through a 'waggle dance.' The angle of the dance indicates direction, while its duration signals distance. Researchers have recently discovered that bees also adjust the dance based on the quality of the food: richer sources inspire longer, more vigorous performances.", "options": ["It presents a recent finding that adds detail to the description in the previous sentences.", "It refutes the claim made in the first sentence.", "It summarizes the main argument of the text.", "It provides background information about honeybee habitats."], "answer": "A", "explanation_en": "The third sentence presents a new finding — bees adjusting the dance by food quality — which adds detail to the description in the first two sentences. It refutes nothing (not B), isn't a summary (not C), and never mentions habitats (not D).", "explanation_cn": "第三句讲的是新发现（蜜蜂会根据食物质量调整舞蹈），是对前两句描述的补充细节 → A。文中没有反驳（B 错）；不是总结全文（C 错）；没有提到栖息地（D 错）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Text Structure and Purpose"}, {"qid": "d2-p9", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "The committee, along with the school principal, ___ scheduled to announce the new policy tomorrow.", "options": ["are", "is", "were", "be"], "answer": "B", "explanation_en": "The subject is 'The committee' (singular); 'along with the school principal' is an interrupter that doesn't change the number, so singular 'is' is correct. 'Are' and 'were' are plural; 'be' lacks a helping verb and can't stand alone as the verb.", "explanation_cn": "主语是 The committee（单数），along with the school principal 是插入语，不改变主语单复数 → 谓语用单数 is。are/were 是复数形式，错；be 缺少助动词，不能单独作谓语。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Subject-Verb Agreement"}, {"qid": "d2-p10", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "She packed everything she would need for the trip ___ a map, a compass, and extra batteries.", "options": [":", ";", ",", "."], "answer": "A", "explanation_en": "The colon introduces the list of what she packed. A semicolon only joins two independent clauses; a comma can't introduce a list; a period would leave the list as an incomplete fragment.", "explanation_cn": "冒号用于引出列表 → 选冒号。分号只能连接两个独立分句；逗号不能引出列表；句号会让后面变成不完整的片段句。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Punctuation"}], "date": "2026-10-23"}, {"day": 3, "words": [{"word": "hackneyed", "pos": "adj.", "ipa": "/ˈhækniːd/", "def_en": "overused and therefore no longer interesting", "def_cn": "陈腐的，老套的", "example_en": "The critic dismissed the film's hackneyed plot, in which the underdog team triumphs in the final seconds.", "example_cn": "影评人对这部电影老套的剧情不屑一顾：弱旅在最后几秒反败为胜。"}, {"word": "hyperbole", "pos": "n.", "ipa": "/haɪˈpɜːrbəli/", "def_en": "an exaggerated statement not meant to be taken literally", "def_cn": "夸张（修辞手法）", "example_en": "Calling the brief rain shower a catastrophic flood was pure hyperbole.", "example_cn": "把一场短暂的阵雨称为灾难性洪水，纯属夸张。"}, {"word": "idiosyncrasy", "pos": "n.", "ipa": "/ˌɪdiəˈsɪŋkrəsi/", "def_en": "a distinctive or peculiar habit of a person", "def_cn": "独特的个人习惯，怪癖", "example_en": "One of the professor's many idiosyncrasies was grading papers only with a green pen.", "example_cn": "这位教授的怪癖之一，是只用绿笔批改试卷。"}, {"word": "impetus", "pos": "n.", "ipa": "/ˈɪmpətəs/", "def_en": "the force that makes something happen or develop", "def_cn": "推动力，动力", "example_en": "The energy crisis provided the impetus for the nation's investment in solar technology.", "example_cn": "能源危机成为该国投资太阳能技术的推动力。"}, {"word": "indolent", "pos": "adj.", "ipa": "/ˈɪndələnt/", "def_en": "wanting to avoid activity or exertion; lazy", "def_cn": "懒惰的，不愿劳作的", "example_en": "After months of indolent afternoons on the couch, he resolved to join a running club.", "example_cn": "在沙发上虚度了几个懒散的午后之后，他决定加入一个跑步俱乐部。"}, {"word": "ingenuity", "pos": "n.", "ipa": "/ˌɪndʒəˈnuːəti/", "def_en": "the quality of being clever, original, and inventive", "def_cn": "独创性，心灵手巧", "example_en": "The engineers' ingenuity turned a discarded shipping container into a fully equipped classroom.", "example_cn": "工程师们的巧思把一个废弃的集装箱改造成了设备齐全的教室。"}, {"word": "innate", "pos": "adj.", "ipa": "/ɪˈneɪt/", "def_en": "inborn; natural rather than learned", "def_cn": "天生的，与生俱来的", "example_en": "Her innate curiosity about how things work led her to dismantle every appliance in the house.", "example_cn": "她与生俱来的好奇心驱使她拆掉了家里所有的电器。"}, {"word": "inscrutable", "pos": "adj.", "ipa": "/ɪnˈskruːtəbəl/", "def_en": "impossible to understand or interpret", "def_cn": "高深莫测的，难以理解的", "example_en": "The ancient manuscript's inscrutable symbols have puzzled linguists for decades.", "example_cn": "这份古老手稿上高深莫测的符号困扰了语言学家几十年。"}, {"word": "intrepid", "pos": "adj.", "ipa": "/ɪnˈtrepɪd/", "def_en": "fearless; adventurous", "def_cn": "无畏的，勇敢的", "example_en": "The intrepid journalist traveled alone through the conflict zone to report the story.", "example_cn": "这位无畏的记者独自穿越冲突地区去报道新闻。"}, {"word": "judicious", "pos": "adj.", "ipa": "/dʒuːˈdɪʃəs/", "def_en": "having or showing good judgment; wise and careful", "def_cn": "明智的，审慎的", "example_en": "A judicious investor, she waited for the market to stabilize before buying stocks.", "example_cn": "作为一名审慎的投资者，她等到市场稳定后才买入股票。"}, {"word": "lament", "pos": "v.", "ipa": "/ləˈment/", "def_en": "to mourn or express sorrow", "def_cn": "哀悼，悲叹", "example_en": "Environmentalists lament the rapid disappearance of the region's wetlands.", "example_cn": "环保人士为该地区湿地的迅速消失而悲叹。"}, {"word": "laudable", "pos": "adj.", "ipa": "/ˈlɔːdəbəl/", "def_en": "deserving praise and commendation", "def_cn": "值得赞扬的", "example_en": "The student's laudable effort to tutor her classmates earned her the community service award.", "example_cn": "这名学生辅导同学的值得称赞的努力为她赢得了社区服务奖。"}, {"word": "lethargic", "pos": "adj.", "ipa": "/ləˈθɑːrdʒɪk/", "def_en": "sluggish and apathetic; lacking energy", "def_cn": "无精打采的，昏昏欲睡的", "example_en": "The hot, humid afternoon made even the most energetic children lethargic.", "example_cn": "闷热潮湿的午后让最活泼的孩子都变得无精打采。"}, {"word": "magnanimous", "pos": "adj.", "ipa": "/mæɡˈnænɪməs/", "def_en": "generous or forgiving, especially toward a rival", "def_cn": "宽宏大量的，慷慨的", "example_en": "In a magnanimous gesture, the champion congratulated her opponent and praised his performance.", "example_cn": "冠军做出了一个宽宏大量的举动：祝贺对手并称赞他的表现。"}, {"word": "meticulous", "pos": "adj.", "ipa": "/məˈtɪkjələs/", "def_en": "showing great attention to detail; very careful", "def_cn": "一丝不苟的，细致的", "example_en": "The watchmaker's meticulous craftsmanship is evident in every tiny gear.", "example_cn": "这位制表师一丝不苟的工艺体现在每一个微小的齿轮上。"}, {"word": "nascent", "pos": "adj.", "ipa": "/ˈneɪsənt/", "def_en": "just coming into existence; beginning to develop", "def_cn": "初生的，萌芽的", "example_en": "The nascent democracy struggled to establish fair elections in its first decade.", "example_cn": "这个初生的民主政体在第一个十年里艰难地建立公平选举。"}, {"word": "nefarious", "pos": "adj.", "ipa": "/nɪˈferiəs/", "def_en": "wicked or criminal", "def_cn": "邪恶的，不法的", "example_en": "The detective uncovered the nefarious scheme to rig the city's elections.", "example_cn": "侦探揭露了操纵该市选举的邪恶阴谋。"}, {"word": "nuance", "pos": "n.", "ipa": "/ˈnuːɑːns/", "def_en": "a subtle difference in meaning or expression", "def_cn": "细微差别", "example_en": "A skilled translator captures not just the words but the nuance of the original text.", "example_cn": "出色的译者不仅传达文字，还传达原文的细微差别。"}, {"word": "obdurate", "pos": "adj.", "ipa": "/ˈɑːbdʊrət/", "def_en": "stubbornly refusing to change one's opinion or course of action", "def_cn": "固执的，顽固不化的", "example_en": "Despite hours of negotiation, the committee remained obdurate in its refusal to revise the policy.", "example_cn": "尽管谈判了数小时，委员会仍然固执地拒绝修改政策。"}, {"word": "opulent", "pos": "adj.", "ipa": "/ˈɑːpjələnt/", "def_en": "ostentatiously rich and luxurious", "def_cn": "豪华的，富丽堂皇的", "example_en": "The opulent ballroom, with its crystal chandeliers and marble floors, dazzled the guests.", "example_cn": "富丽堂皇的舞厅里水晶吊灯、大理石地板，让宾客目眩神迷。"}], "practice": [{"qid": "d3-p1", "stem": "Which choice completes the text with the most logical and precise word?", "passage": "The review praised the novel's fresh dialogue but criticized its ___ ending, in which the long-lost siblings reunite just in time for the holidays—a conclusion readers have encountered countless times before.", "options": ["hackneyed", "ambiguous", "inscrutable", "judicious"], "answer": "A", "explanation_en": "The ending is one 'readers have encountered countless times before' — that means it's 'hackneyed' (overused, clichéd). 'Ambiguous' (unclear) doesn't match 'seen countless times'; 'inscrutable' (mysterious) is nearly the opposite; 'judicious' (wise) is irrelevant.", "explanation_cn": "结尾是“读者见过无数次的”，只能是“老套的”hackneyed。ambiguous（含糊的）与“见过无数次”不符；inscrutable（高深莫测的）语义相反；judicious（明智的）与语境无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d3-p2", "stem": "Which choice completes the text with the most logical and precise word?", "passage": "Unlike her cautious colleagues, who preferred to analyze data from the safety of the lab, Dr. Alvarez was ___: she personally led expeditions into the remote rainforest to collect samples.", "options": ["indolent", "intrepid", "obdurate", "lethargic"], "answer": "B", "explanation_en": "Contrasted with her cautious colleagues, she personally led expeditions into the rainforest — that's 'intrepid' (fearless). 'Indolent' (lazy) and 'lethargic' (sluggish) contradict leading expeditions; 'obdurate' (stubborn) is irrelevant.", "explanation_cn": "与“谨慎的同事”对比，她亲自带队深入雨林，只能是“无畏的”intrepid。indolent（懒惰的）和 lethargic（无精打采的）都与“亲自带队”矛盾；obdurate（固执的）与语境无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d3-p3", "stem": "Which choice completes the text with the most logical and precise word?", "passage": "The restorer's ___ examination of the painting—documenting every crack and discoloration under magnification—ensured that no detail was overlooked before repairs began.", "options": ["nascent", "meticulous", "nefarious", "hackneyed"], "answer": "B", "explanation_en": "The dash explains she documented every crack under magnification — that's 'meticulous' (extremely careful). 'Nascent' (newborn) is irrelevant; 'nefarious' (wicked) is wrongly negative; 'hackneyed' (clichéd) is irrelevant.", "explanation_cn": "破折号后解释“记录每一道裂缝”，只能是“细致的”meticulous。nascent（初生的）无关；nefarious（邪恶的）贬义不符；hackneyed（陈腐的）无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d3-p4", "stem": "Which choice completes the text with the most logical and precise word?", "passage": "Historians argue that the invention of the printing press provided the ___ for the rapid spread of new ideas across Europe, accelerating the pace of the Renaissance.", "options": ["lament", "impetus", "idiosyncrasy", "hyperbole"], "answer": "B", "explanation_en": "The printing press gave the spread of new ideas its driving force — 'impetus' (momentum). 'Lament' (to mourn) is wrong in both part of speech and meaning; 'idiosyncrasy' (quirk) and 'hyperbole' (exaggeration) are unrelated.", "explanation_cn": "印刷术“为”新思想的迅速传播提供了 ___，只能是“推动力”impetus。lament（悲叹）词性语义不符；idiosyncrasy（怪癖）无关；hyperbole（夸张）无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d3-p5", "stem": "Which choice completes the text with the most logical and precise word?", "passage": "Machine translation often misses the ___ of literary language—the slight shifts in tone that signal irony or affection—leaving the rendered text technically accurate but emotionally flat.", "options": ["nuance", "impetus", "idiosyncrasy", "lament"], "answer": "A", "explanation_en": "The dash defines it as 'slight shifts in tone' — that's 'nuance' (a subtle difference). 'Impetus,' 'idiosyncrasy,' and 'lament' are all unrelated to subtle shades of meaning.", "explanation_cn": "破折号后解释“语气上的细微变化”，只能是“细微差别”nuance。impetus（推动力）无关；idiosyncrasy（怪癖）无关；lament（悲叹）无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d3-p6", "stem": "Which choice completes the text with the most logical and precise word?", "passage": "After winning the championship, the team's captain made a ___ gesture: she invited the defeated finalists to join the victory celebration, praising their effort throughout the tournament.", "options": ["obdurate", "magnanimous", "indolent", "nefarious"], "answer": "B", "explanation_en": "Inviting the defeated finalists to celebrate and praising their effort is a 'magnanimous' (generous, forgiving) gesture. 'Obdurate' (stubborn) and 'nefarious' (wicked) are opposites; 'indolent' (lazy) is irrelevant.", "explanation_cn": "邀请落败者参加庆功并称赞他们，只能是“宽宏大量的”magnanimous。obdurate（固执的）语义相反；indolent（懒惰的）无关；nefarious（邪恶的）贬义相反。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Words in Context"}, {"qid": "d3-p7", "stem": "Which choice completes the text with the most logical transition?", "passage": "The city's new bike-share program was initially met with skepticism. ___ ridership has doubled in the past year, and surveys show that 70% of users now commute by bike at least twice a week.", "options": ["However,", "For example,", "Similarly,", "Therefore,"], "answer": "A", "explanation_en": "The program was first met with skepticism, but ridership has since doubled — that's a contrast, so 'However' is right. 'For example' introduces an example, 'Similarly' shows similarity, and 'Therefore' shows cause and effect — none of those fit.", "explanation_cn": "前句说“最初受到质疑”，后句说“骑行量翻倍、评价高”，是转折关系，选 However。For example 表举例，Similarly 表并列相似，Therefore 表因果，都不符合转折逻辑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Transitions"}, {"qid": "d3-p8", "stem": "Which choice best describes the overall structure of the text?", "passage": "Marine biologist Elena Ruiz spent three summers tagging sea turtles off the coast of Costa Rica. She expected to confirm the prevailing theory that the turtles return to the same beach each year. Instead, her tracking data revealed that nearly a third of the turtles nested on different beaches, a finding that challenges long-held assumptions about the species' behavior.", "options": ["It presents a researcher's expectation, then describes findings that contradict it.", "It outlines a scientific debate, then argues for one side.", "It summarizes a theory, then provides evidence supporting it.", "It describes a natural phenomenon, then proposes a solution to a problem."], "answer": "A", "explanation_en": "The text first states the researcher's expectation (to confirm the theory), then reports findings that contradict it ('Instead…challenges'). There's no debate between two sides (not B); the evidence refutes rather than supports the theory (not C); and no solution is proposed (not D).", "explanation_cn": "文本先讲研究者的预期（expected to confirm），再讲发现与之矛盾（Instead…challenges），对应 A。B 文中没有呈现辩论双方；C 证据是反驳而非支持理论；D 没有提出解决方案。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Text Structure and Purpose"}, {"qid": "d3-p9", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "The committee of engineers, after months of testing, ___ decided to approve the new bridge design.", "options": ["have", "has", "are", "were"], "answer": "B", "explanation_en": "The subject 'committee' is singular in American English, and 'of engineers' is just a prepositional phrase that doesn't affect number — so singular 'has' is correct. 'Have,' 'are,' and 'were' are all plural forms.", "explanation_cn": "主语是 committee（委员会），在美式英语中作单数看待；of engineers 是介词短语，不影响主谓一致，所以用单数 has。have、are、were 都是复数形式，错误。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Standard English Conventions"}, {"qid": "d3-p10", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "The company takes pride in ___ long history of innovation.", "options": ["its", "it's", "their", "there"], "answer": "A", "explanation_en": "We need a possessive adjective before 'history' — 'its.' 'It's' means 'it is,' which breaks the sentence; 'their' is plural and clashes with the singular 'company'; 'there' refers to a place and is irrelevant.", "explanation_cn": "这里需要形容词性物主代词修饰 history，只能是 its。it's = it is，放入句中不通；their 指复数，与单数 company 不一致；there 是地点副词，无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Standard English Conventions"}], "date": "2026-10-26"}, {"day": 4, "words": [{"word": "affluent", "pos": "adj.", "ipa": "/ˈæfluənt/", "def_en": "having a great deal of money; wealthy", "def_cn": "富裕的，有钱的", "example_en": "The affluent suburb boasted tree-lined streets, private schools, and some of the highest property values in the state.", "example_cn": "这个富裕的郊区拥有绿树成荫的街道、私立学校，是全州房价最高的地区之一。"}, {"word": "aloof", "pos": "adj.", "ipa": "/əˈluːf/", "def_en": "distant and uninvolved; emotionally detached", "def_cn": "疏远的，冷漠的", "example_en": "The new student seemed aloof at first, rarely joining conversations during lunch in the crowded cafeteria.", "example_cn": "这个新生起初显得很疏远，在拥挤的食堂吃午饭时很少参与交谈。"}, {"word": "assuage", "pos": "v.", "ipa": "/əˈsweɪdʒ/", "def_en": "to make something unpleasant less intense; to ease or calm", "def_cn": "缓和，减轻，安抚", "example_en": "The principal tried to assuage parents' concerns by presenting detailed data on the school's improved safety measures.", "example_cn": "校长试图通过展示学校安全措施改善的详细数据来安抚家长的担忧。"}, {"word": "brusque", "pos": "adj.", "ipa": "/brʌsk/", "def_en": "abruptly blunt in speech or manner; curt", "def_cn": "生硬的，唐突无礼的", "example_en": "His brusque reply to the reporter's question surprised the audience, who had expected a more diplomatic answer.", "example_cn": "他对记者提问的生硬回答让观众感到惊讶，大家原本期待一个更圆滑的回答。"}, {"word": "conjecture", "pos": "v.", "ipa": "/kənˈdʒektʃər/", "def_en": "to form an opinion based on incomplete information; to guess", "def_cn": "推测，猜测", "example_en": "Without fossil evidence from that era, scientists can only conjecture about how the earliest mammals behaved.", "example_cn": "由于缺乏那个时代的化石证据，科学家只能推测最早的哺乳动物是如何生活的。"}, {"word": "denigrate", "pos": "v.", "ipa": "/ˈdenɪɡreɪt/", "def_en": "to attack someone's reputation; to belittle unfairly", "def_cn": "诋毁，贬低", "example_en": "The editorial did not merely criticize the proposal; it sought to denigrate the character of everyone who supported it.", "example_cn": "这篇社论不只是批评该提案，还试图诋毁每一位支持者的人格。"}, {"word": "disparate", "pos": "adj.", "ipa": "/ˈdɪspərət/", "def_en": "fundamentally different; distinct in kind", "def_cn": "迥然不同的", "example_en": "The committee brought together scholars from disparate fields, including physics, poetry, and economics.", "example_cn": "该委员会汇集了来自物理学、诗歌和经济学等迥然不同领域的学者。"}, {"word": "equanimity", "pos": "n.", "ipa": "/ˌekwəˈnɪməti/", "def_en": "calmness and composure, especially under stress", "def_cn": "镇定，沉着", "example_en": "Despite the hostile questions from the audience, the speaker maintained her equanimity throughout the debate.", "example_cn": "尽管观众提出了尖锐的问题，演讲者在整个辩论中始终保持镇定。"}, {"word": "explicit", "pos": "adj.", "ipa": "/ɪkˈsplɪsɪt/", "def_en": "stated clearly and in detail, leaving no room for confusion", "def_cn": "明确的，清楚的", "example_en": "The instructions were explicit: all applications had to be submitted before midnight on Friday.", "example_cn": "说明非常明确：所有申请必须在周五午夜前提交。"}, {"word": "garrulous", "pos": "adj.", "ipa": "/ˈɡærələs/", "def_en": "excessively talkative, especially on trivial matters", "def_cn": "喋喋不休的", "example_en": "The garrulous tour guide talked continuously for two hours, barely pausing even when the group stopped to rest.", "example_cn": "这位喋喋不休的导游连续讲了两个小时，即使团队停下来休息也几乎不停。"}, {"word": "impassive", "pos": "adj.", "ipa": "/ɪmˈpæsɪv/", "def_en": "not showing emotion; expressionless", "def_cn": "面无表情的，冷漠的", "example_en": "The judge listened with an impassive expression, giving no hint of how she would rule on the case.", "example_cn": "法官面无表情地听着，没有透露她将如何裁决此案。"}, {"word": "laconic", "pos": "adj.", "ipa": "/ləˈkɑːnɪk/", "def_en": "using very few words; concise to the point of seeming rude", "def_cn": "简洁的，惜字如金的", "example_en": "Famous for his laconic style, the novelist once answered an hour-long interview with fewer than fifty words.", "example_cn": "这位以简洁风格著称的小说家，曾用不到五十个词回答了一场长达一小时的采访。"}, {"word": "oblique", "pos": "adj.", "ipa": "/oʊˈbliːk/", "def_en": "indirect in expression; not straightforward", "def_cn": "间接的，含糊的", "example_en": "Rather than giving a direct answer, the senator offered an oblique response that left reporters guessing.", "example_cn": "这位参议员没有直接回答，而是给出了一个含糊的回应，让记者们猜测不已。"}, {"word": "perennial", "pos": "adj.", "ipa": "/pəˈreniəl/", "def_en": "lasting for a long time; recurring again and again", "def_cn": "常年的，经久不衰的", "example_en": "Funding for public libraries has been a perennial issue, debated by every city council for decades.", "example_cn": "公共图书馆的经费问题经久不衰，几十年来每一届市议会都在争论。"}, {"word": "precursor", "pos": "n.", "ipa": "/priːˈkɜːrsər/", "def_en": "something that comes before and signals what follows; a forerunner", "def_cn": "先驱，前身", "example_en": "The telegraph was an important precursor to the internet, proving that instant long-distance communication was possible.", "example_cn": "电报是互联网的重要先驱，证明了即时远距离通信是可能的。"}, {"word": "pugnacious", "pos": "adj.", "ipa": "/pʌɡˈneɪʃəs/", "def_en": "eager to argue or fight; combative", "def_cn": "好斗的", "example_en": "The pugnacious debater challenged every opponent's argument, refusing to concede even a single point.", "example_cn": "这位好斗的辩手挑战每一位对手的论点，拒绝让步任何一点。"}, {"word": "scintillating", "pos": "adj.", "ipa": "/ˈsɪntəleɪtɪŋ/", "def_en": "brilliant and exciting; sparkling with wit or talent", "def_cn": "才华横溢的，闪闪发光的", "example_en": "Her scintillating performance in the school play earned her a standing ovation from the entire audience.", "example_cn": "她在校园话剧中光彩夺目的表演赢得了全场观众的起立鼓掌。"}, {"word": "substantiate", "pos": "v.", "ipa": "/səbˈstænʃieɪt/", "def_en": "to provide evidence that proves a claim is true", "def_cn": "证实，用证据支持", "example_en": "The scientist conducted three more experiments to substantiate her controversial claim about the new drug.", "example_cn": "这位科学家又做了三次实验，以证实她关于这种新药的有争议的主张。"}, {"word": "transient", "pos": "adj.", "ipa": "/ˈtrænʃənt/", "def_en": "lasting only a short time; temporary", "def_cn": "短暂的，转瞬即逝的", "example_en": "The joy of winning the championship was transient, fading within weeks as the new season began.", "example_cn": "夺冠的喜悦是短暂的，新赛季开始几周后就消退了。"}, {"word": "veracity", "pos": "n.", "ipa": "/vəˈræsəti/", "def_en": "conformity to facts; truthfulness and accuracy", "def_cn": "真实性", "example_en": "The reporter checked three independent sources to confirm the veracity of the leaked documents.", "example_cn": "这位记者核查了三个独立消息源，以确认泄露文件的真实性。"}], "practice": [{"qid": "d4-q1", "stem": "After the chemical spill, the mayor held a press conference to ______ the residents' fears, explaining that the water supply had been tested and found safe. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["assuage", "confirm", "document", "anticipate"], "answer": "A", "explanation_en": "'Assuage' means to ease or calm, which fits a mayor trying to calm residents' fears. 'Confirm' would mean verifying the fears rather than calming them; 'document' and 'anticipate' do not describe calming emotions.", "explanation_cn": "assuage 意为'缓和、安抚'，符合市长安抚居民恐惧的语境。confirm（证实）反而会加重恐惧；document（记录）和 anticipate（预料）都与'安抚情绪'无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d4-q2", "stem": "Unlike his garrulous opponent, who spoke for nearly an hour, the challenger gave a ______ response, answering each question in a single sentence. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["lengthy", "laconic", "hostile", "improvised"], "answer": "B", "explanation_en": "'Laconic' means using very few words, the direct contrast to 'garrulous' (excessively talkative). 'Lengthy' is the opposite of what the blank requires, while 'hostile' and 'improvised' describe attitude and preparation, not brevity.", "explanation_cn": "laconic 意为'简洁的'，与 garrulous（喋喋不休的）形成直接对比。lengthy（冗长的）意思相反；hostile（敌对的）和 improvised（即兴的）描述的是态度和准备情况，而非简洁。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d4-q3", "stem": "Because the manuscript was badly damaged, historians could only ______ about the missing passages, filling the gaps with educated guesses based on the surviving text. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["complain", "conjecture", "argue", "boast"], "answer": "B", "explanation_en": "'Conjecture' means to guess based on incomplete evidence, exactly what historians do when making 'educated guesses.' The other choices describe emotional or rhetorical acts that do not fit the context of filling gaps in a text.", "explanation_cn": "conjecture 意为'根据不完整证据推测'，正好对应文中的 educated guesses（有根据的猜测）。其他选项描述的是情绪或修辞行为，与填补文本空白的语境不符。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d4-q4", "stem": "Urban beekeepers report that honeybee colonies on city rooftops often produce more honey than rural hives. Researchers attribute this to the diversity of flowering plants in parks and gardens, which bloom at different times and provide a steadier food supply than the single-crop fields surrounding many rural apiaries. According to the text, why do urban hives often outperform rural ones?", "passage": "", "options": ["Cities have fewer natural predators of bees.", "Urban flowers produce more nectar per bloom.", "A variety of city plants offers bees a more consistent food source.", "Rooftop hives are better protected from harsh weather."], "answer": "C", "explanation_en": "The text states that diverse city plants blooming at different times give bees a 'steadier food supply' than single-crop rural fields. The other options mention predators, nectar quantity, and weather protection, none of which appear in the text.", "explanation_cn": "文中说城市中多种植物在不同时间开花，给蜜蜂提供了比农村单一作物田'更稳定的食物供应'。其他选项提到的天敌、花蜜量和天气保护在文中都没有出现。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d4-q5", "stem": "Biologist Elena Ruiz has spent a decade studying coral reefs. She was surprised to find that some reefs recovered quickly after bleaching events. Further investigation revealed that these resilient reefs shared a common feature: strong ocean currents that carried away excess heat. Which choice best describes the function of the second sentence in the text as a whole?", "passage": "", "options": ["It states a finding that the rest of the text goes on to explain.", "It summarizes the conclusion of Ruiz's decade of research.", "It challenges a widely accepted theory about coral bleaching.", "It describes the research methods Ruiz used in her investigation."], "answer": "A", "explanation_en": "The second sentence presents the surprising finding (quick recovery), and the third sentence explains it (strong currents carried away heat). It does not summarize the whole study, challenge a theory, or describe research methods.", "explanation_cn": "第二句提出了令人惊讶的发现（珊瑚礁恢复迅速），第三句解释了原因（强洋流带走多余热量）。它没有总结整个研究、挑战某个理论，也没有描述研究方法。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d4-q6", "stem": "The journalist's claims about corruption were dramatic, but she failed to ______ them with documents or named sources, leaving readers with little reason to believe her. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["substantiate", "publicize", "retract", "illustrate"], "answer": "A", "explanation_en": "'Substantiate' means to support with evidence, which is precisely what documents and named sources would provide. 'Publicize' means to make public (already done), 'retract' means to withdraw, and 'illustrate' means to clarify with examples — none fits the need for proof.", "explanation_cn": "substantiate 意为'用证据证实'，正是文件和具名消息源能提供的东西。publicize（公开）已经做过了；retract（撤回）意思相反；illustrate（举例说明）不等于提供证据。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d4-q7", "stem": "The ancient library of Alexandria, which once housed hundreds of thousands of scrolls, ______ destroyed by a series of fires over several centuries. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": ["was", "were", "are", "have been"], "answer": "A", "explanation_en": "The subject is 'The ancient library,' a singular noun, so the singular past-tense verb 'was' is required. The plural and present-tense options do not agree with the singular subject or the historical time frame.", "explanation_cn": "主语是单数名词 The ancient library，且描述的是历史事件，应用过去时单数 was。复数或现在时选项与主语和时态都不一致。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d4-q8", "stem": "Honeybees communicate the location of food through the waggle dance. ______, ants lay down chemical trails that nestmates follow to rich food sources. Which choice completes the text with the most logical transition?", "passage": "", "options": ["Similarly", "However", "Therefore", "For example"], "answer": "A", "explanation_en": "Both sentences describe insects communicating food locations through different mechanisms, so 'Similarly' correctly signals the comparison. 'However' would signal contrast, 'Therefore' a conclusion, and 'For example' an illustration of the previous claim — none fits.", "explanation_cn": "两句话都描述昆虫通过不同机制传递食物位置的信息，是类比关系，所以用 Similarly。However 表转折，Therefore 表结论，For example 表举例，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d4-q9", "stem": "The committee members came from ______ backgrounds — a farmer, a software engineer, a retired teacher, and a marine biologist — yet they reached agreement within a single afternoon. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["similar", "privileged", "disparate", "wealthy"], "answer": "C", "explanation_en": "'Disparate' means fundamentally different, matching the varied occupations listed. 'Similar' contradicts the list, while 'privileged' and 'wealthy' describe social status, which the text does not discuss.", "explanation_cn": "disparate 意为'迥然不同的'，与列举的多种职业相符。similar（相似的）与文意矛盾；privileged（优越的）和 wealthy（富有的）描述的是社会地位，文中并未涉及。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d4-q10", "stem": "A study tracked the nightly sleep of 200 college students. During a regular week, students averaged 7.1 hours of sleep per night; during exam week, the average fell to 5.2 hours. Which choice most effectively uses the data to support the claim that exam stress reduces sleep?", "passage": "", "options": ["students slept nearly two hours less per night during exam week than during a regular week.", "students slept more during exam week because they stayed up studying.", "students averaged the same amount of sleep in both weeks.", "students need exactly eight hours of sleep every night."], "answer": "A", "explanation_en": "The data shows a drop from 7.1 to 5.2 hours — nearly two hours less per night. The other choices contradict the data or introduce claims (needing eight hours) not supported by it.", "explanation_cn": "数据显示从 7.1 小时降到 5.2 小时，少了近两小时。其他选项与数据矛盾，或引入了数据不支持的说法（如需要八小时睡眠）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-10-27"}, {"day": 5, "words": [{"word": "abate", "pos": "v.", "ipa": "/əˈbeɪt/", "def_en": "to become less intense; to lessen or subside", "def_cn": "减轻，减弱，平息", "example_en": "After the new traffic laws took effect, the number of accidents on the highway began to abate.", "example_cn": "新的交通法规生效后，高速公路上的事故数量开始减少。"}, {"word": "altruistic", "pos": "adj.", "ipa": "/ˌæltruˈɪstɪk/", "def_en": "selflessly concerned for the well-being of others", "def_cn": "利他的，无私的", "example_en": "The volunteers' altruistic efforts brought clean water to villages that had suffered from drought for years.", "example_cn": "志愿者们无私的努力为遭受多年干旱的村庄带来了干净的水。"}, {"word": "audacious", "pos": "adj.", "ipa": "/ɔːˈdeɪʃəs/", "def_en": "bold and daring; willing to take risks", "def_cn": "大胆的", "example_en": "The startup's audacious plan to build a city on the ocean attracted both investors and skeptics.", "example_cn": "这家初创公司在海上建城的大胆计划既吸引了投资者，也引来了质疑者。"}, {"word": "capitulate", "pos": "v.", "ipa": "/kəˈpɪtʃəleɪt/", "def_en": "to surrender or give in to demands", "def_cn": "投降，屈服", "example_en": "After months of siege, the defending army finally decided to capitulate rather than risk further losses.", "example_cn": "经过数月的围困，守军最终决定投降，而不愿冒更大的损失。"}, {"word": "clandestine", "pos": "adj.", "ipa": "/klænˈdestɪn/", "def_en": "kept secret, often for hidden or illegal purposes", "def_cn": "秘密的", "example_en": "The journalists held clandestine meetings with the whistleblower to protect his identity from the authorities.", "example_cn": "记者们与告密者秘密会面，以保护他的身份不被当局发现。"}, {"word": "deplete", "pos": "v.", "ipa": "/dɪˈpliːt/", "def_en": "to use up a supply; to exhaust resources", "def_cn": "耗尽", "example_en": "Overfishing has severely depleted the tuna population in the Pacific, alarming marine biologists worldwide.", "example_cn": "过度捕捞严重耗尽了太平洋的金枪鱼资源，令全球海洋生物学家担忧。"}, {"word": "diffident", "pos": "adj.", "ipa": "/ˈdɪfɪdənt/", "def_en": "shy and lacking self-confidence", "def_cn": "羞怯的，缺乏自信的", "example_en": "The diffident freshman hesitated before raising her hand, even though she knew the correct answer.", "example_cn": "这位羞怯的新生在举手前犹豫了，尽管她知道正确答案。"}, {"word": "erudite", "pos": "adj.", "ipa": "/ˈerudaɪt/", "def_en": "having or showing great knowledge; scholarly", "def_cn": "博学的", "example_en": "The professor's erudite lecture on ancient Rome drew on sources in four different languages.", "example_cn": "教授关于古罗马的博学讲座引用了四种不同语言的资料。"}, {"word": "exhaustive", "pos": "adj.", "ipa": "/ɪɡˈzɔːstɪv/", "def_en": "thorough and complete; covering every detail", "def_cn": "详尽的，彻底的", "example_en": "The committee conducted an exhaustive review of all 200 applications before selecting the finalists.", "example_cn": "委员会在选出入围者之前，对全部 200 份申请进行了详尽的审查。"}, {"word": "glib", "pos": "adj.", "ipa": "/ɡlɪb/", "def_en": "fluent and smooth-talking, but shallow or insincere", "def_cn": "油嘴滑舌的，流利但不真诚的", "example_en": "Voters were unimpressed by the candidate's glib promises, which lacked any specific plan or detail.", "example_cn": "选民对候选人油嘴滑舌的承诺不以为然，因为其中没有任何具体计划或细节。"}, {"word": "immutable", "pos": "adj.", "ipa": "/ɪˈmjuːtəbəl/", "def_en": "unable to be changed; fixed", "def_cn": "不可改变的", "example_en": "While fashions change every season, the laws of physics remain immutable.", "example_cn": "时尚每季都在变，但物理定律是不变的。"}, {"word": "lugubrious", "pos": "adj.", "ipa": "/luːˈɡuːbriəs/", "def_en": "mournful and gloomy in an exaggerated way", "def_cn": "忧郁的，悲哀的", "example_en": "The lugubrious tone of the novel, filled with loss and regret, left many readers in tears.", "example_cn": "这部小说忧郁的基调充满失去与遗憾，让许多读者落泪。"}, {"word": "obsequious", "pos": "adj.", "ipa": "/əbˈsiːkwiəs/", "def_en": "excessively eager to please; fawning and servile", "def_cn": "谄媚的，奉承的", "example_en": "The manager was surrounded by obsequious assistants who agreed with everything he said.", "example_cn": "这位经理身边围满了谄媚的助理，对他说的每句话都表示赞同。"}, {"word": "platitude", "pos": "n.", "ipa": "/ˈplætɪtuːd/", "def_en": "a trite, overused remark with little meaning", "def_cn": "陈词滥调", "example_en": "Instead of offering real advice, the speaker filled his talk with empty platitudes about following your dreams.", "example_cn": "演讲者没有给出真正的建议，而是用'追随梦想'之类的空洞陈词滥调填满了演讲。"}, {"word": "profligate", "pos": "adj.", "ipa": "/ˈprɑːflɪɡət/", "def_en": "recklessly wasteful; extravagant", "def_cn": "挥霍的，浪费的", "example_en": "The profligate spending of the previous administration left the city with a massive budget deficit.", "example_cn": "上届政府的挥霍无度让城市背上了巨额预算赤字。"}, {"word": "querulous", "pos": "adj.", "ipa": "/ˈkwerələs/", "def_en": "complaining in an annoying way; whining", "def_cn": "爱抱怨的", "example_en": "The querulous customer complained about the food, the service, and even the background music.", "example_cn": "这位爱抱怨的顾客抱怨食物、抱怨服务，甚至抱怨背景音乐。"}, {"word": "solicitous", "pos": "adj.", "ipa": "/səˈlɪsɪtəs/", "def_en": "showing care and concern; attentive", "def_cn": "关切的，体贴的", "example_en": "The solicitous nurse checked on her patients every hour, making sure they were comfortable.", "example_cn": "这位体贴的护士每小时都去查看病人，确保他们舒适。"}, {"word": "taciturn", "pos": "adj.", "ipa": "/ˈtæsɪtɜːrn/", "def_en": "habitually silent; reserved in speech", "def_cn": "沉默寡言的", "example_en": "The taciturn farmer rarely spoke at town meetings, but everyone listened when he did.", "example_cn": "这位沉默寡言的农夫在镇民大会上很少发言，但他一开口所有人都会倾听。"}, {"word": "ubiquitous", "pos": "adj.", "ipa": "/juːˈbɪkwɪtəs/", "def_en": "present everywhere at the same time", "def_cn": "无处不在的", "example_en": "Security cameras are now ubiquitous in big cities, watching streets, shops, and subway stations.", "example_cn": "监控摄像头如今在大城市无处不在，监视着街道、商店和地铁站。"}, {"word": "vindicate", "pos": "v.", "ipa": "/ˈvɪndɪkeɪt/", "def_en": "to clear someone of blame; to prove right or justified", "def_cn": "证明无罪，为……辩护", "example_en": "The final report vindicated the engineer, showing that the bridge collapse was caused by faulty materials.", "example_cn": "最终报告证明了这位工程师的清白，显示大桥坍塌是由劣质材料造成的。"}], "practice": [{"qid": "d5-q1", "stem": "The storm finally began to ______ after midnight, and by dawn the winds had calmed enough for rescue crews to begin their work. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["intensify", "abate", "return", "shift"], "answer": "B", "explanation_en": "'Abate' means to lessen or subside, fitting a storm that calmed by dawn. 'Intensify' and 'return' suggest the opposite, and 'shift' describes a change in direction, not a decrease in strength.", "explanation_cn": "abate 意为'减弱、平息'，符合暴风雨到黎明时平息的语境。intensify（加剧）和 return（重来）意思相反；shift（转向）指方向变化，而非强度减弱。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d5-q2", "stem": "Smartphones have become so ______ that it is now unusual to see a teenager without one, even in the most remote towns. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["expensive", "ubiquitous", "fragile", "outdated"], "answer": "B", "explanation_en": "'Ubiquitous' means present everywhere, matching the idea that phones are now found even in remote towns. The other choices describe cost, durability, or age — none explains their universal presence.", "explanation_cn": "ubiquitous 意为'无处不在的'，与'连最偏远的小镇都有'相呼应。其他选项描述的是价格、耐用性或新旧，都无法解释其普遍存在。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d5-q3", "stem": "New DNA evidence ______ the man who had spent twelve years in prison, proving that he had been wrongly convicted of the crime. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["implicated", "vindicated", "ignored", "punished"], "answer": "B", "explanation_en": "'Vindicate' means to clear from blame, which is what the DNA evidence did by proving the conviction was wrongful. 'Implicated' and 'punished' suggest guilt, the opposite meaning, and 'ignored' does not fit evidence that proved innocence.", "explanation_cn": "vindicate 意为'证明无罪'，DNA 证据证明他是被冤枉的，正是此意。implicated（牵连）和 punished（惩罚）暗示有罪，意思相反；ignored（忽视）与'证明清白'的证据不符。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d5-q4", "stem": "The author's description of the abandoned factory — its 'rusted gates sagging like tired eyelids' and 'windows staring blankly at the empty street' — suggests which tone?", "passage": "", "options": ["celebratory", "melancholic", "furious", "indifferent"], "answer": "B", "explanation_en": "Images of sagging gates and blankly staring windows evoke sadness and decay, a melancholic tone. 'Celebratory' and 'furious' imply strong positive or angry feelings absent here, and 'indifferent' contradicts the vivid, emotional imagery.", "explanation_cn": "下垂的铁门、空洞的窗户等意象唤起衰败和忧伤之感，是 melancholic（忧郁的）语气。celebratory（欢庆的）和 furious（愤怒的）所暗示的强烈情感文中没有；indifferent（漠然的）与生动的情感意象相矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d5-q5", "stem": "The recipe called for three spices ______ cinnamon, cardamom, and cloves — each adding a distinct warmth to the dish. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": [":", ";", ",", "—"], "answer": "A", "explanation_en": "A colon properly introduces a list that explains or expands on what precedes it. A semicolon joins independent clauses, a comma would create a comma splice here, and a dash is less conventional for introducing a formal list in SAT style.", "explanation_cn": "冒号用于引出解释前文内容的列表。分号连接独立分句；逗号在此会造成逗号粘连；破折号在 SAT 规范中不如冒号正式。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d5-q6", "stem": "While revising an essay about recycling, a student wants to combine these ideas into one effective sentence: 'Recycling reduces landfill waste. It also saves energy. Manufacturing products from recycled materials requires less energy than using raw materials.' Which choice most effectively combines the ideas?", "passage": "", "options": ["Recycling reduces landfill waste, and it also saves energy, and manufacturing products from recycled materials requires less energy than using raw materials.", "By reducing landfill waste and requiring less energy than manufacturing from raw materials, recycling saves energy.", "Recycling both reduces landfill waste and saves energy, since manufacturing from recycled materials uses less energy than starting from raw materials.", "Landfill waste is reduced by recycling, which is good, and energy is saved too."], "answer": "C", "explanation_en": "Choice C combines all three ideas concisely with a clear causal link ('since'). Choice A is wordy and repetitive, B confusingly merges the ideas, and D is vague and informal.", "explanation_cn": "C 选项简洁地合并了三个要点，并用 since 建立了清晰的因果关系。A 啰嗦重复，B 逻辑混乱，D 含糊且不正式。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d5-q7", "stem": "The two diplomats held ______ meetings in a small Geneva café, taking care that no journalists would discover the negotiations. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["public", "clandestine", "ceremonial", "brief"], "answer": "B", "explanation_en": "'Clandestine' means secret or concealed, matching meetings deliberately hidden from journalists. 'Public' is the opposite, 'ceremonial' describes formal ritual, and 'brief' describes length — none captures the secrecy.", "explanation_cn": "clandestine 意为'秘密的'，与刻意躲避记者的会面相符。public（公开的）意思相反；ceremonial（仪式的）指正式礼仪；brief（短暂的）指时长，都不能表达'秘密'之意。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d5-q8", "stem": "Octopuses can change both the color and texture of their skin in less than a second. Recent research suggests this ability serves not only as camouflage but also as a form of communication: by flashing patterns at one another, octopuses may signal aggression or courtship. Scientists are now studying whether these displays follow consistent rules, like a visual language. Which choice best states the main idea of the text?", "passage": "", "options": ["Octopuses are the only sea creatures that change color.", "Scientists have fully decoded the visual language of octopuses.", "Octopuses' rapid skin changes may function as both camouflage and communication.", "Camouflage is the sole purpose of an octopus's color changes."], "answer": "C", "explanation_en": "The text covers both camouflage and the newer finding about communication, so C captures the full main idea. A makes an unsupported absolute claim, B overstates the research ('studying whether'), and D contradicts the text's point about communication.", "explanation_cn": "全文既讲了伪装，也讲了新发现的交流功能，C 完整概括了主旨。A 是无依据的绝对化说法；B 言过其实（文中说'正在研究是否'）；D 与文中关于交流功能的论述相矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d5-q9", "stem": "Although she was the most qualified candidate, her ______ manner in the interview — quiet voice, downcast eyes — made the panel question her confidence. Which choice completes the text with the most logical and precise word or phrase?", "passage": "", "options": ["diffident", "arrogant", "outspoken", "cheerful"], "answer": "A", "explanation_en": "The context describes a quiet voice and downcast eyes, signs of shyness and low confidence, which is exactly what 'diffident' means. 'Arrogant' and 'outspoken' are opposites of shy, and 'cheerful' describes mood rather than confidence.", "explanation_cn": "文中描述轻声细语、低垂双眼，是羞怯和缺乏自信的表现，正是 diffident（羞怯的、缺乏自信的）的意思。arrogant（傲慢的）和 outspoken（直言的）与羞怯相反；cheerful（愉快的）描述的是情绪而非自信。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d5-q10", "stem": "Covered in dust, ______. Which choice completes the text so that it conforms to the conventions of Standard English?", "passage": "", "options": ["the old manuscripts had not been touched for decades", "the librarian sneezed repeatedly", "it was clear the room needed cleaning", "the discovery excited the historians"], "answer": "A", "explanation_en": "The participial phrase 'Covered in dust' must modify the subject that follows it. Only in A is the subject ('the old manuscripts') the thing covered in dust; in the other choices the subject is a person, 'it,' or 'the discovery,' creating a dangling modifier.", "explanation_cn": "分词短语 Covered in dust 必须修饰紧随其后的主语。只有 A 的主语（the old manuscripts）是'布满灰尘'的东西；其他选项的主语是人、it 或 the discovery，会造成悬垂修饰语。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-10-28"}, {"day": 6, "words": [{"word": "abdicate", "pos": "v.", "ipa": "/ˈæbdɪkeɪt/", "def_en": "To formally give up a position of power, especially a throne.", "def_cn": "正式放弃（王位、权力等）", "example_en": "After the scandal, the CEO refused to abdicate his position despite pressure from the board.", "example_cn": "丑闻曝光后，尽管董事会施压，这位首席执行官仍拒绝辞去职位。"}, {"word": "amiable", "pos": "adj.", "ipa": "/ˈeɪmiəbəl/", "def_en": "Friendly and pleasant in manner.", "def_cn": "和蔼可亲的；友善的", "example_en": "The amiable shopkeeper greeted every customer by name and always offered helpful advice.", "example_cn": "这位和蔼的店主叫得出每位顾客的名字，还总是热心地提供建议。"}, {"word": "authentic", "pos": "adj.", "ipa": "/ɔːˈθɛntɪk/", "def_en": "Genuine; real rather than fake or copied.", "def_cn": "真实的；正宗的", "example_en": "Experts confirmed that the painting was an authentic work by the seventeenth-century master.", "example_cn": "专家确认这幅画是这位十七世纪大师的真迹。"}, {"word": "castigate", "pos": "v.", "ipa": "/ˈkæstɪɡeɪt/", "def_en": "To criticize or punish someone severely.", "def_cn": "严厉批评；惩罚", "example_en": "The editorial castigated the city council for ignoring the growing housing crisis.", "example_cn": "这篇社论严厉批评市议会无视日益严重的住房危机。"}, {"word": "cogent", "pos": "adj.", "ipa": "/ˈkoʊdʒənt/", "def_en": "Clear, logical, and convincing.", "def_cn": "有说服力的；切中要害的", "example_en": "She presented a cogent argument for why the school should extend library hours.", "example_cn": "她提出了一个令人信服的论点，说明学校为什么应该延长图书馆开放时间。"}, {"word": "deplore", "pos": "v.", "ipa": "/dɪˈplɔːr/", "def_en": "To strongly disapprove of something; to regret deeply.", "def_cn": "强烈谴责；深感遗憾", "example_en": "Environmentalists deplore the destruction of wetlands for commercial development.", "example_cn": "环保人士强烈谴责为商业开发而破坏湿地的行为。"}, {"word": "discord", "pos": "n.", "ipa": "/ˈdɪskɔːrd/", "def_en": "Disagreement or lack of harmony between people.", "def_cn": "不和；分歧", "example_en": "The proposed budget cuts sowed discord among members of the committee.", "example_cn": "拟议中的预算削减在委员会成员之间播下了不和的种子。"}, {"word": "euphemism", "pos": "n.", "ipa": "/ˈjuːfəmɪzəm/", "def_en": "A mild word used in place of one considered harsh or blunt.", "def_cn": "委婉语", "example_en": "The phrase passed away is a common euphemism for the word died.", "example_cn": "passed away（去世）是 died（死）的常见委婉说法。"}, {"word": "exorbitant", "pos": "adj.", "ipa": "/ɪɡˈzɔːrbɪtənt/", "def_en": "Unreasonably high in price or amount.", "def_cn": "过高的；离谱的", "example_en": "Tourists complained about the exorbitant prices charged by hotels during the festival.", "example_cn": "游客抱怨节日期间酒店收取的离谱高价。"}, {"word": "gratuitous", "pos": "adj.", "ipa": "/ɡrəˈtuːɪtəs/", "def_en": "Given freely; also, uncalled for or lacking good reason.", "def_cn": "免费的；无缘无故的", "example_en": "Critics found the gratuitous violence in the film unnecessary to the story.", "example_cn": "影评人认为这部电影中无谓的暴力场面对剧情毫无必要。"}, {"word": "imperturbable", "pos": "adj.", "ipa": "/ˌɪmpərˈtɜːrbəbəl/", "def_en": "Unable to be upset or disturbed; calm under pressure.", "def_cn": "沉着冷静的；不动声色的", "example_en": "The imperturbable pilot landed the damaged plane without any sign of panic.", "example_cn": "这位沉着冷静的飞行员毫无慌乱地将受损的飞机安全降落。"}, {"word": "malleable", "pos": "adj.", "ipa": "/ˈmæliəbəl/", "def_en": "Easily shaped or influenced.", "def_cn": "可塑的；易受影响的", "example_en": "Young children's opinions are malleable and easily shaped by their peers.", "example_cn": "年幼孩子的观点可塑性很强，容易受同龄人影响。"}, {"word": "obtuse", "pos": "adj.", "ipa": "/ɑːbˈtuːs/", "def_en": "Slow to understand; dull-witted.", "def_cn": "迟钝的；愚钝的", "example_en": "His obtuse remarks during the debate suggested he had not read the proposal.", "example_cn": "他在辩论中迟钝的发言表明他根本没读过这份提案。"}, {"word": "precarious", "pos": "adj.", "ipa": "/prɪˈkɛriəs/", "def_en": "Dangerously unstable or uncertain.", "def_cn": "不稳定的；危险的", "example_en": "The injured hiker was in a precarious position on the narrow cliff ledge.", "example_cn": "受伤的徒步者在狭窄的悬崖边上处境十分危险。"}, {"word": "propensity", "pos": "n.", "ipa": "/prəˈpɛnsɪti/", "def_en": "A natural tendency to behave in a certain way.", "def_cn": "倾向；习性", "example_en": "His propensity for exaggeration made his stories entertaining but unreliable.", "example_cn": "他夸大其词的习性让他的故事很有趣，但不可靠。"}, {"word": "quintessential", "pos": "adj.", "ipa": "/ˌkwɪntɪˈsɛnʃəl/", "def_en": "Representing the perfect example of something.", "def_cn": "典型的；精髓的", "example_en": "The small cafe with its marble tables was the quintessential Parisian bistro.", "example_cn": "这家摆着大理石桌子的小咖啡馆是典型的巴黎小酒馆。"}, {"word": "somber", "pos": "adj.", "ipa": "/ˈsɑːmbər/", "def_en": "Dark, gloomy, or serious in mood.", "def_cn": "阴沉的；严肃的", "example_en": "A somber mood filled the room as the principal announced the school closure.", "example_cn": "当校长宣布学校关闭时，房间里弥漫着沉重的气氛。"}, {"word": "tenacious", "pos": "adj.", "ipa": "/tɪˈneɪʃəs/", "def_en": "Holding firmly to something; persistent and determined.", "def_cn": "坚韧的；执着的", "example_en": "The tenacious reporter spent two years uncovering the corruption scandal.", "example_cn": "这位坚韧不拔的记者花了两年时间揭露这起腐败丑闻。"}, {"word": "umbrage", "pos": "n.", "ipa": "/ˈʌmbrɪdʒ/", "def_en": "Offense or annoyance, especially at being insulted.", "def_cn": "不快；被冒犯的感觉", "example_en": "She took umbrage at the suggestion that she had copied her colleague's idea.", "example_cn": "有人暗示她抄袭了同事的想法，她对此感到被冒犯。"}, {"word": "virtuoso", "pos": "n.", "ipa": "/ˌvɜːrtʃuˈoʊsoʊ/", "def_en": "A person highly skilled in music or another art.", "def_cn": "大师；名家（尤指音乐）", "example_en": "The young virtuoso performed the difficult concerto without a single mistake.", "example_cn": "这位年轻的演奏大师完美演绎了这首高难度的协奏曲，没有一处失误。"}], "practice": [{"qid": "d6-q1", "stem": "The scientist's presentation was remarkably _____: every claim was supported by data, and the logic connecting evidence to conclusion was flawless.", "passage": "", "options": ["cogent", "gratuitous", "obtuse", "somber"], "answer": "A", "explanation_en": "Cogent means clear, logical, and convincing, which fits a presentation with flawless logic and data support. Gratuitous (uncalled for) and obtuse (slow to understand) describe opposite qualities, and somber (gloomy) is irrelevant to argument quality.", "explanation_cn": "cogent 意为“有说服力的、逻辑严密的”，符合题干中“逻辑无懈可击、有数据支撑”的描述。gratuitous（无谓的）、obtuse（迟钝的）意思相反，somber（阴沉的）与论证质量无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d6-q2", "stem": "Despite failing three driving tests, Maya remained _____, practicing every weekend until she finally passed.", "passage": "", "options": ["imperturbable", "tenacious", "malleable", "amiable"], "answer": "B", "explanation_en": "Tenacious means persistent and unwilling to give up, matching Maya's continued practice. Imperturbable (calm) does not capture persistence, malleable (easily influenced) is wrong, and amiable (friendly) is irrelevant.", "explanation_cn": "tenacious 意为“坚韧不拔的”，符合 Maya 反复练习的坚持。imperturbable（沉着的）不体现坚持，malleable（易受影响的）错误，amiable（友善的）无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d6-q3", "stem": "The chef took _____ at the reviewer's claim that his signature dish was uninspired, calling the remark deeply insulting.", "passage": "", "op
