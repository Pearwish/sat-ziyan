tions": ["umbrage", "discord", "propensity", "euphemism"], "answer": "A", "explanation_en": "To take umbrage means to take offense, which fits the chef calling the remark insulting. Discord (disagreement) is too general, propensity (tendency) does not fit the sentence structure, and euphemism (mild expression) is unrelated.", "explanation_cn": "take umbrage 意为“感到被冒犯”，与厨师称评论“极具侮辱性”相呼应。discord（不和）太笼统，propensity（倾向）句式不通，euphemism（委婉语）无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d6-q4", "stem": "Marine biologists have found that coral reefs recover more quickly from bleaching events when nearby seagrass beds are healthy. Seagrass filters pollutants from the water, which suggests that protecting seagrass may be an effective strategy for preserving coral ecosystems. Which choice best states the main idea of the text?", "passage": "", "options": ["Seagrass beds are more important than coral reefs.", "Coral bleaching is caused entirely by water pollution.", "Healthy seagrass beds may help coral reefs recover from bleaching.", "Marine biologists disagree about how to protect coral ecosystems."], "answer": "C", "explanation_en": "The text links healthy seagrass to faster coral recovery and suggests protecting seagrass as a strategy — choice C captures this. A overstates the claim, B uses an absolute (entirely) the text never supports, and D contradicts the text's tone.", "explanation_cn": "文章将健康的海草床与珊瑚更快恢复联系起来，并建议保护海草——C 准确概括。A 过度解读，B 的 entirely 文中没有依据，D 与文章语气矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d6-q5", "stem": "The author begins the passage by describing the 1848 discovery of gold in California before discussing its economic effects. What is the primary purpose of this opening?", "passage": "", "options": ["To criticize the gold seekers for their greed", "To provide historical context for the economic discussion", "To argue that the importance of the gold rush was exaggerated", "To compare California with other mining regions"], "answer": "B", "explanation_en": "The opening sets up historical background for the economic analysis that follows. A and C introduce criticism or argument not present in the description, and D mentions a comparison that never occurs.", "explanation_cn": "开头为后文的经济分析提供历史背景。A 和 C 加入了不存在的批评或论点，D 提到的比较从未出现。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d6-q6", "stem": "Hummingbirds beat their wings up to 80 times per second, _____ them to hover in place while feeding.", "passage": "", "options": ["allowed", "allow", "allowing", "allows"], "answer": "C", "explanation_en": "The participial phrase allowing them to hover correctly modifies the main clause. A and D create verb-tense and agreement errors, and B would require a conjunction to form a complete clause.", "explanation_cn": "allowing them to hover 是现在分词短语作结果状语，结构正确。A 和 D 造成动词时态和主谓一致错误，B 需要连词才能成句。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d6-q7", "stem": "With only three days of funding left and no new donors in sight, the small nonprofit was in a _____ financial situation.", "passage": "", "options": ["precarious", "quintessential", "authentic", "amiable"], "answer": "A", "explanation_en": "Precarious means dangerously unstable, fitting an organization nearly out of money. Quintessential (typical example) and authentic (genuine) do not describe instability, and amiable (friendly) is irrelevant.", "explanation_cn": "precarious 意为“岌岌可危的”，符合资金只剩三天的状况。quintessential（典型的）、authentic（真实的）不表示不稳定，amiable（友善的）无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d6-q8", "stem": "The new subway line reduced commute times by 20 percent. _____, local businesses near stations reported a 15 percent rise in foot traffic.", "passage": "", "options": ["Nevertheless", "Consequently", "In contrast", "Previously"], "answer": "B", "explanation_en": "Consequently signals that the rise in foot traffic resulted from the shorter commutes. Nevertheless and In contrast show opposition, while Previously refers to earlier time — none fits the cause-and-effect logic.", "explanation_cn": "Consequently 表示因果关系：通勤时间缩短带来了客流增长。Nevertheless 和 In contrast 表转折，Previously 表过去时间，都不符合因果逻辑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d6-q9", "stem": "The report _____ the agency for wasting millions of dollars, describing its oversight as a shocking failure of responsibility.", "passage": "", "options": ["castigated", "commended", "exonerated", "appeased"], "answer": "A", "explanation_en": "Castigate means to criticize severely, matching the phrase a shocking failure of responsibility. Commended (praised) and exonerated (cleared of blame) are opposites, and appeased (calmed) does not fit.", "explanation_cn": "castigate 意为“严厉批评”，与“令人震惊的失职”相呼应。commended（表扬）、exonerated（免责）意思相反，appeased（安抚）不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d6-q10", "stem": "Studies show that students who take handwritten notes remember lectures better than those who type. Researchers believe handwriting forces the brain to process and summarize information, while typing encourages word-for-word transcription. What can most reasonably be inferred from the text?", "passage": "", "options": ["Typing is never useful for learning.", "The benefit of handwriting comes from deeper mental processing.", "All students should be banned from using laptops.", "Handwritten notes are always longer than typed ones."], "answer": "B", "explanation_en": "The text attributes the advantage to the brain processing and summarizing — B restates this. A and C use extreme language (never, banned) unsupported by the text, and D makes an unsupported claim about length.", "explanation_cn": "文章把手写的优势归因于大脑的加工和概括——B 复述了这一点。A 和 C 用了文中没有的极端措辞，D 关于长度的说法没有依据。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-10-29"}, {"day": 7, "words": [{"word": "abhor", "pos": "v.", "ipa": "/æbˈhɔːr/", "def_en": "To hate or detest something deeply.", "def_cn": "深恶痛绝；憎恨", "example_en": "The activist abhorred any form of animal cruelty and campaigned against it for years.", "example_cn": "这位活动家深恶痛绝任何形式的虐待动物行为，并为此奔走呼吁多年。"}, {"word": "ample", "pos": "adj.", "ipa": "/ˈæmpəl/", "def_en": "More than enough; plentiful.", "def_cn": "充足的；丰富的", "example_en": "The recipe provides ample servings for a family of six.", "example_cn": "这份食谱的分量足够六口之家食用。"}, {"word": "aversion", "pos": "n.", "ipa": "/əˈvɜːrʒən/", "def_en": "A strong feeling of dislike.", "def_cn": "厌恶；反感", "example_en": "His aversion to public speaking made class presentations a nightmare for him.", "example_cn": "他对公开演讲的强烈反感让课堂展示成了他的噩梦。"}, {"word": "caustic", "pos": "adj.", "ipa": "/ˈkɔːstɪk/", "def_en": "Bitingly critical or sarcastic; severely critical.", "def_cn": "刻薄的；尖酸的", "example_en": "The critic's caustic review dismissed the novel as two hundred pages of wasted paper.", "example_cn": "这位评论家刻薄的书评把这部小说贬为两百页的废纸。"}, {"word": "commemorate", "pos": "v.", "ipa": "/kəˈmɛməreɪt/", "def_en": "To honor the memory of a person or event.", "def_cn": "纪念；缅怀", "example_en": "The city built a monument to commemorate the firefighters who died in the blaze.", "example_cn": "这座城市建造了一座纪念碑，缅怀在这场大火中牺牲的消防员。"}, {"word": "deride", "pos": "v.", "ipa": "/dɪˈraɪd/", "def_en": "To mock or ridicule with contempt.", "def_cn": "嘲笑；嘲弄", "example_en": "Early critics derided the theory, but later experiments proved it correct.", "example_cn": "早期的批评者嘲笑这一理论，但后来的实验证明了它的正确性。"}, {"word": "discrete", "pos": "adj.", "ipa": "/dɪˈskriːt/", "def_en": "Separate and distinct; individually separate.", "def_cn": "分离的；不连续的", "example_en": "The course is divided into three discrete units, each with its own final exam.", "example_cn": "这门课程分为三个独立的单元，每个单元都有各自的期末考试。"}, {"word": "exasperate", "pos": "v.", "ipa": "/ɪɡˈzæspəreɪt/", "def_en": "To irritate or frustrate someone intensely.", "def_cn": "激怒；使恼火", "example_en": "The constant flight delays exasperated travelers waiting at the gate.", "example_cn": "航班一再延误，激怒了在登机口等待的旅客。"}, {"word": "expedite", "pos": "v.", "ipa": "/ˈɛkspədaɪt/", "def_en": "To speed up a process or action.", "def_cn": "加快；促进", "example_en": "The company hired extra staff to expedite the delivery of holiday orders.", "example_cn": "公司增聘了员工，以加快假日订单的配送。"}, {"word": "gravity", "pos": "n.", "ipa": "/ˈɡrævɪti/", "def_en": "Seriousness or importance of a situation.", "def_cn": "严重性；重要性", "example_en": "The doctor's grave expression conveyed the gravity of the patient's condition.", "example_cn": "医生凝重的表情传达了病人病情的严重性。"}, {"word": "impervious", "pos": "adj.", "ipa": "/ɪmˈpɜːrviəs/", "def_en": "Not affected by something; unable to be penetrated.", "def_cn": "不受影响的；不能穿透的", "example_en": "The new raincoat is impervious to water, keeping hikers dry in storms.", "example_cn": "这件新雨衣防水，暴雨中也能让徒步者保持干爽。"}, {"word": "mercurial", "pos": "adj.", "ipa": "/mərˈkjʊriəl/", "def_en": "Subject to sudden changes in mood; unpredictable.", "def_cn": "喜怒无常的；变幻莫测的", "example_en": "The mercurial director praised the actors one day and fired them the next.", "example_cn": "这位喜怒无常的导演前一天还夸演员，第二天就把人开除了。"}, {"word": "officious", "pos": "adj.", "ipa": "/əˈfɪʃəs/", "def_en": "Overly eager to offer unwanted help or advice.", "def_cn": "爱指手画脚的；多管闲事的", "example_en": "The officious neighbor insisted on telling everyone how to mow their lawns.", "example_cn": "这位爱管闲事的邻居非要教每个人怎么修剪草坪。"}, {"word": "precipitate", "pos": "v.", "ipa": "/prɪˈsɪpɪteɪt/", "def_en": "To cause something to happen suddenly or sooner than expected.", "def_cn": "促成；引发", "example_en": "The assassination precipitated a political crisis that lasted for months.", "example_cn": "这起暗杀事件引发了一场持续数月的政治危机。"}, {"word": "prosaic", "pos": "adj.", "ipa": "/proʊˈzeɪɪk/", "def_en": "Ordinary and dull; lacking imagination.", "def_cn": "平淡乏味的；世俗的", "example_en": "Behind the actor's glamorous image was a surprisingly prosaic daily routine.", "example_cn": "这位演员光鲜形象的背后，是出人意料的平淡日常生活。"}, {"word": "rancor", "pos": "n.", "ipa": "/ˈræŋkər/", "def_en": "Deep, bitter hatred or ill will.", "def_cn": "深仇；怨恨", "example_en": "Despite their fierce rivalry, the two candidates debated without rancor.", "example_cn": "尽管是激烈的竞争对手，两位候选人辩论时并未带有怨恨。"}, {"word": "spurious", "pos": "adj.", "ipa": "/ˈspjʊriəs/", "def_en": "False or fake; not genuine.", "def_cn": "假的；伪造的", "example_en": "The website spread spurious claims about the new vaccine's side effects.", "example_cn": "这个网站散布了关于新疫苗副作用的虚假说法。"}, {"word": "tenuous", "pos": "adj.", "ipa": "/ˈtɛnjuəs/", "def_en": "Very weak or slight; having little basis.", "def_cn": "薄弱的；站不住脚的", "example_en": "The lawyer's case rested on tenuous evidence that the jury found unconvincing.", "example_cn": "这位律师的案子建立在站不住脚的证据上，陪审团觉得无法信服。"}, {"word": "undermine", "pos": "v.", "ipa": "/ˌʌndərˈmaɪn/", "def_en": "To gradually weaken or damage something.", "def_cn": "逐渐削弱；破坏", "example_en": "Constant criticism from the coach began to undermine the team's confidence.", "example_cn": "教练不断的批评开始动摇全队的信心。"}, {"word": "vitriolic", "pos": "adj.", "ipa": "/ˌvɪtriˈɑːlɪk/", "def_en": "Filled with bitter criticism or malice.", "def_cn": "刻毒的；恶毒的", "example_en": "The debate turned vitriolic when the candidates began attacking each other's families.", "example_cn": "当候选人开始攻击对方家人时，辩论变得充满恶意。"}], "practice": [{"qid": "d7-q1", "stem": "A lifelong pacifist, the novelist _____ violence in all its forms and refused to glorify it in her books.", "passage": "", "options": ["abhorred", "expedited", "commemorated", "undermined"], "answer": "A", "explanation_en": "Abhor means to hate deeply, fitting a pacifist's attitude toward violence. Expedited (sped up) and commemorated (honored) are wrong, and undermined (weakened) does not fit the sentence structure.", "explanation_cn": "abhor 意为“憎恨”，符合和平主义者对暴力的态度。expedited（加快）、commemorated（纪念）错误，undermined（削弱）句式不通。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d7-q2", "stem": "What began as a polite debate soon turned _____, with both speakers hurling personal insults at each other.", "passage": "", "options": ["vitriolic", "prosaic", "ample", "discrete"], "answer": "A", "explanation_en": "Vitriolic means filled with bitter criticism, matching the personal insults. Prosaic (dull) does not capture hostility, ample (plentiful) is irrelevant, and discrete (separate) does not fit.", "explanation_cn": "vitriolic 意为“充满恶意的”，与互相人身攻击相呼应。prosaic（平淡的）不体现敌意，ample（充足的）无关，discrete（分离的）不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d7-q3", "stem": "The theory linking the two events was based on _____ evidence — a single blurry photograph and one unreliable witness.", "passage": "", "options": ["tenuous", "ample", "spurious", "caustic"], "answer": "A", "explanation_en": "Tenuous means weak or having little basis, fitting the flimsy evidence described. Ample (plentiful) is the opposite, spurious (fake) goes too far since the evidence is weak rather than necessarily fabricated, and caustic (biting) is irrelevant.", "explanation_cn": "tenuous 意为“薄弱的”，符合文中单薄的证据。ample（充足的）相反，spurious（伪造的）过头了——证据是薄弱而非一定伪造，caustic（刻薄的）无关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d7-q4", "stem": "The archaeologist carefully brushed dirt from the ancient vase, _____ that even a small scratch could destroy its value.", "passage": "", "options": ["knowing", "known", "know", "knows"], "answer": "A", "explanation_en": "The present participle knowing correctly introduces the reason clause. B is a past participle that does not fit, and C and D would create sentence fragments or agreement errors.", "explanation_cn": "现在分词 knowing 表原因，结构正确。B 是过去分词不合语境，C 和 D 会造成句子片段或主谓不一致。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d7-q5", "stem": "Investors grew nervous about the _____ stock market, which soared one week and crashed the next without warning.", "passage": "", "options": ["mercurial", "prosaic", "officious", "discrete"], "answer": "A", "explanation_en": "Mercurial means unpredictably changeable, matching a market that soars and crashes. Prosaic (dull) is the opposite of volatile, officious (meddlesome) is irrelevant, and discrete (separate) does not fit.", "explanation_cn": "mercurial 意为“变幻莫测的”，符合暴涨暴跌的市场。prosaic（平淡的）与波动相反，officious（多管闲事的）无关，discrete（分离的）不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d7-q6", "stem": "Honeybees communicate the location of flowers through a waggle dance. The angle of the dance indicates direction relative to the sun, while its duration signals distance. Researchers who decoded this dance were able to predict where bees would fly next. Which choice best describes the text?", "passage": "", "options": ["It explains how bees navigate by the stars.", "It describes a method bees use to share information.", "It argues that bees are more intelligent than humans.", "It compares honeybees with other insects."], "answer": "B", "explanation_en": "The text describes the waggle dance as a communication method — B captures this. A mentions stars, which the text never does; C overstates with a human comparison; D makes a comparison absent from the text.", "explanation_cn": "文章把摇摆舞描述为蜜蜂交流信息的方式——B 准确概括。A 提到的星星文中没有，C 过度引申，D 的比较文中不存在。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d7-q7", "stem": "Every November, the town holds a parade to _____ the soldiers who defended it during the war.", "passage": "", "options": ["commemorate", "deride", "exasperate", "precipitate"], "answer": "A", "explanation_en": "Commemorate means to honor the memory of, fitting a parade honoring soldiers. Deride (mock), exasperate (irritate), and precipitate (trigger) are all wrong in this context.", "explanation_cn": "commemorate 意为“纪念”，符合游行缅怀士兵的语境。deride（嘲笑）、exasperate（激怒）、precipitate（引发）都不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d7-q8", "stem": "Solar panels have become much cheaper over the past decade. _____, many homeowners who once considered them unaffordable are now installing them.", "passage": "", "options": ["As a result", "On the other hand", "For instance", "In contrast"], "answer": "A", "explanation_en": "As a result shows the consequence of falling prices. On the other hand and In contrast signal opposition, while For instance introduces an example — none fits the cause-and-effect relationship.", "explanation_cn": "As a result 表因果：降价导致更多家庭安装。On the other hand 和 In contrast 表转折，For instance 表举例，都不符合因果逻辑。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d7-q9", "stem": "The veteran diplomat remained _____ to criticism, calmly continuing negotiations despite harsh media attacks.", "passage": "", "options": ["impervious", "officious", "prosaic", "ample"], "answer": "A", "explanation_en": "Impervious means not affected by something, fitting someone who continues calmly despite attacks. Officious (meddlesome), prosaic (dull), and ample (plentiful) do not fit.", "explanation_cn": "impervious 意为“不受影响的”，符合在抨击下依然冷静谈判。officious（多管闲事的）、prosaic（平淡的）、ample（充足的）都不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d7-q10", "stem": "The passage traces the history of public libraries from Benjamin Franklin's first subscription library to today's digital lending systems, arguing that libraries have always adapted to new technologies. The main purpose of the passage is to:", "passage": "", "options": ["criticize modern libraries for abandoning books", "show how libraries have evolved while serving their core mission", "persuade readers to donate to their local library", "compare American libraries with European ones"], "answer": "B", "explanation_en": "The passage emphasizes adaptation across history while maintaining purpose — B captures this. A introduces criticism not present, C adds a donation appeal never mentioned, and D makes a comparison absent from the text.", "explanation_cn": "文章强调图书馆在历史中不断适应新技术——B 准确概括。A 加入了不存在的批评，C 加了文中没有的捐款呼吁，D 的比较文中不存在。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-10-30"}, {"day": 8, "words": [{"word": "accolade", "pos": "n.", "ipa": "/ˈækəˌleɪd/", "def_en": "An award or privilege granted as a special honor.", "def_cn": "荣誉；嘉奖", "example_en": "The young novelist received the National Book Award, the highest accolade in American literature.", "example_cn": "这位年轻的小说家获得了美国国家图书奖，这是美国文学界的最高荣誉。"}, {"word": "amplify", "pos": "v.", "ipa": "/ˈæmplɪˌfaɪ/", "def_en": "To make louder, stronger, or more intense.", "def_cn": "放大；增强", "example_en": "The microphone amplified the speaker's voice so that even the back row could hear clearly.", "example_cn": "麦克风放大了演讲者的声音，连最后一排都听得清清楚楚。"}, {"word": "banal", "pos": "adj.", "ipa": "/bəˈnɑːl/", "def_en": "So lacking in originality as to be boring.", "def_cn": "陈腐的；平庸乏味的", "example_en": "The critic dismissed the film's banal dialogue as unworthy of the director's reputation.", "example_cn": "影评人认为这部电影的台词陈腐乏味，配不上导演的名声。"}, {"word": "censure", "pos": "v.", "ipa": "/ˈsɛnʃər/", "def_en": "To express severe disapproval of someone or something.", "def_cn": "谴责；斥责", "example_en": "The committee voted to censure the official for misusing public funds.", "example_cn": "委员会投票谴责了那位挪用公款的官员。"}, {"word": "concur", "pos": "v.", "ipa": "/kənˈkɜːr/", "def_en": "To agree; to be of the same opinion.", "def_cn": "赞同；意见一致", "example_en": "The two scientists concurred that the data supported their hypothesis.", "example_cn": "两位科学家一致认为数据支持他们的假设。"}, {"word": "deter", "pos": "v.", "ipa": "/dɪˈtɜːr/", "def_en": "To discourage or prevent someone from acting.", "def_cn": "阻止；威慑", "example_en": "High ticket prices may deter casual fans from attending the concert.", "example_cn": "高昂的票价可能会让普通乐迷打消去看演唱会的念头。"}, {"word": "disdain", "pos": "n.", "ipa": "/dɪsˈdeɪn/", "def_en": "The feeling that something is unworthy of respect.", "def_cn": "轻蔑；鄙视", "example_en": "She felt a deep disdain for politicians who made promises they never kept.", "example_cn": "她对那些许下诺言却从不兑现的政客深感鄙视。"}, {"word": "exemplary", "pos": "adj.", "ipa": "/ɪɡˈzɛmpləri/", "def_en": "Serving as a desirable model; worthy of imitation.", "def_cn": "模范的；典范的", "example_en": "The nurse's exemplary care earned her the admiration of patients and colleagues alike.", "example_cn": "这位护士堪称典范的护理赢得了病人和同事的一致钦佩。"}, {"word": "extol", "pos": "v.", "ipa": "/ɪkˈstoʊl/", "def_en": "To praise enthusiastically.", "def_cn": "赞美；颂扬", "example_en": "The review extolled the restaurant's inventive menu and impeccable service.", "example_cn": "这篇评论盛赞了这家餐厅富有创意的菜单和无可挑剔的服务。"}, {"word": "haphazard", "pos": "adj.", "ipa": "/hæpˈhæzərd/", "def_en": "Lacking any obvious principle of organization; random.", "def_cn": "杂乱无章的；随意的", "example_en": "The files were stored in a haphazard manner, making it difficult to locate any document.", "example_cn": "文件存放得杂乱无章，找起任何一份文件都十分困难。"}, {"word": "impugn", "pos": "v.", "ipa": "/ɪmˈpjuːn/", "def_en": "To question or dispute the truth or validity of something.", "def_cn": "质疑；抨击", "example_en": "The lawyer tried to impugn the witness's credibility by pointing out inconsistencies in her testimony.", "example_cn": "律师试图通过指出证人证词中的矛盾之处来质疑她的可信度。"}, {"word": "mollify", "pos": "v.", "ipa": "/ˈmɑːlɪˌfaɪ/", "def_en": "To appease someone's anger or anxiety.", "def_cn": "安抚；平息", "example_en": "The company offered refunds in an attempt to mollify its angry customers.", "example_cn": "公司提出退款，试图安抚愤怒的顾客。"}, {"word": "orthodox", "pos": "adj.", "ipa": "/ˈɔːrθəˌdɑːks/", "def_en": "Conforming to established doctrine or accepted standards.", "def_cn": "正统的；传统的", "example_en": "The orthodox treatment for the disease had been used for decades before a new therapy emerged.", "example_cn": "在新疗法出现之前，这种疾病的传统疗法已经沿用了几十年。"}, {"word": "predilection", "pos": "n.", "ipa": "/ˌprɛdlˈɛkʃən/", "def_en": "A preference or special liking for something.", "def_cn": "偏爱；嗜好", "example_en": "The chef's predilection for spicy food was evident in every dish on the menu.", "example_cn": "这位厨师对辛辣食物的偏爱在菜单上的每一道菜里都显而易见。"}, {"word": "provident", "pos": "adj.", "ipa": "/ˈprɑːvɪdənt/", "def_en": "Making provision for the future; careful with resources.", "def_cn": "有远见的；节俭的", "example_en": "Her provident habit of saving part of each paycheck left her financially secure.", "example_cn": "她每份工资都存下一部分的习惯让她经济上有了保障。"}, {"word": "reclusive", "pos": "adj.", "ipa": "/rɪˈkluːsɪv/", "def_en": "Avoiding the company of others; solitary.", "def_cn": "隐居的；深居简出的", "example_en": "The reclusive author rarely gave interviews and lived far from the city.", "example_cn": "这位深居简出的作家很少接受采访，住在远离城市的地方。"}, {"word": "stoic", "pos": "adj.", "ipa": "/ˈstoʊɪk/", "def_en": "Enduring pain or hardship without complaint or visible emotion.", "def_cn": "坚忍的；不动声色的", "example_en": "Despite the painful injury, the runner remained stoic and finished the race.", "example_cn": "尽管受了很疼的伤，这位跑者依然不动声色地跑完了比赛。"}, {"word": "torpor", "pos": "n.", "ipa": "/ˈtɔːrpər/", "def_en": "Mental or physical inactivity; lethargy.", "def_cn": "迟钝；麻木；不活跃", "example_en": "The long, uneventful meeting left the committee in a state of torpor.", "example_cn": "这场漫长而沉闷的会议让委员会成员个个昏昏欲睡。"}, {"word": "unequivocal", "pos": "adj.", "ipa": "/ˌʌnɪˈkwɪvəkəl/", "def_en": "Leaving no doubt; totally clear and unambiguous.", "def_cn": "明确的；毫不含糊的", "example_en": "The results provided unequivocal evidence that the new drug was effective.", "example_cn": "实验结果提供了明确的证据，证明这种新药有效。"}, {"word": "vociferous", "pos": "adj.", "ipa": "/voʊˈsɪfərəs/", "def_en": "Expressing opinions loudly and forcefully.", "def_cn": "大声疾呼的；激烈的", "example_en": "Vociferous protesters gathered outside the courthouse demanding justice.", "example_cn": "情绪激昂的抗议者聚集在法院外要求伸张正义。"}], "practice": [{"qid": "d8-q1", "stem": "The mayor's address was ______, leaving no room for doubt about where she stood on the proposed tax increase.", "passage": "", "options": ["unequivocal", "haphazard", "banal", "reclusive"], "answer": "A", "explanation_en": "\"Unequivocal\" means leaving no doubt, which matches \"leaving no room for doubt\" in the sentence. \"Haphazard\" means disorganized, \"banal\" means boring and unoriginal, and \"reclusive\" means avoiding other people—none of these fit a clear, decisive speech.", "explanation_cn": "unequivocal 意为\"毫不含糊的\"，与句中 leaving no room for doubt 呼应。haphazard（杂乱的）、banal（陈腐的）、reclusive（隐居的）都不符合\"立场明确\"的语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d8-q2", "stem": "During cross-examination, the defense attorney attempted to ______ the credibility of the key witness by pointing out contradictions in her earlier statements.", "passage": "", "options": ["mollify", "impugn", "extol", "deter"], "answer": "B", "explanation_en": "\"Impugn\" means to question or challenge the truth of something, which is exactly what the attorney does to the witness's credibility. \"Mollify\" means to calm, \"extol\" means to praise, and \"deter\" means to discourage—all opposite or unrelated to the intended meaning.", "explanation_cn": "impugn 意为\"质疑、抨击\"，符合律师质疑证人可信度的语境。mollify（安抚）、extol（赞美）、deter（阻止）语义都不符。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d8-q3", "stem": "The stack of applications on the admissions officer's desk ______ to be reviewed before the Friday deadline.", "passage": "", "options": ["need", "needs", "needing", "are needing"], "answer": "B", "explanation_en": "The subject is \"stack,\" a singular noun, so the verb must be singular: \"needs.\" The phrase \"on the admissions officer's desk\" is a prepositional phrase and does not affect subject-verb agreement. \"Are needing\" is both plural and an awkward progressive form.", "explanation_cn": "主语是单数名词 stack（\"一摞\"），谓语动词用单数 needs。on the desk 是介词短语，不影响主谓一致。are needing 既是复数又是别扭的进行时。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d8-q4", "stem": "The biographer describes the inventor's workshop as \"a haphazard maze of half-finished prototypes and scattered blueprints.\" The author's use of \"haphazard\" primarily serves to", "passage": "", "options": ["emphasize the disorganized condition of the workshop", "praise the inventor's methodical approach to research", "suggest that the prototypes were ultimately successful", "criticize the quality of the inventor's blueprints"], "answer": "A", "explanation_en": "\"Haphazard\" means lacking organization, so the word emphasizes how disorganized the workshop was. The passage gives no evidence that the approach was methodical (B), that the prototypes succeeded (C), or that the blueprints themselves were poor (D).", "explanation_cn": "haphazard 意为\"杂乱无章的\"，作者用它来强调作坊的混乱状态。文中没有说他方法严谨（B）、原型成功（C）或蓝图质量差（D）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d8-q5", "stem": "Marine biologist Elena Ruiz spent a decade tracking whale migration patterns. Her colleagues initially dismissed her methods as unconventional, yet her findings were eventually published in a leading journal and earned her the field's highest accolade. Based on the text, Ruiz's career best illustrates that", "passage": "", "options": ["unconventional methods are always superior to traditional ones", "persistence can lead to recognition despite early skepticism", "marine biology offers more awards than other sciences", "colleagues rarely acknowledge the work of outsiders"], "answer": "B", "explanation_en": "The text shows Ruiz persisting for a decade despite dismissal, ultimately earning the field's highest honor—this illustrates persistence leading to recognition. The text does not claim unconventional methods are always better (A), compare award counts across sciences (C), or say colleagues rarely acknowledge outsiders (D).", "explanation_cn": "文章讲 Ruiz 坚持十年、不顾质疑，最终获得最高荣誉，说明坚持能带来认可。A 过于绝对（always），C、D 在文中没有依据。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d8-q6", "stem": "The committee's response to the crisis—swift, organized, and thorough—was widely described as ______.", "passage": "", "options": ["banal", "exemplary", "haphazard", "reclusive"], "answer": "B", "explanation_en": "\"Exemplary\" means serving as a model worth imitating, which fits a response described as swift, organized, and thorough. \"Banal\" (boring) and \"haphazard\" (disorganized) contradict the description, and \"reclusive\" (solitary) is irrelevant.", "explanation_cn": "exemplary 意为\"模范的\"，与 swift, organized, thorough 的描述一致。banal（平庸的）、haphazard（杂乱的）与描述矛盾，reclusive（隐居的）不相关。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d8-q7", "stem": "The new campus policy was welcomed by students. ______, many faculty members raised concerns about its cost.", "passage": "", "options": ["Moreover", "However", "Consequently", "For example"], "answer": "B", "explanation_en": "The second sentence contrasts with the first (students welcomed it, but faculty objected), so the contrast transition \"however\" is needed. \"Moreover\" adds similar information, \"consequently\" shows cause and effect, and \"for example\" introduces an illustration—none fit a contrast.", "explanation_cn": "第二句与第一句形成转折（学生欢迎、教师反对），需要表示转折的 however。moreover（递进）、consequently（因果）、for example（举例）都不符合转折关系。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d8-q8", "stem": "Despite the painful injury, the marathon runner remained ______, showing no emotion as she crossed the finish line.", "passage": "", "options": ["vociferous", "stoic", "banal", "provident"], "answer": "B", "explanation_en": "\"Stoic\" means enduring hardship without complaint or visible emotion, matching \"showing no emotion.\" \"Vociferous\" means loud and forceful, \"banal\" means unoriginal, and \"provident\" means planning for the future—none describe quiet endurance.", "explanation_cn": "stoic 意为\"坚忍的、不动声色的\"，与 showing no emotion 呼应。vociferous（大声的）、banal（平庸的）、provident（有远见的）都不符合\"忍痛完赛\"的语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d8-q9", "stem": "The researcher's findings challenged the orthodox view in her field ______ they were eventually published in a leading journal.", "passage": "", "options": ["; however,", ", however", ": however", ". However"], "answer": "A", "explanation_en": "Two independent clauses joined by the conjunctive adverb \"however\" require a semicolon before it and a comma after: \"; however,\". A comma alone (B) creates a comma splice, a colon (C) is not used before a conjunctive adverb here, and (D) lacks the comma after \"However.\"", "explanation_cn": "两个独立分句用连接副词 however 连接时，前面用分号、后面用逗号。B 是逗号粘连（comma splice），C 冒号用法不对，D 缺少 however 后的逗号。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d8-q10", "stem": "In 2019, the small nonprofit \"Books for All\" received a national accolade for distributing over two million free books to underserved communities. The organization's director credited the award to hundreds of volunteers. What does the text most strongly suggest about the accolade?", "passage": "", "options": ["It was given in recognition of the nonprofit's charitable impact.", "It was awarded primarily to the organization's director.", "It guarantees future funding for the nonprofit.", "It is the only national award for literacy programs."], "answer": "A", "explanation_en": "The text links the accolade directly to the distribution of two million free books—a charitable impact. The director credited volunteers, so (B) is wrong. The text says nothing about future funding (C) or about it being the only such award (D).", "explanation_cn": "文章把获奖与捐赠两百万本书的公益成果直接关联，说明奖项是对其公益影响的认可。主任把功劳归于志愿者，所以 B 错；C、D 在文中没有提及。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-02"}, {"day": 9, "words": [{"word": "decadent", "pos": "adj.", "ipa": "/ˈdɛkədənt/", "def_en": "Marked by moral decline or excessive self-indulgence.", "def_cn": "颓废的；奢靡堕落的", "example_en": "The novel portrays the decadent lifestyle of aristocrats on the eve of revolution.", "example_cn": "这部小说描绘了革命前夕贵族们奢靡颓废的生活方式。"}, {"word": "embellish", "pos": "v.", "ipa": "/ɪmˈbɛlɪʃ/", "def_en": "To make more attractive by adding details; to decorate.", "def_cn": "美化；修饰", "example_en": "The storyteller embellished the tale with vivid descriptions of the distant kingdom.", "example_cn": "讲故事的人用对遥远王国的生动描写为这个故事增色。"}, {"word": "falter", "pos": "v.", "ipa": "/ˈfɔːltər/", "def_en": "To lose strength or momentum; to hesitate.", "def_cn": "衰退；动摇；犹豫", "example_en": "After leading for three quarters, the team's offense began to falter in the final minutes.", "example_cn": "领先了三节之后，这支球队的进攻在最后几分钟开始哑火。"}, {"word": "garner", "pos": "v.", "ipa": "/ˈɡɑːrnər/", "def_en": "To gather or collect, especially information or support.", "def_cn": "获得；收集", "example_en": "The documentary garnered widespread praise for its honest portrayal of rural life.", "example_cn": "这部纪录片因真实呈现乡村生活而广受好评。"}, {"word": "harbinger", "pos": "n.", "ipa": "/ˈhɑːrbɪndʒər/", "def_en": "A person or thing that announces what is coming.", "def_cn": "预兆；先驱", "example_en": "The first robin is often considered a harbinger of spring.", "example_cn": "第一只知更鸟常常被视为春天的预兆。"}, {"word": "idealistic", "pos": "adj.", "ipa": "/aɪˌdiːəˈlɪstɪk/", "def_en": "Guided by ideals rather than practical considerations.", "def_cn": "理想主义的", "example_en": "The idealistic young lawyer took cases that paid little but served the public good.", "example_cn": "这位理想主义的年轻律师接的案子报酬微薄，但有利于公共利益。"}, {"word": "jeopardize", "pos": "v.", "ipa": "/ˈdʒɛpərˌdaɪz/", "def_en": "To put in danger or at risk.", "def_cn": "危及；危害", "example_en": "Missing the deadline would jeopardize the entire research project.", "example_cn": "错过截止日期会让整个研究项目功亏一篑。"}, {"word": "kindle", "pos": "v.", "ipa": "/ˈkɪndəl/", "def_en": "To set on fire; to arouse or inspire a feeling.", "def_cn": "点燃；激起", "example_en": "The coach's speech kindled a fierce determination in the players.", "example_cn": "教练的讲话激起了队员们强烈的决心。"}, {"word": "lucrative", "pos": "adj.", "ipa": "/ˈluːkrətɪv/", "def_en": "Producing a great deal of profit.", "def_cn": "获利丰厚的", "example_en": "The software engineer left her job to start a lucrative consulting business.", "example_cn": "这位软件工程师辞职创办了一家利润丰厚的咨询公司。"}, {"word": "meager", "pos": "adj.", "ipa": "/ˈmiːɡər/", "def_en": "Lacking in quantity or quality; inadequate.", "def_cn": "微薄的；不足的", "example_en": "Despite his meager salary, he managed to save enough for graduate school.", "example_cn": "尽管工资微薄，他还是攒够了读研究生的钱。"}, {"word": "nostalgia", "pos": "n.", "ipa": "/nɑːˈstældʒə/", "def_en": "A sentimental longing for the past.", "def_cn": "怀旧；乡愁", "example_en": "The old photographs filled her with nostalgia for her childhood summers.", "example_cn": "这些老照片让她对童年的夏天充满怀念。"}, {"word": "overwhelm", "pos": "v.", "ipa": "/ˌoʊvərˈwɛlm/", "def_en": "To overpower in thought or feeling; to flood.", "def_cn": "压倒；使不知所措", "example_en": "The flood of applications overwhelmed the small admissions office.", "example_cn": "潮水般的申请让小小的招生办公室应接不暇。"}, {"word": "plausible", "pos": "adj.", "ipa": "/ˈplɔːzəbəl/", "def_en": "Seeming reasonable or probably true.", "def_cn": "貌似合理的；可信的", "example_en": "The detective found the suspect's alibi plausible and decided to investigate further.", "example_cn": "侦探觉得嫌疑人的不在场证明可信，决定继续调查。"}, {"word": "quandary", "pos": "n.", "ipa": "/ˈkwɑːndəri/", "def_en": "A state of confusion or dilemma; being stuck between choices.", "def_cn": "困境；进退两难", "example_en": "Faced with two excellent job offers, she found herself in a quandary.", "example_cn": "面对两份都很心动的工作机会，她陷入了两难。"}, {"word": "revere", "pos": "v.", "ipa": "/rɪˈvɪr/", "def_en": "To regard with deep respect.", "def_cn": "尊敬；崇敬", "example_en": "The students revered their teacher for her dedication and wisdom.", "example_cn": "学生们敬佩老师的奉献精神和智慧。"}, {"word": "stigma", "pos": "n.", "ipa": "/ˈstɪɡmə/", "def_en": "A mark of disgrace associated with something.", "def_cn": "耻辱；污名", "example_en": "The stigma of failure kept him from applying to competitive schools.", "example_cn": "对失败的耻辱感让他不敢申请有竞争力的学校。"}, {"word": "timid", "pos": "adj.", "ipa": "/ˈtɪmɪd/", "def_en": "Lacking courage or confidence; shy.", "def_cn": "胆小的；羞怯的", "example_en": "The timid child hid behind her mother when strangers approached.", "example_cn": "陌生人走近时，这个胆小的孩子躲到了妈妈身后。"}, {"word": "unearth", "pos": "v.", "ipa": "/ʌnˈɜːrθ/", "def_en": "To discover something hidden, lost, or buried.", "def_cn": "发掘；发现", "example_en": "Archaeologists unearthed a 2,000-year-old temple in the desert.", "example_cn": "考古学家在沙漠中发掘出一座有两千年历史的神庙。"}, {"word": "versatile", "pos": "adj.", "ipa": "/ˈvɜːrsətəl/", "def_en": "Able to be used for many different purposes; multi-talented.", "def_cn": "多才多艺的；多功能的", "example_en": "Eggs are a versatile ingredient used in both sweet and savory dishes.", "example_cn": "鸡蛋是一种多功能的食材，甜咸菜肴都用得上。"}, {"word": "waver", "pos": "v.", "ipa": "/ˈweɪvər/", "def_en": "To be undecided between opinions; to become unsteady.", "def_cn": "犹豫；动摇", "example_en": "He never wavered in his commitment to finishing the marathon.", "example_cn": "他跑完马拉松的决心从未动摇过。"}], "practice": [{"qid": "d9-q1", "stem": "The documentary contrasts the billionaire's ______ lifestyle—private jets, lavish parties, and reckless spending—with his modest upbringing.", "passage": "", "options": ["meager", "decadent", "idealistic", "versatile"], "answer": "B", "explanation_en": "\"Decadent\" describes excessive self-indulgence and moral decline, matching the lavish, reckless lifestyle described. \"Meager\" (lacking in quantity) is the opposite, \"idealistic\" (guided by ideals) doesn't fit reckless spending, and \"versatile\" (adaptable) is irrelevant.", "explanation_cn": "decadent 意为\"颓废奢靡的\"，与 private jets、lavish parties 的描述一致。meager（微薄的）正好相反，idealistic（理想主义的）、versatile（多才多艺的）不符合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d9-q2", "stem": "The first cherry blossoms are often regarded as a ______ of spring, signaling the end of winter.", "passage": "", "options": ["stigma", "harbinger", "quandary", "nostalgia"], "answer": "B", "explanation_en": "\"Harbinger\" means something that announces what is coming, which fits blossoms signaling spring's arrival. \"Stigma\" (mark of disgrace), \"quandary\" (dilemma), and \"nostalgia\" (longing for the past) do not convey announcing something to come.", "explanation_cn": "harbinger 意为\"预兆\"，樱花预示春天到来。stigma（污名）、quandary（困境）、nostalgia（怀旧）都没有\"预示到来\"的意思。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d9-q3", "stem": "Neither the manager nor the employees ______ aware of the accounting error until the external audit.", "passage": "", "options": ["was", "were", "has been", "is"], "answer": "B", "explanation_en": "In \"neither/nor\" constructions, the verb agrees with the nearer subject—\"employees,\" which is plural—so \"were\" is correct. The past-tense context (\"until the external audit\") also rules out the present-tense options (C) and (D).", "explanation_cn": "neither...nor 结构中谓语与靠近它的主语 employees（复数）保持一致，用 were。until the audit 说明是过去语境，排除现在时的 C、D。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d9-q4", "stem": "The historian writes that the candidate's speech \"kindled a sense of hope among voters who had grown cynical about politics.\" The word \"kindled\" is used here to suggest that the speech", "passage": "", "options": ["confused voters about the candidate's policies", "aroused a feeling that had nearly died out", "was delivered in an angry tone", "focused mainly on economic issues"], "answer": "B", "explanation_en": "\"Kindle\" means to set on fire or arouse, and here it describes reawakening hope in cynical voters—arousing a feeling that had nearly died out. The text gives no support for confusion (A), anger (C), or an economic focus (D).", "explanation_cn": "kindle 意为\"点燃、激起\"，这里指重新唤起选民几乎熄灭的希望。文中没有提到困惑（A）、愤怒语气（C）或经济议题（D）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d9-q5", "stem": "Psychologists have found that nostalgia is not merely sadness about the past; recalling fond memories can actually reduce stress and strengthen social bonds. Which choice best states the main idea of the text?", "passage": "", "options": ["Nostalgia is a purely negative emotion.", "Fond memories can have positive psychological effects.", "Stress is the main cause of nostalgia.", "Social bonds are difficult to maintain."], "answer": "B", "explanation_en": "The text argues that recalling fond memories reduces stress and strengthens bonds—positive effects. (A) contradicts the text (\"not merely sadness\"), and (C) and (D) misstate the relationships described.", "explanation_cn": "文章指出回忆美好往事能减压、增进社交纽带，即有积极心理作用。A 与\"not merely sadness\"矛盾，C、D 曲解了文中的关系。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d9-q6", "stem": "Faced with a ______, the board could neither approve the expensive proposal nor abandon the project that so many depended on.", "passage": "", "options": ["quandary", "stigma", "harbinger", "nostalgia"], "answer": "A", "explanation_en": "\"Quandary\" means a state of dilemma—being stuck between difficult options—which matches \"could neither approve... nor abandon.\" \"Stigma,\" \"harbinger,\" and \"nostalgia\" do not describe being caught between two choices.", "explanation_cn": "quandary 意为\"进退两难的困境\"，与 could neither...nor... 的句式呼应。stigma（污名）、harbinger（预兆）、nostalgia（怀旧）都不表示两难抉择。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d9-q7", "stem": "While researching a topic, a student has taken the following notes:\n- The Great Barrier Reef is the world's largest coral reef system.\n- Rising ocean temperatures cause coral bleaching.\n- Bleached coral is more vulnerable to disease.\n- Marine protected areas can help reefs recover.\nThe student wants to explain a threat to coral reefs and one possible solution. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "passage": "", "options": ["The Great Barrier Reef is the world's largest coral reef system, located off the coast of Australia.", "Rising ocean temperatures cause coral bleaching, which makes coral vulnerable to disease; marine protected areas can aid recovery.", "Coral bleaching is a process that scientists have studied for many years.", "Marine protected areas are popular destinations for divers."], "answer": "B", "explanation_en": "Choice (B) covers both required elements: the threat (rising temperatures cause bleaching, increasing disease vulnerability) and the solution (protected areas aid recovery). (A) gives only background, (C) adds unstated information, and (D) ignores the threat entirely.", "explanation_cn": "B 同时涵盖了威胁（升温导致白化、白化易染病）和解决办法（保护区助恢复）。A 只有背景，C 加入了笔记没有的信息，D 完全没提威胁。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d9-q8", "stem": "When pressed by reporters about the scandal, the spokesperson began to ______, giving vague and evasive answers.", "passage": "", "options": ["garner", "embellish", "waver", "jeopardize"], "answer": "C", "explanation_en": "\"Waver\" means to be undecided or unsteady, which fits giving vague, evasive answers under pressure. \"Garner\" (gather), \"embellish\" (decorate a story), and \"jeopardize\" (put at risk) do not describe faltering under questioning.", "explanation_cn": "waver 意为\"动摇、犹豫\"，符合被追问时含糊其辞的表现。garner（收集）、embellish（美化）、jeopardize（危及）都不表示\"在追问下动摇\"。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d9-q9", "stem": "By the time the rescue team reached the stranded hikers, they ______ in the mountains for three days.", "passage": "", "options": ["have been waiting", "are waiting", "had been waiting", "will have waited"], "answer": "C", "explanation_en": "\"By the time\" with a past-tense main clause (\"reached\") requires the past perfect continuous for the earlier ongoing action: \"had been waiting.\" The present-tense options (A, B) and future perfect (D) do not match the past context.", "explanation_cn": "\"By the time + 过去时\"结构中，更早持续的动作要用过去完成进行时 had been waiting。A、B 是现在时，D 是将来完成时，都不符合过去语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d9-q10", "stem": "Although the tech startup was highly lucrative, its founders worried that rapid growth would jeopardize the company's original mission. What does the text most strongly suggest about the founders?", "passage": "", "options": ["They cared more about profits than about their mission.", "They valued their mission even as the company became profitable.", "They planned to sell the company immediately.", "They had no interest in growing the business."], "answer": "B", "explanation_en": "The founders' worry that growth would \"jeopardize\" (endanger) the mission shows they valued the mission despite profitability—(B). (A) reverses their priority, and (C) and (D) have no support in the text.", "explanation_cn": "创始人担心快速增长会危及（jeopardize）公司初心，说明他们在盈利的同时依然看重使命。A 颠倒了主次，C、D 在文中没有依据。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-03"}, {"day": 10, "words": [{"word": "adverse", "pos": "adj.", "ipa": "/ædˈvɜːrs/", "def_en": "Harmful or unfavorable; acting against one's interests.", "def_cn": "不利的；有害的", "example_en": "The new regulations had an adverse effect on small businesses, forcing many owners to cut staff.", "example_cn": "新法规对小企业产生了不利影响，迫使许多业主裁员。"}, {"word": "apprehensive", "pos": "adj.", "ipa": "/ˌæprɪˈhensɪv/", "def_en": "Anxious or fearful that something bad will happen.", "def_cn": "忧虑的；担心的", "example_en": "The students were apprehensive about the final exam, having heard it was exceptionally difficult.", "example_cn": "学生们对期末考试感到忧虑，听说这次考试异常困难。"}, {"word": "belligerent", "pos": "adj.", "ipa": "/bəˈlɪdʒərənt/", "def_en": "Hostile and aggressive; engaged in war or conflict.", "def_cn": "好战的；交战的", "example_en": "The diplomat's belligerent tone during the negotiations alarmed even his own allies.", "example_cn": "这位外交官在谈判中好战的语气连他自己的盟友都感到震惊。"}, {"word": "condone", "pos": "v.", "ipa": "/kənˈdoʊn/", "def_en": "To accept or allow behavior that is morally wrong; to overlook an offense.", "def_cn": "宽恕；纵容", "example_en": "The school refused to condone cheating, suspending every student involved in the scandal.", "example_cn": "学校拒绝纵容作弊，将卷入丑闻的每名学生都停学了。"}, {"word": "contemptuous", "pos": "adj.", "ipa": "/kənˈtemptʃuəs/", "def_en": "Showing deep hatred or disrespect; scornful.", "def_cn": "轻蔑的；鄙视的", "example_en": "Her contemptuous glance at the proposal made it clear she considered it a waste of time.", "example_cn": "她对这份提案投去轻蔑的一瞥，显然认为这是浪费时间。"}, {"word": "devout", "pos": "adj.", "ipa": "/dɪˈvaʊt/", "def_en": "Deeply religious; showing strong commitment or dedication.", "def_cn": "虔诚的；热忱的", "example_en": "A devout supporter of the arts, she donated half her income to local theaters.", "example_cn": "作为艺术的热忱支持者，她把一半收入捐给了当地剧院。"}, {"word": "disseminate", "pos": "v.", "ipa": "/dɪˈsemɪneɪt/", "def_en": "To spread information or ideas widely.", "def_cn": "传播；散布", "example_en": "The organization uses social media to disseminate health guidelines to remote communities.", "example_cn": "该组织利用社交媒体向偏远社区传播健康指南。"}, {"word": "extraneous", "pos": "adj.", "ipa": "/ɪkˈstreɪniəs/", "def_en": "Irrelevant or unnecessary; not essential to the matter at hand.", "def_cn": "无关的；多余的", "example_en": "The editor removed several extraneous paragraphs that distracted from the essay's main argument.", "example_cn": "编辑删掉了几个无关段落，它们分散了文章主要论点的注意力。"}, {"word": "facetious", "pos": "adj.", "ipa": "/fəˈsiːʃəs/", "def_en": "Treating serious issues with deliberately inappropriate humor.", "def_cn": "轻浮的；开玩笑不当的", "example_en": "His facetious remarks during the solemn ceremony offended many of the guests.", "example_cn": "他在庄严仪式上轻浮的言论冒犯了许多宾客。"}, {"word": "heterogeneous", "pos": "adj.", "ipa": "/ˌhetərəˈdʒiːniəs/", "def_en": "Diverse in character or content; composed of different parts.", "def_cn": "异质的；多样的", "example_en": "The city's heterogeneous population includes immigrants from more than eighty countries.", "example_cn": "这座城市人口构成多样，包括来自八十多个国家的移民。"}, {"word": "inane", "pos": "adj.", "ipa": "/ɪˈneɪn/", "def_en": "Silly and empty of meaning; lacking sense.", "def_cn": "空洞的；愚蠢的", "example_en": "Critics dismissed the film as inane, calling its plot predictable and its dialogue flat.", "example_cn": "评论家认为这部电影空洞无物，称其情节可预测、对白平淡。"}, {"word": "mundane", "pos": "adj.", "ipa": "/mʌnˈdeɪn/", "def_en": "Dull and ordinary; concerned with everyday life rather than the extraordinary.", "def_cn": "平凡的；世俗的", "example_en": "She transformed mundane household objects into striking works of art.", "example_cn": "她把平凡的家居物品变成了引人注目的艺术品。"}, {"word": "ostentatious", "pos": "adj.", "ipa": "/ˌɑːstənˈteɪʃəs/", "def_en": "Designed to impress others; showy and pretentious.", "def_cn": "炫耀的；卖弄的", "example_en": "The billionaire's ostentatious mansion, with its gold-plated gates, drew criticism from neighbors.", "example_cn": "这位亿万富翁炫耀的豪宅配有镀金大门，引来了邻居的批评。"}, {"word": "preempt", "pos": "v.", "ipa": "/priːˈempt/", "def_en": "To take action to prevent something from happening; to seize before others can.", "def_cn": "先发制人；抢先", "example_en": "The company preempted criticism by publishing its environmental data voluntarily.", "example_cn": "该公司主动公布环境数据，先发制人地避免了批评。"}, {"word": "prudent", "pos": "adj.", "ipa": "/ˈpruːdənt/", "def_en": "Acting with care and good judgment; cautious and sensible.", "def_cn": "谨慎的；明智的", "example_en": "It would be prudent to save a portion of your income before making large purchases.", "example_cn": "在大额消费之前存下一部分收入是明智的。"}, {"word": "relegate", "pos": "v.", "ipa": "/ˈrelɪɡeɪt/", "def_en": "To assign to a lower rank or less important position; to dismiss to obscurity.", "def_cn": "降级；贬低；归入次要地位", "example_en": "After the scandal, the once-celebrated mayor was relegated to a minor advisory role.", "example_cn": "丑闻之后，这位曾经备受推崇的市长被降到了一个次要的顾问职位。"}, {"word": "strident", "pos": "adj.", "ipa": "/ˈstraɪdənt/", "def_en": "Loud and harsh; forcefully expressed, often in protest.", "def_cn": "刺耳的；强硬的", "example_en": "The strident protests outside the factory could be heard from several blocks away.", "example_cn": "几个街区外都能听到工厂外刺耳的抗议声。"}, {"word": "tractable", "pos": "adj.", "ipa": "/ˈtræktəbəl/", "def_en": "Easy to manage, control, or deal with; docile.", "def_cn": "易管教的；易处理的", "example_en": "The new software proved more tractable than expected, requiring only minor adjustments.", "example_cn": "这款新软件比预想的更容易上手，只需要微小的调整。"}, {"word": "unobtrusive", "pos": "adj.", "ipa": "/ˌʌnəbˈtruːsɪv/", "def_en": "Not conspicuous or attracting attention; modest and discreet.", "def_cn": "不显眼的；低调的", "example_en": "The security cameras were unobtrusive, blending seamlessly into the museum's decor.", "example_cn": "监控摄像头很不显眼，与博物馆的装饰融为一体。"}, {"word": "voracious", "pos": "adj.", "ipa": "/vɔːˈreɪʃəs/", "def_en": "Having a huge appetite; eagerly consuming large amounts, especially of knowledge.", "def_cn": "贪婪的；如饥似渴的", "example_en": "A voracious reader, she finished three novels in a single weekend.", "example_cn": "作为如饥似渴的读者，她一个周末就读完了三本小说。"}], "practice": [{"qid": "d10-q1", "stem": "Marine biologists were surprised by the _____ appetite of the newly discovered shark species, which consumed nearly twice its body weight in fish each week.", "passage": "", "options": ["voracious", "mundane", "tractable", "unobtrusive"], "answer": "A", "explanation_en": "The context describes an appetite that consumes nearly twice its body weight, which matches voracious (having a huge appetite). Mundane means ordinary, tractable means easy to manage, and unobtrusive means not attracting attention, none of which describe an enormous appetite.", "explanation_cn": "题干描述这种鲨鱼每周吃掉近两倍体重的鱼，形容食量巨大，只有 voracious（贪婪的、如饥似渴的）符合。mundane 是平凡的，tractable 是易管教的，unobtrusive 是不显眼的，都不符合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d10-q2", "stem": "The biographer's account of the scientist's life is detailed but focused; she carefully excluded any _____ details that did not illuminate his discoveries.", "passage": "", "options": ["extraneous", "prudent", "devout", "strident"], "answer": "A", "explanation_en": "Excluded details that did not illuminate his discoveries signals that the removed details were irrelevant, which is the definition of extraneous. Prudent means wise, devout means deeply committed, and strident means harsh, none of which fit the idea of irrelevant details.", "explanation_cn": "题干说传记作者删掉了不能阐明其发现的细节，即无关细节，对应 extraneous（无关的、多余的）。prudent 是谨慎的，devout 是虔诚的，strident 是刺耳的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d10-q3", "stem": "In 2019, researchers at a coastal observatory noticed that seagrass meadows were recovering faster in areas where small fishing boats had been banned. They hypothesized that reduced boat traffic allowed the seagrass roots to stabilize. To test this, they compared meadows in three bays with different levels of boat traffic over two years. Which finding, if true, would most directly support the researchers' hypothesis?", "passage": "", "options": ["Seagrass in all three bays grew at the same rate regardless of boat traffic.", "The bay with the least boat traffic showed the fastest seagrass recovery.", "Fishing boats were replaced by larger commercial vessels in one bay.", "Seagrass meadows recovered equally well in protected and unprotected areas."], "answer": "B", "explanation_en": "The hypothesis is that less boat traffic leads to faster recovery. Finding B shows exactly that relationship: the bay with the least traffic recovered fastest. A and D contradict the hypothesis, and C introduces an irrelevant change.", "explanation_cn": "研究者的假设是船只越少、海草恢复越快。B 选项直接显示了这种对应关系，最有力地支持假设。A 和 D 与假设矛盾，C 是无关信息。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d10-q4", "stem": "The historian opens her essay with a vivid description of the crowded marketplace in 14th-century Cairo. She then argues that such markets were not merely commercial hubs but centers of intellectual exchange. What is the function of the opening description in the text as a whole?", "passage": "", "options": ["It provides statistical evidence for the essay's main claim.", "It illustrates the setting that the historian will reinterpret.", "It refutes a competing historian's argument.", "It summarizes the essay's conclusion."], "answer": "B", "explanation_en": "The opening paints a vivid scene of the marketplace, which the author then reinterprets as an intellectual center. It illustrates the setting before offering a new interpretation. It is not statistics (A), not a refutation (C), and not a summary of the conclusion (D).", "explanation_cn": "开头生动描写了市场场景，随后作者重新解读其意义，B 正确。它不是统计证据（A），也不是反驳他人观点（C）或总结结论（D）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d10-q5", "stem": "Many species of migratory birds _____ thousands of miles each year to reach their breeding grounds.", "passage": "", "options": ["travels", "travel", "has traveled", "is traveling"], "answer": "B", "explanation_en": "The subject is plural (many species), so the verb must be plural: travel. Travels and is traveling are singular, and has traveled is both singular and the wrong tense for a habitual action.", "explanation_cn": "主语是复数 many species，所以谓语用复数 travel。travels 和 is traveling 是单数，has traveled 也是单数且时态不对（习惯性动作用一般现在时）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d10-q6", "stem": "Although the principal sympathized with the students' frustration, she made it clear that the school could not _____ vandalism, no matter how justified the protest seemed.", "passage": "", "options": ["condone", "disseminate", "preempt", "relegate"], "answer": "A", "explanation_en": "The sentence says the school cannot accept vandalism; condone means to overlook or accept wrongdoing, which fits. Disseminate means to spread, preempt means to prevent by acting first, and relegate means to demote, none of which fit cannot ___ vandalism.", "explanation_cn": "句意是学校不能容忍破坏行为，condone（纵容、宽恕）最符合。disseminate 是传播，preempt 是先发制人，relegate 是降级，都不合语境。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d10-q7", "stem": "The new library is twice the size of the old one. _____, it houses a dedicated children's wing and a rooftop garden.", "passage": "", "options": ["However", "Moreover", "Nevertheless", "Instead"], "answer": "B", "explanation_en": "The second sentence adds another positive feature of the library, so the transition should signal addition: moreover. However and nevertheless signal contrast, and instead signals replacement, none of which fit.", "explanation_cn": "第二句在补充图书馆的另一个优点，表示递进，用 moreover。however 和 nevertheless 表转折，instead 表替代，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d10-q8", "stem": "Honeybees communicate the location of flowers through the waggle dance. The angle of the dance relative to the sun indicates direction, while the duration of the waggle indicates distance. When researchers moved a hive indoors under artificial light, the bees' dances became disoriented. What can most reasonably be inferred from the text?", "passage": "", "options": ["Bees cannot communicate without sunlight.", "The waggle dance depends on the bees' ability to perceive the sun's position.", "Artificial light improves the accuracy of the waggle dance.", "Bees use the waggle dance only to communicate distance."], "answer": "B", "explanation_en": "The text states the dance angle is measured relative to the sun, and removing natural sunlight disoriented the dances, so the dance depends on perceiving the sun's position. A is too extreme, C contradicts the text, and D ignores direction.", "explanation_cn": "文中说舞蹈角度是相对于太阳的，且在人工光下舞蹈变得混乱，可推断舞蹈依赖于对太阳位置的感知。A 过于绝对，C 与文意相反，D 忽略了方向信息。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d10-q9", "stem": "Given the volatile stock market, financial advisors recommend a _____ approach: diversifying investments rather than betting everything on a single company.", "passage": "", "options": ["prudent", "inane", "belligerent", "facetious"], "answer": "A", "explanation_en": "Diversifying investments instead of gambling is careful, sensible behavior: prudent. Inane means silly, belligerent means hostile, and facetious means joking inappropriately; none describe wise financial advice.", "explanation_cn": "分散投资而非孤注一掷是谨慎明智的做法，对应 prudent。inane 是愚蠢的，belligerent 是好战的，facetious 是轻浮的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d10-q10", "stem": "After months of preparation _____ the orchestra finally performed the symphony to a sold-out audience.", "passage": "", "options": ["preparation,", "preparation;", "preparation-", "preparation"], "answer": "A", "explanation_en": "An introductory phrase (After months of preparation) must be followed by a comma. A semicolon (B) requires a complete clause on each side, a dash (C) is unnecessarily abrupt here, and no punctuation (D) creates a run-on.", "explanation_cn": "句首介词短语作状语后要用逗号隔开。分号（B）前后都需是完整句子，破折号（C）在此过于突兀，无标点（D）则句子粘连。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-04"}, {"day": 11, "words": [{"word": "advocate", "pos": "v.", "ipa": "/ˈædvəkeɪt/", "def_en": "To publicly support or recommend a cause or policy.", "def_cn": "提倡；主张", "example_en": "The senator advocates for stricter regulations on industrial pollution.", "example_cn": "这位参议员主张对工业污染实施更严格的监管。"}, {"word": "arbitrary", "pos": "adj.", "ipa": "/ˈɑːrbɪtreri/", "def_en": "Based on random choice or personal whim rather than reason.", "def_cn": "任意的；武断的", "example_en": "Students complained that the grading seemed arbitrary, with no clear rubric to follow.", "example_cn": "学生们抱怨评分似乎很武断，没有明确的评分标准可循。"}, {"word": "benevolent", "pos": "adj.", "ipa": "/bəˈnevələnt/", "def_en": "Kind and generous; intending to do good.", "def_cn": "仁慈的；善良的", "example_en": "The benevolent donor funded scholarships for dozens of low-income students.", "example_cn": "这位仁慈的捐赠者为数十名低收入学生提供了奖学金。"}, {"word": "contemplate", "pos": "v.", "ipa": "/ˈkɑːntəmpleɪt/", "def_en": "To think about deeply and carefully; to consider.", "def_cn": "沉思；考虑", "example_en": "She sat by the lake to contemplate her decision about graduate school.", "example_cn": "她坐在湖边沉思自己关于研究生院的决定。"}, {"word": "conventional", "pos": "adj.", "ipa": "/kənˈvenʃənəl/", "def_en": "Following traditional or widely accepted standards; not unusual.", "def_cn": "传统的；常规的", "example_en": "Rather than follow conventional farming methods, he experimented with vertical gardens.", "example_cn": "他没有遵循传统的耕作方法，而是尝试了垂直花园。"}, {"word": "copious", "pos": "adj.", "ipa": "/ˈkoʊpiəs/", "def_en": "Abundant in quantity; plentiful.", "def_cn": "丰富的；大量的", "example_en": "The detective took copious notes during each interview with the witnesses.", "example_cn": "侦探在每次询问证人时都做了大量笔记。"}, {"word": "didactic", "pos": "adj.", "ipa": "/daɪˈdæktɪk/", "def_en": "Intended to teach a moral lesson; instructive, sometimes preachy.", "def_cn": "说教的；教诲的", "example_en": "The novel's didactic tone annoyed readers who preferred stories without obvious moral lessons.", "example_cn": "这部小说说教的语气让那些喜欢没有明显道德说教的故事的读者感到厌烦。"}, {"word": "dissent", "pos": "n.", "ipa": "/dɪˈsent/", "def_en": "Disagreement with an official opinion or decision.", "def_cn": "异议；不同意见", "example_en": "The judge wrote a powerful dissent arguing that the majority opinion ignored key evidence.", "example_cn": "这位法官写了一份有力的异议书，认为多数意见忽视了关键证据。"}, {"word": "exuberant", "pos": "adj.", "ipa": "/ɪɡˈzuːbərənt/", "def_en": "Full of energy, excitement, and cheerfulness.", "def_cn": "热情洋溢的；生机勃勃的", "example_en": "The exuberant crowd cheered as the team scored in the final seconds.", "example_cn": "在球队最后几秒得分时，热情洋溢的人群欢呼起来。"}, {"word": "fastidious", "pos": "adj.", "ipa": "/fæˈstɪdiəs/", "def_en": "Very attentive to detail; hard to please.", "def_cn": "挑剔的；一丝不苟的", "example_en": "The fastidious editor caught every typo and inconsistency in the manuscript.", "example_cn": "这位一丝不苟的编辑找出了手稿中所有的拼写错误和前后不一致。"}, {"word": "homogeneous", "pos": "adj.", "ipa": "/ˌhoʊməˈdʒiːniəs/", "def_en": "Uniform in composition; consisting of similar parts.", "def_cn": "同质的；同类的", "example_en": "The once homogeneous neighborhood has become far more diverse in recent decades.", "example_cn": "这个曾经同质化的社区在近几十年变得更加多元。"}, {"word": "incongruous", "pos": "adj.", "ipa": "/ɪnˈkɑːŋɡruəs/", "def_en": "Not in harmony or keeping with surroundings; out of place.", "def_cn": "不协调的；不相称的", "example_en": "The modern glass tower looked incongruous among the historic brick buildings.", "example_cn": "这座现代玻璃塔在历史砖楼群中显得格格不入。"}, {"word": "munificent", "pos": "adj.", "ipa": "/mjuːˈnɪfɪsənt/", "def_en": "Extremely generous, especially with money.", "def_cn": "慷慨的（尤指金钱）", "example_en": "The university received a munificent gift that will fund a new science building.", "example_cn": "这所大学收到了一笔慷慨的捐赠，将用于资助一栋新的科学楼。"}, {"word": "paragon", "pos": "n.", "ipa": "/ˈpærəɡɑːn/", "def_en": "A perfect example or model of excellence.", "def_cn": "典范；模范", "example_en": "She was regarded as a paragon of integrity, admired by colleagues across the industry.", "example_cn": "她被视为诚信的典范，受到全行业同事的钦佩。"}, {"word": "prescient", "pos": "adj.", "ipa": "/ˈpreʃənt/", "def_en": "Having knowledge of events before they happen; showing foresight.", "def_cn": "有先见之明的", "example_en": "His prescient warnings about the housing bubble were ignored until the market collapsed.", "example_cn": "他对房地产泡沫有先见之明的警告一直被忽视，直到市场崩溃。"}, {"word": "relinquish", "pos": "v.", "ipa": "/rɪˈlɪŋkwɪʃ/", "def_en": "To voluntarily give up or surrender something.", "def_cn": "放弃；让出", "example_en": "The aging champion refused to relinquish his title without a final match.", "example_cn": "这位年迈的冠军拒绝在没有进行最后一场比赛的情况下放弃头衔。"}, {"word": "subjugate", "pos": "v.", "ipa": "/ˈsʌbdʒuɡeɪt/", "def_en": "To bring under control by force; to conquer and dominate.", "def_cn": "征服；使屈服", "example_en": "The empire sought to subjugate neighboring kingdoms through military campaigns.", "example_cn": "这个帝国试图通过军事行动征服邻国。"}, {"word": "trenchant", "pos": "adj.", "ipa": "/ˈtrentʃənt/", "def_en": "Sharp and incisive; expressing ideas with force and clarity.", "def_cn": "锐利的；一针见血的", "example_en": "The critic's trenchant review exposed the flaws in the government's new policy.", "example_cn": "这位评论家一针见血的评论揭露了政府新政策的缺陷。"}, {"word": "upbraid", "pos": "v.", "ipa": "/ʌpˈbreɪd/", "def_en": "To scold or criticize severely.", "def_cn": "责备；训斥", "example_en": "The coach upbraided the players for their lack of effort during practice.", "example_cn": "教练训斥队员们在训练中缺乏努力。"}, {"word": "whimsical", "pos": "adj.", "ipa": "/ˈwɪmzɪkəl/", "def_en": "Playfully quaint or fanciful; unpredictable in a charming way.", "def_cn": "异想天开的；古灵精怪的", "example_en": "The artist's whimsical sculptures of dancing animals delighted children at the park.", "example_cn": "这位艺术家异想天开的跳舞动物雕塑让公园里的孩子们欣喜不已。"}], "practice": [{"qid": "d11-q1", "stem": "The coach's decision to bench the team's best player seemed completely _____: no explanation was given, and the player had committed no foul.", "passage": "", "options": ["arbitrary", "benevolent", "didactic", "munificent"], "answer": "A", "explanation_en": "A decision with no explanation or justification is arbitrary (based on whim rather than reason). Benevolent means kind, didactic means instructive, and munificent means generous, none of which describe an unexplained decision.", "explanation_cn": "没有解释、没有理由的决定是武断的，对应 arbitrary。benevolent 是仁慈的，didactic 是说教的，munificent 是慷慨的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d11-q2", "stem": "The quaint fishing village, with its centuries-old cottages, made the gleaming shopping mall on its outskirts look strangely _____.", "passage": "", "options": ["incongruous", "homogeneous", "conventional", "copious"], "answer": "A", "explanation_en": "A modern mall among centuries-old cottages is out of place: incongruous. Homogeneous means uniform, conventional means traditional, and copious means abundant; none capture the clash.", "explanation_cn": "现代化商场在古老渔村边显得格格不入，对应 incongruous（不协调的）。homogeneous 是同质的，conventional 是传统的，copious 是丰富的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d11-q3", "stem": "A 2022 study tracked the sleep habits of 500 college students during exam week. Students who slept at least seven hours performed significantly better than those who slept fewer than five hours, even when total study time was identical. The researchers concluded that sleep consolidates memory. Which finding would most weaken the researchers' conclusion?", "passage": "", "options": ["Students who slept more also reported lower stress levels.", "A follow-up study found no link between sleep and memory consolidation.", "The students were all from the same university.", "Exam week lasted only five days."], "answer": "B", "explanation_en": "The conclusion claims sleep consolidates memory. Finding B directly contradicts that mechanism, weakening the conclusion. A offers an alternative explanation but does not disprove consolidation; C and D are irrelevant details.", "explanation_cn": "结论是睡眠能巩固记忆。B 直接否定了睡眠与记忆巩固的关联，最削弱结论。A 只是提供了另一种解释，C 和 D 是无关细节。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d11-q4", "stem": "Critics praised the journalist's _____ analysis of the scandal, noting that her sharp questions exposed contradictions the officials had hoped to hide.", "passage": "", "options": ["trenchant", "whimsical", "didactic", "conventional"], "answer": "A", "explanation_en": "Sharp questions that expose hidden contradictions are trenchant (incisive). Whimsical means playfully fanciful, didactic means preachy, and conventional means traditional, none of which describe piercing analysis.", "explanation_cn": "能揭露矛盾的犀利分析是 trenchant（一针见血的）。whimsical 是异想天开的，didactic 是说教的，conventional 是常规的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d11-q5", "stem": "The committee _____ to reach a consensus after three hours of heated debate.", "passage": "", "options": ["were unable", "was unable", "have been unable", "are unable"], "answer": "B", "explanation_en": "In American English, collective nouns like committee take singular verbs when acting as a unit: was unable. The past tense is required because the sentence describes a completed event.", "explanation_cn": "美式英语中 committee 作整体时谓语用单数，且是过去发生的事，用 was unable。were、are、have been 都是复数形式。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d11-q6", "stem": "Coral reefs support an extraordinary diversity of marine life. They are often called the rainforests of the sea. Which choice most effectively combines the sentences?", "passage": "", "options": ["Coral reefs, often called the rainforests of the sea, support an extraordinary diversity of marine life.", "Coral reefs support an extraordinary diversity of marine life, and they are often called the rainforests of the sea, too.", "The rainforests of the sea is what coral reefs are often called, and they support an extraordinary diversity of marine life.", "Supporting an extraordinary diversity of marine life, the rainforests of the sea are coral reefs."], "answer": "A", "explanation_en": "Choice A combines the sentences concisely with an appositive, avoiding redundancy. B is wordy, C has awkward word order and a subject-verb error, and D illogically suggests the rainforests are coral reefs.", "explanation_cn": "A 用同位语简洁地合并了两句。B 啰嗦，C 语序别扭且主谓不一致，D 逻辑错误（把雨林说成了珊瑚礁）。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d11-q7", "stem": "After forty years as CEO, she finally decided to _____ control of the company to her successor, though many doubted she would ever step down.", "passage": "", "options": ["relinquish", "advocate", "contemplate", "subjugate"], "answer": "A", "explanation_en": "Giving up control to a successor is relinquish (to surrender). Advocate means to support, contemplate means to consider, and subjugate means to conquer, none of which mean giving something up.", "explanation_cn": "把公司控制权交给继任者是放弃，对应 relinquish。advocate 是提倡，contemplate 是考虑，subjugate 是征服，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d11-q8", "stem": "The graph shows the number of electric vehicles sold in the US from 2018 to 2023. Sales rose steadily each year, with the sharpest increase occurring between 2021 and 2022. Which statement is best supported by the data?", "passage": "", "options": ["Electric vehicle sales declined in 2023.", "The largest year-over-year growth happened between 2021 and 2022.", "Gas-powered cars outsold electric vehicles in every year shown.", "Sales remained flat from 2018 to 2020."], "answer": "B", "explanation_en": "The text explicitly states the sharpest increase was between 2021 and 2022, which is choice B. A contradicts rose steadily, C introduces data not shown, and D contradicts rose steadily each year.", "explanation_cn": "文中明确说 2021 到 2022 年增长最快，即 B。A 与逐年上升矛盾，C 是文中没有的数据，D 与每年稳步上升矛盾。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d11-q9", "stem": "For decades, historians assumed that the ancient trade route had fallen into disuse by the 12th century. However, newly discovered merchant records reveal continuous activity well into the 1400s, forcing scholars to reconsider the region's economic history. The main purpose of the text is to", "passage": "", "options": ["describe the daily life of ancient merchants.", "challenge a long-held historical assumption.", "compare two competing trade routes.", "explain why the trade route declined."], "answer": "B", "explanation_en": "The text contrasts the old assumption with new evidence that overturns it; its purpose is to challenge that assumption. It does not describe daily life (A), compare routes (C), or explain a decline (D).", "explanation_cn": "文章用新证据推翻了长期以来的历史假设，目的是挑战旧观点。A 描述商人日常生活、C 比较两条路线、D 解释衰落原因，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}, {"qid": "d11-q10", "stem": "Investors who had dismissed her warnings as alarmist later admitted she had been remarkably _____: every market crash she predicted came to pass within a year.", "passage": "", "options": ["prescient", "exuberant", "fastidious", "arbitrary"], "answer": "A", "explanation_en": "Correctly predicting market crashes before they happen shows foresight: prescient. Exuberant means enthusiastic, fastidious means detail-oriented, and arbitrary means random; none describe accurate foresight.", "explanation_cn": "准确预测市场崩溃体现了先见之明，对应 prescient。exuberant 是热情的，fastidious 是挑剔的，arbitrary 是武断的，都不符合。", "khan": "https://www.khanacademy.org/digital-sat", "label": "Khan Academy · Digital SAT 练习"}], "date": "2026-11-05"}, {"day": 12, "words": [{"word": "aesthetic", "pos": "adj.", "ipa": "/ɛsˈθɛtɪk/", "def_en": "Relating to beauty or the appreciation of beauty.", "def_cn": "美学的；审美的", "example_en": "The museum's new wing was praised not only for its collection but for its striking aesthetic design.", "example_cn": "这座博物馆的新馆不仅因藏品受赞誉，更因其惊艳的美学设计而备受好评。"}, {"word": "archaic", "pos": "adj.", "ipa": "/ɑrˈkeɪɪk/", "def_en": "Very old or old-fashioned; no longer in common use.", "def_cn": "过时的；古老的", "example_en": "The archaic computer system could no longer handle the company's growing data needs.", "example_cn": "这套过时的计算机系统已无法满足公司日益增长的数据需求。"}, {"word": "benign", "pos": "adj.", "ipa": "/bɪˈnaɪn/", "def_en": "Gentle and harmless; not threatening.", "def_cn": "温和的；无害的", "example_en": "The doctor assured the patient that the tumor was benign and easily treatable.", "example_cn": "医生向病人保证这个肿瘤是良性的，很容易治疗。"}, {"word": "consensus", "pos": "n.", "ipa": "/kənˈsɛnsəs/", "def_en": "General agreement among a group of people.", "def_cn": "共识；一致意见", "example_en": "After hours of debate, the committee finally reached a consensus on the budget.", "example_cn": "经过数小时的辩论，委员会终于就预算达成了共识。"}, {"word": "decorum", "pos": "n.", "ipa": "/dɪˈkɔrəm/", "def_en": "Behavior that is proper and polite in a formal situation.", "def_cn": "礼仪；得体", "example_en": "The students maintained perfect decorum during the graduation ceremony.", "example_cn": "学生们在毕业典礼上表现得体，举止端庄。"}, {"word": "docile", "pos": "adj.", "ipa": "/ˈdɑsəl/", "def_en": "Easily taught, led, or managed; obedient.", "def_cn": "温顺的；听话的", "example_en": "The docile puppy learned new commands within a single afternoon.", "example_cn": "这只温顺的小狗一下午就学会了新指令。"}, {"word": "fathom", "pos": "v.", "ipa": "/ˈfæðəm/", "def_en": "To understand something deeply after much thought.", "def_cn": "理解；领悟", "example_en": "Scientists are still trying to fathom the complexity of the human brain.", "example_cn": "科学家们仍在努力理解人类大脑的复杂性。"}, {"word": "iconoclast", "pos": "n.", "ipa": "/aɪˈkɑnəklæst/", "def_en": "A person who attacks or criticizes cherished beliefs or traditions.", "def_cn": "反传统者；打破成规者", "example_en": "The young director was hailed as an iconoclast for rejecting Hollywood formulas.", "example_cn": "这位年轻导演因拒绝好莱坞套路而被誉为反传统者。"}, {"word": "indigent", "pos": "adj.", "ipa": "/ˈɪndɪdʒənt/", "def_en": "Extremely poor; lacking basic necessities.", "def_cn": "贫困的；贫穷的", "example_en": "The charity provides free legal aid to indigent families.", "example_cn": "这家慈善机构为贫困家庭提供免费法律援助。"}, {"word": "nonchalant", "pos": "adj.", "ipa": "/ˌnɑnʃəˈlɑnt/", "def_en": "Calm and relaxed, showing little concern.", "def_cn": "若无其事的；漠然的", "example_en": "She gave a nonchalant shrug when asked about the missing documents.", "example_cn": "被问及丢失的文件时，她若无其事地耸了耸肩。"}, {"word": "parochial", "pos": "adj.", "ipa": "/pəˈroʊkiəl/", "def_en": "Having a narrow, limited point of view.", "def_cn": "眼界狭窄的；地方观念重的", "example_en": "His parochial outlook made it hard for him to appreciate foreign cultures.", "example_cn": "他狭隘的眼界让他难以欣赏外国文化。"}, {"word": "pristine", "pos": "adj.", "ipa": "/ˈprɪstin/", "def_en": "In perfect, unspoiled condition; pure.", "def_cn": "原始的；纯净无瑕的", "example_en": "The hikers were amazed by the pristine lakes of the national park.", "example_cn": "徒步者们对国家公园里纯净无瑕的湖泊赞叹不已。"}, {"word": "repudiate", "pos": "v.", "ipa": "/rɪˈpjudiˌeɪt/", "def_en": "To reject or refuse to accept something as true.", "def_cn": "否认；拒绝接受", "example_en": "The candidate repudiated the rumors about his past.", "example_cn": "这位候选人否认了有关他过去的谣言。"}, {"word": "submissive", "pos": "adj.", "ipa": "/səbˈmɪsɪv/", "def_en": "Willing to obey others; yielding without resistance.", "def_cn": "顺从的；服从的", "example_en": "The submissive employee never questioned his manager's decisions.", "example_cn": "这位顺从的员工从不质疑经理的决定。"}, {"word": "trite", "pos": "adj.", "ipa": "/traɪt/", "def_en": "Overused and lacking originality; dull.", "def_cn": "陈腐的；老套的", "example_en": "The essay was full of trite phrases like think outside the box.", "example_cn": "这篇短文充斥着陈词滥调，比如 think outside the box。"}, {"word": "urbane", "pos": "adj.", "ipa": "/ɜrˈbeɪn/", "def_en": "Sophisticated, polite, and refined in manner.", "def_cn": "温文尔雅的；彬彬有礼的", "example_en": "The urbane host put every guest at ease with witty conversation.", "example_cn": "这位温文尔雅的主人用风趣的谈话让每位客人都感到自在。"}, {"word": "zealot", "pos": "n.", "ipa": "/ˈzɛlət/", "def_en": "A person with extreme, fanatical enthusiasm for a cause.", "def_cn": "狂热分子；极端支持者", "example_en": "The fitness zealot exercised three hours every single day.", "example_cn": "这位健身狂热分子每天锻炼三小时。"}, {"word": "alleviate", "pos": "v.", "ipa": "/əˈliviˌeɪt/", "def_en": "To make pain or problems less severe.", "def_cn": "缓解；减轻", "example_en": "The new medicine helped alleviate the patient's chronic pain.", "example_cn": "这种新药帮助缓解了病人的慢性疼痛。"}, {"word": "astute", "pos": "adj.", "ipa": "/əˈstut/", "def_en": "Clever and perceptive; showing sharp judgment.", "def_cn": "精明的；敏锐的", "example_en": "The astute investor sold her stocks just before the market crashed.", "example_cn": "这位精明的投资者在股市崩盘前及时抛售了股票。"}, {"word": "brevity", "pos": "n.", "ipa": "/ˈbrɛvəti/", "def_en": "The quality of being brief; concise use of words.", "def_cn": "简洁；简短", "example_en": "The speaker was admired for the brevity and clarity of her remarks.", "example_cn": "这位演讲者以言辞简洁明了而备受赞赏。"}], "practice": [{"qid": "d
